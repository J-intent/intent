<head>

<style>
:root {
  --bg: #16161c; --panel: #1e1e26; --border: #2c2c38;
  --text: #d8d8e0; --dim: #8a8a99; --accent: #7c9aff;
  --code-bg: #12121a; --hl: #2a2a3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.75 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
#app { display: flex; min-height: 100vh; }
#side { width: 264px; flex-shrink: 0; background: var(--panel);
  border-right: 1px solid var(--border); padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
#side h1 { font-size: 18px; margin: 0 0 4px; color: var(--accent); }
#side .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
#search { width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  margin-bottom: 14px; outline: none; }
#search:focus { border-color: var(--accent); }
.gtitle { color: var(--dim); font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; margin: 14px 0 6px; }
.nav a { display: block; padding: 5px 9px; color: var(--text);
  text-decoration: none; border-radius: 6px; font-size: 13.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav a:hover { background: var(--hl); }
.nav a.active { background: var(--accent); color: #101018; }
#main { flex: 1; padding: 36px 48px 80px; max-width: 900px; }
#main h1 { font-size: 26px; border-bottom: 1px solid var(--border);
  padding-bottom: 10px; }
#main h2 { font-size: 20px; margin-top: 34px; }
#main h3 { font-size: 17px; margin-top: 26px; }
#main h4, #main h5, #main h6 { font-size: 15px; margin-top: 20px; }
a { color: var(--accent); }
code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
  font-family: Consolas, "Cascadia Code", monospace; font-size: 13px; }
pre { background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; margin: 14px 0; }
th, td { border: 1px solid var(--border); padding: 7px 12px;
  text-align: left; font-size: 13.5px; }
th { background: var(--panel); }
blockquote { border-left: 3px solid var(--accent); margin: 12px 0;
  padding: 4px 16px; color: var(--dim); background: var(--panel);
  border-radius: 0 8px 8px 0; }
hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
#hits { margin-bottom: 14px; }
#hits .hit { padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
#hits .hit:hover { background: var(--hl); }
#hits .hit .t { color: var(--accent); font-weight: 600; }
#hits .hit .s { color: var(--dim); font-size: 12.5px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; }
#hits .hit mark { background: #4a3f1f; color: #e8d48a; }
.empty { color: var(--dim); text-align: center; margin-top: 60px; }
@media (max-width: 760px) {
  #app { flex-direction: column; }
  #side { width: 100%; height: auto; position: static; }
  #main { padding: 24px; }
}

<script>
const PAGES = [{"id": "spec.md", "title": "Intent 语言规范 v1.8.0", "group": "规范", "html": "<h1 id=\"intent-语言规范-v180\">Intent 语言规范 v1.8.0</h1>\n<blockquote>心学为体，禅道为翼，马哲为用\n<strong>本文档是 Intent 的权威规范</strong>，从实现（<code>src/mini_intent.py</code>）反向提取，每个条目标注源码锚点。\n教学视角见 <code>docs/chapter_01~08_*.md</code>；设计哲学见 <code>docs/philosophy_mapper.md</code>。\n规范与实现冲突时，以本文件标注的源码行为为准，并提 issue 修文档。</blockquote>\n<p><strong>状态标注</strong>：✅ 已实现 ｜ 🔜 已预留（词法接受，语义未完整） ｜ ⚠️ 文档曾写错（已在本版修正）</p>\n<hr>\n<h2 id=\"1-词法\">1. 词法</h2>\n<h3 id=\"11-字符与注释\">1.1 字符与注释</h3>\n<p>源码 UTF-8。三种注释（<code>Lexer.skip_comment</code> mini_intent.py:262）：</p>\n<pre><code class=\"lang-intent\"># 井号注释\n// 双斜杠注释\n/* 块注释 */</code></pre>\n<h3 id=\"12-标识符与关键字\">1.2 标识符与关键字</h3>\n<p>标识符：字母/下划线开头，含字母数字下划线。</p>\n<p><strong>关键字</strong>（<code>Lexer.KEYWORDS</code> mini_intent.py:203）按支持度分三档：</p>\n<table><thead><tr><th>已实现 ✅</th><th>let, def, return, if, else, elif, for, while, break, continue, match, requires, ensures, import, as, class, this, mut, fn, try, catch, finally, defer, assert, enum, yield, and, or, not, in, raise, spawn, scope</th></tr></thead><tbody><tr><td>字面量关键字 ✅</td><td>true, false, null（None/True/False 同义接受）</td></tr><tr><td>记录性注解 ✅</td><td>pure（<code>func.is_pure</code>，仅记录不强制）, effect <code>[...]</code>（效果列表，仅记录）</td></tr><tr><td>别名（兼容，推荐用主形式）</td><td>var, const ≡ let</td></tr><tr><td>预留未实现 🔜</td><td>func（用 def/fn）, is（用 ==）, invariant（契约扩展）</td></tr></tbody></table>\n<blockquote><code>from</code> 已在 EX1 启用：<code>raise &lt;错误值&gt; from &lt;原因&gt;</code>（非 import 的 from）。</blockquote>\n<p><strong>内置类型标识符</strong>（非关键字，<code>Lexer.BUILTIN_TYPES</code> mini_intent.py:212）：<code>Int</code> <code>Float</code> <code>String</code> <code>Bool</code> <code>List</code> <code>Dict</code></p>\n<h3 id=\"13-字面量\">1.3 字面量</h3>\n<table><thead><tr><th>类型</th><th>形式</th><th>示例</th></tr></thead><tbody><tr><td>Int</td><td>十进制数字</td><td><code>42</code> <code>-7</code></td></tr><tr><td>Float</td><td>带小数点或科学计数</td><td><code>3.14</code> <code>1e-3</code></td></tr><tr><td>String</td><td>双引号，支持 <code>\\</code> 转义</td><td><code>&quot;hello\\n&quot;</code></td></tr><tr><td>f-string</td><td><code>f&quot;...&quot;</code> 前缀（显式插值宣告）</td><td><code>f&quot;${name} 好&quot;</code></td></tr><tr><td>插值字符串</td><td><code>${expr}</code> 内嵌求值</td><td><code>&quot;${name} 得分 ${score}&quot;</code></td></tr><tr><td>多行字符串</td><td><code>&quot;&quot;&quot;...&quot;&quot;&quot;</code> 或 <code>&#x27;&#x27;&#x27;...&#x27;&#x27;&#x27;</code>，保留换行</td><td>见下</td></tr><tr><td>Bool</td><td><code>true</code> / <code>false</code></td><td></td></tr><tr><td>Null</td><td><code>null</code></td><td></td></tr><tr><td>List</td><td><code>[a, b, c]</code></td><td><code>[1, 2, 3]</code></td></tr><tr><td>Dict</td><td><code>{key: value}</code></td><td><code>{&quot;x&quot;: 1}</code></td></tr></tbody></table>\n<h3 id=\"14-运算符全表lexersymbols-mini-intentpy216\">1.4 运算符全表（<code>Lexer.SYMBOLS</code> mini_intent.py:216）</h3>\n<table><thead><tr><th>类别</th><th>运算符</th></tr></thead><tbody><tr><td>算术</td><td><code>+</code> <code>-</code> <code>*</code> <code>/</code> <code>%</code> <code>**</code> <code>//</code></td></tr><tr><td>比较</td><td><code>==</code> <code>!=</code> <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code></td></tr><tr><td>逻辑</td><td><code>and</code> <code>or</code> <code>not</code>（关键字形式）</td></tr><tr><td>位运算 🔜</td><td><code>&amp;</code> `</td></tr><tr><td>赋值</td><td><code>=</code> <code>+=</code> <code>-=</code> <code>*=</code> <code>/=</code> <code>%=</code> <code>**=</code> <code>//=</code> 等 🔜（除 <code>=</code> 外预留）</td></tr><tr><td>结构</td><td><code>(</code> <code>)</code> <code>{</code> <code>}</code> <code>[</code> <code>]</code> <code>,</code> <code>:</code> <code>;</code> <code>.</code></td></tr><tr><td>箭头</td><td><code>-&gt;</code>（返回类型） <code>=&gt;</code>（match 分支/λ） <code>&lt;-</code>（CC2 通道发送/接收）</td></tr><tr><td>管道</td><td>`</td></tr><tr><td>其他</td><td><code>@</code>（装饰器） <code>:=</code> <code>++</code> <code>--</code> 🔜</td></tr></tbody></table>\n<hr>\n<h2 id=\"2-类型系统\">2. 类型系统</h2>\n<h3 id=\"21-类型规则intent-与-python-的根本分歧\">2.1 类型规则（Intent 与 Python 的根本分歧）</h3>\n<ol>\n<li><strong>运行时动态类型</strong>：值在运行时携带类型；没有编译期类型检查</li>\n<li><strong>类型推断 = 心即理</strong>：<code>let x = 10;</code> 无需标注，系统知道 <code>x: Int</code></li>\n<li><strong>let 默认不可变</strong>：<code>let</code> 声明的变量不可重新赋值；<code>let mut</code> 显式宣告可变（<code>Scope.declare</code> mini_intent.py:3040 附近，违例报「无法修改常量」）</li>\n<li><strong>契约优先于类型</strong>：<code>requires/ensures</code> 是运行时可验证的断言，比类型标注更受信任</li>\n<li><strong>数值互通（刻意宽松）</strong>：<code>Int</code> 标注接受 <code>Float</code> 值（<code>IntType.can_assign_from</code> 显式设计）；类型别名与 Union 同理遵循各底层成员规则</li>\n<li><strong>泛型约束即契约</strong>：<code>T: Comparable</code> 违约抛 <code>ContractError</code>（契约错误通道），不是普通 TypeError</li>\n</ol>\n<h3 id=\"22-类型标注语法\">2.2 类型标注语法</h3>\n<pre><code class=\"lang-intent\">let x: Int = 10;              // 显式标注(可选)\ndef f(a: Float, b: Float): Float { ... }   // 参数与返回类型\ndef g&lt;T&gt;(x: T): T { ... }     // 泛型函数(类型参数从实参推断)</code></pre>\n<p>标注是提示，不是枷锁：<code>intent check --types</code>（<code>--types</code>）做渐进类型静态检查——<strong>标注处检查 + 推断处放过</strong>（mypy-lite，L1）：</p>\n<ul>\n<li>变量声明 <code>let x: T = expr</code>、调用实参 vs 形参标注、<code>return</code> vs 返回标注，三处可推断即检查；</li>\n<li>推断不出类型的一律放过（显式信任，不猜）；</li>\n<li>数值互通（§2.1）：Int/Float 双向接受；</li>\n<li>Union 标注任一成员合法；泛型参数视为 Any；类型别名透明解析；</li>\n<li>容器只查基类（<code>List[Int]</code> 的元素类型不查，留待完整版）；</li>\n<li>契约优先于类型：<code>requires/ensures</code> 是运行时可验证的主防线，类型是静态副防线。</li>\n</ul>\n<p>正反例判定自测：<code>tools/typecheck_selftest.py</code>（21/21）。已知边界：<code>std/itertools2.intent</code> 的多行 <code>export</code> 语法不被 parser 接受（<code>--check</code> 同拒，宽松执行模式容忍）——类型检查以语法干净为前提。</p>\n<h3 id=\"23-内建类型\">2.3 内建类型</h3>\n<table><thead><tr><th>类型</th><th>值类型</th><th>相等性</th></tr></thead><tbody><tr><td>Int</td><td>64 位整数</td><td>值相等</td></tr><tr><td>Float</td><td>双精度浮点</td><td>值相等</td></tr><tr><td>String</td><td>Unicode 字符串</td><td>值相等</td></tr><tr><td>Bool</td><td>true/false</td><td>值相等</td></tr><tr><td>List</td><td>有序序列，元素可为混合类型</td><td>逐元素递归相等（<code>_binary_op</code> mini_intent.py:6186）</td></tr><tr><td>Dict</td><td>字符串/数值键 → 值</td><td>键集合一致 + 值逐项递归相等（mini_intent.py:6200，2026-10-16 修复）</td></tr><tr><td>Result&lt;T,E&gt;</td><td>Ok(v) / Err(e)</td><td>—</td></tr></tbody></table>\n<h3 id=\"24-resultte烦恼即菩提\">2.4 Result&lt;T,E&gt;（烦恼即菩提）</h3>\n<pre><code class=\"lang-intent\">let r = Ok(42);               // 构造: Ok(v) / Err(e)\nlet r2 = safe_divide(10, 0)?; // ? 操作符: Err 向上传播,Ok 解包\nr.is_ok                       // Bool 属性\nr.unwrap()                    // 方法: Ok 返回值,Err 抛 NameError</code></pre>\n<h3 id=\"25-泛型函数级与约束\">2.5 泛型（函数级）与约束</h3>\n<pre><code class=\"lang-intent\">def identity&lt;T&gt;(x: T): T { return x; };\nidentity(42);      // T = Int\n\ndef max_of&lt;T: Comparable&gt;(a: T, b: T): T { ... };\nmax_of(3, 7);      // Int 满足 Comparable → 7\nmax_of(Ok(1), Ok(2));  // Result 不满足 → ContractError(契约违约)</code></pre>\n<p>内置约束：<code>Comparable</code>（Int/Float/String/Bool）、<code>Numeric</code>（Int/Float）。未知约束宽容放行。\n类型别名（<code>type Meters = Float;</code>）为透明同义词；Union（<code>A | B</code>）任一成员合法即通过。</p>\n<hr>\n<h2 id=\"3-语法\">3. 语法</h2>\n<blockquote>语句以 <code>;</code> 结尾（一句话说完了）。顶层结构 = 函数定义 + 全局语句。</blockquote>\n<h3 id=\"31-变量声明\">3.1 变量声明</h3>\n<pre><code>let [mut] name [: Type] = expr ;</code></pre>\n<p>⚠️ <code>var</code>/<code>const</code> 是 <code>let</code> 的兼容别名，新代码用 <code>let</code>。</p>\n<h3 id=\"32-函数定义\">3.2 函数定义</h3>\n<pre><code>def name(params) [: ReturnType] [requires ...] [ensures ...] { body } ;</code></pre>\n<ul>\n<li>默认参数：<code>def f(x: Int, y: Int = 10) { ... }</code></li>\n<li>Lambda：<code>fn(x) { return x <em> 2; }</code> 或 <code>fn(x) =&gt; x </em> 2</code> 🔜（箭头体未实现，用块体）</li>\n<li>闭包：函数可嵌套定义，携带诞生环境（<code>_t_clret.intent</code> 验证）</li>\n<li>装饰器：<code>@deco def f() {...}</code> 🔜（解析支持，执行路径有限）</li>\n<li>生成器：函数体内 <code>yield expr;</code>，收集为 List 返回（mini_intent.py:5367）</li>\n<li>生成器委派（P1.5）：<code>yield from expr;</code>——可迭代对象的元素逐个转发（支持 List/Dict 键）</li>\n</ul>\n<p><strong>契约</strong>（一等公民，Intent 的身份证）：</p>\n<pre><code class=\"lang-intent\">def divide(a: Float, b: Float): Float\n    requires b != 0.0          // 进门签合同:不满足则拒绝执行(抛 ContractViolation)\n    ensures result * b == a    // 出门前验货:result 是返回值的特殊名\n{\n    return a / b;\n};</code></pre>\n<h3 id=\"33-控制流\">3.3 控制流</h3>\n<pre><code class=\"lang-intent\">if cond { ... } else if cond2 { ... } else { ... }   // if 是表达式,可 let r = if c { 1 } else { 0 };\nwhile cond { ... };\nfor x in iterable { ... };          // iterable: List / Dict(遍历键) / range()\nfor (k, v) in dict { ... };         // 解包遍历\nbreak; continue;\n&quot;sub&quot; in &quot;string&quot;;                 // in 右侧支持 String(子串归属)</code></pre>\n<blockquote><code>else if</code> 链 2026-10-18 落地：parser 将 <code>else</code> 后随的 <code>if</code> 解析为嵌套 IfStmt（与 <code>elif</code> 语义等价）——规范先立、实现补票（tests/test_control_flow.intent 回归）。</blockquote>\n<h3 id=\"33b-with-语句p11块级资源管理\">3.3b with 语句（P1.1，块级资源管理）</h3>\n<pre><code class=\"lang-intent\">with Resource(&quot;db&quot;) as r {          // 块退出时自动调用 r.close()(若有)\n    r.use();\n};</code></pre>\n<h3 id=\"33c-类型别名与-unionp13a\">3.3c 类型别名与 Union（P1.3a）</h3>\n<pre><code class=\"lang-intent\">type Meters = Float;                // 别名: 透明同义词(type 是软关键字)\ntype Shape = Circle | Square;       // Union: 任一成员合法即通过\nlet x: Int | String = 42;</code></pre>\n<h3 id=\"34-match-模式匹配表达式强制穷举检查\">3.4 match 模式匹配（表达式，强制穷举检查）</h3>\n<pre><code class=\"lang-intent\">let grade = match score {\n    &quot;A&quot; =&gt; &quot;优秀&quot;,              // 字面量\n    n if n &gt;= 90 =&gt; &quot;A&quot;,        // 守卫(变量绑定 + if 条件)\n    _ =&gt; &quot;其他&quot;,                // 通配符(有意识地放弃穷举)\n};</code></pre>\n<p>支持的模式：字面量 / 变量绑定 / <code>_</code> 通配 / or 模式 <code>A | B</code> / 构造器解构。\n<strong>match range 模式（<code>90..100</code>）🔜 未实现</strong>——philosophy_mapper.md 曾写成已支持，实际需用 <code>if</code> 守卫（2026-10-16 测试发现）。\n穷举检查：无通配/变量/或模式覆盖全部字面量时，静态报 <code>MatchError</code>（<code>_check_match_exhaustive</code> mini_intent.py:1509）。</p>\n<h3 id=\"35-错误处理\">3.5 错误处理</h3>\n<pre><code class=\"lang-intent\">try { risky(); } catch e { handle(e); } finally { cleanup(); };\ndefer { cleanup(); };        // 作用域退出时逆序执行(函数级)</code></pre>\n<ul>\n<li><code>catch</code> 必须带变量名：<code>catch e { }</code> 或 <code>catch (e) { }</code>（lesson_05 曾写 <code>catch {</code>，2026-10-16 确认为文档错误）</li>\n<li><code>try/catch/finally</code> 皆为表达式</li>\n<li><strong>catch 按类型分流（P1.4）</strong>：<code>catch e: ContractError { }</code>——类型不匹配的异常继续传播；错误值成员 <code>e.type</code> / <code>e.message</code> / <code>e.stack</code></li>\n<li>不可恢复错误不用异常，用契约（宪法第 4 条）</li>\n</ul>\n<p>异常类型名（<code>PY_TO_INTENT_EXC</code> 映射）：ContractError / AssertError / ValueError / TypeError / IndexError / KeyError / ZeroDivisionError / NameError / RuntimeError / SyntaxError / ImportError。</p>\n<h3 id=\"36-类与枚举\">3.6 类与枚举</h3>\n<pre><code class=\"lang-intent\">class Point {                 // ⚠️ 继承用尖括号: class Dog &lt; Animal(不是冒号!)\n    def init() { this.x = 0; }        // 构造器\n    def set(x: Int) { this.x = x; }   // 方法(类体内 } 后不加分号)\n    def get(): Int { return this.x; }\n};\nlet p = Point();              // 实例化\np.set(3);                     // 方法调用\np.x;                          // 字段访问\n\nenum Direction { North, South, East, West };   // 枚举:变体注册为全局常量</code></pre>\n<p>运算符重载：实例定义 <code>__add__</code>/<code>__eq__</code> 等方法即生效（<code>_binary_op</code> mini_intent.py:6225）。</p>\n<h3 id=\"37-管道与推导式\">3.7 管道与推导式</h3>\n<pre><code class=\"lang-intent\">let result = data |&gt; filter(valid) |&gt; map(transform);   // |&gt; 管道:从左到右\nlet squares = [x * x for x in nums if x &gt; 2];           // 列表推导式\nlet m = {k: len(k) for k in pairs};                     // 字典推导式</code></pre>\n<h3 id=\"38-模块系统\">3.8 模块系统</h3>\n<pre><code class=\"lang-intent\">import std.math;              // 标准库\nimport mylib;                 // 项目文件(搜索路径: 文件目录及其 std/ lib/ ./ ./std ./lib + ~/.intent/lib)\nimport mylib as ml;           // 别名\nexport my_func, my_const;     // 显式导出(P2.1): 无 export 声明的模块维持全量导出(兼容)</code></pre>\n<p>模块查找优先级：<code>&lt;base&gt;/&lt;name&gt;.intent</code> → <code>&lt;base&gt;/&lt;name&gt;/__init__.intent</code> → <code>&lt;base&gt;/&lt;name&gt;/&lt;name&gt;.intent</code>（npm 风格）。\n模块 = 文件；循环导入检测（<code>_import_stack</code>）；每个模块独立执行，导入时注册其导出符号。</p>\n<p><strong>扁平注入语义（已知边界，2026-10-19 记）</strong>：<code>import std.bim.unit;</code> 把模块符号<strong>扁平</strong>注入当前作用域（<code>mm_to_m(...)</code> 裸调可用），同时挂载嵌套链 <code>std.bim.unit.mm_to_m(...)</code>；但中间名 <code>unit</code> <strong>不是</strong>独立符号——<code>unit.mm_to_m(...)</code> 报 NameError。历史模板（tools/dynamo_node.py BD1）曾踩此坑，BD2 期已修正。</p>\n<h3 id=\"39-包管理p21-pk1-依赖解析v02-本地优先\">3.9 包管理（P2.1 + PK1 依赖解析，V0.2 本地优先）</h3>\n<p>项目清单 <code>intent.toml</code>：</p>\n<pre><code class=\"lang-toml\">[project]\nname = &quot;myproj&quot;\nversion = &quot;0.1.0&quot;\n\n[deps]\nmathkit = { path = &quot;lib/mathkit&quot;, version = &quot;^1.2&quot; }   # 路径依赖 + 语义化约束\nutils   = &quot;../utils&quot;                                   # 路径依赖(无约束)\nweb     = { git = &quot;https://github.com/x/web.git&quot;, version = &quot;&gt;=2.0, &lt;3.0&quot; }</code></pre>\n<ul>\n<li><code>--install &lt;url&gt;</code>：安装单个依赖（git clone --depth 1 到 <code>./lib/&lt;name&gt;</code>）</li>\n<li><code>--install &lt;dir&gt;</code>：<code>&lt;dir&gt;</code> 含 intent.toml → 按该项目批量解析安装（否则视为单个依赖源）</li>\n<li><code>--install</code>（无参）：按当前目录 intent.toml 的 <code>[deps]</code> 批量安装</li>\n<li><code>--install --dry-run [dir]</code>：<strong>依赖解析预演</strong>——约束合并/冲突检测/解析计划，不安装不写锁（PK1 判定入口）</li>\n<li>启动时：<code>./lib</code> 与 <code>~/.intent/lib</code>（全局库）自动加入模块搜索路径</li>\n</ul>\n<p><strong>PK1 依赖解析器</strong>（<code>resolve_dependencies</code> mini_intent.py:8550）：</p>\n<ul>\n<li>约束语法：<code>*</code>（任意）/ <code>^1.2</code>（兼容：≥1.2.0 &lt;2.0.0）/ <code>~1.2</code>（补丁级：≥1.2.0 &lt;1.3.0）/ <code>&gt;=</code> <code>&lt;=</code> <code>&gt;</code> <code>&lt;</code> <code>=</code> / 逗号分隔多段（AND 语义）；语义化版本三段式，缺段补 0，正式版高于预发布版</li>\n<li>解析算法：BFS 走依赖图 → 约束累积（钻石依赖合并）→ 候选枚举（路径依赖单候选；本地注册表 <code>registry/</code> 多版本候选）→ <strong>公共兼容集取最高版本</strong>（最新不满足自动回退次高）→ 无解报 <code>依赖冲突</code>（退出码 1，不写锁）</li>\n<li><code>intent.lock</code>（JSON）：锁定每包 version/source/deps/required_by；非 dry-run 安装前写入</li>\n<li>刻意不做：全局 SAT 求解；git 依赖的 tag 枚举（未克隆无版本可读，install 后校验）</li>\n</ul>\n<h3 id=\"310-错误处理raise-与异常链ex1\">3.10 错误处理：raise 与异常链（EX1）</h3>\n<pre><code class=\"lang-intent\">try {\n    raise error(&quot;KeyError&quot;, &quot;缺键 name&quot;) from inner_err;   // 显式因果链\n} catch e {\n    print(e.type);            // &quot;KeyError&quot; — 定向捕获\n    print(e.__cause__.type);  // 起因类型(无 from 时为 None)\n    print(e.message);         // 消息\n    print(e.stack);           // Intent 调用链快照\n};</code></pre>\n<ul>\n<li><code>error(type, message)</code> 内置：构造一等错误值（raise 的原料）</li>\n<li><code>raise &lt;错误值&gt;</code>：ErrorValue 原样抛；<code>Err(&quot;boom&quot;)</code> 取内层消息；字符串简写 → <code>RuntimeError</code>；其余类型明确拒绝（TypeError）</li>\n<li><code>raise X from Y</code>：<code>X.__cause__ = Y</code>——因果显式化，不猜</li>\n<li>未捕获到顶层：渲染含「异常链(__cause__, 从起因到外层)」段（<code>render_intent_error</code>）</li>\n<li>刻意不做：<code>__context__</code>（隐式上下文，异常处理中再抛新错的自动挂链）</li>\n</ul>\n<h3 id=\"311-结构化并发spawn-与-scopecc1\">3.11 结构化并发：spawn 与 scope（CC1）</h3>\n<pre><code class=\"lang-intent\">let mut results = [];\ndef work(lo: Int, hi: Int) { ... push(results, partial_sum); };\n\nscope {\n    spawn work(0, 50);        // 派生任务(调用点求值)\n    spawn work(50, 100);\n};                            // 块退出 = 汇合点: 全部任务自动 join\n// 此处两个任务必已完成</code></pre>\n<ul>\n<li><code>spawn &lt;可调用&gt;;</code> / <code>spawn f(args);</code>：Python threading 演示级实现；每个任务跑在独立 Interpreter 上，闭包作用域经 FunctionValue 共享</li>\n<li><code>scope { ... }</code>：并发作用域——块内 spawn 的任务在块退出时统一 join；任务异常在 join 处重抛（第一个，不沉没）</li>\n<li>scope 外的 spawn 被拒绝（RuntimeError）——<strong>没有孤儿线程</strong></li>\n<li>词法作用域：scope 块是独立词法作用域（Resolver 同 try 块语义）</li>\n<li>刻意不做：async/await（A3）、自由线程安全（A4）；channel 已由 CC2 交付（§3.12）</li>\n</ul>\n<h3 id=\"312-channel-通信cc2\">3.12 channel 通信（CC2）</h3>\n<pre><code class=\"lang-intent\">let ch = chan();        // 无界缓冲; chan(n) = 容量 n(满则发送阻塞)\nscope {\n    spawn producer(ch); // 任务间经通道握手 — 不共享内存, 传递消息\n    spawn consumer(ch);\n};\nch &lt;- 42;               // 发送: 阻塞直至入队; 通道已关闭则报错\nlet v = &lt;- ch;          // 接收: 空则阻塞等待\nclose(ch);              // 关闭: 发送此后再报错; 接收排空剩余即止</code></pre>\n<ul>\n<li><code>ch &lt;- v</code>（SendExpr）/ <code>&lt;- ch</code>（RecvExpr）：与 Go channel 同形的词法（<code>&lt;-</code> 是最优先级外的最低优先级运算符——<code>a&lt;-b</code> 无空格即通道发送，比较请留空格）</li>\n<li>线程安全由底层 <code>queue.Queue</code> 保证，不自己造锁；阻塞/关闭语义：缓冲满发送阻塞、空接收阻塞、关闭后排空再接收抛 <code>ChannelClosedError</code>（显式失败，不返回哑值）</li>\n<li>通道是引用语义：传参/赋值共享同一通道（<code>copy()</code> 返回自身）</li>\n<li>刻意不做：select 多路复用、带超时的 receive（A3 async 期再议）</li>\n</ul>\n<h3 id=\"313-测试框架深化tq1\">3.13 测试框架深化（TQ1）</h3>\n<p>在 D1（<code>--test</code> + <code>test_*</code> 函数 + <code>assert</code>）之上的 pytest 子集等价物——无装饰器语法前的约法：</p>\n<pre><code class=\"lang-intent\">def setup() { ... };    // fixture 钩子: 每个用例前由运行器调用\ndef teardown() { ... };// fixture 钩子: 每个用例后调用(失败/skip 也清理)\n\ndef test_x() {\n    let err = expect_error(fn() { items[99]; }, &quot;IndexError&quot;);  // 预期异常\n    skip(&quot;环境不具备&quot;);                                          // 诚实跳过\n    param_cases([[1, 2], [3, 4]], fn(a, b) { ... });            // 参数化\n    let m = mock(&quot;svc&quot;); m(1);                                  // 测试替身\n    assert mock_call_count(m) == 1, &quot;调用被记录&quot;;\n};</code></pre>\n<ul>\n<li><code>expect_error(fn, type)</code>：断言 fn() 抛出指定类型——返回捕获的 ErrorValue；未抛错或类型不符 → AssertionError（坏路径也是契约的一部分）</li>\n<li><code>skip(reason)</code>：抛出 SkipTest，运行器计为「跳过」——既非通过也非失败，摘要单独计数（<code>9/10 通过, 0 失败, 1 跳过</code>）</li>\n<li><code>param_cases(cases, fn)</code>：cases 是用例列表，每项展开传给 fn；失败带用例序号（定位到个案）</li>\n<li><code>mock(name)</code> / <code>mock_return(m, v)</code> / <code>mock_calls(m)</code> / <code>mock_call_count(m)</code>：记录调用序列的测试替身，可直接调用 <code>m(args)</code></li>\n<li>setup/teardown 是文件级约定（与 test_* 同文件定义），运行器负责环绕；teardown 自身失败即用例失败</li>\n</ul>\n<h3 id=\"314-帧快照与事后调试ex2\">3.14 帧快照与事后调试（EX2）</h3>\n<pre><code class=\"lang-intent\">python src/mini_intent.py --postmortem tests/_demo_error_stack.intent</code></pre>\n<ul>\n<li>异常穿帧时，每层 <code>execute_function</code>/<code>_execute_method</code> 把本帧局部变量快照挂上异常（<code>_intent_frames</code>，从外到内）——帧快照取自建帧时挂在 <code>CallFrame.scope</code> 上的本帧作用域，各帧各的本地人</li>\n<li><code>--postmortem</code>：渲染完整诊断（D3）→ 帧快照写盘 <code>.intent_postmortem.json</code>（停机后可捡回）→ 帧检视 + 命令循环（<code>frames</code> / <code>frame N</code> / <code>vars</code> / <code>where</code> / <code>quit</code>）；默认停在出错帧（最内层）</li>\n<li>非交互（stdin EOF）自动收尾，退出码 0——postmortem 的职责是接住崩溃，不是复制失败</li>\n<li>与 C7 <code>--debug</code> 的分工：debugger 事前（打断点逐步走），postmortem 事后（栈已冻结，只检视不执行）</li>\n</ul>\n<h3 id=\"315-c-abi-ffii1-最小切片ctypes-背载\">3.15 C ABI FFI（I1 最小切片，ctypes 背载）</h3>\n<pre><code class=\"lang-intent\">let lib = ffi_load(&quot;msvcrt&quot;);                          // 加载 .dll/.so\nlet strlen = ffi_func(lib, &quot;strlen&quot;, &quot;Int&quot;, [&quot;Str&quot;]);  // 声明外部函数\nprint(strlen(&quot;hello&quot;));                                // 5\n\nlet pt = ffi_struct([&quot;x&quot;, &quot;y&quot;], [&quot;Int&quot;, &quot;Int&quot;]);       // 结构体(平铺标量)\nffi_field_set(pt, &quot;x&quot;, 42);\nlet user32 = ffi_load(&quot;user32&quot;);\nlet get_cursor = ffi_func(user32, &quot;GetCursorPos&quot;, &quot;Int&quot;, [&quot;Struct&quot;]);\nget_cursor(pt);                                        // 结构体按引用传(出参)\nprint(ffi_field_get(pt, &quot;x&quot;));</code></pre>\n<ul>\n<li>类型名白名单：<code>Int</code>(c_int) / <code>Float</code>(c_double) / <code>Str</code>(c_char_p, utf-8) / <code>Bool</code>(c_int) / <code>Ptr</code>(c_void_p) / <code>Struct</code>(指针语义) / <code>Void</code>(仅返回)；声明期校验，未知类型名抛 ValueError</li>\n<li><code>Struct</code> 形参 = 指向结构体的指针（Win32 出参/入参指针模式）——<strong>未声明 argtypes 的 ctypes 函数对 Structure 实例按值传递，必须显式 byref</strong>（实测 GetCursorPos：传实例 ret=0，byref ret=1）</li>\n<li>符号不存在 / 库加载失败 / 实参个数或类型不符 → RuntimeError/TypeError，显式失败不返回哑值</li>\n<li>架构立场：寄生期复用宿主 CPython 的 ctypes，不自己造 ABI 桥（ROADMAP §0.1）</li>\n<li><strong>完整 I1 剩余</strong>（20 人日中的未做部分）：回调（CFUNCTYPE）、数组/联合、varargs、头文件解析、<code>foreign</code> 语法糖——最小切片已交付并通过 8 项测试（tests/test_ffi.intent，Windows 真实 API msvcrt/user32）</li>\n</ul>\n<h3 id=\"316-python-互操作桥i2a-最小切片寄生期标志\">3.16 Python 互操作桥（I2a 最小切片，寄生期标志）</h3>\n<pre><code class=\"lang-intent\">import python.math;                 // 加载真 Python 模块\nprint(math.sqrt(16.0));             // 4.0 — 命名空间成员调用\nprint(python.math.floor(3.7));      // 3  — 全链亦可\nlet text = json.dumps({&quot;a&quot;: 1});    // import python.json 后</code></pre>\n<ul>\n<li><strong>命名空间挂载</strong>：<code>import python.X</code> 经 importlib 加载真模块，符号包成桥值挂到 <code>X</code>（末段名独立可用）；<strong>不平扁注入</strong>——防遮蔽核心内置（与 std import 扁平注入的边界偏差是刻意设计，见 §3.8）</li>\n<li>双向编排：标量/列表/字典/None 自动转换；富对象（类实例等）包成不透明 <code>PyObjectValue</code> 句柄（可传回 Python，不可在 Intent 侧探内部）</li>\n<li>异常策略：Python 侧任何异常 → RuntimeError（带原类型名）——显式失败，不静默 None</li>\n<li>架构立场：I2 是路线图 ROI 最高的单个任务（ROADMAP §0.1）；寄生期解决生态从零</li>\n<li><strong>完整 I2a 剩余</strong>（15 人日中的未做部分）：类实例化、关键字参数、Python 回调 Intent、子模块链、pip 三方包 round-trip（requests/numpy）</li>\n</ul>\n<hr>\n<h2 id=\"4-标准库\">4. 标准库</h2>\n<h3 id=\"41-内置函数162-setup-builtins-mini-intentpy4305\">4.1 内置函数（162，<code>_setup_builtins</code> mini_intent.py:4305）</h3>\n<table><thead><tr><th>类别</th><th>函数（签名）</th></tr></thead><tbody><tr><td>输出断言</td><td><code>print(...)</code> <code>assert(cond, msg)</code></td></tr><tr><td>集合</td><td><code>len(x)</code> <code>keys(d)</code> <code>values(d)</code> <code>push(l, v)</code> <code>pop(l)</code> <code>insert(l, i, v)</code> <code>remove_at(l, i)</code> <code>enumerate(l)</code> <code>zip(a, b)</code> <code>range(...)</code> <code>reversed(x)</code> <code>sorted(x)</code> <code>any(l)</code> <code>all(l)</code> <code>contains(x, v)</code></td></tr><tr><td>类型转换</td><td><code>int(x)</code> <code>float(x)</code> <code>str(x)</code> <code>bool(x)</code> <code>type_of(x)</code> <code>type(x)</code></td></tr><tr><td>数学</td><td><code>abs(x)</code> <code>min(...)</code> <code>max(...)</code> <code>sum(l)</code> <code>sqrt(x)</code> <code>pow(a, b)</code> <code>floor/ceil/round(x)</code> <code>log/exp/cos/sin/tan/acos/asin/atan(x)</code> <code>atan2(a, b)</code> <code>pi</code> <code>random()</code> <code>randint(a, b)</code></td></tr><tr><td>字符串</td><td><code>split(s, sep)</code> <code>join(l, sep)</code> <code>trim(s)</code> <code>ord(c)</code> <code>chr(n)</code> <code>starts_with/ends_with(s, p)</code> <code>replace(s, a, b)</code> <code>to_upper/to_lower(s)</code> <code>substr(s, start, end)</code></td></tr><tr><td>Result</td><td><code>ok(v)</code> <code>err(e)</code> <code>error(type, message)</code>（构造一等错误值，EX1）</td></tr><tr><td>文件</td><td><code>read_file(p)</code> <code>write_file(p, c)</code> <code>list_dir(p)</code> <code>file_exists(p)</code> <code>is_dir/is_file(p)</code> <code>make_dir(p)</code> <code>delete_file(p)</code> <code>file_size(p)</code> <code>file_modified(p)</code></td></tr><tr><td>系统</td><td><code>env(k)</code> <code>cwd()</code> <code>ch_dir(p)</code> <code>shell(cmd)</code> <code>platform()</code> <code>path_join/basename/dirname/ext(p)</code> <code>now()</code> <code>sleep(ms)</code> <code>input(prompt)</code> <code>version()</code> <code>args()</code></td></tr><tr><td>序列化</td><td><code>json_parse(s)</code> <code>json_dump(v)</code></td></tr><tr><td>HTTP（B6）</td><td><code>http_get(url)</code> <code>http_post(url, body)</code> <code>http_get_json(url)</code> <code>http_post_json(url, v)</code> <code>http_serve_start(port)</code> <code>http_serve_stop(port)</code>（本地测试服务器，不依赖外网）</td></tr><tr><td>SQLite（B7）</td><td><code>sqlite_open(path)</code> <code>sqlite_exec(h, sql)</code> <code>sqlite_query(h, sql)</code> <code>sqlite_close(h)</code>（句柄式；查询返回行字典列表）</td></tr><tr><td>正则（B8）</td><td><code>re_test(p, t)</code> <code>re_full_match(p, t)</code> <code>re_find_all(p, t)</code> <code>re_groups(p, t)</code> <code>re_replace(p, r, t)</code> <code>re_split(p, t)</code>（非法模式抛 ValueError）</td></tr><tr><td>日期时间（B4）</td><td><code>datetime_now()</code> <code>datetime_today()</code> <code>datetime_parse(iso)</code> <code>datetime_format(iso, fmt)</code> <code>datetime_add_days/hours(iso, n)</code> <code>datetime_diff_days/seconds(a, b)</code> <code>datetime_weekday(iso)</code> <code>datetime_parts(iso)</code> <code>datetime_timestamp(iso)</code> <code>datetime_from_timestamp(ts)</code> <code>datetime_to_timezone(iso, off)</code>（ISO 字符串表示；非法输入抛 ValueError）</td></tr><tr><td>压缩编码（B9）</td><td><code>enc_base64_encode(s)</code> <code>enc_base64_decode(s)</code> <code>enc_gzip_compress(s)</code> <code>enc_gzip_decompress(s)</code> <code>enc_urlencode(s)</code> <code>enc_urldecode(s)</code>（gzip 二进制以 base64 文本承载；非法输入抛 ValueError）</td></tr><tr><td>文件通配（SL1）</td><td><code>glob_match(pattern)</code>（Python glob 语义，空表=无匹配）</td></tr><tr><td>高级文件（SL1）</td><td><code>shutil_copy_file(src, dst)</code> <code>shutil_move(src, dst)</code> <code>shutil_rmtree(path)</code>（失败抛 RuntimeError）</td></tr><tr><td>临时文件（SL1）</td><td><code>tempfile_mkdtemp()</code> <code>tempfile_mkstemp(prefix)</code> <code>tempfile_tempdir()</code></td></tr><tr><td>UUID（SL1）</td><td><code>uuid_uuid4()</code> <code>uuid_uuid4_hex()</code></td></tr><tr><td>摘要（SL1）</td><td><code>hash_md5/sha1/sha256/sha512(text)</code>（UTF-8 输入，十六进制摘要）</td></tr><tr><td>消息认证（SL1）</td><td><code>hmac_sha256(key, msg)</code> <code>hmac_sha256_verify(key, msg, sig)</code>（常量时间比对）</td></tr><tr><td>安全随机（SL1）</td><td><code>secrets_token_hex(n)</code> <code>secrets_rand_below(n)</code> <code>secrets_choice(lst)</code>（CSPRNG；空表选择抛 ValueError）</td></tr><tr><td>十进制（SL1）</td><td><code>decimal_add/sub/mul/div(a, b)</code> <code>decimal_compare(a, b)</code>（字符串承载，28 位精度；非法数字抛 ValueError，除零抛 ZeroDivisionError）</td></tr><tr><td>内存观测（MM1）</td><td><code>mem_live_count()</code> <code>mem_alloc_total()</code> <code>mem_stats_info()</code> <code>gc_collect_now()</code> <code>ref_count_of(obj)</code>（设计文档 docs/memory_design.md）</td></tr><tr><td>通道（CC2）</td><td><code>chan()</code> <code>chan(n)</code>（创建无界/容量 n 通道） <code>close(ch)</code>（关闭：发送报错、接收排空即止）</td></tr><tr><td>测试框架（TQ1）</td><td><code>skip(reason)</code> <code>expect_error(fn, type)</code> <code>param_cases(cases, fn)</code> <code>mock(name)</code> <code>mock_return(m, v)</code> <code>mock_calls(m)</code> <code>mock_call_count(m)</code></td></tr><tr><td>FFI（I1 最小切片）</td><td><code>ffi_load(path)</code> <code>ffi_func(lib, name, restype, argtypes)</code> <code>ffi_struct(names, types)</code> <code>ffi_field_get(s, name)</code> <code>ffi_field_set(s, name, v)</code> <code>ffi_sizeof(s)</code>（ctypes 背载；类型名白名单 Int/Float/Str/Bool/Ptr/Struct + Void；见 §3.15）</td></tr></tbody></table>\n<h3 id=\"42-std-模块stdintent\">4.2 std 模块（<code>std/*.intent</code>）</h3>\n<table><thead><tr><th>模块</th><th>函数</th></tr></thead><tbody><tr><td><code>str</code></td><td>length, is_empty, concat, repeat, contains, starts_with, ends_with, index_of, last_index_of, substring, to_upper, to_lower, replace, cut, glue, strip, match_at</td></tr><tr><td><code>math</code></td><td>add, multiply, square, abs, max, min</td></tr><tr><td><code>list</code></td><td>sum, contains, any, all, take, drop, zip, map, filter, reduce</td></tr><tr><td><code>itertools</code></td><td>chain, zip_longest, cycle, enumerate, flatten, unique, chunk, groupby, count_where</td></tr><tr><td><code>collections</code></td><td>counter, most_common, class Stack(push/pop/peek/size/is_empty), class Queue(enqueue/dequeue/peek/size/is_empty)</td></tr><tr><td><code>time</code></td><td>current_timestamp, delay, timestamp_ns, elapsed_ms, elapsed_ns</td></tr><tr><td><code>json</code></td><td>parse, stringify, read_json, write_json</td></tr><tr><td><code>random</code></td><td>random_val, rand_int, uniform, choice, dice</td></tr><tr><td><code>fs</code></td><td>ls, exists, is_directory, is_regular_file, mkdir, remove, read_all, write_all, size_bytes, mtime</td></tr><tr><td><code>os</code></td><td>getenv, curdir, chdir, run, sys_platform, home_dir</td></tr><tr><td><code>sys</code></td><td>read_file, write_file, timestamp, debug, exit</td></tr><tr><td><code>contract</code></td><td>assert, require_positive, require_non_negative, require_in_range, require_divisor_non_zero, require_non_empty, ensure_result_not_null, ensure_result_in_range, ensure_length_le_original, ensure_result_positive, mut</td></tr><tr><td><code>http</code></td><td>get, post, get_json, post_json, serve_start, serve_stop</td></tr><tr><td><code>sqlite</code></td><td>open, exec, query, close</td></tr><tr><td><code>re</code></td><td>test, full_match, find_all, groups, replace, split</td></tr><tr><td><code>datetime</code></td><td>now, today, parse, format, add_days, add_hours, diff_days, diff_seconds, weekday, parts, timestamp, from_timestamp, to_timezone</td></tr><tr><td><code>encoding</code></td><td>base64_encode, base64_decode, gzip_compress, gzip_decompress, urlencode, urldecode（gzip 二进制以 base64 文本承载；非法输入抛 ValueError）</td></tr><tr><td><code>itertools2</code>（SL2）</td><td>permutations, combinations, product, heappush, heappop, bisect_left, bisect_right, insort, class MinHeap, class Deque, class DefaultDict, class ChainMap（纯 Intent；heap/bisect 为有序插入/线性定位的演示级实现，语义与 Python 一致）</td></tr><tr><td><code>glob</code>（SL1）</td><td>glob（通配符匹配）</td></tr><tr><td><code>shutil</code>（SL1）</td><td>copy_file, move, rmtree</td></tr><tr><td><code>tempfile</code>（SL1）</td><td>mkdtemp, mkstemp, tempdir</td></tr><tr><td><code>uuid</code>（SL1）</td><td>uuid4, uuid4_hex</td></tr><tr><td><code>hashlib</code>（SL1）</td><td>md5, sha1, sha256, sha512（md5/sha1 仅校验和与兼容用途）</td></tr><tr><td><code>hmac</code>（SL1）</td><td>sha256, sha256_verify</td></tr><tr><td><code>secrets</code>（SL1）</td><td>token_hex, rand_below, choice（密码学安全随机）</td></tr><tr><td><code>decimal</code>（SL1）</td><td>add, sub, mul, div, compare（字符串承载的精确十进制）</td></tr><tr><td><code>statistics</code>（SL1）</td><td>mean, median, variance, stdev（纯 Intent；总体方差，契约封门）</td></tr><tr><td><code>textwrap</code>（SL1）</td><td>wrap, fill, indent, shorten（纯 Intent；换行走 chr(10)）</td></tr><tr><td><code>csv</code>（SL1）</td><td>parse_line, serialize_row, parse（RFC 4180 子集；引号走 chr(34)）</td></tr><tr><td><code>argparse</code>（SL1）</td><td>parse, get（--key value 对 + 裸 --flag 置真；演示级）</td></tr><tr><td><code>pathlib</code>（SL1）</td><td>name, stem, suffix, parent, join_path, with_suffix（纯 Intent；不叫 join——避让核心内置）</td></tr><tr><td><code>memory</code>（MM1）</td><td>mem_live, alloc_total, mem_stats, gc_collect, ref_count（寄生策略：弱引用注册表 + 宿主分代 GC；docs/memory_design.md）</td></tr><tr><td><code>functools</code>（X1）</td><td>compose(f, g)（右先生效的组合）/ memoize(f)（单参记忆化，无淘汰子集）</td></tr><tr><td><code>bim/*</code></td><td>unit(单位换算) / geometry(Vector3D 等) / transform(矩阵) / solid / polygon / pipe / pipe_fittings / pipe_routing(A* 3D 寻路) / <strong>cbwd</strong>(BD4：洞口合并——连通分量+空间哈希预筛，与 CBWD 参考逐例一致)</td></tr></tbody></table>\n<p>字典方法（P3.1）：<code>d.has_key(k)</code> / <code>d.keys()</code> / <code>d.values()</code>；dict 键统一为 Python 标量形态（<code>DictValue._norm_key</code>），int/float/str/bool 键均可，<code>{1: &quot;a&quot;}</code> 与 <code>squares[3]</code> 自然工作。</p>\n<h3 id=\"43-字节码编译器与栈式-vmv03\">4.3 字节码编译器与栈式 VM（V0.3）</h3>\n<p><code>src/intent_bytecode.py</code>：AST → 字节码 → 栈式 VM。</p>\n<p><strong>原生字节码覆盖</strong>：let/let mut、算术与比较、not、print、if/else、while、break/continue、函数定义与调用（含递归）、return、<strong>闭包</strong>（MAKE_CLOSURE 捕获定义时环境，Env 链实现词法作用域）、<strong>管道</strong>（编译期 desugar 为嵌套调用）、<strong>Result ? 传播</strong>（UNWRAP_OK：Err 跳函数末尾 RET 提前返回）、<strong>契约检查</strong>（requires 进门验收 / ensures 经 return 重写验收，违约抛 ContractViolation）。函数体末条为表达式时其值即返回值（与解释器隐式返回一致）。</p>\n<p><strong>委托通道（RUN_AST）</strong>：match / 类与对象 / with / 方法调用 / for / try / 生成器 / 装饰器 / 泛型 / 默认参数等重特性——AST 节点原样交给树遍历解释器执行，与 VM 共享同一环境（VMScope 适配器：<code>symbols</code> 与 <code>Env.vars</code> 为同一 dict，双向可见）。VMScope 是 Scope 的真子类，VM 启动时将解释器 <code>global_scope</code> 桥接为 VM 全局环境——嵌套 import 沿作用域链找到 VM 里的正版模块树。对象运算符重载（<code>__add__</code>/<code>__eq__</code>…）经 <code>_binary_op</code> 委托，零重复实现。任何未原生覆盖的节点都走委托通道——<strong>任意 Intent 程序可编译</strong>。</p>\n<p><strong>架构</strong>：Emitter（回填跳转/委托上下文）→ VM（值栈 + 帧栈 + 环境链）；VMClosure 是 FunctionValue 子类——解释器侧调用分发零改动。委托块内的 return 经 <code>_VMReturn</code> 信号回传 VM 调用链；break/continue 经流控标志回传原生循环。</p>\n<p><strong>V0.3 性能（T7）</strong>：主循环热指令全内联——<code>stack/push/pop/frames/env/code/ip</code> 驻留局部变量；LOAD_VAR/STORE_VAR/ASSIGN_VAR 直接走环境链；双侧 IntValue 的算术/比较走快路径（bool 不是 IntValue 子类，<code>type() is</code> 精确匹配不误吞）；argc≤1 的闭包调用免列表构造。委托点前同步 <code>self.env</code>，慢路径仍走原方法。基准：fib(25) VM ≈788ms vs 解释器 ≈3415ms ≈ <strong>4.3x</strong>（<code>tests/perf_check.intent</code>，<code>Time:</code> 计时行走 vm_diff 归一化）。</p>\n<p><strong>已知边界</strong>：委托块外的 break/continue 宽松忽略；VM 错误抛原生异常（无 P0.1 诊断渲染）；程序级「返回值」 CLI 摘要行两侧暂不一致。</p>\n<p>输出约定：编译元信息走 stderr，程序输出走 stdout——<code>--compile --run-vm</code> 的 stdout 与解释器 stdout 可直接 diff 对照。\n差分测试工具：<code>python tools/vm_diff.py</code>（默认跑 examples/ + tests/test_*，逐位归一化比对，退出码 1 表示有语义分歧）。\n注：<code>src/mini_intent.py</code> 作为 <code>__main__</code> 运行时会把自身注册进 <code>sys.modules[&#x27;mini_intent&#x27;]</code>——辅助模块 <code>from mini_intent import ...</code> 才不会重新加载出第二套类定义。</p>\n<h3 id=\"44-内存管理mm1寄生策略\">4.4 内存管理（MM1，寄生策略）</h3>\n<p>容器值（List/Dict/Instance）在 <code>__init__</code> 即登记进模块级 <code>_ObjectRegistry</code>（弱引用表，不拉长寿命）。\n循环垃圾委托宿主 CPython 分代 GC；<code>gc_collect_now()</code> = 快照 → <code>gc.collect()</code> → 快照，差值即回收容器数。\n语义：<code>mem_live()</code> 存活容器数；<code>alloc_total()</code> 累计创建（单调增）；<code>mem_stats()</code> 含 by_type 分布；\n<code>ref_count(obj)</code> 为宿主观测值（含解释器内部引用，只做诊断）。\n设计文档：<code>docs/memory_design.md</code>（含 M2/M3 演进与四条已知限制）。\n已知限制：<code>ListValue.copy()</code> 不处理环——自引用列表作为 Intent 函数实参会无限递归（形参复制传值语义，M2 期修）。</p>\n<hr>\n<h2 id=\"5-cli\">5. CLI</h2>\n<pre><code>python src/mini_intent.py &lt;file&gt;           # 执行\npython src/mini_intent.py &lt;file&gt; [args...] # 执行, 额外参数经 args() 读取\npython src/mini_intent.py -c &quot;code&quot;        # 直接执行代码串\npython src/mini_intent.py --check [file]   # 只解析不执行: 干净退出0, 错误退出2\npython src/mini_intent.py --types [file]   # L1: 渐进类型静态检查(mypy-lite: 标注处检查+推断处放过)\npython src/mini_intent.py --compile file.intent [--run-vm]  # M10: 编译字节码(可选 VM 执行)\npython src/mini_intent.py --emit tokens|ast &lt;file&gt;   # 分析结果写文件\npython src/mini_intent.py --test [path]    # 测试(默认 tests/, _ 开头跳过)\npython src/mini_intent.py --lint file.intent         # 静态检查(let 重赋值/空 catch/无契约/未用 import)\npython src/mini_intent.py --doc file.intent          # 生成 markdown 模块文档\npython src/mini_intent.py --fmt file.intent         # 格式化, 输出到 stdout(重定向即写回)\npython src/mini_intent.py --install [url|dir]  # 安装依赖(url 单个; dir 含 intent.toml 按项目批量; 无参按当前目录批量)\npython src/mini_intent.py --install --dry-run [dir]  # PK1: 依赖解析预演(约束合并/冲突检测, 不安装)\npython src/mini_intent.py --debug file.intent  # C7: 调试模式(断点/单步/变量检视/调用栈)\npython src/mini_intent.py --postmortem file.intent  # EX2: 事后调试(帧快照存档 + 崩溃后进场检视)\npython tools/venv.py create|install|list|activate  # PK2: 虚拟环境(.venv 隔离 + 全局缓存 + PATH)\npython src/mini_intent.py --version        # 版本\npython src/mini_intent.py -t / -a          # 只看 tokens / AST\npython src/mini_intent.py -r               # REPL\npython src/mini_intent.py -d               # 演示\npython src/mini_intent.py -p               # 哲学视角翻译</code></pre>\n<p>退出码：0 成功 ｜ 1 运行时/测试失败/类型错误（<code>--types</code>）｜ 2 用法/语法错误（<code>--check</code>/<code>--types</code>）。\nbanner 与 pyreadline 提示只在 TTY 显示（<code>--fmt &gt; file</code> 等管道场景输出纯净）。\n⚠️ 文件模式当前为<strong>宽松执行</strong>（语法错误警告后继续，退出码 0）——测试模式与 <code>--check</code> 严格。CI 请用 <code>--check</code> + <code>--test</code>。</p>\n<hr>\n<h2 id=\"6-已知限制诚实清单\">6. 已知限制（诚实清单）</h2>\n<table><thead><tr><th>#</th><th>限制</th><th>状态</th></tr></thead><tbody><tr><td>1</td><td>执行引擎</td><td>双轨：树遍历解释器 + 字节码 VM（V0.3，fib25 ≈4.3x）；无 JIT</td></tr><tr><td>2</td><td>并发（async/channel）</td><td>🔜 部分实现（2026-10-18 CC1：spawn + scope 结构化并发，Python threading 演示级；CC2：channel 通信原语 <code>ch &lt;- v</code> / <code>&lt;- ch</code> / close；async/await（A3）排队）</td></tr><tr><td>3</td><td>包管理（intent.toml/注册表）缺失，import 仅文件级</td><td>✅ 已实现（2026-10-16：intent.toml + --install + lib 搜索路径；2026-10-18：本地目录注册表 publish/list/install；PK1 依赖解析器 semver 约束 + 冲突解决 + intent.lock，--dry-run 预演）</td></tr><tr><td>4</td><td>位运算、复合赋值、<code>:=</code>/<code>++</code>/<code>--</code> 词法接受但语义未实现</td><td>预留</td></tr><tr><td>5</td><td>match range 模式、类型别名/Union 未实现</td><td>~~路线图 P1.3~~ ✅ 已实现（2026-10-16，match range 仍未实现）</td></tr><tr><td>6</td><td>静态类型检查缺失（Resolver 只做作用域分析）</td><td>✅ 已实现（2026-10-18 L1：<code>--types</code> 渐进类型检查——标注处检查 + 推断处放过，mypy-lite 最小切片；容器元素类型/全量推断留待完整版）</td></tr><tr><td>7</td><td>f-string/多行字符串：插值 <code>${}</code> 已支持；<code>f&quot;...&quot;</code> 前缀与 <code>&quot;&quot;&quot;</code> 三引号未实现</td><td>✅ 已实现（2026-10-16）</td></tr><tr><td>8</td><td>formatter/linter/LSP 缺失</td><td>formatter ✅ linter ✅ doc ✅ 已实现（2026-10-16）；LSP ✅ 已实现（2026-10-18，tools/lsp/）</td></tr><tr><td>9</td><td>with 语句</td><td>✅ 已实现（2026-10-16）</td></tr><tr><td>10</td><td>yield from / 泛型约束</td><td>✅ 已实现（2026-10-16）</td></tr><tr><td>11</td><td><code>//</code> 是行注释——整除运算符在源码中不可达（<code>5 // 0</code> 被词法吞为注释）</td><td>已知语言限制（用 <code>/</code> 真除法；修法需词法上下文歧义消解，排队）</td></tr><tr><td>12</td><td><code>str(inf)</code> 抛 OverflowError（1e308*10 → inf 时）；字典缺键抛 RuntimeError（KeyError 转译）；<code>len(None)</code> 抛 AttributeError</td><td>行为快照，均可被 catch 捕获（见 tests/test_fuzz.intent）</td></tr><tr><td>13</td><td>内置无方法式调用：<code>lst.push(x)</code> 不被支持，须写自由函数 <code>push(lst, x)</code>（成员访问不回退内置）</td><td>语法选择（类方法才行）；</td></tr><tr><td>14</td><td><code>ListValue.copy()</code> 不处理环：自引用列表作 Intent 函数实参 → 无限递归（形参复制传值）</td><td>M2 期修（copy 带 memo 表）；诊断路径直调内置绕行</td></tr><tr><td>15</td><td><code>import std.X</code> 将模块全部符号注入当前作用域，可能遮蔽核心内置（如 pathlib.join 曾遮蔽 join）</td><td>命名避让（join_path）；根治需改 import 语义，排队</td></tr><tr><td>16</td><td><code>and</code>/<code>or</code> 原为两侧 eager 求值（<code>i &lt; len(l) and l[i] &lt; x</code> 边界越界）</td><td>✅ 已修复（2026-10-18：短路求值，返回类型保持 BoolValue；VM 经委托通道同受益）</td></tr><tr><td>17</td><td><code>import std.X</code> 扁平注入符号，但中间名（如 <code>unit</code>）不是独立符号，<code>unit.mm_to_m(...)</code> 报 NameError</td><td>已知边界（2026-10-19 BD2 期实证）；用裸名 <code>mm_to_m(...)</code> 或全链 <code>std.bim.unit.mm_to_m(...)</code>；BD1 模板已修正</td></tr><tr><td>18</td><td>FFI 仅最小切片：无回调/数组/联合/varargs/头文件解析/<code>foreign</code> 语法糖</td><td>I1 剩余部分（20 人日中的未做部分，ROADMAP 维度 8 已注断点）</td></tr><tr><td>19</td><td><code>run_source</code> 对容器返回 RuntimeValue 树（ListValue.value 内为 IntValue 等），非原生类型</td><td>桥侧已脱壳（tools/revit_bridge.py <code>_to_native</code>）；宿主接入时需自行转换</td></tr><tr><td>20</td><td>Python 桥（I2a）无关键字参数/类实例化/回调</td><td>最小切片边界（spec §3.16）；完整版随 I2a 剩余部分</td></tr></tbody></table>\n<hr>\n<h2 id=\"7-文档勘误记录本版修正\">7. 文档勘误记录（本版修正）</h2>\n<table><thead><tr><th>位置</th><th>原文</th><th>修正</th><th>依据</th></tr></thead><tbody><tr><td>philosophy_mapper.md</td><td><code>class B : A { ... }</code></td><td><code>class B &lt; A { ... }</code></td><td>Parser mini_intent.py:1006</td></tr><tr><td>philosophy_mapper.md</td><td><code>90..100 =&gt; &quot;A&quot;</code></td><td>match range 未实现，用 <code>n if n &gt;= 90 =&gt; &quot;A&quot;</code></td><td><code>_parse_pattern</code> 无 range 分支</td></tr><tr><td>chapter_05（lesson_05.intent）</td><td><code>catch { ... }</code></td><td><code>catch e { ... }</code></td><td>parse_try_stmt mini_intent.py:1318</td></tr><tr><td>README.md</td><td><code>let mut</code> 演示 counter = counter + 1 等</td><td>保持（非错误）</td><td>—</td></tr></tbody></table>\n<hr>\n<p><em>规范版本 v1.11.0 · 2026-10-19 从实现提取 · 与 mini_intent.py 工作区对齐（v2.11.0：X1 装饰器最小切片——@deco + functools 系 + 顶层函数一等值修复；§4.2 functools）</em></p>", "text": "Intent 语言规范 v1.8.0 心学为体，禅道为翼，马哲为用 本文档是 Intent 的权威规范 ，从实现（ src/mini_intent.py ）反向提取，每个条目标注源码锚点。 教学视角见 docs/chapter_01~08_*.md ；设计哲学见 docs/philosophy_mapper.md 。 规范与实现冲突时，以本文件标注的源码行为为准，并提 issue 修文档。 状态标注 ：✅ 已实现 ｜ 🔜 已预留（词法接受，语义未完整） ｜ ⚠️ 文档曾写错（已在本版修正） 1. 词法 1.1 字符与注释 源码 UTF-8。三种注释（ Lexer.skip_comment mini_intent.py:262）： # 井号注释 // 双斜杠注释 /* 块注释 */ 1.2 标识符与关键字 标识符：字母/下划线开头，含字母数字下划线。 关键字 （ Lexer.KEYWORDS mini_intent.py:203）按支持度分三档： 已实现 ✅ let, def, return, if, else, elif, for, while, break, continue, match, requires, ensures, import, as, class, this, mut, fn, try, catch, finally, defer, assert, enum, yield, and, or, not, in, raise, spawn, scope 字面量关键字 ✅ true, false, null（None/True/False 同义接受） 记录性注解 ✅ pure（ func.is_pure ，仅记录不强制）, effect [...] （效果列表，仅记录） 别名（兼容，推荐用主形式） var, const ≡ let 预留未实现 🔜 func（用 def/fn）, is（用 ==）, invariant（契约扩展） from 已在 EX1 启用： raise &lt;错误值&gt; from &lt;原因&gt; （非 import 的 from）。 内置类型标识符 （非关键字， Lexer.BUILTIN_TYPES mini_intent.py:212）： Int Float String Bool List Dict 1.3 字面量 类型 形式 示例 Int 十进制数字 42 -7 Float 带小数点或科学计数 3.14 1e-3 String 双引号，支持 \\ 转义 &quot;hello\\n&quot; f-string f&quot;...&quot; 前缀（显式插值宣告） f&quot;${name} 好&quot; 插值字符串 ${expr} 内嵌求值 &quot;${name} 得分 ${score}&quot; 多行字符串 &quot;&quot;&quot;...&quot;&quot;&quot; 或 &#x27;&#x27;&#x27;...&#x27;&#x27;&#x27; ，保留换行 见下 Bool true / false Null null List [a, b, c] [1, 2, 3] Dict {key: value} {&quot;x&quot;: 1} 1.4 运算符全表（ Lexer.SYMBOLS mini_intent.py:216） 类别 运算符 算术 + - * / % ** // 比较 == != &lt; &gt; &lt;= &gt;= 逻辑 and or not （关键字形式） 位运算 🔜 &amp; ` 赋值 = += -= *= /= %= **= //= 等 🔜（除 = 外预留） 结构 ( ) { } [ ] , : ; . 箭头 -&gt; （返回类型） =&gt; （match 分支/λ） &lt;- （CC2 通道发送/接收） 管道 ` 其他 @ （装饰器） := ++ -- 🔜 2. 类型系统 2.1 类型规则（Intent 与 Python 的根本分歧） 运行时动态类型 ：值在运行时携带类型；没有编译期类型检查 类型推断 = 心即理 ： let x = 10; 无需标注，系统知道 x: Int let 默认不可变 ： let 声明的变量不可重新赋值； let mut 显式宣告可变（ Scope.declare mini_intent.py:3040 附近，违例报「无法修改常量」） 契约优先于类型 ： requires/ensures 是运行时可验证的断言，比类型标注更受信任 数值互通（刻意宽松） ： Int 标注接受 Float 值（ IntType.can_assign_from 显式设计）；类型别名与 Union 同理遵循各底层成员规则 泛型约束即契约 ： T: Comparable 违约抛 ContractError （契约错误通道），不是普通 TypeError 2.2 类型标注语法 let x: Int = 10; // 显式标注(可选) def f(a: Float, b: Float): Float { ... } // 参数与返回类型 def g&lt;T&gt;(x: T): T { ... } // 泛型函数(类型参数从实参推断) 标注是提示，不是枷锁： intent check --types （ --types ）做渐进类型静态检查—— 标注处检查 + 推断处放过 （mypy-lite，L1）： 变量声明 let x: T = expr 、调用实参 vs 形参标注、 return vs 返回标注，三处可推断即检查； 推断不出类型的一律放过（显式信任，不猜）； 数值互通（§2.1）：Int/Float 双向接受； Union 标注任一成员合法；泛型参数视为 Any；类型别名透明解析； 容器只查基类（ List[Int] 的元素类型不查，留待完整版）； 契约优先于类型： requires/ensures 是运行时可验证的主防线，类型是静态副防线。 正反例判定自测： tools/typecheck_selftest.py （21/21）。已知边界： std/itertools2.intent 的多行 export 语法不被 parser 接受（ --check 同拒，宽松执行模式容忍）——类型检查以语法干净为前提。 2.3 内建类型 类型 值类型 相等性 Int 64 位整数 值相等 Float 双精度浮点 值相等 String Unicode 字符串 值相等 Bool true/false 值相等 List 有序序列，元素可为混合类型 逐元素递归相等（ _binary_op mini_intent.py:6186） Dict 字符串/数值键 → 值 键集合一致 + 值逐项递归相等（mini_intent.py:6200，2026-10-16 修复） Result&lt;T,E&gt; Ok(v) / Err(e) — 2.4 Result&lt;T,E&gt;（烦恼即菩提） let r = Ok(42); // 构造: Ok(v) / Err(e) let r2 = safe_divide(10, 0)?; // ? 操作符: Err 向上传播,Ok 解包 r.is_ok // Bool 属性 r.unwrap() // 方法: Ok 返回值,Err 抛 NameError 2.5 泛型（函数级）与约束 def identity&lt;T&gt;(x: T): T { return x; }; identity(42); // T = Int def max_of&lt;T: Comparable&gt;(a: T, b: T): T { ... }; max_of(3, 7); // Int 满足 Comparable → 7 max_of(Ok(1), Ok(2)); // Result 不满足 → ContractError(契约违约) 内置约束： Comparable （Int/Float/String/Bool）、 Numeric （Int/Float）。未知约束宽容放行。 类型别名（ type Meters = Float; ）为透明同义词；Union（ A | B ）任一成员合法即通过。 3. 语法 语句以 ; 结尾（一句话说完了）。顶层结构 = 函数定义 + 全局语句。 3.1 变量声明 let [mut] name [: Type] = expr ; ⚠️ var / const 是 let 的兼容别名，新代码用 let 。 3.2 函数定义 def name(params) [: ReturnType] [requires ...] [ensures ...] { body } ; 默认参数： def f(x: Int, y: Int = 10) { ... } Lambda： fn(x) { return x 2; } 或 fn(x) =&gt; x 2 🔜（箭头体未实现，用块体） 闭包：函数可嵌套定义，携带诞生环境（ _t_clret.intent 验证） 装饰器： @deco def f() {...} 🔜（解析支持，执行路径有限） 生成器：函数体内 yield expr; ，收集为 List 返回（mini_intent.py:5367） 生成器委派（P1.5）： yield from expr; ——可迭代对象的元素逐个转发（支持 List/Dict 键） 契约 （一等公民，Intent 的身份证）： def divide(a: Float, b: Float): Float requires b != 0.0 // 进门签合同:不满足则拒绝执行(抛 ContractViolation) ensures result * b == a // 出门前验货:result 是返回值的特殊名 { return a / b; }; 3.3 控制流 if cond { ... } else if cond2 { ... } else { ... } // if 是表达式,可 let r = if c { 1 } else { 0 }; while cond { ... }; for x in iterable { ... }; // iterable: List / Dict(遍历键) / range() for (k, v) in dict { ... }; // 解包遍历 break; continue; &quot;sub&quot; in &quot;string&quot;; // in 右侧支持 String(子串归属) else if 链 2026-10-18 落地：parser 将 else 后随的 if 解析为嵌套 IfStmt（与 elif 语义等价）——规范先立、实现补票（tests/test_control_flow.intent 回归）。 3.3b with 语句（P1.1，块级资源管理） with Resource(&quot;db&quot;) as r { // 块退出时自动调用 r.close()(若有) r.use(); }; 3.3c 类型别名与 Union（P1.3a） type Meters = Float; // 别名: 透明同义词(type 是软关键字) type Shape = Circle | Square; // Union: 任一成员合法即通过 let x: Int | String = 42; 3.4 match 模式匹配（表达式，强制穷举检查） let grade = match score { &quot;A&quot; =&gt; &quot;优秀&quot;, // 字面量 n if n &gt;= 90 =&gt; &quot;A&quot;, // 守卫(变量绑定 + if 条件) _ =&gt; &quot;其他&quot;, // 通配符(有意识地放弃穷举) }; 支持的模式：字面量 / 变量绑定 / _ 通配 / or 模式 A | B / 构造器解构。 match range 模式（ 90..100 ）🔜 未实现 ——philosophy_mapper.md 曾写成已支持，实际需用 if 守卫（2026-10-16 测试发现）。 穷举检查：无通配/变量/或模式覆盖全部字面量时，静态报 MatchError （ _check_match_exhaustive mini_intent.py:1509）。 3.5 错误处理 try { risky(); } catch e { handle(e); } finally { cleanup(); }; defer { cleanup(); }; // 作用域退出时逆序执行(函数级) catch 必须带变量名： catch e { } 或 catch (e) { } （lesson_05 曾写 catch { ，2026-10-16 确认为文档错误） try/catch/finally 皆为表达式 catch 按类型分流（P1.4） ： catch e: ContractError { } ——类型不匹配的异常继续传播；错误值成员 e.type / e.message / e.stack 不可恢复错误不用异常，用契约（宪法第 4 条） 异常类型名（ PY_TO_INTENT_EXC 映射）：ContractError / AssertError / ValueError / TypeError / IndexError / KeyError / ZeroDivisionError / NameError / RuntimeError / SyntaxError / ImportError。 3.6 类与枚举 class Point { // ⚠️ 继承用尖括号: class Dog &lt; Animal(不是冒号!) def init() { this.x = 0; } // 构造器 def set(x: Int) { this.x = x; } // 方法(类体内 } 后不加分号) def get(): Int { return this.x; } }; let p = Point(); // 实例化 p.set(3); // 方法调用 p.x; // 字段访问 enum Direction { North, South, East, West }; // 枚举:变体注册为全局常量 运算符重载：实例定义 __add__ / __eq__ 等方法即生效（ _binary_op mini_intent.py:6225）。 3.7 管道与推导式 let result = data |&gt; filter(valid) |&gt; map(transform); // |&gt; 管道:从左到右 let squares = [x * x for x in nums if x &gt; 2]; // 列表推导式 let m = {k: len(k) for k in pairs}; // 字典推导式 3.8 模块系统 import std.math; // 标准库 import mylib; // 项目文件(搜索路径: 文件目录及其 std/ lib/ ./ ./std ./lib + ~/.intent/lib) import mylib as ml; // 别名 export my_func, my_const; // 显式导出(P2.1): 无 export 声明的模块维持全量导出(兼容) 模块查找优先级： &lt;base&gt;/&lt;name&gt;.intent → &lt;base&gt;/&lt;name&gt;/__init__.intent → &lt;base&gt;/&lt;name&gt;/&lt;name&gt;.intent （npm 风格）。 模块 = 文件；循环导入检测（ _import_stack ）；每个模块独立执行，导入时注册其导出符号。 扁平注入语义（已知边界，2026-10-19 记） ： import std.bim.unit; 把模块符号 扁平 注入当前作用域（ mm_to_m(...) 裸调可用），同时挂载嵌套链 std.bim.unit.mm_to_m(...) ；但中间名 unit 不是 独立符号—— unit.mm_to_m(...) 报 NameError。历史模板（tools/dynamo_node.py BD1）曾踩此坑，BD2 期已修正。 3.9 包管理（P2.1 + PK1 依赖解析，V0.2 本地优先） 项目清单 intent.toml ： [project] name = &quot;myproj&quot; version = &quot;0.1.0&quot; [deps] mathkit = { path = &quot;lib/mathkit&quot;, version = &quot;^1.2&quot; } # 路径依赖 + 语义化约束 utils = &quot;../utils&quot; # 路径依赖(无约束) web = { git = &quot;https://github.com/x/web.git&quot;, version = &quot;&gt;=2.0, &lt;3.0&quot; } --install &lt;url&gt; ：安装单个依赖（git clone --depth 1 到 ./lib/&lt;name&gt; ） --install &lt;dir&gt; ： &lt;dir&gt; 含 intent.toml → 按该项目批量解析安装（否则视为单个依赖源） --install （无参）：按当前目录 intent.toml 的 [deps] 批量安装 --install --dry-run [dir] ： 依赖解析预演 ——约束合并/冲突检测/解析计划，不安装不写锁（PK1 判定入口） 启动时： ./lib 与 ~/.intent/lib （全局库）自动加入模块搜索路径 PK1 依赖解析器 （ resolve_dependencies mini_intent.py:8550）： 约束语法： * （任意）/ ^1.2 （兼容：≥1.2.0 &lt;2.0.0）/ ~1.2 （补丁级：≥1.2.0 &lt;1.3.0）/ &gt;= &lt;= &gt; &lt; = / 逗号分隔多段（AND 语义）；语义化版本三段式，缺段补 0，正式版高于预发布版 解析算法：BFS 走依赖图 → 约束累积（钻石依赖合并）→ 候选枚举（路径依赖单候选；本地注册表 registry/ 多版本候选）→ 公共兼容集取最高版本 （最新不满足自动回退次高）→ 无解报 依赖冲突 （退出码 1，不写锁） intent.lock （JSON）：锁定每包 version/source/deps/required_by；非 dry-run 安装前写入 刻意不做：全局 SAT 求解；git 依赖的 tag 枚举（未克隆无版本可读，install 后校验） 3.10 错误处理：raise 与异常链（EX1） try { raise error(&quot;KeyError&quot;, &quot;缺键 name&quot;) from inner_err; // 显式因果链 } catch e { print(e.type); // &quot;KeyError&quot; — 定向捕获 print(e.__cause__.type); // 起因类型(无 from 时为 None) print(e.message); // 消息 print(e.stack); // Intent 调用链快照 }; error(type, message) 内置：构造一等错误值（raise 的原料） raise &lt;错误值&gt; ：ErrorValue 原样抛； Err(&quot;boom&quot;) 取内层消息；字符串简写 → RuntimeError ；其余类型明确拒绝（TypeError） raise X from Y ： X.__cause__ = Y ——因果显式化，不猜 未捕获到顶层：渲染含「异常链(__cause__, 从起因到外层)」段（ render_intent_error ） 刻意不做： __context__ （隐式上下文，异常处理中再抛新错的自动挂链） 3.11 结构化并发：spawn 与 scope（CC1） let mut results = []; def work(lo: Int, hi: Int) { ... push(results, partial_sum); }; scope { spawn work(0, 50); // 派生任务(调用点求值) spawn work(50, 100); }; // 块退出 = 汇合点: 全部任务自动 join // 此处两个任务必已完成 spawn &lt;可调用&gt;; / spawn f(args); ：Python threading 演示级实现；每个任务跑在独立 Interpreter 上，闭包作用域经 FunctionValue 共享 scope { ... } ：并发作用域——块内 spawn 的任务在块退出时统一 join；任务异常在 join 处重抛（第一个，不沉没） scope 外的 spawn 被拒绝（RuntimeError）—— 没有孤儿线程 词法作用域：scope 块是独立词法作用域（Resolver 同 try 块语义） 刻意不做：async/await（A3）、自由线程安全（A4）；channel 已由 CC2 交付（§3.12） 3.12 channel 通信（CC2） let ch = chan(); // 无界缓冲; chan(n) = 容量 n(满则发送阻塞) scope { spawn producer(ch); // 任务间经通道握手 — 不共享内存, 传递消息 spawn consumer(ch); }; ch &lt;- 42; // 发送: 阻塞直至入队; 通道已关闭则报错 let v = &lt;- ch; // 接收: 空则阻塞等待 close(ch); // 关闭: 发送此后再报错; 接收排空剩余即止 ch &lt;- v （SendExpr）/ &lt;- ch （RecvExpr）：与 Go channel 同形的词法（ &lt;- 是最优先级外的最低优先级运算符—— a&lt;-b 无空格即通道发送，比较请留空格） 线程安全由底层 queue.Queue 保证，不自己造锁；阻塞/关闭语义：缓冲满发送阻塞、空接收阻塞、关闭后排空再接收抛 ChannelClosedError （显式失败，不返回哑值） 通道是引用语义：传参/赋值共享同一通道（ copy() 返回自身） 刻意不做：select 多路复用、带超时的 receive（A3 async 期再议） 3.13 测试框架深化（TQ1） 在 D1（ --test + test_* 函数 + assert ）之上的 pytest 子集等价物——无装饰器语法前的约法： def setup() { ... }; // fixture 钩子: 每个用例前由运行器调用 def teardown() { ... };// fixture 钩子: 每个用例后调用(失败/skip 也清理) def test_x() { let err = expect_error(fn() { items[99]; }, &quot;IndexError&quot;); // 预期异常 skip(&quot;环境不具备&quot;); // 诚实跳过 param_cases([[1, 2], [3, 4]], fn(a, b) { ... }); // 参数化 let m = mock(&quot;svc&quot;); m(1); // 测试替身 assert mock_call_count(m) == 1, &quot;调用被记录&quot;; }; expect_error(fn, type) ：断言 fn() 抛出指定类型——返回捕获的 ErrorValue；未抛错或类型不符 → AssertionError（坏路径也是契约的一部分） skip(reason) ：抛出 SkipTest，运行器计为「跳过」——既非通过也非失败，摘要单独计数（ 9/10 通过, 0 失败, 1 跳过 ） param_cases(cases, fn) ：cases 是用例列表，每项展开传给 fn；失败带用例序号（定位到个案） mock(name) / mock_return(m, v) / mock_calls(m) / mock_call_count(m) ：记录调用序列的测试替身，可直接调用 m(args) setup/teardown 是文件级约定（与 test_* 同文件定义），运行器负责环绕；teardown 自身失败即用例失败 3.14 帧快照与事后调试（EX2） python src/mini_intent.py --postmortem tests/_demo_error_stack.intent 异常穿帧时，每层 execute_function / _execute_method 把本帧局部变量快照挂上异常（ _intent_frames ，从外到内）——帧快照取自建帧时挂在 CallFrame.scope 上的本帧作用域，各帧各的本地人 --postmortem ：渲染完整诊断（D3）→ 帧快照写盘 .intent_postmortem.json （停机后可捡回）→ 帧检视 + 命令循环（ frames / frame N / vars / where / quit ）；默认停在出错帧（最内层） 非交互（stdin EOF）自动收尾，退出码 0——postmortem 的职责是接住崩溃，不是复制失败 与 C7 --debug 的分工：debugger 事前（打断点逐步走），postmortem 事后（栈已冻结，只检视不执行） 3.15 C ABI FFI（I1 最小切片，ctypes 背载） let lib = ffi_load(&quot;msvcrt&quot;); // 加载 .dll/.so let strlen = ffi_func(lib, &quot;strlen&quot;, &quot;Int&quot;, [&quot;Str&quot;]); // 声明外部函数 print(strlen(&quot;hello&quot;)); // 5 let pt = ffi_struct([&quot;x&quot;, &quot;y&quot;], [&quot;Int&quot;, &quot;Int&quot;]); // 结构体(平铺标量) ffi_field_set(pt, &quot;x&quot;, 42); let user32 = ffi_load(&quot;user32&quot;); let get_cursor = ffi_func(user32, &quot;GetCursorPos&quot;, &quot;Int&quot;, [&quot;Struct&quot;]); get_cursor(pt); // 结构体按引用传(出参) print(ffi_field_get(pt, &quot;x&quot;)); 类型名白名单： Int (c_int) / Float (c_double) / Str (c_char_p, utf-8) / Bool (c_int) / Ptr (c_void_p) / Struct (指针语义) / Void (仅返回)；声明期校验，未知类型名抛 ValueError Struct 形参 = 指向结构体的指针（Win32 出参/入参指针模式）—— 未声明 argtypes 的 ctypes 函数对 Structure 实例按值传递，必须显式 byref （实测 GetCursorPos：传实例 ret=0，byref ret=1） 符号不存在 / 库加载失败 / 实参个数或类型不符 → RuntimeError/TypeError，显式失败不返回哑值 架构立场：寄生期复用宿主 CPython 的 ctypes，不自己造 ABI 桥（ROADMAP §0.1） 完整 I1 剩余 （20 人日中的未做部分）：回调（CFUNCTYPE）、数组/联合、varargs、头文件解析、 foreign 语法糖——最小切片已交付并通过 8 项测试（tests/test_ffi.intent，Windows 真实 API msvcrt/user32） 3.16 Python 互操作桥（I2a 最小切片，寄生期标志） import py , alloc_total, mem_stats, gc_collect, ref_count（寄生策略：弱引用注册表 + 宿主分代 GC；docs/memory_design.md） functools （X1） compose(f, g)（右先生效的组合）/ memoize(f)（单参记忆化，无淘汰子集） bim/* unit(单位换算) / geometry(Vector3D 等) / transform(矩阵) / solid / polygon / pipe / pipe_fittings / pipe_routing(A* 3D 寻路) / cbwd (BD4：洞口合并——连通分量+空间哈希预筛，与 CBWD 参考逐例一致) 字典方法（P3.1）： d.has_key(k) / d.keys() / d.values() ；dict 键统一为 Python 标量形态（ DictValue._norm_key ），int/float/str/bool 键均可， {1: &quot;a&quot;} 与 squares[3] 自然工作。 4.3 字节码编译器与栈式 VM（V0.3） src/intent_bytecode.py ：AST → 字节码 → 栈式 VM。 原生字节码覆盖 ：let/let mut、算术与比较、not、print、if/else、while、break/continue、函数定义与调用（含递归）、return、 闭包 （MAKE_CLOSURE 捕获定义时环境，Env 链实现词法作用域）、 管道 （编译期 desugar 为嵌套调用）、 Result ? 传播 （UNWRAP_OK：Err 跳函数末尾 RET 提前返回）、 契约检查 （requires 进门验收 / ensures 经 return 重写验收，违约抛 ContractViolation）。函数体末条为表达式时其值即返回值（与解释器隐式返回一致）。 委托通道（RUN_AST） ：match / 类与对象 / with / 方法调用 / for / try / 生成器 / 装饰器 / 泛型 / 默认参数等重特性——AST 节点原样交给树遍历解释器执行，与 VM 共享同一环境（VMScope 适配器： symbols 与 Env.vars 为同一 dict，双向可见）。VMScope 是 Scope 的真子类，VM 启动时将解释器 global_scope 桥接为 VM 全局环境——嵌套 import 沿作用域链找到 VM 里的正版模块树。对象运算符重载（ __add__ / __eq__ …）经 _binary_op 委托，零重复实现。任何未原生覆盖的节点都走委托通道—— 任意 Intent 程序可编译 。 架构 ：Emitter（回填跳转/委托上下文）→ VM（值栈 + 帧栈 + 环境链）；VMClosure 是 FunctionValue 子类——解释器侧调用分发零改动。委托块内的 return 经 _VMReturn 信号回传 VM 调用链；break/continue 经流控标志回传原生循环。 V0.3 性能（T7） ：主循环热指令全内联—— stack/push/pop/frames/env/code/ip 驻留局部变量；LOAD_VAR/STORE_VAR/ASSIGN_VAR 直接走环境链；双侧 IntValue 的算术/比较走快路径（bool 不是 IntValue 子类， type() is 精确匹配不误吞）；argc≤1 的闭包调用免列表构造。委托点前同步 self.env ，慢路径仍走原方法。基准：fib(25) VM ≈788ms vs 解释器 ≈3415ms ≈ 4.3x （ tests/perf_check.intent ， Time: 计时行走 vm_diff 归一化）。 已知边界 ：委托块外的 break/continue 宽松忽略；VM 错误抛原生异常（无 P0.1 诊断渲染）；程序级「返回值」 CLI 摘要行两侧暂不一致。 输出约定：编译元信息走 stderr，程序输出走 stdout—— --compile --run-vm 的 stdout 与解释器 stdout 可直接 diff 对照。 差分测试工具： python tools/vm_diff.py （默认跑 examples/ + tests/test_*，逐位归一化比对，退出码 1 表示有语义分歧）。 注： src/mini_intent.py 作为 __main__ 运行时会把自身注册进 sys.modules[&#x27;mini_intent&#x27;] ——辅助模块 from mini_intent import ... 才不会重新加载出第二套类定义。 4.4 内存管理（MM1，寄生策略） 容器值（List/Dict/Instance）在 __init__ 即登记进模块级 _ObjectRegistry （弱引用表，不拉长寿命）。 循环垃圾委托宿主 CPython 分代 GC； gc_collect_now() = 快照 → gc.collect() → 快照，差值即回收容器数。 语义： mem_live() 存活容器数； alloc_total() 累计创建（单调增）； mem_stats() 含 by_type 分布； ref_count(obj) 为宿主观测值（含解释器内部引用，只做诊断）。 设计文档： docs/memory_design.md （含 M2/M3 演进与四条已知限制）。 已知限制： ListValue.copy() 不处理环——自引用列表作为 Intent 函数实参会无限递归（形参复制传值语义，M2 期修）。 5. CLI python src/mini_intent.py &lt;file&gt; # 执行 python src/mini_intent.py &lt;file&gt; [args...] # 执行, 额外参数经 args() 读取 python src/mini_intent.py -c &quot;code&quot; # 直接执行代码串 python src/mini_intent.py --check [file] # 只解析不执行: 干净退出0, 错误退出2 python src/mini_intent.py --types [file] # L1: 渐进类型静态检查(mypy-lite: 标注处检查+推断处放过) python src/mini_intent.py --compile file.intent [--run-vm] # M10: 编译字节码(可选 VM 执行) python src/mini_intent.py --emit tokens|ast &lt;file&gt; # 分析结果写文件 python src/mini_intent.py --test [path] # 测试(默认 tests/, _ 开头跳过) python src/mini_intent.py --lint file.intent # 静态检查(let 重赋值/空 catch/无契约/未用 import) python src/mini_intent.py --doc file.intent # 生成 markdown 模块文档 python src/mini_intent.py --fmt file.intent # 格式化, 输出到 stdout(重定向即写回) python src/mini_intent.py --install [url|dir] # 安装依赖(url 单个; dir 含 intent.toml 按项目批量; 无参按当前目录批量) python src/mini_intent.py --install --dry-run [dir] # PK1: 依赖解析预演(约束合并/冲突检测, 不安装) python src/mini_intent.py --debug file.intent # C7: 调试模式(断点/单步/变量检视/调用栈) python src/mini_intent.py --postmortem file.intent # EX2: 事后调试(帧快照存档 + 崩溃后进场检视) python tools/venv.py create|install|list|activate # PK2: 虚拟环境(.venv 隔离 + 全局缓存 + PATH) python src/mini_intent.py --version # 版本 python src/mini_intent.py -t / -a # 只看 tokens / AST python src/mini_intent.py -r # REPL python src/mini_intent.py -d # 演示 python src/mini_intent.py -p # 哲学视角翻译 退出码：0 成功 ｜ 1 运行时/测试失败/类型错误（ --types ）｜ 2 用法/语法错误（ --check / --types ）。 banner 与 pyreadline 提示只在 TTY 显示（ --fmt &gt; file 等管道场景输出纯净）。 ⚠️ 文件模式当前为 宽松执行 （语法错误警告后继续，退出码 0）——测试模式与 --check 严格。CI 请用 --check + --test 。 6. 已知限制（诚实清单） # 限制 状态 1 执行引擎 双轨：树遍历解释器 + 字节码 VM（V0.3，fib25 ≈4.3x）；无 JIT 2 并发（async/channel） 🔜 部分实现（2026-10-18 CC1：spawn + scope 结构化并发，Python threading 演示级；CC2：channel 通信原语 ch &lt;- v / &lt;- ch / close；async/await（A3）排队） 3 包管理（intent.toml/注册表）缺失，import 仅文件级 ✅ 已实现（2026-10-16：intent.toml + --install + lib 搜索路径；2026-10-18：本地目录注册表 publish/list/install；PK1 依赖解析器 semver 约束 + 冲突解决 + intent.lock，--dry-run 预演） 4 位运算、复合赋值、 := / ++ / -- 词法接受但语义未实现 预留 5 match range 模式、类型别名/Union 未实现 ~~路线图 P1.3~~ ✅ 已实现（2026-10-16，match range 仍未实现） 6 静态类型检查缺失（Resolver 只做作用域分析） ✅ 已实现（2026-10-18 L1： --types 渐进类型检查——标注处检查 + 推断处放过，mypy-lite 最小切片；容器元素类型/全量推断留待完整版） 7 f-string/多行字符串：插值 ${} 已支持； f&quot;...&quot; 前缀与 &quot;&quot;&quot; 三引号未实现 ✅ 已实现（2026-10-16） 8 formatter/linter/LSP 缺失 formatter ✅ linter ✅ doc ✅ 已实现（2026-10-16）；LSP ✅ 已实现（2026-10-18，tools/lsp/） 9 with 语句 ✅ 已实现（2026-10-16） 10 yield from / 泛型约束 ✅ 已实现（2026-10-16） 11 // 是行注释——整除运算符在源码中不可达（ 5 // 0 被词法吞为注释） 已知语言限制（用 / 真除法；修法需词法上下文歧义消解，排队） 12 str(inf) 抛 OverflowError（1e308*10 → inf 时）；字典缺键抛 RuntimeError（KeyError 转译）； len(None) 抛 AttributeError 行为快照，均可被 catch 捕获（见 tests/test_fuzz.intent） 13 内置无方法式调用： lst.push(x) 不被支持，须写自由函数 push(lst, x) （成员访问不回退内置） 语法选择（类方法才行）； 14 ListValue.copy() 不处理环：自引用列表作 Intent 函数实参 → 无限递归（形参复制传值） M2 期修（copy 带 memo 表）；诊断路径直调内置绕行 15 import std.X 将模块全部符号注入当前作用域，可能遮蔽核心内置（如 pathlib.join 曾遮蔽 join） 命名避让（join_path）；根治需改 import 语义，排队 16 and / or 原为两侧 eager 求值（ i &lt; len(l) and l[i] &lt; x 边界越界） ✅ 已修复（2026-10-18：短路求值，返回类型保持 BoolValue；VM 经委托通道同受益） 17 import std.X 扁平注入符号，但中间名（如 unit ）不是独立符号， unit.mm_to_m(...) 报 NameError 已知边界（2026-10-19 BD2 期实证）；用裸名 mm_to_m(...) 或全链 std.bim.unit.mm_to_m(...) ；BD1 模板已修正 18 FFI 仅最小切片：无回调/数组/联合/varargs/头文件解析/ foreign 语法糖 I1 剩余部分（20 人日中的未做部分，ROADMAP 维度 8 已注断点） 19 run_source 对容器返回 RuntimeValue 树（ListValue.value 内为 IntValue 等），非原生类型 桥侧已脱壳（tools/revit_bridge.py _to_native ）；宿主接入时需自行转换 20 Python 桥（I2a）无关键字参数/类实例化/回调 最小切片边界（spec §3.16）；完整版随 I2a 剩余部分 7. 文档勘误记录（本版修正） 位置 原文 修正 依据 philosophy_mapper.md class B : A { ... } class B &lt; A { ... } Parser mini_intent.py:1006 philosophy_mapper.md 90..100 =&gt; &quot;A&quot; match range 未实现，用 n if n &gt;= 90 =&gt; &quot;A&quot; _parse_pattern 无 range 分支 chapter_05（lesson_05.intent） catch { ... } catch e { ... } parse_try_stmt mini_intent.py:1318 README.md let mut 演示 counter = counter + 1 等 保持（非错误） — 规范版本 v1.11.0 · 2026-10-19 从实现提取 · 与 mini_intent.py 工作区对齐（v2.11.0：X1 装饰器最小切片——@deco + functools 系 + 顶层函数一等值修复；§4.2 functools）"}, {"id": "roadmap.md", "title": "Intent 完善路线图 — 对标 Python 生态的系统性升级方案", "group": "规范", "html": "<h1 id=\"intent-完善路线图-对标-python-生态的系统性升级方案\">Intent 完善路线图 — 对标 Python 生态的系统性升级方案</h1>\n<blockquote>心学为体，禅道为翼，马哲为用\n定位：<strong>意图清晰的通用编程语言</strong>。BIM 是特色战场，不是天花板。\n本文档是所有语言改进的唯一裁决依据。任何新特性提案，先过「设计宪法」，再进路线图。</blockquote>\n<hr>\n<h2 id=\"一设计宪法不可违背的六条\">一、设计宪法（不可违背的六条）</h2>\n<p>从《用代码学哲学》8 章提炼。每条宪法是过滤一切特性提案的筛子——通不过的，不做。</p>\n<table><thead><tr><th>#</th><th>宪法</th><th>来源</th><th>含义</th></tr></thead><tbody><tr><td>1</td><td><strong>声明即存在</strong></td><td>心即理（第1章）</td><td><code>let</code> 默认不可变；可变必须显式 <code>mut</code>。不许倒退成 Python 式默认可变</td></tr><tr><td>2</td><td><strong>代码即意图</strong></td><td>心即理</td><td>语法必须让意图裸露。禁止为性能/便利引入隐藏行为（隐式转换、隐式类型提升）</td></tr><tr><td>3</td><td><strong>一切皆表达式</strong></td><td>第1章</td><td>if/match/try/for 都是表达式。新控制流不允许出现&quot;不产生值的语句&quot;</td></tr><tr><td>4</td><td><strong>错误是另一种正常</strong></td><td>烦恼即菩提（第5章）</td><td><code>Result&lt;T,E&gt;</code> + <code>?</code> 是一等错误通道。异常机制只用于真正的契约违反</td></tr><tr><td>5</td><td><strong>知行合一</strong></td><td>第2章</td><td>`</td></tr><tr><td>6</td><td><strong>可验证的良知</strong></td><td>实事求是（第4章）</td><td><code>requires/ensures</code> 是语言级契约，运行时强制验证。这是 Intent 区别于一切语言的身份证，任何重构不许削弱它</td></tr></tbody></table>\n<p><strong>宪法执行方式</strong>：每个特性提案必须附带「哲学映射」一节，说明它强化了哪条宪法、削弱了哪条。只强化不削弱的才进 Phase 1+。</p>\n<hr>\n<h2 id=\"二现状盘点intent-v120-vs-python-312\">二、现状盘点：Intent v1.2.0 vs Python 3.12</h2>\n<h3 id=\"21-能力矩阵\">2.1 能力矩阵</h3>\n<table><thead><tr><th>板块</th><th>Python</th><th>Intent 现状</th><th>差距判定</th></tr></thead><tbody><tr><td>词法/语法/解释器</td><td>全链路</td><td>全链路（Lexer→Parser→Resolver→树遍历，9435 行）</td><td>✅ 对等</td></tr><tr><td>基础语法</td><td>let/def/class/if/for/while/with</td><td>let/let mut/def/class/if/match/for/while/defer</td><td>✅ 对等（无 with，defer 部分覆盖）</td></tr><tr><td>不可变默认</td><td>无（默认可变）</td><td><code>let</code> 默认不可变</td><td>⬆️ 超越</td></tr><tr><td>模式匹配</td><td>match（3.10+）</td><td>match（范围/解构/guard/穷举检查）</td><td>✅ 对等</td></tr><tr><td>管道</td><td>无（函数嵌套）</td><td>`</td><td>&gt;` 管道</td></tr><tr><td>契约</td><td>无（icontract 等第三方）</td><td>requires/ensures 运行时验证</td><td>⬆️ 核心特色</td></tr><tr><td>错误处理</td><td>Exception + raise</td><td>Result&lt;T,E&gt; + ? + try/catch/finally</td><td>✅ 对等（堆栈追踪缺失）</td></tr><tr><td>闭包/生成器</td><td>完整</td><td>闭包 ✅ / yield ✅</td><td>🔶 缺 yield from / send</td></tr><tr><td>面向对象</td><td>完整（协议/描述符/metaclass）</td><td>class/继承/覆盖/enum/运算符重载</td><td>🔶 缺接口协议、属性描述符</td></tr><tr><td>类型系统</td><td>动态 + 渐进类型（mypy）</td><td>纯运行时动态类型；函数级泛型参数替换</td><td>🔶 无静态检查、无类型别名/Union</td></tr><tr><td>并发</td><td>threading/asyncio/multiprocessing</td><td><strong>零</strong></td><td>❌ 完全缺失</td></tr><tr><td>标准库</td><td>200+ 模块</td><td>19 模块（通用 10 + BIM 8），70+ 内置函数</td><td>❌ 缺网络/数据/正则/算法库</td></tr><tr><td>包管理</td><td>pip + PyPI + venv</td><td>无。import 仅相对路径/std 目录</td><td>❌ 完全缺失</td></tr><tr><td>测试框架</td><td>unittest/pytest</td><td>无（靠 examples/ 手动跑）</td><td>❌ 完全缺失</td></tr><tr><td>Formatter</td><td>black</td><td>无</td><td>❌</td></tr><tr><td>Linter</td><td>ruff/flake8</td><td>无</td><td>❌</td></tr><tr><td>LSP/IDE</td><td>完整生态</td><td>无</td><td>❌</td></tr><tr><td>文档生成</td><td>Sphinx</td><td>无（docstring 未定义语法）</td><td>❌</td></tr><tr><td>语言规范</td><td>PEP + 参考手册</td><td>无正式 spec（散见于 8 章书稿）</td><td>❌</td></tr><tr><td>调用栈追踪</td><td>traceback</td><td>只有 Python 层 traceback，无 Intent 级栈</td><td>❌</td></tr></tbody></table>\n<h3 id=\"22-已有资产升级的基石不许推倒重来\">2.2 已有资产（升级的基石，不许推倒重来）</h3>\n<ol>\n<li><strong>解释器全链路</strong>：Lexer/Parser/Resolver/Interpreter 四件套，作用域解析正确（闭包安全），模块系统带循环依赖检测</li>\n<li><strong>契约引擎双形态</strong>：语言内 <code>requires/ensures</code> + 语言无关的 <code>contract_skill/intent_contract.py</code>（可嵌入 LLM 编程助手）</li>\n<li><strong>哲学资产</strong>：8 章书稿 + philosophy/mapping.json + philosophy_mapper.md——这是竞品抄不走的护城河</li>\n<li><strong>BIM 标准库</strong>：8 模块 ~1700 行，管道 A* 路由可直接移植 C#</li>\n<li><strong>泛型参数替换机制</strong>：<code>identity&lt;T&gt;(x: T) -&gt; T</code> 已能工作，是类型系统的种子</li>\n</ol>\n<hr>\n<h2 id=\"三路线图总览四个-phase\">三、路线图总览：四个 Phase</h2>\n<pre><code>Phase 0 地基加固 ──── 错误堆栈 / CLI / 语言规范 / 测试框架       （一切的前提）\nPhase 1 语言内核 ──── 语法补全 / 类型系统 / 错误处理深化          （编程体验）\nPhase 2 生态基建 ──── 包管理 / formatter / linter / 文档生成      （可用性）\nPhase 3 标准库+并发 ─ 高频库扩张 / 并发模型 / LSP                （通用性）</code></pre>\n<p><strong>排序逻辑</strong>：先让语言「可调试、可测试、可描述」（P0），再补「写得舒服」（P1），再建「生态循环」（P2），最后扩「能力边界」（P3）。Python 的胜利不是语法胜利，是生态胜利——但 Intent 现在连 spec 都没有，谈生态是空中楼阁。</p>\n<hr>\n<h2 id=\"四phase-0地基加固\">四、Phase 0：地基加固</h2>\n<blockquote>目标：让 Intent 从「能跑的 Demo」变成「可维护的语言」。</blockquote>\n<blockquote><strong>实施进度</strong>：P0.1 ✅｜P0.2 ✅｜P0.3 ✅｜P0.4 ✅｜P1.1~P1.5 ✅｜P2.1 ✅｜P2.2 ✅（2026-10-16）｜<strong>P2.5 CI → 下一步</strong></blockquote>\n<h3 id=\"41-intent-级调用栈与错误诊断-p0-已完成\">4.1 Intent 级调用栈与错误诊断 【P0】✅ 已完成</h3>\n<p><strong>缺口</strong>：现在函数内出错只抛 Python 异常，用户看到的是 <code>mini_intent.py line 5649</code>，看不到 Intent 调用链。</p>\n<p><strong>方案</strong>：</p>\n<ul>\n<li>Interpreter 维护 <code>call_stack: List[Frame]</code>（函数名/行号/列号/源文件），execute_function 出入栈</li>\n<li>运行时错误统一包装为 <code>IntentError</code>，携带：错误类型、消息、Intent 源位置、调用栈快照</li>\n<li>CLI 层渲染：源码行 + <code>^</code> 光标 + 调用链，对齐 Python traceback 的信息密度</li>\n<li>契约违反用专属子类 <code>ContractViolation(requires/ensures 哪个条款、实际值、期望条件)</code>——契约是身份证，错误信息必须第一个被看见</li>\n</ul>\n<p><strong>哲学映射</strong>：致良知——良知不是感觉，是可检验的条件。错误信息是把「检验失败」精确指认给当事人。</p>\n<p><strong>验收</strong>：任意深层嵌套调用出错，输出含完整 Intent 调用链与出错行高亮。</p>\n<p><strong>实施记录（2026-10-16）</strong>：4 处改动——</p>\n<ol>\n<li><code>mini_intent.py</code> 新增 <code>IntentError</code>/<code>ContractViolation</code>/<code>CallFrame</code>（异常体系与栈帧）</li>\n<li><code>execute_function</code>/<code>_execute_method</code> 包装为薄壳：入栈→委托 inner→异常穿帧时快照调用链→finally 出栈（不逐处改 raise 点，反膨胀）</li>\n<li>契约违反从「静默失败」升级为抛 <code>ContractViolation</code>（携带违约条款/期望/实际）</li>\n<li>CLI 新增 <code>wrap_intent_error</code>+<code>render_intent_error</code>：错误消息+源码行光标+调用链从外到内+退出码规范（0/1/2）</li>\n</ol>\n<p>实测效果：</p>\n<pre><code>❌ 契约违反: 契约违约(requires): 前置条件1失败: b != 0.0 — 函数 safe_divide 拒绝执行\n   at tests/t_contract_violation.intent:3:22\n   3 |     requires b != 0.0\n                         ^\n   调用链(从外到内):\n     main (tests/t_contract_violation.intent:13)\n     compute (tests/t_contract_violation.intent:14)\n     safe_divide (tests/t_contract_violation.intent:10)</code></pre>\n<p>回归：13/14 examples 通过；唯一失败的 demo.intent 为遗留 lambda 参数语法问题（旧代码同样失败），记入 P1 待办。</p>\n<h3 id=\"42-测试框架-intent-test-p0\">4.2 测试框架 <code>intent test</code> 【P0】</h3>\n<p><strong>缺口</strong>：19 个模块、9435 行解释器，零自动化测试。regression 靠人肉。</p>\n<p><strong>方案</strong>：</p>\n<ul>\n<li>语法：<code>test &quot;名称&quot; { assert expr; }</code> 块，或复用 <code>contract.intent</code> 的 assert 体系</li>\n<li>CLI：<code>python src/mini_intent.py --test [path]</code> 收集 <code>tests/**/*.intent</code>，报告通过/失败/断言详情</li>\n<li>断言失败时带契约上下文（哪个 requires 没满足）</li>\n<li>第一批用例：每个语言特性一个测试文件（复用现有 <code>_t_*.intent</code> 调试文件，它们本来就是回归测试的雏形）</li>\n</ul>\n<p><strong>哲学映射</strong>：实践是检验真理的唯一标准——测试就是把「真理」变成可重复执行的实践。</p>\n<p><strong>验收</strong>：一条命令跑完全部回归；CI 能挂。</p>\n<p><strong>实施记录（2026-10-16）</strong>：零语法侵入方案——</p>\n<ul>\n<li>约定：测试文件中 <code>def test_xxx()</code> 函数即用例；<code>assert cond, &quot;msg&quot;;</code> 为断言语句（<strong>无括号</strong>，assert 是关键字语句）；每个测试文件独立 Interpreter 保证状态隔离</li>\n<li>CLI：<code>python src/mini_intent.py --test [path]</code>（默认 <code>tests/</code>，<code>_</code> 开头文件跳过）</li>\n<li>断言失败复用 P0.1 的错误渲染（源码位置+调用链），退出码 0/1/2</li>\n<li><strong>测试模式严格</strong>：parser.errors 非零即失败（文件模式仍是宽松模式，见待办 T3）</li>\n</ul>\n<p><strong>成果</strong>：<code>tests/</code> 8 个测试文件 33 个用例全绿；examples 29/29 回归通过。</p>\n<p><strong>测试框架即先知——首轮就抓出 1 个真 bug + 3 个文档/实现不一致</strong>：</p>\n<table><thead><tr><th>#</th><th>发现</th><th>处理</th></tr></thead><tbody><tr><td>B1</td><td><strong>DictValue 相等性 bug</strong>：<code>{&quot;x&quot;:1} == {&quot;x&quot;:1}</code> 恒 false（dataclass 空字段 eq 陷阱，<code>_t_dict_eq</code> 只 print 不 assert 所以藏了 3 个月）</td><td>✅ 已修：Dict 比较改为逐项递归（与 List 同策略）</td></tr><tr><td>T1</td><td>match range 模式 <code>90..100</code> <strong>未实现</strong>（philosophy_mapper.md 文档超前）</td><td>测试暂用 <code>if guard</code>；实现记入 P1</td></tr><tr><td>T2</td><td>class 继承实际语法是 <code>class Dog &lt; Animal</code>，mapper 文档写的是 <code>class B : A</code>（错）</td><td>测试已按实现写；<strong>修文档记入 P0.3</strong></td></tr><tr><td>T3</td><td>Result 无成员方法路由，<code>r.unwrap()</code>/<code>r.is_ok</code> 不通</td><td>✅ 已修：MemberAccess+CallExpr 加 ResultValue 分支</td></tr><tr><td>T4</td><td>文件模式宽松执行：语法错误只警告不阻断，退出码 0（假通过）</td><td>记入 P0.4：<code>--check</code> 严格模式</td></tr></tbody></table>\n<h3 id=\"43-语言规范文档-specmd-p0\">4.3 语言规范文档 spec.md 【P0】</h3>\n<p><strong>缺口</strong>：现在「Intent 是什么」散落在 8 章书稿（教学视角）和 9435 行实现（权威视角）里，没有正式的规范。</p>\n<p><strong>方案</strong>：</p>\n<ul>\n<li><code>docs/spec.md</code>：词法（关键字/字面量/运算符全表）→ 语法（每个构造的 EBNF + 语义）→ 类型系统规则 → 标准库 API 签名</li>\n<li>规范从<strong>实现提取</strong>而非凭空写：每个条目标注对应源码位置，保证 spec 与实现不漂移</li>\n<li>这是以后写编译器/移植 C#/给社区贡献的锚点</li>\n</ul>\n<p><strong>验收</strong>：新人只读 spec.md + 8 章书稿，能正确写出任何合法 Intent 程序。</p>\n<p><strong>实施记录（2026-10-16）</strong>：</p>\n<ul>\n<li>产出 <code>docs/spec.md</code>（v1.2.0）：词法全表→类型系统→语法（每构造标注源码锚点）→标准库 API→CLI→已知限制诚实清单→文档勘误记录</li>\n<li>规范从实现反向提取，并用脚本实证每个关键字的真实支持度：<strong>零分支预留关键字</strong> <code>func</code>/<code>invariant</code>/<code>is</code>/<code>from</code>；<code>var</code>/<code>const</code> 实为 <code>let</code> 别名；<code>pure</code>/<code>effect</code> 仅记录不强制；位运算/复合赋值/<code>:=</code>/<code>++</code>/<code>--</code> 词法接受语义未实现</li>\n<li><strong>修正 philosophy_mapper.md 三处文档错误</strong>：class 继承 <code>:</code> → <code>&lt;</code>、类内方法 <code>};</code> → <code>}</code>、match range 改 guard 形式并注明未实现</li>\n<li>新增 <code>tests/test_pipe.intent</code>（2 用例）——spec 声明的每个能力都应有测试背书，全量 <strong>35/35 通过</strong></li>\n</ul>\n<h3 id=\"44-cli-现代化-p1\">4.4 CLI 现代化 【P1】</h3>\n<p><strong>现状</strong>：argparse 已有 run/tokens/ast/repl/demo/philosophy。\n<strong>补齐</strong>：</p>\n<ul>\n<li><code>-c &quot;code&quot;</code> 直接执行代码串（对齐 Python <code>-c</code>）</li>\n<li><code>--emit ast|tokens</code> 输出到文件而非 stdout</li>\n<li><code>--version</code> / <code>--check</code>（只解析不执行，做 lint 前置）</li>\n<li>退出码规范：0 成功 / 1 运行时错误 / 2 用法错误（CI 依赖这个）</li>\n</ul>\n<p><strong>实施记录（2026-10-16）</strong>：</p>\n<ul>\n<li>新增 <code>-c</code>（直接执行）、<code>--version</code>、<code>--check</code>（只解析，治宽松假通过）、<code>--emit tokens|ast FILE</code>（分析结果写文件）</li>\n<li><code>parse_known_args</code>：源文件后的额外参数透传——新增 <code>args()</code> 内置（程序与世界的接口），<strong>Intent 从此能写命令行工具</strong>（philosophy_mapper.intent 立即受益，从跑不通到完整工作）</li>\n<li>顺手修复 demo 代码 <code>let i</code> → <code>let mut i</code>（不可变变量做循环计数器，演示门面居然是坏的）</li>\n<li>全量回归：tests 35/35、examples 30/30、demo/repl 冒烟全过</li>\n</ul>\n<hr>\n<h2 id=\"五phase-1语言内核补全\">五、Phase 1：语言内核补全</h2>\n<blockquote>目标：对齐 Python 的「写得舒服」，且每项都有哲学加成。</blockquote>\n<blockquote><strong>实施进度（2026-10-16 全部完成）</strong>：P1.1 with ✅｜P1.2 f-string/多行 ✅｜P1.3a 类型别名+Union ✅｜P1.3b 泛型约束 ✅｜P1.4 异常层级 ✅｜P1.5 yield from ✅。全量 61/61 测试通过，examples 30/30，demo/repl 正常。测试 61 个（较 P0 末的 35 个新增 26 个 P1 用例）。</blockquote>\n<p><strong>实施记录</strong>：</p>\n<ul>\n<li><strong>P1.1 with</strong>：<code>with expr as x { body }</code>，块退出自动调 <code>close()</code>——defer 的块级特化（3 用例）</li>\n<li><strong>P1.2 字符串</strong>：<code>f&quot;...&quot;</code> 前缀（显式插值宣告）+ <code>&quot;&quot;&quot;</code> 三引号多行（4 用例）；顺带发现并修复 <strong><code>in</code> 右侧不支持 String</strong> 的真缺口（子串归属）</li>\n<li><strong>P1.3a 类型系统</strong>：<code>type X = ...</code> 软关键字别名 + <code>A | B</code> Union（6 用例）。软关键字模式：<code>type(x)</code> 函数调用不受影响。<strong>发现并记载设计规则</strong>：Int 标注接受 Float 是刻意的数值互通（非 bug）</li>\n<li><strong>P1.3b 泛型约束</strong>：<code>T: Comparable</code>，违约抛 ContractError 走契约错误通道（3 用例）</li>\n<li><strong>P1.4 异常层级</strong>：ErrorValue 一等错误值（.type/.message/.stack）+ <code>catch e: ContractError</code> 类型分流，不匹配继续传播（5 用例）</li>\n<li><strong>P1.5 yield from</strong>：生成器委派转发，支持 List/Dict 键（5 用例）</li>\n</ul>\n<h3 id=\"51-with-语句-资源作用域-p1\">5.1 with 语句 —— 资源作用域 【P1】</h3>\n<p><strong>Python 参照</strong>：<code>with open(f) as fh:</code> 自动管理资源生命周期。\n<strong>Intent 缺口</strong>：有 <code>defer</code>（函数级、逆序、无条件）但没有块级作用域资源管理。\n<strong>设计</strong>：</p>\n<pre><code class=\"lang-intent\">with open(&quot;data.txt&quot;) as fh {\n    let content = fh.read_all();\n};  // 作用域结束自动 close —— defer 在块级的具体化</code></pre>\n<p><strong>设计思路</strong>：<code>defer</code> 是「功成身退」的函数级表达，<code>with</code> 是它的块级特化——资源获取（open）与释放（close）在同一个可见的花括号内对称出现，比 defer 更直观。两者共存：defer 管函数级清理，with 管块级资源。\n<strong>哲学映射</strong>：向死而生——获取资源的那一刻，释放它的代码已经在等待。</p>\n<h3 id=\"52-字符串能力补齐-p1\">5.2 字符串能力补齐 【P1】</h3>\n<p><strong>缺口</strong>（对照 Python str）：f-string 插值、多行字符串、split/join 的完整语义（已有部分内置函数）。\n<strong>设计</strong>：</p>\n<pre><code class=\"lang-intent\">let name = &quot;Intent&quot;;\nlet greeting = f&quot;你好，{name}，版本 {version()}&quot;;   // f-string\nlet poem = &quot;&quot;&quot;心学为体\n禅道为翼\n马哲为用&quot;&quot;&quot;;                                          // 多行字符串</code></pre>\n<p><strong>设计思路</strong>：f-string 让「模板与数据在同一行相见」——心即理：你写下的字面与变量名，就是意图本身，不需要 <code>.format()</code> 这种间接层。\n<strong>优先级说明</strong>：词法层改动小（<code>f&quot;...&quot;</code> 前缀 + <code>&quot;&quot;&quot;</code> 三引号），解释器加一个字符串插值求值，投入产出比高。</p>\n<h3 id=\"53-类型系统深化-p1最重要\">5.3 类型系统深化 【P1，最重要】</h3>\n<p><strong>缺口</strong>：现在是纯运行时动态类型（无静态推断——<code>grep infer</code> 零命中）。函数级泛型有参数替换但无约束。</p>\n<p><strong>分三步走，不许一步到位</strong>（反膨胀）：</p>\n<p><strong>Step 1 — 类型别名与 Union（语法层，1-2 天）</strong>：</p>\n<pre><code class=\"lang-intent\">type Meters = Float;\ntype Shape = Circle | Square;   // Union：一个东西的多种存在形态</code></pre>\n<p>Union 的哲学：<strong>不二法门</strong>的推广——enum 是「封闭的几种」，Union 是「开放的几种」。</p>\n<p><strong>Step 2 — 泛型约束（复用已有替换机制，2-3 天）</strong>：</p>\n<pre><code class=\"lang-intent\">def max_of&lt;T: Comparable&gt;(items: List&lt;T&gt;): T { ... };</code></pre>\n<p>约束在调用点检查，违反报契约级错误（Comparable 不是可比较的 → 这不是类型错误，是<strong>契约违反</strong>，复用现有错误通道）。</p>\n<p><strong>Step 3 — 可选静态检查器（独立工具，Phase 2）</strong>：\n不做完整类型推断（那是 mypy 级别的工程）。做一个<strong>契约驱动的轻量检查器</strong>：利用已有的 <code>requires/ensures</code> 和类型标注，做「声明一致性」检查——参数个数、标注类型与实参的明显不匹配、match 穷举性。Resolver 已经有语义分析遍的骨架，扩它。\n<strong>设计原则</strong>：Intent 的类型策略是「契约优先，类型其次」——静态检查永远服务于契约验证，不追求图灵完备的类型理论。</p>\n<h3 id=\"54-错误处理深化-p1\">5.4 错误处理深化 【P1】</h3>\n<p><strong>缺口</strong>：Result/? / try/catch/finally 已有。缺：</p>\n<ul>\n<li><strong>异常层级</strong>：定义内置异常树（<code>ContractError</code> / <code>ValueError</code> / <code>IndexError</code>...），<code>catch</code> 支持按类型捕获：<code>catch e: ContractError { ... }</code></li>\n<li><strong>错误上下文</strong>：catch 块内可访问 <code>e.message</code> / <code>e.stack</code>（来自 4.1 的调用栈）</li>\n<li><strong>panic/recover</strong>：<strong>不做</strong>——与「错误是另一种正常」冲突。不可恢复错误用 <code>ensures</code> 表达。</li>\n</ul>\n<pre><code class=\"lang-intent\">try {\n    let r = risky()?;      // Err 自然传播，不恐慌\n} catch e: ContractError {\n    // 契约违反：这不是程序的错，是调用方式错了\n    print(&quot;合同违约：&quot;, e.message);\n} finally {\n    cleanup();\n};</code></pre>\n<p><strong>哲学映射</strong>：烦恼即菩提——catch 按类型分流，就是「认识你的烦恼是什么种类，然后对症转化」。</p>\n<h3 id=\"55-生成器补全-p2\">5.5 生成器补全 【P2】</h3>\n<p><strong>缺口</strong>：有 yield，缺 <code>yield from</code>（委派）和生成器 <code>send</code>/<code>close</code> 协议。\n<strong>方案</strong>：<code>yield from</code> 实现简单（解释器层转发）；<code>send</code> 需要双向通道，与并发模型的 channel 天然衔接——放 Phase 3 与并发一起做。</p>\n<hr>\n<h2 id=\"六phase-2生态基建\">六、Phase 2：生态基建</h2>\n<blockquote>目标：让 Intent 从「一个人的语言」变成「可协作的语言」。Python 赢在生态，不赢在语法。</blockquote>\n<blockquote><strong>实施进度</strong>：P2.1 ✅｜P2.2 ✅｜P2.3 ✅｜P2.4 ✅｜P2.5 ✅（均 2026-10-16）｜<strong>Phase 2 收官 → P3 标准库与并发</strong></blockquote>\n<blockquote>v2.0.0 里程碑：P0（4 项）+ P1（6 项）+ P2（5 项）共 15 个课题完成；61 测试；81 文件全过 check/lint/doc；CI 五步（check/test/lint/doc/fmt 幂等）。</blockquote>\n<h3 id=\"62-formatter-intent-fmt-p1-已完成\">6.2 Formatter <code>intent fmt</code> 【P1】✅ 已完成</h3>\n<p><strong>实施记录（2026-10-16）</strong>：</p>\n<ul>\n<li>token 流重排不动语义：4 空格缩进、K&amp;R 花括号、<code>;</code>/match 分支 <code>,</code> 换行、二元运算符两侧空格、<code>:</code> 前紧贴后空格、管道/<code>=&gt;</code> 两侧空格</li>\n<li>Lexer 加 <code>keep_comments</code> 开关（Parser 路径零影响）：注释产 COMMENT token——<strong>代码的哲学注释是灵魂，formatter 不许丢</strong></li>\n<li>Token 加 <code>is_fstring</code> 标记：formatter 还原 <code>f&quot;...&quot;</code> 前缀与字符串引号（Lexer 原本剥掉）</li>\n<li>幂等验证通过；真实文件（lesson_01/std.str）格式化后 <code>--check</code> 全过</li>\n<li>顺手修两个输出污染：banner 与 pyreadline 提示改为仅 TTY/stderr 显示（<code>--fmt &gt; file</code> 管道纯净）</li>\n<li>已知限制（诚实记录）：不补缺失分号（保守不动语义）、80 列不断行、无可配置项（gofmt 哲学）</li>\n</ul>\n<h3 id=\"61-包管理-p1生态第一优先级-已完成\">6.1 包管理 【P1，生态第一优先级】✅ 已完成</h3>\n<p><strong>实施记录（2026-10-16）</strong>：</p>\n<ul>\n<li><code>intent.toml</code> 清单（tomllib 解析）：<code>[project]</code> name/version + <code>[deps]</code>（git url / 本地路径）</li>\n<li><code>--install &lt;url&gt;</code> 单个安装 / <code>--install</code> 无参按清单批量（本地复制、git pull 更新、clone --depth 1）</li>\n<li>启动时注入 <code>./lib</code> 与 <code>~/.intent/lib</code>（全局库）到模块搜索路径</li>\n<li>模块查找加第三种候选 <code>&lt;name&gt;/&lt;name&gt;.intent</code>（npm 风格，git 仓库开箱即用）</li>\n<li><strong>顺手补实现了从未存在的 <code>export</code> 语句</strong>（spec 里那条是从 README 抄的未验证条目——ExportStmt 是孤儿 AST，Lexer 连 export 关键字都没有）。现在 <code>export a, b;</code> 显式声明模块边界，无声明维持全量导出（兼容）</li>\n<li>测试 runner 补上模块搜索路径注入（fixture 从任意 cwd 可跑）</li>\n<li>全量 61/61 + fixture 2/2 通过</li>\n</ul>\n<p><strong>仍然不做</strong>：版本求解器、注册表（出现 3+ 真实第三方需求再做）。</p>\n<h3 id=\"61-包管理-p1生态第一优先级\">6.1 包管理 【P1，生态第一优先级】</h3>\n<p><strong>设计</strong>（刻意最小化，反 pip 膨胀）：</p>\n<pre><code>project/\n  intent.toml      # [project] name/version + [deps] 名称 = &quot;版本约束&quot;\n  src/\n  tests/</code></pre>\n<p><strong>三件套，分两期</strong>：</p>\n<ul>\n<li><strong>V0.1（本地优先，无注册表）</strong>：<code>intent.toml</code> 声明 + <code>import</c

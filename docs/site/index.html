剩余：IronPython2 兼容、bundle 打包规范 ✅ BD4 CBWD 移植最小切片：洞口合并算法移植（std/bim/cbwd.intent），与 COM.py 参考逐例对齐（parity 6/6 + 8 测试）。剩余：Dynamo 实跑判定、翻弯/标签排列移植、组边界与参数写回 v4.0-beta「生态冷启动」出口 [ ] 20 个官方包全部过「契约+测试+doc」三件套检查 [ ] fib25 达 CPython 0.8x（M3 上）或 AOT 退路交付 [ ] 浏览器（WASM）跑通 Intent REPL [ ] 第三方提交的 PR ≥ 5 个 [ ] 五维雷达全部 ≥ 70% v4.0 LTS「生产就绪」出口 [ ] §0.2 的五条硬标准全过 [ ] API 冻结 + LTS 分支 + 安全响应流程（SLA 文档） [ ] 至少 1 个 10 万行级真实项目用 Intent 写成（ 最终验收：它真的被用来干活 ） 6. 风险登记册 ID 风险 概率 冲击 缓解 R1 巴士因子 ：单维护者（阿J 是唯一重度 contributor） 高 致命 D5 每期定向邀请；文档/CI/流程全部「陌生人可上手」；每个 Phase 末至少 2 个外部 PR 合并 R2 生态鸡生蛋 ：没包没人用，没人用没包 高 高 I2a Python 桥先寄生；D2 官方先立 20 标杆包；P3/P4 绑定「有真实包候选」才启动 R3 JIT 不可行 ：M3 40 人日打水漂 中 高 分两期对冲；AOT 预编译退路；v3.5 先拿 M2 的 2x 保底 R4 范围膨胀 ：Python 有 200 模块，抄不完 高 中 每期「不做清单」；LangForge 判定纪律（无判定不进 TASKS）；S 组以「生产常用 40 模块」封顶 R5 正面对标无胜算 ：通用战场 vs CPython+30 年 高 中 定位锚定 BIM/AEC + 契约优先；通用能力「够用即可」不做军备竞赛 R6 自动化失控 ：无人值守闭环产出低质代码堆积 中 中 每轮判定命令 + 人工抽查纪律（已实行）；契约覆盖率（Q2）作为质量闸 R7 内存模型选错（RC vs GC），返工 中 高 M1 先出设计文档评审再动工；参考 Python/CPython 与 Swift ARC 两种路线 各期「不做清单」（反膨胀防线） v3.0 不做 ：async/await、JIT、FFI、装饰器、eval——一次只打透一层 v3.5 不做 ：WASM、包仓库服务化、属性测试——等前面积木 v4.0-beta 不做 ：多后端（LLVM 直连）、移动端、IDE 全家——LTS 后再议 v4.0 LTS 不做 ：语言特性继续膨胀——LTS 期只修不加，新特性进 v5.0 实验分支 7. 与 LangForge 的衔接（本路线图如何被执行） 任务同构 ：本文档所有任务（S/T/P/A/M/E/X/I/Q/D 组）按「期」分批进入 langforge.py 的 TASKS——Phase 5 的 12 个任务作为下一批解锁（依赖已满足的立即进就绪池） 每期出口即评审点 ：v3.0/v3.5/v4.0-beta 出口清单由 --verify 命令组判定，不是人工感觉 雷达驱动调度 ：每期结束出五维雷达图，凹维自动转为下期 P1 任务（闭环自我修正） 风险任务熔断 ：R3（JIT）若连续 2 轮无实质进展，自动触发退路（AOT）——不死磕 人工介入点 （叫你，不是自动）：期出口评审、T5/M3/I2 三个皇冠任务的方案评审、R1 社区动作（只能人做） 8. 一页纸总结 今天（v2.3.0）：引擎全特性 + 18 模块 + 8 工具 + 126 测试 + VM 4.4x v3.0：类型系统（渐进类型）＋包管理（依赖/venv）＋结构化并发 ＋内存管理 —— 「能写生产代码」 v3.5：元编程全家 ＋Python 互操作桥（寄生）＋剖析/覆盖率 ＋性能 2x —— 「能借力生态」 v4.0-beta：20 官方包 ＋契约覆盖率 ＋async ＋JIT 0.8x/或AOT ＋WASM —— 「生态起步」 v4.0 LTS：API 冻结 ＋10 万行真实项目 ＋LTS/安全响应 —— 「Python 级成熟度」 差异化三张牌（每期都要强化）：契约系统（T5 契约即类型）｜自由线程（A4）｜BIM 领域包（D2）"}, {"id": "memory_design.md", "title": "Intent 内存管理设计文档（MM1）", "group": "规范", "html": "<h1 id=\"intent-内存管理设计文档mm1\">Intent 内存管理设计文档（MM1）</h1>\n<blockquote>版本：v1.0 ｜ 2026-10-18 ｜ 状态：首期已实现（寄生策略），M2/M3 演进路线见 §6\n配套：<code>src/mini_intent.py</code>（_ObjectRegistry + OBJECT_REGISTRY）、<code>std/memory.intent</code>、<code>tests/test_memory.intent</code></blockquote>\n<hr>\n<h2 id=\"1-问题定义\">1. 问题定义</h2>\n<p>Intent 解释器宿主于 CPython：Intent 的运行时值（List/Dict/Instance 等）都是 Python 对象，\n其生死由 CPython 引用计数 + 分代 GC 管辖。Intent 语言层面临三个内存问题：</p>\n<ol>\n<li><strong>不可观测</strong>：Intent 程序无法知道自己制造了多少对象、多少还活着；</li>\n<li><strong>循环引用</strong>：<code>a.push(a)</code> 这类自引用/环结构，引用计数永不归零，宿主不触发 GC 就泄漏；</li>\n<li><strong>无回收入口</strong>：长跑服务（v3.0 出口要求 24h 内存曲线平坦）需要一个确定性的回收时机。</li>\n</ol>\n<h2 id=\"2-候选策略与决策\">2. 候选策略与决策</h2>\n<table><thead><tr><th>策略</th><th>做法</th><th>评估</th></tr></thead><tbody><tr><td>A. 自持引用计数</td><td>解释器给每个值维护 RC，环检测另建图扫描</td><td>与宿主 RC 双重计数，开销翻倍；环检测要遍历全堆——20 人日打底</td></tr><tr><td>B. 自持分代 GC</td><td>解释器自建年轻代/老代，mark-sweep</td><td>同上，且要与宿主 GC 争权；v4.0 JIT 前不值得</td></tr><tr><td>C. <strong>寄生 + 观测</strong>（选定）</td><td>容器创建即登记弱引用；循环垃圾委托宿主分代 GC；暴露观测/触发 API</td><td>零额外内存管辖成本；观测真实（弱引用不延命）；回收确定（显式 collect）</td></tr></tbody></table>\n<p><strong>决策理由（心学为体：知止而后有）</strong>：意图运行时的&quot;存在&quot;由宿主保管，\nIntent 第一件该做的事不是夺权，是<strong>看见</strong>。策略 C 用最小代价拿到三样东西：\n真实的存活计数、真实的累计分配、确定的循环回收时机。\n自持 GC（A/B）留到 M3 JIT 期——那时内存模型必须与执行引擎同构设计，提前做就是重复造轮子。</p>\n<h2 id=\"3-架构首期已落地\">3. 架构（首期已落地）</h2>\n<pre><code>┌────────────────────────────────────────────┐\n│ Intent 程序                                  │\n│   std.memory.mem_live() / gc_collect() ...  │  ← std/memory.intent（契约封装）\n├────────────────────────────────────────────┤\n│ 内置层（mini_intent.py）                     │\n│   mem_live_count / mem_alloc_total /        │\n│   mem_stats_info / gc_collect_now /         │\n│   ref_count_of                              │\n├────────────────────────────────────────────┤\n│ _ObjectRegistry（模块级单例）                │\n│   register(obj)  ← ListValue/DictValue/     │\n│                     InstanceValue.__init__  │  ← 三个容器类构造即挂接\n│   _refs: [weakref.ref]  弱引用不拉长寿命     │\n│   live() / stats() / collect()              │\n├────────────────────────────────────────────┤\n│ 宿主 CPython：gc.collect() 分代回收循环垃圾   │\n└────────────────────────────────────────────┘</code></pre>\n<p><strong>不变量</strong>：</p>\n<ul>\n<li>注册表只持弱引用——它自身不是任何 Intent 对象的存活理由；</li>\n<li><code>collect()</code> = 先登记表快照 → <code>gc.collect()</code> → 再快照，差值即回收容器数（观测值）；</li>\n<li><code>_refs</code> 超 4096 自动修剪死亡弱引用，注册表自身不泄漏。</li>\n</ul>\n<p><strong>双路径覆盖</strong>：VM（intent_bytecode.py）复用同一套值类（import 自 mini_intent），\n树遍历与字节码执行共享同一注册表，vm_diff 两侧观测一致。</p>\n<h2 id=\"4-api-语义stdmemoryintent\">4. API 语义（std/memory.intent）</h2>\n<table><thead><tr><th>函数</th><th>语义</th><th>契约</th></tr></thead><tbody><tr><td><code>mem_live() -&gt; Int</code></td><td>当前存活容器数</td><td><code>ensures result &gt;= 0</code></td></tr><tr><td><code>alloc_total() -&gt; Int</code></td><td>累计创建容器数（单调增）</td><td><code>ensures result &gt;= 0</code></td></tr><tr><td><code>mem_stats() -&gt; Dict</code></td><td>live/alloc_total/reclaim_total/by_type</td><td>—</td></tr><tr><td><code>gc_collect() -&gt; Int</code></td><td>触发循环回收，返回本次回收数</td><td><code>ensures result &gt;= 0</code></td></tr><tr><td><code>ref_count(obj) -&gt; Int</code></td><td>宿主引用计数（诊断观测值，含解释器内部引用）</td><td><code>ensures result &gt;= 1</code></td></tr></tbody></table>\n<h2 id=\"5-测试判定teststest-memoryintent55\">5. 测试判定（tests/test_memory.intent，5/5）</h2>\n<ul>\n<li>分配可观测：20 个被持有列表 → live ≥ baseline + 20；</li>\n<li>累计单调：alloc_total 只增不减；</li>\n<li>自引用可诊断：<code>push(a, a)</code> 后 ref_count &gt; 2；</li>\n<li><strong>循环可回收</strong>：函数作用域内制造 10 个自环并丢弃 → live 暂存（RC 不归零）→</li>\n</ul>\n<p><code>gc_collect()</code> 后 live 回落 ≥10——「长跑无泄漏 + 循环引用回收」的命令级判定；</p>\n<ul>\n<li>统计字典形态完整。</li>\n</ul>\n<h2 id=\"6-已知限制与演进\">6. 已知限制与演进</h2>\n<table><thead><tr><th>#</th><th>限制</th><th>影响</th><th>计划</th></tr></thead><tbody><tr><td>L1</td><td><code>ListValue.copy()</code> 等不处理环——自引用列表作 Intent 函数实参时无限递归（形参复制传值语义）</td><td>诊断路径受限（ref_count 须直调内置）</td><td>M2 期修：copy 带 memo 表</td></tr><tr><td>L2</td><td>注册表只覆盖容器（List/Dict/Instance）；字符串/整数等标量不登记</td><td>标量无环，不影响回收正确性</td><td>不修（反膨胀）</td></tr><tr><td>L3</td><td>ref_count 是宿主观测值，非语言级 RC</td><td>只做诊断，不做精确契约</td><td>语言级 RC 随 M3 JIT 同构设计</td></tr><tr><td>L4</td><td>无自动回收策略（无阈值触发/无分代调优）</td><td>长跑需程序自行择机 collect</td><td>M4 剖析工具期补 <code>--mem-profile</code></td></tr></tbody></table>\n<p><strong>M2 衔接</strong>：属性访问优化（内联缓存/隐藏类）要求对象形状稳定——\n注册表的 by_type 统计是其现成度量。<strong>M3 衔接</strong>：JIT 编译的代码若自持 GC，\n必须与 _ObjectRegistry 同构（同一 Hook 点、同一不变量），否则双重管辖。</p>\n<h2 id=\"7-风险登记对应-roadmap-longterm-r7\">7. 风险登记（对应 ROADMAP_LONGTERM R7）</h2>\n<p>内存模型选错（RC vs GC）的最大返工风险，已被「寄生先行」对冲：\n首期交付的是观测与回收入口，不绑定任何管辖策略；\nM2/M3 的选型可以拿首期的真实分配数据说话，而不是拍脑袋。</p>", "text": "Intent 内存管理设计文档（MM1） 版本：v1.0 ｜ 2026-10-18 ｜ 状态：首期已实现（寄生策略），M2/M3 演进路线见 §6 配套： src/mini_intent.py （_ObjectRegistry + OBJECT_REGISTRY）、 std/memory.intent 、 tests/test_memory.intent 1. 问题定义 Intent 解释器宿主于 CPython：Intent 的运行时值（List/Dict/Instance 等）都是 Python 对象， 其生死由 CPython 引用计数 + 分代 GC 管辖。Intent 语言层面临三个内存问题： 不可观测 ：Intent 程序无法知道自己制造了多少对象、多少还活着； 循环引用 ： a.push(a) 这类自引用/环结构，引用计数永不归零，宿主不触发 GC 就泄漏； 无回收入口 ：长跑服务（v3.0 出口要求 24h 内存曲线平坦）需要一个确定性的回收时机。 2. 候选策略与决策 策略 做法 评估 A. 自持引用计数 解释器给每个值维护 RC，环检测另建图扫描 与宿主 RC 双重计数，开销翻倍；环检测要遍历全堆——20 人日打底 B. 自持分代 GC 解释器自建年轻代/老代，mark-sweep 同上，且要与宿主 GC 争权；v4.0 JIT 前不值得 C. 寄生 + 观测 （选定） 容器创建即登记弱引用；循环垃圾委托宿主分代 GC；暴露观测/触发 API 零额外内存管辖成本；观测真实（弱引用不延命）；回收确定（显式 collect） 决策理由（心学为体：知止而后有） ：意图运行时的&quot;存在&quot;由宿主保管， Intent 第一件该做的事不是夺权，是 看见 。策略 C 用最小代价拿到三样东西： 真实的存活计数、真实的累计分配、确定的循环回收时机。 自持 GC（A/B）留到 M3 JIT 期——那时内存模型必须与执行引擎同构设计，提前做就是重复造轮子。 3. 架构（首期已落地） ┌────────────────────────────────────────────┐ │ Intent 程序 │ │ std.memory.mem_live() / gc_collect() ... │ ← std/memory.intent（契约封装） ├────────────────────────────────────────────┤ │ 内置层（mini_intent.py） │ │ mem_live_count / mem_alloc_total / │ │ mem_stats_info / gc_collect_now / │ │ ref_count_of │ ├────────────────────────────────────────────┤ │ _ObjectRegistry（模块级单例） │ │ register(obj) ← ListValue/DictValue/ │ │ InstanceValue.__init__ │ ← 三个容器类构造即挂接 │ _refs: [weakref.ref] 弱引用不拉长寿命 │ │ live() / stats() / collect() │ ├────────────────────────────────────────────┤ │ 宿主 CPython：gc.collect() 分代回收循环垃圾 │ └────────────────────────────────────────────┘ 不变量 ： 注册表只持弱引用——它自身不是任何 Intent 对象的存活理由； collect() = 先登记表快照 → gc.collect() → 再快照，差值即回收容器数（观测值）； _refs 超 4096 自动修剪死亡弱引用，注册表自身不泄漏。 双路径覆盖 ：VM（intent_bytecode.py）复用同一套值类（import 自 mini_intent）， 树遍历与字节码执行共享同一注册表，vm_diff 两侧观测一致。 4. API 语义（std/memory.intent） 函数 语义 契约 mem_live() -&gt; Int 当前存活容器数 ensures result &gt;= 0 alloc_total() -&gt; Int 累计创建容器数（单调增） ensures result &gt;= 0 mem_stats() -&gt; Dict live/alloc_total/reclaim_total/by_type — gc_collect() -&gt; Int 触发循环回收，返回本次回收数 ensures result &gt;= 0 ref_count(obj) -&gt; Int 宿主引用计数（诊断观测值，含解释器内部引用） ensures result &gt;= 1 5. 测试判定（tests/test_memory.intent，5/5） 分配可观测：20 个被持有列表 → live ≥ baseline + 20； 累计单调：alloc_total 只增不减； 自引用可诊断： push(a, a) 后 ref_count &gt; 2； 循环可回收 ：函数作用域内制造 10 个自环并丢弃 → live 暂存（RC 不归零）→ gc_collect() 后 live 回落 ≥10——「长跑无泄漏 + 循环引用回收」的命令级判定； 统计字典形态完整。 6. 已知限制与演进 # 限制 影响 计划 L1 ListValue.copy() 等不处理环——自引用列表作 Intent 函数实参时无限递归（形参复制传值语义） 诊断路径受限（ref_count 须直调内置） M2 期修：copy 带 memo 表 L2 注册表只覆盖容器（List/Dict/Instance）；字符串/整数等标量不登记 标量无环，不影响回收正确性 不修（反膨胀） L3 ref_count 是宿主观测值，非语言级 RC 只做诊断，不做精确契约 语言级 RC 随 M3 JIT 同构设计 L4 无自动回收策略（无阈值触发/无分代调优） 长跑需程序自行择机 collect M4 剖析工具期补 --mem-profile M2 衔接 ：属性访问优化（内联缓存/隐藏类）要求对象形状稳定—— 注册表的 by_type 统计是其现成度量。 M3 衔接 ：JIT 编译的代码若自持 GC， 必须与 _ObjectRegistry 同构（同一 Hook 点、同一不变量），否则双重管辖。 7. 风险登记（对应 ROADMAP_LONGTERM R7） 内存模型选错（RC vs GC）的最大返工风险，已被「寄生先行」对冲： 首期交付的是观测与回收入口，不绑定任何管辖策略； M2/M3 的选型可以拿首期的真实分配数据说话，而不是拍脑袋。"}, {"id": "std/argparse.intent", "title": "std.argparse", "group": "标准库 API", "html": "<h1 id=\"argparse\">argparse</h1>\n<h2 id=\"parse\"><code>parse</code></h2>\n<blockquote>parse(args: List[String]) → Dict  解析参数列表为字典</blockquote>\n<pre><code class=\"lang-intent\">def parse(args: List&lt;String&gt;)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>args</code></td><td>List&lt;String&gt;</td></tr></tbody></table>\n<h2 id=\"get\"><code>get</code></h2>\n<blockquote>get(opts: Dict, key: String, default: String) → String  带默认取值</blockquote>\n<pre><code class=\"lang-intent\">def get(opts: Any, key: String, default: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>opts</code></td><td>Any</td></tr><tr><td><code>key</code></td><td>String</td></tr><tr><td><code>default</code></td><td>String</td></tr></tbody></table>", "text": "argparse parse parse(args: List[String]) → Dict 解析参数列表为字典 def parse(args: List&lt;String&gt;) 参数 类型 args List&lt;String&gt; get get(opts: Dict, key: String, default: String) → String 带默认取值 def get(opts: Any, key: String, default: String) -&gt; String 参数 类型 opts Any key String default String"}, {"id": "std/collections.intent", "title": "std.collections", "group": "标准库 API", "html": "<h1 id=\"collections\">collections</h1>\n<h2 id=\"counter\"><code>counter</code></h2>\n<blockquote>counter — 数一数每个元素出现几次(存在的密度)</blockquote>\n<pre><code class=\"lang-intent\">def counter(lst: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"most-common\"><code>most_common</code></h2>\n<blockquote>most_common — 出现最多的前 n 个(键, 次数)对</blockquote>\n<pre><code class=\"lang-intent\">def most_common(cnt: Any, n: Int)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>cnt</code></td><td>Any</td></tr><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"class-stack\">class <code>Stack</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>push(x: Any)</code></li>\n<li><code>pop()</code></li>\n<li><code>peek()</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n<li><code>is_empty()</code> -&gt; <code>Bool</code></li>\n</ul>\n<h2 id=\"class-queue\">class <code>Queue</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>enqueue(x: Any)</code></li>\n<li><code>dequeue()</code></li>\n<li><code>peek()</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n<li><code>is_empty()</code> -&gt; <code>Bool</code></li>\n</ul>", "text": "collections counter counter — 数一数每个元素出现几次(存在的密度) def counter(lst: Any) 参数 类型 lst Any most_common most_common — 出现最多的前 n 个(键, 次数)对 def most_common(cnt: Any, n: Int) 参数 类型 cnt Any n Int class Stack init() push(x: Any) pop() peek() size() -&gt; Int is_empty() -&gt; Bool class Queue init() enqueue(x: Any) dequeue() peek() size() -&gt; Int is_empty() -&gt; Bool"}, {"id": "std/contract.intent", "title": "std.contract", "group": "标准库 API", "html": "<h1 id=\"contract\">contract</h1>\n<h2 id=\"require-positive\"><code>require_positive</code></h2>\n<blockquote>══ 前置条件辅助 ══\n正数检查</blockquote>\n<pre><code class=\"lang-intent\">def require_positive(n: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"require-non-negative\"><code>require_non_negative</code></h2>\n<pre><code class=\"lang-intent\">def require_non_negative(n: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"require-in-range\"><code>require_in_range</code></h2>\n<pre><code class=\"lang-intent\">def require_in_range(n: Int, lo: Int, hi: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr><tr><td><code>lo</code></td><td>Int</td></tr><tr><td><code>hi</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"require-divisor-non-zero\"><code>require_divisor_non_zero</code></h2>\n<blockquote>除数非零</blockquote>\n<pre><code class=\"lang-intent\">def require_divisor_non_zero(d: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>d</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"require-non-empty\"><code>require_non_empty</code></h2>\n<blockquote>列表/字符串非空</blockquote>\n<pre><code class=\"lang-intent\">def require_non_empty(xs: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>xs</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"ensure-result-not-null\"><code>ensure_result_not_null</code></h2>\n<blockquote>══ 后置条件辅助 ══\n结果非空（用于返回列表的函数）</blockquote>\n<pre><code class=\"lang-intent\">def ensure_result_not_null(result: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>result</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"ensure-result-in-range\"><code>ensure_result_in_range</code></h2>\n<blockquote>结果在合法范围内</blockquote>\n<pre><code class=\"lang-intent\">def ensure_result_in_range(result: Int, lo: Int, hi: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>result</code></td><td>Int</td></tr><tr><td><code>lo</code></td><td>Int</td></tr><tr><td><code>hi</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"ensure-length-le-original\"><code>ensure_length_le_original</code></h2>\n<blockquote>列表长度不变（适用于 filter/take 类操作）</blockquote>\n<pre><code class=\"lang-intent\">def ensure_length_le_original(result_len: Int, original_len: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>result_len</code></td><td>Int</td></tr><tr><td><code>original_len</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"ensure-result-positive\"><code>ensure_result_positive</code></h2>\n<blockquote>计算结果与输入关系</blockquote>\n<pre><code class=\"lang-intent\">def ensure_result_positive(result: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>result</code></td><td>Int</td></tr></tbody></table>", "text": "contract require_positive ══ 前置条件辅助 ══ 正数检查 def require_positive(n: Int) -&gt; Bool 参数 类型 n Int require_non_negative def require_non_negative(n: Int) -&gt; Bool 参数 类型 n Int require_in_range def require_in_range(n: Int, lo: Int, hi: Int) -&gt; Bool 参数 类型 n Int lo Int hi Int require_divisor_non_zero 除数非零 def require_divisor_non_zero(d: Int) -&gt; Bool 参数 类型 d Int require_non_empty 列表/字符串非空 def require_non_empty(xs: Any) -&gt; Bool 参数 类型 xs Any ensure_result_not_null ══ 后置条件辅助 ══ 结果非空（用于返回列表的函数） def ensure_result_not_null(result: Any) -&gt; Bool 参数 类型 result Any ensure_result_in_range 结果在合法范围内 def ensure_result_in_range(result: Int, lo: Int, hi: Int) -&gt; Bool 参数 类型 result Int lo Int hi Int ensure_length_le_original 列表长度不变（适用于 filter/take 类操作） def ensure_length_le_original(result_len: Int, original_len: Int) -&gt; Bool 参数 类型 result_len Int original_len Int ensure_result_positive 计算结果与输入关系 def ensure_result_positive(result: Int) -&gt; Bool 参数 类型 result Int"}, {"id": "std/csv.intent", "title": "std.csv", "group": "标准库 API", "html": "<h1 id=\"csv\">csv</h1>\n<h2 id=\"parse-line\"><code>parse_line</code></h2>\n<blockquote>parse_line(line: String) → List[String]  解析单行(引号/转义/空字段)</blockquote>\n<pre><code class=\"lang-intent\">def parse_line(line: String) -&gt; List&lt;String&gt;</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>line</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"serialize-row\"><code>serialize_row</code></h2>\n<blockquote>serialize_row(fields: List[String]) → String  生成单行(按需加引号)\n含逗号/引号/换行的字段加引号包裹, 引号翻倍转义</blockquote>\n<pre><code class=\"lang-intent\">def serialize_row(fields: List&lt;String&gt;) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>fields</code></td><td>List&lt;String&gt;</td></tr></tbody></table>\n<h2 id=\"parse\"><code>parse</code></h2>\n<blockquote>parse(text: String) → List[List[String]]  解析多行文本(空文本→空表)</blockquote>\n<pre><code class=\"lang-intent\">def parse(text: String) -&gt; List&lt;List&lt;String&gt;&gt;</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>", "text": "csv parse_line parse_line(line: String) → List[String] 解析单行(引号/转义/空字段) def parse_line(line: String) -&gt; List&lt;String&gt; 参数 类型 line String serialize_row serialize_row(fields: List[String]) → String 生成单行(按需加引号) 含逗号/引号/换行的字段加引号包裹, 引号翻倍转义 def serialize_row(fields: List&lt;String&gt;) -&gt; String 参数 类型 fields List&lt;String&gt; parse parse(text: String) → List[List[String]] 解析多行文本(空文本→空表) def parse(text: String) -&gt; List&lt;List&lt;String&gt;&gt; 参数 类型 text String"}, {"id": "std/datetime.intent", "title": "std.datetime", "group": "标准库 API", "html": "<h1 id=\"datetime\">datetime</h1>\n<h2 id=\"now\"><code>now</code></h2>\n<blockquote>now() → String  当前本地日期时间</blockquote>\n<pre><code class=\"lang-intent\">def now() -&gt; String</code></pre>\n<h2 id=\"today\"><code>today</code></h2>\n<blockquote>today() → String  今天日期</blockquote>\n<pre><code class=\"lang-intent\">def today() -&gt; String</code></pre>\n<h2 id=\"parse\"><code>parse</code></h2>\n<blockquote>parse(iso: String) → String  校验并规范化（纯日期补 00:00:00）</blockquote>\n<pre><code class=\"lang-intent\">def parse(iso: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"format\"><code>format</code></h2>\n<blockquote>format(iso: String, fmt: String) → String  按 strftime 格式串格式化</blockquote>\n<pre><code class=\"lang-intent\">def format(iso: String, fmt: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr><tr><td><code>fmt</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"add-days\"><code>add_days</code></h2>\n<blockquote>add_days(iso: String, days: Int) → String  加天数（可为负）</blockquote>\n<pre><code class=\"lang-intent\">def add_days(iso: String, days: Int) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr><tr><td><code>days</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"add-hours\"><code>add_hours</code></h2>\n<blockquote>add_hours(iso: String, hours: Int) → String  加小时（可为负）</blockquote>\n<pre><code class=\"lang-intent\">def add_hours(iso: String, hours: Int) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr><tr><td><code>hours</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"diff-days\"><code>diff_days</code></h2>\n<blockquote>diff_days(a: String, b: String) → Int  a - b 的整天数（向下取整）</blockquote>\n<pre><code class=\"lang-intent\">def diff_days(a: String, b: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"diff-seconds\"><code>diff_seconds</code></h2>\n<blockquote>diff_seconds(a: String, b: String) → Int  a - b 的秒数</blockquote>\n<pre><code class=\"lang-intent\">def diff_seconds(a: String, b: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"weekday\"><code>weekday</code></h2>\n<blockquote>weekday(iso: String) → Int  星期几（0=周一 … 6=周日）</blockquote>\n<pre><code class=\"lang-intent\">def weekday(iso: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"parts\"><code>parts</code></h2>\n<blockquote>parts(iso: String) → Dict  年月日时分秒字典</blockquote>\n<pre><code class=\"lang-intent\">def parts(iso: String) -&gt; Dict</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"timestamp\"><code>timestamp</code></h2>\n<blockquote>timestamp(iso: String) → Float  Unix 时间戳（按本地时区解释）</blockquote>\n<pre><code class=\"lang-intent\">def timestamp(iso: String) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"from-timestamp\"><code>from_timestamp</code></h2>\n<blockquote>from_timestamp(ts: Float) → String  Unix 时间戳 → 本地 ISO 字符串</blockquote>\n<pre><code class=\"lang-intent\">def from_timestamp(ts: Float) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>ts</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"to-timezone\"><code>to_timezone</code></h2>\n<blockquote>to_timezone(iso: String, offset_hours: Int) → String\n输入按 UTC 解释，返回 offset_hours 时区的墙上时间（(14:00, +8) → 22:00）</blockquote>\n<pre><code class=\"lang-intent\">def to_timezone(iso: String, offset_hours: Int) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>iso</code></td><td>String</td></tr><tr><td><code>offset_hours</code></td><td>Int</td></tr></tbody></table>", "text": "datetime now now() → String 当前本地日期时间 def now() -&gt; String today today() → String 今天日期 def today() -&gt; String parse parse(iso: String) → String 校验并规范化（纯日期补 00:00:00） def parse(iso: String) -&gt; String 参数 类型 iso String format format(iso: String, fmt: String) → String 按 strftime 格式串格式化 def format(iso: String, fmt: String) -&gt; String 参数 类型 iso String fmt String add_days add_days(iso: String, days: Int) → String 加天数（可为负） def add_days(iso: String, days: Int) -&gt; String 参数 类型 iso String days Int add_hours add_hours(iso: String, hours: Int) → String 加小时（可为负） def add_hours(iso: String, hours: Int) -&gt; String 参数 类型 iso String hours Int diff_days diff_days(a: String, b: String) → Int a - b 的整天数（向下取整） def diff_days(a: String, b: String) -&gt; Int 参数 类型 a String b String diff_seconds diff_seconds(a: String, b: String) → Int a - b 的秒数 def diff_seconds(a: String, b: String) -&gt; Int 参数 类型 a String b String weekday weekday(iso: String) → Int 星期几（0=周一 … 6=周日） def weekday(iso: String) -&gt; Int 参数 类型 iso String parts parts(iso: String) → Dict 年月日时分秒字典 def parts(iso: String) -&gt; Dict 参数 类型 iso String timestamp timestamp(iso: String) → Float Unix 时间戳（按本地时区解释） def timestamp(iso: String) -&gt; Float 参数 类型 iso String from_timestamp from_timestamp(ts: Float) → String Unix 时间戳 → 本地 ISO 字符串 def from_timestamp(ts: Float) -&gt; String 参数 类型 ts Float to_timezone to_timezone(iso: String, offset_hours: Int) → String 输入按 UTC 解释，返回 offset_hours 时区的墙上时间（(14:00, +8) → 22:00） def to_timezone(iso: String, offset_hours: Int) -&gt; String 参数 类型 iso String offset_hours Int"}, {"id": "std/decimal.intent", "title": "std.decimal", "group": "标准库 API", "html": "<h1 id=\"decimal\">decimal</h1>\n<h2 id=\"add\"><code>add</code></h2>\n<blockquote>add(a: String, b: String) → String  精确加法</blockquote>\n<pre><code class=\"lang-intent\">def add(a: String, b: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"sub\"><code>sub</code></h2>\n<blockquote>sub(a: String, b: String) → String  精确减法</blockquote>\n<pre><code class=\"lang-intent\">def sub(a: String, b: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"mul\"><code>mul</code></h2>\n<blockquote>mul(a: String, b: String) → String  精确乘法</blockquote>\n<pre><code class=\"lang-intent\">def mul(a: String, b: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"div\"><code>div</code></h2>\n<blockquote>div(a: String, b: String) → String  精确除法(28 位精度, 除零抛错)</blockquote>\n<pre><code class=\"lang-intent\">def div(a: String, b: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"compare\"><code>compare</code></h2>\n<blockquote>compare(a: String, b: String) → Int  a&gt;b→1, a&lt;b→-1, 相等→0</blockquote>\n<pre><code class=\"lang-intent\">def compare(a: String, b: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>", "text": "decimal add add(a: String, b: String) → String 精确加法 def add(a: String, b: String) -&gt; String 参数 类型 a String b String sub sub(a: String, b: String) → String 精确减法 def sub(a: String, b: String) -&gt; String 参数 类型 a String b String mul mul(a: String, b: String) → String 精确乘法 def mul(a: String, b: String) -&gt; String 参数 类型 a String b String div div(a: String, b: String) → String 精确除法(28 位精度, 除零抛错) def div(a: String, b: String) -&gt; String 参数 类型 a String b String compare compare(a: String, b: String) → Int a&gt;b→1, a&lt;b→-1, 相等→0 def compare(a: String, b: String) -&gt; Int 参数 类型 a String b String"}, {"id": "std/encoding.intent", "title": "std.encoding", "group": "标准库 API", "html": "<h1 id=\"encoding\">encoding</h1>\n<h2 id=\"base64-encode\"><code>base64_encode</code></h2>\n<blockquote>base64_encode(text: String) → String  标准 base64（含 = 补齐）</blockquote>\n<pre><code class=\"lang-intent\">def base64_encode(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"base64-decode\"><code>base64_decode</code></h2>\n<blockquote>base64_decode(data: String) → String  base64 解码（非法输入抛 ValueError）</blockquote>\n<pre><code class=\"lang-intent\">def base64_decode(data: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>data</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"gzip-compress\"><code>gzip_compress</code></h2>\n<blockquote>gzip_compress(text: String) → String  gzip 压缩 → base64 文本</blockquote>\n<pre><code class=\"lang-intent\">def gzip_compress(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"gzip-decompress\"><code>gzip_decompress</code></h2>\n<blockquote>gzip_decompress(data: String) → String  base64 → gzip 解压（非法输入抛 ValueError）</blockquote>\n<pre><code class=\"lang-intent\">def gzip_decompress(data: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>data</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"urlencode\"><code>urlencode</code></h2>\n<blockquote>urlencode(text: String) → String  百分号编码（UTF-8，空格 → %20）</blockquote>\n<pre><code class=\"lang-intent\">def urlencode(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"urldecode\"><code>urldecode</code></h2>\n<blockquote>urldecode(data: String) → String  百分号解码（非法输入抛 ValueError）</blockquote>\n<pre><code class=\"lang-intent\">def urldecode(data: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>data</code></td><td>String</td></tr></tbody></table>", "text": "encoding base64_encode base64_encode(text: String) → String 标准 base64（含 = 补齐） def base64_encode(text: String) -&gt; String 参数 类型 text String base64_decode base64_decode(data: String) → String base64 解码（非法输入抛 ValueError） def base64_decode(data: String) -&gt; String 参数 类型 data String gzip_compress gzip_compress(text: String) → String gzip 压缩 → base64 文本 def gzip_compress(text: String) -&gt; String 参数 类型 text String gzip_decompress gzip_decompress(data: String) → String base64 → gzip 解压（非法输入抛 ValueError） def gzip_decompress(data: String) -&gt; String 参数 类型 data String urlencode urlencode(text: String) → String 百分号编码（UTF-8，空格 → %20） def urlencode(text: String) -&gt; String 参数 类型 text String urldecode urldecode(data: String) → String 百分号解码（非法输入抛 ValueError） def urldecode(data: String) -&gt; String 参数 类型 data String"}, {"id": "std/fs.intent", "title": "std.fs", "group": "标准库 API", "html": "<h1 id=\"fs\">fs</h1>\n<h2 id=\"ls\"><code>ls</code></h2>\n<blockquote>ls(path: String) → List[String]  列出目录内容</blockquote>\n<pre><code class=\"lang-intent\">def ls(path: String) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"exists\"><code>exists</code></h2>\n<blockquote>exists(path: String) → Bool  检查路径是否存在</blockquote>\n<pre><code class=\"lang-intent\">def exists(path: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"is-directory\"><code>is_directory</code></h2>\n<blockquote>is_directory(path: String) → Bool</blockquote>\n<pre><code class=\"lang-intent\">def is_directory(path: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"is-regular-file\"><code>is_regular_file</code></h2>\n<blockquote>is_regular_file(path: String) → Bool</blockquote>\n<pre><code class=\"lang-intent\">def is_regular_file(path: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"mkdir\"><code>mkdir</code></h2>\n<blockquote>mkdir(path: String)  创建目录(含父目录)</blockquote>\n<pre><code class=\"lang-intent\">def mkdir(path: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"remove\"><code>remove</code></h2>\n<blockquote>remove(path: String)  删除文件</blockquote>\n<pre><code class=\"lang-intent\">def remove(path: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"read-all\"><code>read_all</code></h2>\n<blockquote>read_all(path: String) → String  读取整个文件为字符串</blockquote>\n<pre><code class=\"lang-intent\">def read_all(path: String) -&gt; String\n    requires file_exists(path)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>file_exists(path)</li>\n</ul>\n<h2 id=\"write-all\"><code>write_all</code></h2>\n<blockquote>write_all(path: String, content: String)  写入文件</blockquote>\n<pre><code class=\"lang-intent\">def write_all(path: String, content: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr><tr><td><code>content</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"size-bytes\"><code>size_bytes</code></h2>\n<blockquote>size_bytes(path: String) → Int  文件大小(字节)</blockquote>\n<pre><code class=\"lang-intent\">def size_bytes(path: String) -&gt; Int\n    requires file_exists(path)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>file_exists(path)</li>\n</ul>\n<h2 id=\"mtime\"><code>mtime</code></h2>\n<blockquote>mtime(path: String) → Float  最后修改时间(Unix时间戳)</blockquote>\n<pre><code class=\"lang-intent\">def mtime(path: String) -&gt; Float\n    requires file_exists(path)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>file_exists(path)</li>\n</ul>", "text": "fs ls ls(path: String) → List[String] 列出目录内容 def ls(path: String) -&gt; List 参数 类型 path String exists exists(path: String) → Bool 检查路径是否存在 def exists(path: String) -&gt; Bool 参数 类型 path String is_directory is_directory(path: String) → Bool def is_directory(path: String) -&gt; Bool 参数 类型 path String is_regular_file is_regular_file(path: String) → Bool def is_regular_file(path: String) -&gt; Bool 参数 类型 path String mkdir mkdir(path: String) 创建目录(含父目录) def mkdir(path: String) 参数 类型 path String remove remove(path: String) 删除文件 def remove(path: String) 参数 类型 path String read_all read_all(path: String) → String 读取整个文件为字符串 def read_all(path: String) -&gt; String requires file_exists(path) 参数 类型 path String 前置条件 : file_exists(path) write_all write_all(path: String, content: String) 写入文件 def write_all(path: String, content: String) 参数 类型 path String content String size_bytes size_bytes(path: String) → Int 文件大小(字节) def size_bytes(path: String) -&gt; Int requires file_exists(path) 参数 类型 path String 前置条件 : file_exists(path) mtime mtime(path: String) → Float 最后修改时间(Unix时间戳) def mtime(path: String) -&gt; Float requires file_exists(path) 参数 类型 path String 前置条件 : file_exists(path)"}, {"id": "std/functools.intent", "title": "std.functools", "group": "标准库 API", "html": "<h1 id=\"functools\">functools</h1>\n<h2 id=\"compose\"><code>compose</code></h2>\n<blockquote>组合: compose(f, g) → fn(x) { f(g(x)) } — 右先生效</blockquote>\n<pre><code class=\"lang-intent\">def compose(f: Any, g: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>f</code></td><td>Any</td></tr><tr><td><code>g</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"memoize\"><code>memoize</code></h2>\n<blockquote>记忆化(单参 lru_cache 的无淘汰子集): 同参第二次直接命中缓存\n闭包捕获 cache 字典 — 键限标量(Intent 字典键规范), 富键调用方自行编码\n命中证据由调用方侧证(装饰函数的副作用计数), 不搞外部统计出口</blockquote>\n<pre><code class=\"lang-intent\">def memoize(f: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>f</code></td><td>Any</td></tr></tbody></table>", "text": "functools compose 组合: compose(f, g) → fn(x) { f(g(x)) } — 右先生效 def compose(f: Any, g: Any) 参数 类型 f Any g Any memoize 记忆化(单参 lru_cache 的无淘汰子集): 同参第二次直接命中缓存 闭包捕获 cache 字典 — 键限标量(Intent 字典键规范), 富键调用方自行编码 命中证据由调用方侧证(装饰函数的副作用计数), 不搞外部统计出口 def memoize(f: Any) 参数 类型 f Any"}, {"id": "std/glob.intent", "title": "std.glob", "group": "标准库 API", "html": "<h1 id=\"glob\">glob</h1>\n<h2 id=\"glob\"><code>glob</code></h2>\n<blockquote>glob(pattern: String) → List[String]  通配符匹配(空表=无匹配)\n支持 * ? [seq]; 递归 ** 留待真实需求，反膨胀不做</blockquote>\n<pre><code class=\"lang-intent\">def glob(pattern: String) -&gt; List&lt;String&gt;\n    requires len(pattern) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(pattern) &gt; 0</li>\n</ul>", "text": "glob glob glob(pattern: String) → List[String] 通配符匹配(空表=无匹配) 支持 * ? [seq]; 递归 ** 留待真实需求，反膨胀不做 def glob(pattern: String) -&gt; List&lt;String&gt; requires len(pattern) &gt; 0 参数 类型 pattern String 前置条件 : len(pattern) &gt; 0"}, {"id": "std/hashlib.intent", "title": "std.hashlib", "group": "标准库 API", "html": "<h1 id=\"hashlib\">hashlib</h1>\n<h2 id=\"md5\"><code>md5</code></h2>\n<blockquote>md5(text: String) → String  MD5 十六进制摘要(32 字符, 仅校验和用途)</blockquote>\n<pre><code class=\"lang-intent\">def md5(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"sha1\"><code>sha1</code></h2>\n<blockquote>sha1(text: String) → String  SHA-1 十六进制摘要(40 字符, 仅兼容用途)</blockquote>\n<pre><code class=\"lang-intent\">def sha1(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"sha256\"><code>sha256</code></h2>\n<blockquote>sha256(text: String) → String  SHA-256 十六进制摘要(64 字符, 安全起点)</blockquote>\n<pre><code class=\"lang-intent\">def sha256(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"sha512\"><code>sha512</code></h2>\n<blockquote>sha512(text: String) → String  SHA-512 十六进制摘要(128 字符)</blockquote>\n<pre><code class=\"lang-intent\">def sha512(text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr></tbody></table>", "text": "hashlib md5 md5(text: String) → String MD5 十六进制摘要(32 字符, 仅校验和用途) def md5(text: String) -&gt; String 参数 类型 text String sha1 sha1(text: String) → String SHA-1 十六进制摘要(40 字符, 仅兼容用途) def sha1(text: String) -&gt; String 参数 类型 text String sha256 sha256(text: String) → String SHA-256 十六进制摘要(64 字符, 安全起点) def sha256(text: String) -&gt; String 参数 类型 text String sha512 sha512(text: String) → String SHA-512 十六进制摘要(128 字符) def sha512(text: String) -&gt; String 参数 类型 text String"}, {"id": "std/hmac.intent", "title": "std.hmac", "group": "标准库 API", "html": "<h1 id=\"hmac\">hmac</h1>\n<h2 id=\"sha256\"><code>sha256</code></h2>\n<blockquote>sha256(key: String, msg: String) → String  HMAC-SHA256 十六进制摘要</blockquote>\n<pre><code class=\"lang-intent\">def sha256(key: String, msg: String) -&gt; String\n    requires len(key) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>key</code></td><td>String</td></tr><tr><td><code>msg</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(key) &gt; 0</li>\n</ul>\n<h2 id=\"sha256-verify\"><code>sha256_verify</code></h2>\n<blockquote>sha256_verify(key: String, msg: String, sig: String) → Bool\n常量时间比对签名——防时序侧信道，不等即假</blockquote>\n<pre><code class=\"lang-intent\">def sha256_verify(key: String, msg: String, sig: String) -&gt; Bool\n    requires len(key) &gt; 0 and len(sig) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>key</code></td><td>String</td></tr><tr><td><code>msg</code></td><td>String</td></tr><tr><td><code>sig</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(key) &gt; 0 and len(sig) &gt; 0</li>\n</ul>", "text": "hmac sha256 sha256(key: String, msg: String) → String HMAC-SHA256 十六进制摘要 def sha256(key: String, msg: String) -&gt; String requires len(key) &gt; 0 参数 类型 key String msg String 前置条件 : len(key) &gt; 0 sha256_verify sha256_verify(key: String, msg: String, sig: String) → Bool 常量时间比对签名——防时序侧信道，不等即假 def sha256_verify(key: String, msg: String, sig: String) -&gt; Bool requires len(key) &gt; 0 and len(sig) &gt; 0 参数 类型 key String msg String sig String 前置条件 : len(key) &gt; 0 and len(sig) &gt; 0"}, {"id": "std/http.intent", "title": "std.http", "group": "标准库 API", "html": "<h1 id=\"http\">http</h1>\n<h2 id=\"get\"><code>get</code></h2>\n<blockquote>get(url: String) → String  GET 请求，返回响应体</blockquote>\n<pre><code class=\"lang-intent\">def get(url: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>url</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"post\"><code>post</code></h2>\n<blockquote>post(url: String, body: String) → String  POST 文本，返回响应体</blockquote>\n<pre><code class=\"lang-intent\">def post(url: String, body: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>url</code></td><td>String</td></tr><tr><td><code>body</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"get-json\"><code>get_json</code></h2>\n<blockquote>get_json(url: String)  GET 并解析 JSON 响应为 Dict/List</blockquote>\n<pre><code class=\"lang-intent\">def get_json(url: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>url</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"post-json\"><code>post_json</code></h2>\n<blockquote>post_json(url: String, value) → String  POST JSON 体，返回响应体</blockquote>\n<pre><code class=\"lang-intent\">def post_json(url: String, value: Any) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>url</code></td><td>String</td></tr><tr><td><code>value</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"serve-start\"><code>serve_start</code></h2>\n<blockquote>serve_start(port: Int) → Int  启动本地测试服务器，返回实际端口（0=系统分配）</blockquote>\n<pre><code class=\"lang-intent\">def serve_start(port: Int) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>port</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"serve-stop\"><code>serve_stop</code></h2>\n<blockquote>serve_stop(port: Int)  关闭测试服务器</blockquote>\n<pre><code class=\"lang-intent\">def serve_stop(port: Int)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>port</code></td><td>Int</td></tr></tbody></table>", "text": "http get get(url: String) → String GET 请求，返回响应体 def get(url: String) -&gt; String 参数 类型 url String post post(url: String, body: String) → String POST 文本，返回响应体 def post(url: String, body: String) -&gt; String 参数 类型 url String body String get_json get_json(url: String) GET 并解析 JSON 响应为 Dict/List def get_json(url: String) 参数 类型 url String post_json post_json(url: String, value) → String POST JSON 体，返回响应体 def post_json(url: String, value: Any) -&gt; String 参数 类型 url String value Any serve_start serve_start(port: Int) → Int 启动本地测试服务器，返回实际端口（0=系统分配） def serve_start(port: Int) -&gt; Int 参数 类型 port Int serve_stop serve_stop(port: Int) 关闭测试服务器 def serve_stop(port: Int) 参数 类型 port Int"}, {"id": "std/itertools.intent", "title": "std.itertools", "group": "标准库 API", "html": "<h1 id=\"itertools\">itertools</h1>\n<h2 id=\"chain\"><code>chain</code></h2>\n<blockquote>chain — 多条序列首尾相续</blockquote>\n<pre><code class=\"lang-intent\">def chain(a: Any, b: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Any</td></tr><tr><td><code>b</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"zip-longest\"><code>zip_longest</code></h2>\n<blockquote>zip_longest — 配对, 短的一方补足(不丢弃)</blockquote>\n<pre><code class=\"lang-intent\">def zip_longest(a: Any, b: Any, fill: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Any</td></tr><tr><td><code>b</code></td><td>Any</td></tr><tr><td><code>fill</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"cycle\"><code>cycle</code></h2>\n<blockquote>cycle — 循环往复, 重复 n 次</blockquote>\n<pre><code class=\"lang-intent\">def cycle(lst: Any, n: Int)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"enumerate\"><code>enumerate</code></h2>\n<blockquote>enumerate — 物各有其位, 返回 [序号, 值] 对</blockquote>\n<pre><code class=\"lang-intent\">def enumerate(lst: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"flatten\"><code>flatten</code></h2>\n<blockquote>flatten — 化繁为简, 展平一层</blockquote>\n<pre><code class=\"lang-intent\">def flatten(lst: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"unique\"><code>unique</code></h2>\n<blockquote>unique — 去重保序(存在的才留, 不重复)</blockquote>\n<pre><code class=\"lang-intent\">def unique(lst: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbo ls2\">itertools2</h1>\n<h2 id=\"permutations\"><code>permutations</code></h2>\n<blockquote>permutations — 全排列：每个元素都曾领头，物各有其位</blockquote>\n<pre><code class=\"lang-intent\">def permutations(lst: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"combinations\"><code>combinations</code></h2>\n<blockquote>combinations — k 组合：选与不选之间，穷尽所有 subsets</blockquote>\n<pre><code class=\"lang-intent\">def combinations(lst: Any, k: Int)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>k</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"product\"><code>product</code></h2>\n<blockquote>product — 笛卡尔积：两集合的所有姻缘</blockquote>\n<pre><code class=\"lang-intent\">def product(a: Any, b: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Any</td></tr><tr><td><code>b</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"heappush\"><code>heappush</code></h2>\n<blockquote>heappush — 入堆：小者浮前</blockquote>\n<pre><code class=\"lang-intent\">def heappush(heap: Any, x: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>heap</code></td><td>Any</td></tr><tr><td><code>x</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"heappop\"><code>heappop</code></h2>\n<blockquote>heappop — 出堆：返回 [最小值, 剩余堆]；空堆返回 Err</blockquote>\n<pre><code class=\"lang-intent\">def heappop(heap: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>heap</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"bisect-left\"><code>bisect_left</code></h2>\n<blockquote>bisect_left — x 的左插入点（相等元素之前）</blockquote>\n<pre><code class=\"lang-intent\">def bisect_left(lst: Any, x: Any) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>x</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"bisect-right\"><code>bisect_right</code></h2>\n<blockquote>bisect_right — x 的右插入点（相等元素之后）</blockquote>\n<pre><code class=\"lang-intent\">def bisect_right(lst: Any, x: Any) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>x</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"insort\"><code>insort</code></h2>\n<blockquote>insort — 有序插入：位定而后安</blockquote>\n<pre><code class=\"lang-intent\">def insort(lst: Any, x: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>x</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"class-minheap\">class <code>MinHeap</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>push(x: Any)</code></li>\n<li><code>pop()</code></li>\n<li><code>peek()</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n<li><code>is_empty()</code> -&gt; <code>Bool</code></li>\n</ul>\n<h2 id=\"class-deque\">class <code>Deque</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>append(x: Any)</code></li>\n<li><code>appendleft(x: Any)</code></li>\n<li><code>pop()</code></li>\n<li><code>popleft()</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n<li><code>is_empty()</code> -&gt; <code>Bool</code></li>\n</ul>\n<h2 id=\"class-defaultdict\">class <code>DefaultDict</code></h2>\n<ul>\n<li><code>init(factory: Any)</code></li>\n<li><code>get(key: Any)</code></li>\n<li><code>set(key: Any, value: Any)</code></li>\n<li><code>has(key: Any)</code> -&gt; <code>Bool</code></li>\n<li><code>keys()</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n</ul>\n<h2 id=\"class-chainmap\">class <code>ChainMap</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>push(d: Any)</code></li>\n<li><code>get(key: Any)</code></li>\n<li><code>has(key: Any)</code> -&gt; <code>Bool</code></li>\n<li><code>size()</code> -&gt; <code>Int</code></li>\n</ul>", "text": "itertools2 permutations permutations — 全排列：每个元素都曾领头，物各有其位 def permutations(lst: Any) 参数 类型 lst Any combinations combinations — k 组合：选与不选之间，穷尽所有 subsets def combinations(lst: Any, k: Int) 参数 类型 lst Any k Int product product — 笛卡尔积：两集合的所有姻缘 def product(a: Any, b: Any) 参数 类型 a Any b Any heappush heappush — 入堆：小者浮前 def heappush(heap: Any, x: Any) 参数 类型 heap Any x Any heappop heappop — 出堆：返回 [最小值, 剩余堆]；空堆返回 Err def heappop(heap: Any) 参数 类型 heap Any bisect_left bisect_left — x 的左插入点（相等元素之前） def bisect_left(lst: Any, x: Any) -&gt; Int 参数 类型 lst Any x Any bisect_right bisect_right — x 的右插入点（相等元素之后） def bisect_right(lst: Any, x: Any) -&gt; Int 参数 类型 lst Any x Any insort insort — 有序插入：位定而后安 def insort(lst: Any, x: Any) 参数 类型 lst Any x Any class MinHeap init() push(x: Any) pop() peek() size() -&gt; Int is_empty() -&gt; Bool class Deque init() append(x: Any) appendleft(x: Any) pop() popleft() size() -&gt; Int is_empty() -&gt; Bool class DefaultDict init(factory: Any) get(key: Any) set(key: Any, value: Any) has(key: Any) -&gt; Bool keys() size() -&gt; Int class ChainMap init() push(d: Any) get(key: Any) has(key: Any) -&gt; Bool size() -&gt; Int"}, {"id": "std/json.intent", "title": "std.json", "group": "标准库 API", "html": "<h1 id=\"json\">json</h1>\n<h2 id=\"parse\"><code>parse</code></h2>\n<blockquote>parse(json_str: String) — 解析 JSON 字符串</blockquote>\n<pre><code class=\"lang-intent\">def parse(json_str: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>json_str</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"stringify\"><code>stringify</code></h2>\n<blockquote>stringify(value: Any) — 将值序列化为 JSON 字符串</blockquote>\n<pre><code class=\"lang-intent\">def stringify(value: Any) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>value</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"read-json\"><code>read_json</code></h2>\n<blockquote>read_json(path: String) — 从文件读取并解析 JSON</blockquote>\n<pre><code class=\"lang-intent\">def read_json(path: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"write-json\"><code>write_json</code></h2>\n<blockquote>write_json(path: String, value) — 将值序列化后写入文件</blockquote>\n<pre><code class=\"lang-intent\">def write_json(path: String, value: Any) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr><tr><td><code>value</code></td><td>Any</td></tr></tbody></table>", "text": "json parse parse(json_str: String) — 解析 JSON 字符串 def parse(json_str: String) 参数 类型 json_str String stringify stringify(value: Any) — 将值序列化为 JSON 字符串 def stringify(value: Any) -&gt; String 参数 类型 value Any read_json read_json(path: String) — 从文件读取并解析 JSON def read_json(path: String) 参数 类型 path String write_json write_json(path: String, value) — 将值序列化后写入文件 def write_json(path: String, value: Any) -&gt; Int 参数 类型 path String value Any"}, {"id": "std/list.intent", "title": "std.list", "group": "标准库 API", "html": "<h1 id=\"list\">list</h1>\n<h2 id=\"sum\"><code>sum</code></h2>\n<pre><code class=\"lang-intent\">def sum(lst: Any) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"contains\"><code>contains</code></h2>\n<pre><code class=\"lang-intent\">def contains(lst: Any, item: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>item</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"any\"><code>any</code></h2>\n<pre><code class=\"lang-intent\">def any(lst: Any, pred: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>pred</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"all\"><code>all</code></h2>\n<pre><code class=\"lang-intent\">def all(lst: Any, pred: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>pred</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"take\"><code>take</code></h2>\n<pre><code class=\"lang-intent\">def take(lst: Any, n: Int)\n    requires n &gt;= 0\n    ensures len(result) &lt;= len(lst)\n    ensures len(result) &lt;= n</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>n &gt;= 0</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) &lt;= len(lst)</li>\n<li>len(result) &lt;= n</li>\n</ul>\n<h2 id=\"drop\"><code>drop</code></h2>\n<pre><code class=\"lang-intent\">def drop(lst: Any, n: Int)\n    requires n &gt;= 0\n    ensures len(result) &lt;= len(lst)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>n &gt;= 0</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) &lt;= len(lst)</li>\n</ul>\n<h2 id=\"zip\"><code>zip</code></h2>\n<pre><code class=\"lang-intent\">def zip(a: Any, b: Any)\n    ensures len(result) &lt;= len(a) and len(result) &lt;= len(b)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Any</td></tr><tr><td><code>b</code></td><td>Any</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) &lt;= len(a) and len(result) &lt;= len(b)</li>\n</ul>\n<h2 id=\"map\"><code>map</code></h2>\n<pre><code class=\"lang-intent\">def map(lst: Any, f: Any)\n    ensures len(result) == len(lst)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>f</code></td><td>Any</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == len(lst)</li>\n</ul>\n<h2 id=\"filter\"><code>filter</code></h2>\n<pre><code class=\"lang-intent\">def filter(lst: Any, pred: Any)\n    ensures len(result) &lt;= len(lst)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>pred</code></td><td>Any</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) &lt;= len(lst)</li>\n</ul>\n<h2 id=\"reduce\"><code>reduce</code></h2>\n<pre><code class=\"lang-intent\">def reduce(lst: Any, f: Any, initial: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>f</code></td><td>Any</td></tr><tr><td><code>initial</code></td><td>Any</td></tr></tbody></table>", "text": "list sum def sum(lst: Any) -&gt; Int 参数 类型 lst Any contains def contains(lst: Any, item: Any) -&gt; Bool 参数 类型 lst Any item Any any def any(lst: Any, pred: Any) -&gt; Bool 参数 类型 lst Any pred Any all def all(lst: Any, pred: Any) -&gt; Bool 参数 类型 lst Any pred Any take def take(lst: Any, n: Int) requires n &gt;= 0 ensures len(result) &lt;= len(lst) ensures len(result) &lt;= n 参数 类型 lst Any n Int 前置条件 : n &gt;= 0 后置条件 : len(result) &lt;= len(lst) len(result) &lt;= n drop def drop(lst: Any, n: Int) requires n &gt;= 0 ensures len(result) &lt;= len(lst) 参数 类型 lst Any n Int 前置条件 : n &gt;= 0 后置条件 : len(result) &lt;= len(lst) zip def zip(a: Any, b: Any) ensures len(result) &lt;= len(a) and len(result) &lt;= len(b) 参数 类型 a Any b Any 后置条件 : len(result) &lt;= len(a) and len(result) &lt;= len(b) map def map(lst: Any, f: Any) ensures len(result) == len(lst) 参数 类型 lst Any f Any 后置条件 : len(result) == len(lst) filter def filter(lst: Any, pred: Any) ensures len(result) &lt;= len(lst) 参数 类型 lst Any pred Any 后置条件 : len(result) &lt;= len(lst) reduce def reduce(lst: Any, f: Any, initial: Any) 参数 类型 lst Any f Any initial Any"}, {"id": "std/math.intent", "title": "std.math", "group": "标准库 API", "html": "<h1 id=\"math\">math</h1>\n<h2 id=\"add\"><code>add</code></h2>\n<pre><code class=\"lang-intent\">def add(a: Int, b: Int) -&gt; Int\n    ensures result == a + b</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Int</td></tr><tr><td><code>b</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result == a + b</li>\n</ul>\n<h2 id=\"multiply\"><code>multiply</code></h2>\n<pre><code class=\"lang-intent\">def multiply(a: Int, b: Int) -&gt; Int\n    ensures result == a * b</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Int</td></tr><tr><td><code>b</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result == a * b</li>\n</ul>\n<h2 id=\"square\"><code>square</code></h2>\n<pre><code class=\"lang-intent\">def square(x: Int) -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>x</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"abs\"><code>abs</code></h2>\n<pre><code class=\"lang-intent\">def abs(x: Int) -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>x</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"max\"><code>max</code></h2>\n<pre><code class=\"lang-intent\">def max(a: Int, b: Int) -&gt; Int\n    ensures result &gt;= a and result &gt;= b</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Int</td></tr><tr><td><code>b</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= a and result &gt;= b</li>\n</ul>\n<h2 id=\"min\"><code>min</code></h2>\n<pre><code class=\"lang-intent\">def min(a: Int, b: Int) -&gt; Int\n    ensures result &lt;= a and result &lt;= b</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Int</td></tr><tr><td><code>b</code></td><td>Int</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &lt;= a and result &lt;= b</li>\n</ul>", "text": "math add def add(a: Int, b: Int) -&gt; Int ensures result == a + b 参数 类型 a Int b Int 后置条件 : result == a + b multiply def multiply(a: Int, b: Int) -&gt; Int ensures result == a * b 参数 类型 a Int b Int 后置条件 : result == a * b square def square(x: Int) -&gt; Int ensures result &gt;= 0 参数 类型 x Int 后置条件 : result &gt;= 0 abs def abs(x: Int) -&gt; Int ensures result &gt;= 0 参数 类型 x Int 后置条件 : result &gt;= 0 max def max(a: Int, b: Int) -&gt; Int ensures result &gt;= a and result &gt;= b 参数 类型 a Int b Int 后置条件 : result &gt;= a and result &gt;= b min def min(a: Int, b: Int) -&gt; Int ensures result &lt;= a and result &lt;= b 参数 类型 a Int b Int 后置条件 : result &lt;= a and result &lt;= b"}, {"id": "std/memory.intent", "title": "std.memory", "group": "标准库 API", "html": "<h1 id=\"memory\">memory</h1>\n<h2 id=\"mem-live\"><code>mem_live</code></h2>\n<blockquote>mem_live() → Int  当前存活容器对象数</blockquote>\n<pre><code class=\"lang-intent\">def mem_live() -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"alloc-total\"><code>alloc_total</code></h2>\n<blockquote>alloc_total() → Int  累计创建容器对象数</blockquote>\n<pre><code class=\"lang-intent\">def alloc_total() -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"mem-stats\"><code>mem_stats</code></h2>\n<blockquote>mem_stats() → Dict  统计字典(live/alloc_total/reclaim_total/by_type)</blockquote>\n<pre><code class=\"lang-intent\">def mem_stats()</code></pre>\n<h2 id=\"gc-collect\"><code>gc_collect</code></h2>\n<blockquote>gc_collect() → Int  触发循环垃圾回收, 返回本次回收容器数</blockquote>\n<pre><code class=\"lang-intent\">def gc_collect() -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"ref-count\"><code>ref_count</code></h2>\n<blockquote>ref_count(obj) → Int  对象的宿主引用计数(诊断观测值)</blockquote>\n<pre><code class=\"lang-intent\">def ref_count(obj: Any) -&gt; Int\n    ensures result &gt;= 1</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>obj</code></td><td>Any</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 1</li>\n</ul>", "text": "memory mem_live mem_live() → Int 当前存活容器对象数 def mem_live() -&gt; Int ensures result &gt;= 0 后置条件 : result &gt;= 0 alloc_total alloc_total() → Int 累计创建容器对象数 def alloc_total() -&gt; Int ensures result &gt;= 0 后置条件 : result &gt;= 0 mem_stats mem_stats() → Dict 统计字典(live/alloc_total/reclaim_total/by_type) def mem_stats() gc_collect gc_collect() → Int 触发循环垃圾回收, 返回本次回收容器数 def gc_collect() -&gt; Int ensures result &gt;= 0 后置条件 : result &gt;= 0 ref_count ref_count(obj) → Int 对象的宿主引用计数(诊断观测值) def ref_count(obj: Any) -&gt; Int ensures result &gt;= 1 参数 类型 obj Any 后置条件 : result &gt;= 1"}, {"id": "std/os.intent", "title": "std.os", "group": "标准库 API", "html": "<h1 id=\"os\">os</h1>\n<h2 id=\"getenv\"><code>getenv</code></h2>\n<blockquote>getenv(key: String) → String  读取环境变量</blockquote>\n<pre><code class=\"lang-intent\">def getenv(key: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>key</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"curdir\"><code>curdir</code></h2>\n<blockquote>curdir() → String  当前工作目录</blockquote>\n<pre><code class=\"lang-intent\">def curdir() -&gt; String</code></pre>\n<h2 id=\"chdir\"><code>chdir</code></h2>\n<blockquote>chdir(path: String)  切换目录</blockquote>\n<pre><code class=\"lang-intent\">def chdir(path: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"run\"><code>run</code></h2>\n<blockquote>run(cmd: String) → String  执行 shell 命令</blockquote>\n<pre><code class=\"lang-intent\">def run(cmd: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>cmd</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"sys-platform\"><code>sys_platform</code></h2>\n<blockquote>sys_platform() → String  操作系统平台</blockquote>\n<pre><code class=\"lang-intent\">def sys_platform() -&gt; String</code></pre>\n<h2 id=\"home-dir\"><code>home_dir</code></h2>\n<blockquote>home_dir() → String  用户主目录</blockquote>\n<pre><code class=\"lang-intent\">def home_dir() -&gt; String</code></pre>", "text": "os getenv getenv(key: String) → String 读取环境变量 def getenv(key: String) -&gt; String 参数 类型 key String curdir curdir() → String 当前工作目录 def curdir() -&gt; String chdir chdir(path: String) 切换目录 def chdir(path: String) 参数 类型 path String run run(cmd: String) → String 执行 shell 命令 def run(cmd: String) -&gt; String 参数 类型 cmd String sys_platform sys_platform() → String 操作系统平台 def sys_platform() -&gt; String home_dir home_dir() → String 用户主目录 def home_dir() -&gt; String"}, {"id": "std/pathlib.intent", "title": "std.pathlib", "group": "标准库 API", "html": "<h1 id=\"pathlib\">pathlib</h1>\n<h2 id=\"norm\"><code>_norm</code></h2>\n<blockquote>_norm(path) → String  分隔符规范化(内部函数, 不导出)</blockquote>\n<pre><code class=\"lang-intent\">def _norm(path: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"name\"><code>name</code></h2>\n<blockquote>name(path: String) → String  末段文件名(&quot;a/b/c.intent&quot; → &quot;c.intent&quot;)</blockquote>\n<pre><code class=\"lang-intent\">def name(path: String) -&gt; String\n    requires len(path) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0</li>\n</ul>\n<h2 id=\"stem\"><code>stem</code></h2>\n<blockquote>stem(path: String) → String  去扩展名的文件名(隐藏文件保全)</blockquote>\n<pre><code class=\"lang-intent\">def stem(path: String) -&gt; String\n    requires len(path) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0</li>\n</ul>\n<h2 id=\"suffix\"><code>suffix</code></h2>\n<blockquote>suffix(path: String) → String  末段扩展名(含点, 无则空串)</blockquote>\n<pre><code class=\"lang-intent\">def suffix(path: String) -&gt; String\n    requires len(path) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0</li>\n</ul>\n<h2 id=\"parent\"><code>parent</code></h2>\n<blockquote>parent(path: String) → String  父目录(顶层返回 &quot;&quot;)</blockquote>\n<pre><code class=\"lang-intent\">def parent(path: String) -&gt; String\n    requires len(path) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0</li>\n</ul>\n<h2 id=\"join-path\"><code>join_path</code></h2>\n<blockquote>join_path(a: String, b: String) → String  拼接两段(不重复尾分隔符)\n命名避坑: 不叫 join — import 符号注入会遮蔽核心内置 join(sep, parts)</blockquote>\n<pre><code class=\"lang-intent\">def join_path(a: String, b: String) -&gt; String\n    requires len(a) &gt; 0 and len(b) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(a) &gt; 0 and len(b) &gt; 0</li>\n</ul>\n<h2 id=\"with-suffix\"><code>with_suffix</code></h2>\n<blockquote>with_suffix(path: String, ext: String) → String  替换扩展名(ext 含点)</blockquote>\n<pre><code class=\"lang-intent\">def with_suffix(path: String, ext: String) -&gt; String\n    requires len(path) &gt; 0 and len(ext) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr><tr><td><code>ext</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0 and len(ext) &gt; 0</li>\n</ul>", "text": "pathlib _norm _norm(path) → String 分隔符规范化(内部函数, 不导出) def _norm(path: String) -&gt; String 参数 类型 path String name name(path: String) → String 末段文件名(&quot;a/b/c.intent&quot; → &quot;c.intent&quot;) def name(path: String) -&gt; String requires len(path) &gt; 0 参数 类型 path String 前置条件 : len(path) &gt; 0 stem stem(path: String) → String 去扩展名的文件名(隐藏文件保全) def stem(path: String) -&gt; String requires len(path) &gt; 0 参数 类型 path String 前置条件 : len(path) &gt; 0 suffix suffix(path: String) → String 末段扩展名(含点, 无则空串) def suffix(path: String) -&gt; String requires len(path) &gt; 0 参数 类型 path String 前置条件 : len(path) &gt; 0 parent parent(path: String) → String 父目录(顶层返回 &quot;&quot;) def parent(path: String) -&gt; String requires len(path) &gt; 0 参数 类型 path String 前置条件 : len(path) &gt; 0 join_path join_path(a: String, b: String) → String 拼接两段(不重复尾分隔符) 命名避坑: 不叫 join — import 符号注入会遮蔽核心内置 join(sep, parts) def join_path(a: String, b: String) -&gt; String requires len(a) &gt; 0 and len(b) &gt; 0 参数 类型 a String b String 前置条件 : len(a) &gt; 0 and len(b) &gt; 0 with_suffix with_suffix(path: String, ext: String) → String 替换扩展名(ext 含点) def with_suffix(path: String, ext: String) -&gt; String requires len(path) &gt; 0 and len(ext) &gt; 0 参数 类型 path String ext String 前置条件 : len(path) &gt; 0 and len(ext) &gt; 0"}, {"id": "std/random.intent", "title": "std.random", "group": "标准库 API", "html": "<h1 id=\"random\">random</h1>\n<h2 id=\"random-val\"><code>random_val</code></h2>\n<blockquote>random_val() → Float  返回 0~1 之间的随机浮点数</blockquote>\n<pre><code class=\"lang-intent\">def random_val() -&gt; Float</code></pre>\n<h2 id=\"rand-int\"><code>rand_int</code></h2>\n<blockquote>rand_int(lo: Int, hi: Int) → Int  返回 [lo, hi] 范围内的随机整数</blockquote>\n<pre><code class=\"lang-intent\">def rand_int(lo: Int, hi: Int) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lo</code></td><td>Int</td></tr><tr><td><code>hi</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"uniform\"><code>uniform</code></h2>\n<blockquote>uniform(lo: Float, hi: Float) → Float  返回 [lo, hi] 范围内的随机浮点数</blockquote>\n<pre><code class=\"lang-intent\">def uniform(lo: Float, hi: Float) -&gt; Float\n    ensures result &gt;= lo and result &lt;= hi</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lo</code></td><td>Float</td></tr><tr><td><code>hi</code></td><td>Float</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= lo and result &lt;= hi</li>\n</ul>\n<h2 id=\"choice\"><code>choice</code></h2>\n<blockquote>choice(items: List) → Any  从列表中随机选一个元素</blockquote>\n<pre><code class=\"lang-intent\">def choice(items: List) -&gt; Any\n    requires len(items) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>items</code></td><td>List</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(items) &gt; 0</li>\n</ul>\n<h2 id=\"dice\"><code>dice</code></h2>\n<blockquote>dice(sides: Int) → Int  掷骰子 [1, sides]</blockquote>\n<pre><code class=\"lang-intent\">def dice(sides: Int) -&gt; Int\n    requires sides &gt;= 1\n    ensures result &gt;= 1 and result &lt;= sides</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>sides</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>sides &gt;= 1</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 1 and result &lt;= sides</li>\n</ul>", "text": "random random_val random_val() → Float 返回 0~1 之间的随机浮点数 def random_val() -&gt; Float rand_int rand_int(lo: Int, hi: Int) → Int 返回 [lo, hi] 范围内的随机整数 def rand_int(lo: Int, hi: Int) -&gt; Int 参数 类型 lo Int hi Int uniform uniform(lo: Float, hi: Float) → Float 返回 [lo, hi] 范围内的随机浮点数 def uniform(lo: Float, hi: Float) -&gt; Float ensures result &gt;= lo and result &lt;= hi 参数 类型 lo Float hi Float 后置条件 : result &gt;= lo and result &lt;= hi choice choice(items: List) → Any 从列表中随机选一个元素 def choice(items: List) -&gt; Any requires len(items) &gt; 0 参数 类型 items List 前置条件 : len(items) &gt; 0 dice dice(sides: Int) → Int 掷骰子 [1, sides] def dice(sides: Int) -&gt; Int requires sides &gt;= 1 ensures result &gt;= 1 and result &lt;= sides 参数 类型 sides Int 前置条件 : sides &gt;= 1 后置条件 : result &gt;= 1 and result &lt;= sides"}, {"id": "std/re.intent", "title": "std.re", "group": "标准库 API", "html": "<h1 id=\"re\">re</h1>\n<h2 id=\"test\"><code>test</code></h2>\n<blockquote>test(pattern: String, text: String) → Bool  是否存在匹配（search，不锚定）</blockquote>\n<pre><code class=\"lang-intent\">def test(pattern: String, text: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"full-match\"><code>full_match</code></h2>\n<blockquote>full_match(pattern: String, text: String) → Bool  整串匹配（两端锚定）</blockquote>\n<pre><code class=\"lang-intent\">def full_match(pattern: String, text: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"find-all\"><code>find_all</code></h2>\n<blockquote>find_all(pattern: String, text: String) → List  所有匹配子串（完整匹配）</blockquote>\n<pre><code class=\"lang-intent\">def find_all(pattern: String, text: String) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"groups\"><code>groups</code></h2>\n<blockquote>groups(pattern: String, text: String) → List  首个匹配的捕获组（无匹配为空列表）</blockquote>\n<pre><code class=\"lang-intent\">def groups(pattern: String, text: String) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"replace\"><code>replace</code></h2>\n<blockquote>replace(pattern: String, repl: String, text: String) → String  全局替换（\\1 反向引用）</blockquote>\n<pre><code class=\"lang-intent\">def replace(pattern: String, repl: String, text: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>repl</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"split\"><code>split</code></h2>\n<blockquote>split(pattern: String, text: String) → List  按模式切分</blockquote>\n<pre><code class=\"lang-intent\">def split(pattern: String, text: String) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>pattern</code></td><td>String</td></tr><tr><td><code>text</code></td><td>String</td></tr></tbody></table>", "text": "re test test(pattern: String, text: String) → Bool 是否存在匹配（search，不锚定） def test(pattern: String, text: String) -&gt; Bool 参数 类型 pattern String text String full_match full_match(pattern: String, text: String) → Bool 整串匹配（两端锚定） def full_match(pattern: String, text: String) -&gt; Bool 参数 类型 pattern String text String find_all find_all(pattern: String, text: String) → List 所有匹配子串（完整匹配） def find_all(pattern: String, text: String) -&gt; List 参数 类型 pattern String text String groups groups(pattern: String, text: String) → List 首个匹配的捕获组（无匹配为空列表） def groups(pattern: String, text: String) -&gt; List 参数 类型 pattern String text String replace replace(pattern: String, repl: String, text: String) → String 全局替换（\\1 反向引用） def replace(pattern: String, repl: String, text: String) -&gt; String 参数 类型 pattern String repl String text String split split(pattern: String, text: String) → List 按模式切分 def split(pattern: String, text: String) -&gt; List 参数 类型 pattern String text String"}, {"id": "std/secrets.intent", "title": "std.secrets", "group": "标准库 API", "html": "<h1 id=\"secrets\">secrets</h1>\n<h2 id=\"token-hex\"><code>token_hex</code></h2>\n<blockquote>token_hex(n: Int) → String  n 字节安全随机数的十六进制(2n 字符)</blockquote>\n<pre><code class=\"lang-intent\">def token_hex(n: Int) -&gt; String\n    requires n &gt;= 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>n &gt;= 0</li>\n</ul>\n<h2 id=\"rand-below\"><code>rand_below</code></h2>\n<blockquote>rand_below(n: Int) → Int  [0, n) 安全随机整数</blockquote>\n<pre><code class=\"lang-intent\">def rand_below(n: Int) -&gt; Int\n    requires n &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>n &gt; 0</li>\n</ul>\n<h2 id=\"choice\"><code>choice</code></h2>\n<blockquote>choice(lst: List) → Any  列表安全随机取一(空表抛 ValueError)</blockquote>\n<pre><code class=\"lang-intent\">def choice(lst: Any)\n    requires len(lst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(lst) &gt; 0</li>\n</ul>", "text": "secrets token_hex token_hex(n: Int) → String n 字节安全随机数的十六进制(2n 字符) def token_hex(n: Int) -&gt; String requires n &gt;= 0 参数 类型 n Int 前置条件 : n &gt;= 0 rand_below rand_below(n: Int) → Int [0, n) 安全随机整数 def rand_below(n: Int) -&gt; Int requires n &gt; 0 参数 类型 n Int 前置条件 : n &gt; 0 choice choice(lst: List) → Any 列表安全随机取一(空表抛 ValueError) def choice(lst: Any) requires len(lst) &gt; 0 参数 类型 lst Any 前置条件 : len(lst) &gt; 0"}, {"id": "std/shutil.intent", "title": "std.shutil", "group": "标准库 API", "html": "<h1 id=\"shutil\">shutil</h1>\n<h2 id=\"copy-file\"><code>copy_file</code></h2>\n<blockquote>copy_file(src: String, dst: String) → Bool  复制文件(覆盖式, 保留权限)</blockquote>\n<pre><code class=\"lang-intent\">def copy_file(src: String, dst: String) -&gt; Bool\n    requires len(src) &gt; 0 and len(dst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>src</code></td><td>String</td></tr><tr><td><code>dst</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(src) &gt; 0 and len(dst) &gt; 0</li>\n</ul>\n<h2 id=\"move\"><code>move</code></h2>\n<blockquote>move(src: String, dst: String) → Bool  移动文件或目录(跨盘则复制后删)</blockquote>\n<pre><code class=\"lang-intent\">def move(src: String, dst: String) -&gt; Bool\n    requires len(src) &gt; 0 and len(dst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>src</code></td><td>String</td></tr><tr><td><code>dst</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(src) &gt; 0 and len(dst) &gt; 0</li>\n</ul>\n<h2 id=\"rmtree\"><code>rmtree</code></h2>\n<blockquote>rmtree(path: String) → Bool  递归删除目录(不存在抛 RuntimeError)</blockquote>\n<pre><code class=\"lang-intent\">def rmtree(path: String) -&gt; Bool\n    requires len(path) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th

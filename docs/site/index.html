ode> 支持从 <code>./lib</code>、<code>~/.intent/lib</code> 解析 + <code>intent install &lt;git-url&gt;</code> 克隆到本地 lib。<strong>不碰版本求解器</strong>——约束只支持 <code>=</code> 和 <code>&gt;=</code>，冲突了直接报错让人工裁决</li>\n<li><strong>V0.2（注册表）</strong>：只有当出现 3 个以上真实第三方包需求再做。注册表先做静态文件托管（GitHub Pages + JSON 索引），不做 PyPI 级基础设施</li>\n</ul>\n<p><strong>哲学映射</strong>：天地与我并生（第7章）——包管理是「万物一体」的基础设施：你的代码与世界连接。但连接贵在<strong>简单可信</strong>，版本求解器是复杂性瘟疫，V0.1 刻意不治。</p>\n<h3 id=\"62-formatter-intent-fmt-p1\">6.2 Formatter <code>intent fmt</code> 【P1】</h3>\n<p><strong>设计</strong>：token 流重排，不动 AST 语义。规则刻意少：4 空格缩进、80 列、<code>;</code> 保留（Intent 的分号是「一句话说完了」的句号，有哲学含义不删）、行尾注释对齐。<strong>不追求配置化</strong>——gofmt 的成功就在于没有配置。\n<strong>哲学映射</strong>：大道不称——格式不该是个人品味，是语言的默认秩序。你不需要选择，秩序本自存在。</p>\n<h3 id=\"63-linter-intent-lint-p2-已完成\">6.3 Linter <code>intent lint</code> 【P2】✅ 已完成</h3>\n<p><strong>实施记录（2026-10-16）</strong>：AST 静态检查不执行，四条规则对应四条哲学：</p>\n<ul>\n<li>E1 <code>let</code> 常量被重新赋值（不可变是默认）——<strong>作用域敏感</strong>：块内 let 不出块、方法间同名互不相干（初版按函数分组误报，重写为域栈递归下降）</li>\n<li>W1 空 catch 块（沉默的 catch 比没有 catch 更糟）</li>\n<li>I1 顶层函数无契约（契约是身份证）</li>\n<li>W2 import 未使用（不带多余的东西上路）</li>\n</ul>\n<p>分级 E/W/I，有 E 退出 1；全量 81 文件 0 错误级。<strong>又抓出 3 个宽松模式掩盖的真问题</strong>（BIM 库 let 后改值，执行时会炸只是没被调用）。\n原设计中的「let mut 从未被赋值」规则暂缓（误报率高，收益低）。</p>\n<h3 id=\"64-文档生成-intent-doc-p2-已完成\">6.4 文档生成 <code>intent doc</code> 【P2】✅ 已完成</h3>\n<p><strong>实施记录（2026-10-16）</strong>：<code>--doc</code> 从函数签名 + 上方注释块 + 契约生成 markdown（<code>_unparse</code> 表达式反打印，<code>ensures result &gt;= 0</code> 而非 AST repr）；类输出方法列表。全量 81 文件生成不崩。\ndocstring 语法未新增 spec（<code>///</code>/<code>&quot;&quot;&quot;</code> 二选一的决策推迟到有真实需求）；当前用函数上方 <code>//</code> 注释块作文档——注释即文档，不发明第二套。</p>\n<h3 id=\"65-ci-与发布-p1-已完成\">6.5 CI 与发布 【P1】✅ 已完成</h3>\n<p><strong>实施记录（2026-10-16）</strong>：</p>\n<ul>\n<li><code>.github/workflows/ci.yml</code>：push/PR 触发，五步——全文件 <code>--check</code>（81 个文件严格模式）+ <code>--test</code> + <code>--lint</code>（0 错误级）+ <code>--doc</code>（全文件不崩）+ formatter 幂等抽查</li>\n<li>CI 前置清理：修掉宽松模式掩盖的 3 个脏文件（lesson_03 字符串嵌引号、lesson_05 <code>catch {</code>、std/contract.intent 关键字撞名死函数），<strong>重写 demo.intent</strong>（原文件调用一堆从未实现的标准库函数，是「幻想文档」；现为 8 特性真实门面）</li>\n<li>版本 v1.2.0 → <strong>v2.0.0</strong>（契约违约行为破坏性变更）；CHANGELOG.md 记录全history</li>\n<li>本地模拟 CI 三步全过；tests 61/61；全部 81 个 .intent 文件通过严格语法检查</li>\n</ul>\n<ul>\n<li>GitHub Actions：push 跑 <code>intent test</code>（Phase 0.2）+ <code>intent check</code>（6.3）</li>\n<li>版本语义：语义化版本 + CHANGELOG.md，每次发布附「新增特性的哲学映射」——<strong>发布说明就是书稿的连载</strong>。这条对内容 IP 战略有直接价值</li>\n</ul>\n<hr>\n<h2 id=\"七phase-3标准库扩张与并发\">七、Phase 3：标准库扩张与并发</h2>\n<h3 id=\"71-标准库优先级按通用语言必备度排序\">7.1 标准库优先级（按「通用语言必备度」排序）</h3>\n<table><thead><tr><th>优先级</th><th>模块</th><th>内容</th><th>理由</th></tr></thead><tbody><tr><td>P1</td><td><code>re</code> 正则</td><td>匹配/替换/切分/编译</td><td>Python 生态基石，文本处理绕不开</td></tr><tr><td>P1</td><td><code>datetime</code></td><td>日期运算/格式化/时区</td><td>time.intent 只有时间戳，业务代码天天要</td></tr><tr><td>P1</td><td><code>itertools</code></td><td>permutations/combinations/product/chain</td><td>组合爆炸的穷举——「格物」的基础设施</td></tr><tr><td>P1</td><td><code>collections</code></td><td>deque/Counter/defaultdict/namedtuple</td><td>数据结构全家桶，Python 日用好物</td></tr><tr><td>P2</td><td><code>csv</code></td><td>读写（对齐 Python csv 模块）</td><td>BIM 数据导出/导入刚需</td></tr><tr><td>P2</td><td><code>sqlite3</code></td><td>嵌入式数据库绑定</td><td>阿J 的地球OL/DynoManager 都是 SQLite，自建语言不吃自己的库说不过去</td></tr><tr><td>P2</td><td><code>functools</code></td><td>partial/compose/lru_cache</td><td>compose 与管道 `</td></tr><tr><td>P2</td><td><code>http</code> client</td><td>GET/POST/JSON</td><td>通用语言的门票；LLM API 调用靠它</td></tr><tr><td>P3</td><td><code>struct</code>/<code>base64</code></td><td>二进制/编码</td><td>BIM 文件处理</td></tr><tr><td>P3</td><td><code>heapq</code>/<code>bisect</code></td><td>算法库</td><td>管道路由 A* 已内联在 bim 模块，通用化提取</td></tr><tr><td>P3</td><td><code>threading</code>/<code>queue</code></td><td>线程安全队列</td><td>与 7.2 并发模型一起</td></tr></tbody></table>\n<p><strong>每加一个模块的纪律</strong>：模块必须带 <code>requires/ensures</code> 契约；必须进 spec.md；必须配测试。标准库是语言的样板戏——标准库自己违约，契约宪法就是笑话。</p>\n<blockquote><strong>实施进度（2026-10-16）</strong>：itertools ✅｜collections ✅｜re/datetime → 下一步。\nitertools 落地为 chain/zip_longest/cycle/enumerate/flatten/unique/chunk/groupby/count_where（permutations/combinations/product 留待真实需求——反膨胀，先交付「日常 80%」）。\ncollections 落地为 counter/most_common + Stack/Queue 类（deque/defaultdict/namedtuple 缓议）。\n<strong>过程中修掉 3 个解释器真 bug</strong>：<code>x? == v</code> 的 TryExpr/三元歧义（panic mode 吞 <code>?</code>）、<code>RuntimeValue.copy</code> 漏子类（dict 传参即崩，第 9 个真 bug）、dict 键形态分裂（get/set/has_key 归一 <code>_norm_key</code>，第 8 个）。测试 61→76。</blockquote>\n<h3 id=\"72-并发模型-p2最后做\">7.2 并发模型 【P2，最后做】</h3>\n<p><strong>为什么最后</strong>：树遍历解释器加并发是伤筋动骨的手术，语法、运行时、标准库三线联动。放在生态基建之后，且必须想清楚哲学定位。</p>\n<p><strong>三个候选，按哲学契合度</strong>：</p>\n<table><thead><tr><th>方案</th><th>机制</th><th>哲学契合</th><th>成本</th></tr></thead><tbody><tr><td>A. Channel + goroutine</td><td><code>spawn f()</code> + <code>ch &lt;- v</code> / <code>&lt;- ch</code></td><td>⭐⭐⭐ 「知行合一」的时空分离：发送者与接收者各自节奏，数据在中间相遇</td><td>高（调度器）</td></tr><tr><td>B. async/await</td><td><code>async fn</code> + <code>await</code></td><td>⭐⭐ 与管道流式天然合，但关键字抄袭 Python，无哲学加成</td><td>中</td></tr><tr><td>C. 结构化并发</td><td><code>scope { spawn ...; }</code> 作用域结束自动 join</td><td>⭐⭐⭐ 「向死而生」：并发任务的生命周期在创建时就被限定</td><td>中高</td></tr></tbody></table>\n<p><strong>推荐 C 的结构化并发 + A 的 channel 通信</strong>：<code>spawn</code> 出来的任务必须挂在某个作用域上，作用域退出时等待/取消——这符合 Intent 的「声明即存在」宪法：任务的生与死都在声明处可见。channel 作为唯一通信原语（不共享内存）。\n<strong>Step 1 最小切片</strong>：解释器内嵌 Python threading 实现 <code>spawn</code> + 线程安全 channel，只做演示级；Step 2 再考虑协程调度器。\n<strong>验收</strong>：能写生产者-消费者管道：<code>data |&gt; producer |&gt; consumer</code> 的并发版。</p>\n<hr>\n<h2 id=\"七点五phase-4字节码编译器m10-2026-10-17\">七点五、Phase 4：字节码编译器（M10 ✅ 2026-10-17）</h2>\n<blockquote>语言分两阶段：先让它能跑（树遍历解释器），再让它跑得快（字节码 + VM）。\nAST 是意，字节码是言——言不尽意，但言可执行。</blockquote>\n<p><strong>实施记录（2026-10-16/17）</strong>：</p>\n<ul>\n<li><code>src/intent_bytecode.py</code>：指令集 20 条 + Emitter（AST → 指令，跳转回填）+ 栈式 VM（值栈 + 调用帧 + 100 万步熔断）</li>\n<li>CLI：<code>--compile file [--run-vm]</code>；编译元信息走 stderr、程序输出走 stdout——与解释器 stdout 可直接 diff</li>\n<li><strong>M10 V0.1 覆盖</strong>：let/let mut、算术与比较运算、print、if/else、while、函数定义与调用（含递归 fib 验证）、return</li>\n<li>行为对照测试：<code>tests/vm_check.intent</code>（while 累加 + 递归 fib + if/else），CI 步骤「VM 与解释器行为对照」逐字节 diff</li>\n<li><strong>M11（下一步）</strong>：闭包/管道/match/Result/契约/with/生成器——按 LangForge 无人值守闭环逐轮扩展</li>\n<li>途中修复：Resolver 的 for-iterable 作用域深度错标（普通变量作 iterable 时 NameError，range() 因内置 fallback 掩盖）；单文件入口的 <code>sys.modules[&#x27;mini_intent&#x27;]</code> 注册（防辅助模块重新加载出第二套类定义）</li>\n</ul>\n<hr>\n<h2 id=\"八明确的不做清单反膨胀防线\">八、明确的「不做」清单（反膨胀防线）</h2>\n<table><thead><tr><th>不做</th><th>理由</th></tr></thead><tbody><tr><td>JIT / 字节码编译</td><td>树遍历解释器的使命是「清晰」不是「快」。性能优化留给未来的 C# 移植版</td></tr><tr><td>完整的静态类型推断</td><td>违反「代码即意图」：推断让类型藏起来。契约 + 标注已经够</td></tr><tr><td>pip 级版本求解器</td><td>复杂性瘟疫。V0.1 本地优先，约束冲突人工裁决</td></tr><tr><td>宏系统</td><td>match + 装饰器 + 管道已覆盖 99% 场景，宏打开的是不可读性地狱</td></tr><tr><td>panic/recover</td><td>违反「错误是另一种正常」</td></tr><tr><td>多后端（LLVM/WASM）</td><td>生态没起来前，多后端是多份维护噩梦</td></tr><tr><td>运算符重载扩展到全部魔术方法</td><td>Python 的 <code>__add__</code> 家族是过度设计，保留当前核心运算符即可</td></tr><tr><td>bf2py.py / zh2py.py</td><td>Dynamo 时代历史玩具，与语言无关，建议归档到 <code>attic/</code></td></tr></tbody></table>\n<hr>\n<h2 id=\"九执行顺序与工作量人日\">九、执行顺序与工作量（人日）</h2>\n<table><thead><tr><th>阶段</th><th>项目</th><th>工作量</th><th>累计</th></tr></thead><tbody><tr><td>P0.1</td><td>调用栈与错误诊断</td><td>3</td><td>3</td></tr><tr><td>P0.2</td><td>测试框架</td><td>3</td><td>6</td></tr><tr><td>P0.3</td><td>spec.md</td><td>2</td><td>8</td></tr><tr><td>P0.4</td><td>CLI 现代化</td><td>1</td><td>9</td></tr><tr><td>P1.1</td><td>with 语句</td><td>1</td><td>10</td></tr><tr><td>P1.2</td><td>字符串（f-string/多行）</td><td>2</td><td>12</td></tr><tr><td>P1.3a</td><td>类型别名 + Union</td><td>2</td><td>14</td></tr><tr><td>P1.3b</td><td>泛型约束</td><td>3</td><td>17</td></tr><tr><td>P1.4</td><td>异常层级 + catch 类型</td><td>2</td><td>19</td></tr><tr><td>P2.1</td><td>包管理 V0.1</td><td>4</td><td>23</td></tr><tr><td>P2.2</td><td>formatter</td><td>3</td><td>26</td></tr><tr><td>P2.5</td><td>CI + 发布流程</td><td>1</td><td>27</td></tr><tr><td>P3.1a</td><td>re + datetime + itertools + collections</td><td>6</td><td>33</td></tr><tr><td>P3.1b</td><td>csv + sqlite3 + functools + http</td><td>8</td><td>41</td></tr><tr><td>P2.3/P2.4</td><td>linter + doc 生成</td><td>5</td><td>46</td></tr><tr><td>P1.5/P3.2</td><td>yield from + 并发模型</td><td>10</td><td>56</td></tr></tbody></table>\n<p><strong>27 人日（P0+P1+P2 核心）后，Intent 达到「可认真当生产力工具介绍给外人」的门槛。</strong> 前 9 人日（整个 P0）优先做——那是所有后续工作的地基。</p>\n<hr>\n<h2 id=\"十与长期战略的衔接\">十、与长期战略的衔接</h2>\n<ol>\n<li><strong>每个新特性 = 书稿新素材</strong>：8 章之后还有第 9-14 章的选题已经摆在路上——with（向死而生块级版）、Union（不二法门推广）、结构化并发（生死声明处）、包管理（万物一体的基础设施）。语言演进与内容 IP 是同一条生产线</li>\n<li><strong>契约引擎是独立产品线</strong>：<code>contract_skill/</code> 持续演进为 LLM 编程助手的「意图验证层」——这是最快可能圈外变现的资产，与语言演进解耦、双线并进</li>\n<li><strong>BIM 库保持特区地位</strong>：管道路由等 8 模块不追通用化，保持可直接移植 C# 的纯净度——它是「圈内能力圈外化」的桥，不是语言的包袱</li>\n</ol>\n<hr>\n<p><em>「不是先有一个『编程语言』的本质再去实现它。路线图不是命运，是当前的觉知——随时可以格它。」</em></p>", "text": "Intent 完善路线图 — 对标 Python 生态的系统性升级方案 心学为体，禅道为翼，马哲为用 定位： 意图清晰的通用编程语言 。BIM 是特色战场，不是天花板。 本文档是所有语言改进的唯一裁决依据。任何新特性提案，先过「设计宪法」，再进路线图。 一、设计宪法（不可违背的六条） 从《用代码学哲学》8 章提炼。每条宪法是过滤一切特性提案的筛子——通不过的，不做。 # 宪法 来源 含义 1 声明即存在 心即理（第1章） let 默认不可变；可变必须显式 mut 。不许倒退成 Python 式默认可变 2 代码即意图 心即理 语法必须让意图裸露。禁止为性能/便利引入隐藏行为（隐式转换、隐式类型提升） 3 一切皆表达式 第1章 if/match/try/for 都是表达式。新控制流不允许出现&quot;不产生值的语句&quot; 4 错误是另一种正常 烦恼即菩提（第5章） Result&lt;T,E&gt; + ? 是一等错误通道。异常机制只用于真正的契约违反 5 知行合一 第2章 ` 6 可验证的良知 实事求是（第4章） requires/ensures 是语言级契约，运行时强制验证。这是 Intent 区别于一切语言的身份证，任何重构不许削弱它 宪法执行方式 ：每个特性提案必须附带「哲学映射」一节，说明它强化了哪条宪法、削弱了哪条。只强化不削弱的才进 Phase 1+。 二、现状盘点：Intent v1.2.0 vs Python 3.12 2.1 能力矩阵 板块 Python Intent 现状 差距判定 词法/语法/解释器 全链路 全链路（Lexer→Parser→Resolver→树遍历，9435 行） ✅ 对等 基础语法 let/def/class/if/for/while/with let/let mut/def/class/if/match/for/while/defer ✅ 对等（无 with，defer 部分覆盖） 不可变默认 无（默认可变） let 默认不可变 ⬆️ 超越 模式匹配 match（3.10+） match（范围/解构/guard/穷举检查） ✅ 对等 管道 无（函数嵌套） ` &gt;` 管道 契约 无（icontract 等第三方） requires/ensures 运行时验证 ⬆️ 核心特色 错误处理 Exception + raise Result&lt;T,E&gt; + ? + try/catch/finally ✅ 对等（堆栈追踪缺失） 闭包/生成器 完整 闭包 ✅ / yield ✅ 🔶 缺 yield from / send 面向对象 完整（协议/描述符/metaclass） class/继承/覆盖/enum/运算符重载 🔶 缺接口协议、属性描述符 类型系统 动态 + 渐进类型（mypy） 纯运行时动态类型；函数级泛型参数替换 🔶 无静态检查、无类型别名/Union 并发 threading/asyncio/multiprocessing 零 ❌ 完全缺失 标准库 200+ 模块 19 模块（通用 10 + BIM 8），70+ 内置函数 ❌ 缺网络/数据/正则/算法库 包管理 pip + PyPI + venv 无。import 仅相对路径/std 目录 ❌ 完全缺失 测试框架 unittest/pytest 无（靠 examples/ 手动跑） ❌ 完全缺失 Formatter black 无 ❌ Linter ruff/flake8 无 ❌ LSP/IDE 完整生态 无 ❌ 文档生成 Sphinx 无（docstring 未定义语法） ❌ 语言规范 PEP + 参考手册 无正式 spec（散见于 8 章书稿） ❌ 调用栈追踪 traceback 只有 Python 层 traceback，无 Intent 级栈 ❌ 2.2 已有资产（升级的基石，不许推倒重来） 解释器全链路 ：Lexer/Parser/Resolver/Interpreter 四件套，作用域解析正确（闭包安全），模块系统带循环依赖检测 契约引擎双形态 ：语言内 requires/ensures + 语言无关的 contract_skill/intent_contract.py （可嵌入 LLM 编程助手） 哲学资产 ：8 章书稿 + philosophy/mapping.json + philosophy_mapper.md——这是竞品抄不走的护城河 BIM 标准库 ：8 模块 ~1700 行，管道 A* 路由可直接移植 C# 泛型参数替换机制 ： identity&lt;T&gt;(x: T) -&gt; T 已能工作，是类型系统的种子 三、路线图总览：四个 Phase Phase 0 地基加固 ──── 错误堆栈 / CLI / 语言规范 / 测试框架 （一切的前提） Phase 1 语言内核 ──── 语法补全 / 类型系统 / 错误处理深化 （编程体验） Phase 2 生态基建 ──── 包管理 / formatter / linter / 文档生成 （可用性） Phase 3 标准库+并发 ─ 高频库扩张 / 并发模型 / LSP （通用性） 排序逻辑 ：先让语言「可调试、可测试、可描述」（P0），再补「写得舒服」（P1），再建「生态循环」（P2），最后扩「能力边界」（P3）。Python 的胜利不是语法胜利，是生态胜利——但 Intent 现在连 spec 都没有，谈生态是空中楼阁。 四、Phase 0：地基加固 目标：让 Intent 从「能跑的 Demo」变成「可维护的语言」。 实施进度 ：P0.1 ✅｜P0.2 ✅｜P0.3 ✅｜P0.4 ✅｜P1.1~P1.5 ✅｜P2.1 ✅｜P2.2 ✅（2026-10-16）｜ P2.5 CI → 下一步 4.1 Intent 级调用栈与错误诊断 【P0】✅ 已完成 缺口 ：现在函数内出错只抛 Python 异常，用户看到的是 mini_intent.py line 5649 ，看不到 Intent 调用链。 方案 ： Interpreter 维护 call_stack: List[Frame] （函数名/行号/列号/源文件），execute_function 出入栈 运行时错误统一包装为 IntentError ，携带：错误类型、消息、Intent 源位置、调用栈快照 CLI 层渲染：源码行 + ^ 光标 + 调用链，对齐 Python traceback 的信息密度 契约违反用专属子类 ContractViolation(requires/ensures 哪个条款、实际值、期望条件) ——契约是身份证，错误信息必须第一个被看见 哲学映射 ：致良知——良知不是感觉，是可检验的条件。错误信息是把「检验失败」精确指认给当事人。 验收 ：任意深层嵌套调用出错，输出含完整 Intent 调用链与出错行高亮。 实施记录（2026-10-16） ：4 处改动—— mini_intent.py 新增 IntentError / ContractViolation / CallFrame （异常体系与栈帧） execute_function / _execute_method 包装为薄壳：入栈→委托 inner→异常穿帧时快照调用链→finally 出栈（不逐处改 raise 点，反膨胀） 契约违反从「静默失败」升级为抛 ContractViolation （携带违约条款/期望/实际） CLI 新增 wrap_intent_error + render_intent_error ：错误消息+源码行光标+调用链从外到内+退出码规范（0/1/2） 实测效果： ❌ 契约违反: 契约违约(requires): 前置条件1失败: b != 0.0 — 函数 safe_divide 拒绝执行 at tests/t_contract_violation.intent:3:22 3 | requires b != 0.0 ^ 调用链(从外到内): main (tests/t_contract_violation.intent:13) compute (tests/t_contract_violation.intent:14) safe_divide (tests/t_contract_violation.intent:10) 回归：13/14 examples 通过；唯一失败的 demo.intent 为遗留 lambda 参数语法问题（旧代码同样失败），记入 P1 待办。 4.2 测试框架 intent test 【P0】 缺口 ：19 个模块、9435 行解释器，零自动化测试。regression 靠人肉。 方案 ： 语法： test &quot;名称&quot; { assert expr; } 块，或复用 contract.intent 的 assert 体系 CLI： python src/mini_intent.py --test [path] 收集 tests/**/*.intent ，报告通过/失败/断言详情 断言失败时带契约上下文（哪个 requires 没满足） 第一批用例：每个语言特性一个测试文件（复用现有 _t_*.intent 调试文件，它们本来就是回归测试的雏形） 哲学映射 ：实践是检验真理的唯一标准——测试就是把「真理」变成可重复执行的实践。 验收 ：一条命令跑完全部回归；CI 能挂。 实施记录（2026-10-16） ：零语法侵入方案—— 约定：测试文件中 def test_xxx() 函数即用例； assert cond, &quot;msg&quot;; 为断言语句（ 无括号 ，assert 是关键字语句）；每个测试文件独立 Interpreter 保证状态隔离 CLI： python src/mini_intent.py --test [path] （默认 tests/ ， _ 开头文件跳过） 断言失败复用 P0.1 的错误渲染（源码位置+调用链），退出码 0/1/2 测试模式严格 ：parser.errors 非零即失败（文件模式仍是宽松模式，见待办 T3） 成果 ： tests/ 8 个测试文件 33 个用例全绿；examples 29/29 回归通过。 测试框架即先知——首轮就抓出 1 个真 bug + 3 个文档/实现不一致 ： # 发现 处理 B1 DictValue 相等性 bug ： {&quot;x&quot;:1} == {&quot;x&quot;:1} 恒 false（dataclass 空字段 eq 陷阱， _t_dict_eq 只 print 不 assert 所以藏了 3 个月） ✅ 已修：Dict 比较改为逐项递归（与 List 同策略） T1 match range 模式 90..100 未实现 （philosophy_mapper.md 文档超前） 测试暂用 if guard ；实现记入 P1 T2 class 继承实际语法是 class Dog &lt; Animal ，mapper 文档写的是 class B : A （错） 测试已按实现写； 修文档记入 P0.3 T3 Result 无成员方法路由， r.unwrap() / r.is_ok 不通 ✅ 已修：MemberAccess+CallExpr 加 ResultValue 分支 T4 文件模式宽松执行：语法错误只警告不阻断，退出码 0（假通过） 记入 P0.4： --check 严格模式 4.3 语言规范文档 spec.md 【P0】 缺口 ：现在「Intent 是什么」散落在 8 章书稿（教学视角）和 9435 行实现（权威视角）里，没有正式的规范。 方案 ： docs/spec.md ：词法（关键字/字面量/运算符全表）→ 语法（每个构造的 EBNF + 语义）→ 类型系统规则 → 标准库 API 签名 规范从 实现提取 而非凭空写：每个条目标注对应源码位置，保证 spec 与实现不漂移 这是以后写编译器/移植 C#/给社区贡献的锚点 验收 ：新人只读 spec.md + 8 章书稿，能正确写出任何合法 Intent 程序。 实施记录（2026-10-16） ： 产出 docs/spec.md （v1.2.0）：词法全表→类型系统→语法（每构造标注源码锚点）→标准库 API→CLI→已知限制诚实清单→文档勘误记录 规范从实现反向提取，并用脚本实证每个关键字的真实支持度： 零分支预留关键字 func / invariant / is / from ； var / const 实为 let 别名； pure / effect 仅记录不强制；位运算/复合赋值/ := / ++ / -- 词法接受语义未实现 修正 philosophy_mapper.md 三处文档错误 ：class 继承 : → &lt; 、类内方法 }; → } 、match range 改 guard 形式并注明未实现 新增 tests/test_pipe.intent （2 用例）——spec 声明的每个能力都应有测试背书，全量 35/35 通过 4.4 CLI 现代化 【P1】 现状 ：argparse 已有 run/tokens/ast/repl/demo/philosophy。 补齐 ： -c &quot;code&quot; 直接执行代码串（对齐 Python -c ） --emit ast|tokens 输出到文件而非 stdout --version / --check （只解析不执行，做 lint 前置） 退出码规范：0 成功 / 1 运行时错误 / 2 用法错误（CI 依赖这个） 实施记录（2026-10-16） ： 新增 -c （直接执行）、 --version 、 --check （只解析，治宽松假通过）、 --emit tokens|ast FILE （分析结果写文件） parse_known_args ：源文件后的额外参数透传——新增 args() 内置（程序与世界的接口）， Intent 从此能写命令行工具 （philosophy_mapper.intent 立即受益，从跑不通到完整工作） 顺手修复 demo 代码 let i → let mut i （不可变变量做循环计数器，演示门面居然是坏的） 全量回归：tests 35/35、examples 30/30、demo/repl 冒烟全过 五、Phase 1：语言内核补全 目标：对齐 Python 的「写得舒服」，且每项都有哲学加成。 实施进度（2026-10-16 全部完成） ：P1.1 with ✅｜P1.2 f-string/多行 ✅｜P1.3a 类型别名+Union ✅｜P1.3b 泛型约束 ✅｜P1.4 异常层级 ✅｜P1.5 yield from ✅。全量 61/61 测试通过，examples 30/30，demo/repl 正常。测试 61 个（较 P0 末的 35 个新增 26 个 P1 用例）。 实施记录 ： P1.1 with ： with expr as x { body } ，块退出自动调 close() ——defer 的块级特化（3 用例） P1.2 字符串 ： f&quot;...&quot; 前缀（显式插值宣告）+ &quot;&quot;&quot; 三引号多行（4 用例）；顺带发现并修复 in 右侧不支持 String 的真缺口（子串归属） P1.3a 类型系统 ： type X = ... 软关键字别名 + A | B Union（6 用例）。软关键字模式： type(x) 函数调用不受影响。 发现并记载设计规则 ：Int 标注接受 Float 是刻意的数值互通（非 bug） P1.3b 泛型约束 ： T: Comparable ，违约抛 ContractError 走契约错误通道（3 用例） P1.4 异常层级 ：ErrorValue 一等错误值（.type/.message/.stack）+ catch e: ContractError 类型分流，不匹配继续传播（5 用例） P1.5 yield from ：生成器委派转发，支持 List/Dict 键（5 用例） 5.1 with 语句 —— 资源作用域 【P1】 Python 参照 ： with open(f) as fh: 自动管理资源生命周期。 Intent 缺口 ：有 defer （函数级、逆序、无条件）但没有块级作用域资源管理。 设计 ： with open(&quot;data.txt&quot;) as fh { let content = fh.read_all(); }; // 作用域结束自动 close —— defer 在块级的具体化 设计思路 ： defer 是「功成身退」的函数级表达， with 是它的块级特化——资源获取（open）与释放（close）在同一个可见的花括号内对称出现，比 defer 更直观。两者共存：defer 管函数级清理，with 管块级资源。 哲学映射 ：向死而生——获取资源的那一刻，释放它的代码已经在等待。 5.2 字符串能力补齐 【P1】 缺口 （对照 Python str）：f-string 插值、多行字符串、split/join 的完整语义（已有部分内置函数）。 设计 ： let name = &quot;Intent&quot;; let greeting = f&quot;你好，{name}，版本 {version()}&quot;; // f-string let poem = &quot;&quot;&quot;心学为体 禅道为翼 马哲为用&quot;&quot;&quot;; // 多行字符串 设计思路 ：f-string 让「模板与数据在同一行相见」——心即理：你写下的字面与变量名，就是意图本身，不需要 .format() 这种间接层。 优先级说明 ：词法层改动小（ f&quot;...&quot; 前缀 + &quot;&quot;&quot; 三引号），解释器加一个字符串插值求值，投入产出比高。 5.3 类型系统深化 【P1，最重要】 缺口 ：现在是纯运行时动态类型（无静态推断—— grep infer 零命中）。函数级泛型有参数替换但无约束。 分三步走，不许一步到位 （反膨胀）： Step 1 — 类型别名与 Union（语法层，1-2 天） ： type Meters = Float; type Shape = Circle | Square; // Union：一个东西的多种存在形态 Union 的哲学： 不二法门 的推广——enum 是「封闭的几种」，Union 是「开放的几种」。 Step 2 — 泛型约束（复用已有替换机制，2-3 天） ： def max_of&lt;T: Comparable&gt;(items: List&lt;T&gt;): T { ... }; 约束在调用点检查，违反报契约级错误（Comparable 不是可比较的 → 这不是类型错误，是 契约违反 ，复用现有错误通道）。 Step 3 — 可选静态检查器（独立工具，Phase 2） ： 不做完整类型推断（那是 mypy 级别的工程）。做一个 契约驱动的轻量检查器 ：利用已有的 requires/ensures 和类型标注，做「声明一致性」检查——参数个数、标注类型与实参的明显不匹配、match 穷举性。Resolver 已经有语义分析遍的骨架，扩它。 设计原则 ：Intent 的类型策略是「契约优先，类型其次」——静态检查永远服务于契约验证，不追求图灵完备的类型理论。 5.4 错误处理深化 【P1】 缺口 ：Result/? / try/catch/finally 已有。缺： 异常层级 ：定义内置异常树（ ContractError / ValueError / IndexError ...）， catch 支持按类型捕获： catch e: ContractError { ... } 错误上下文 ：catch 块内可访问 e.message / e.stack （来自 4.1 的调用栈） panic/recover ： 不做 ——与「错误是另一种正常」冲突。不可恢复错误用 ensures 表达。 try { let r = risky()?; // Err 自然传播，不恐慌 } catch e: ContractError { // 契约违反：这不是程序的错，是调用方式错了 print(&quot;合同违约：&quot;, e.message); } finally { cleanup(); }; 哲学映射 ：烦恼即菩提——catch 按类型分流，就是「认识你的烦恼是什么种类，然后对症转化」。 5.5 生成器补全 【P2】 缺口 ：有 yield，缺 yield from （委派）和生成器 send / close 协议。 方案 ： yield from 实现简单（解释器层转发）； send 需要双向通道，与并发模型的 channel 天然衔接——放 Phase 3 与并发一起做。 六、Phase 2：生态基建 目标：让 Intent 从「一个人的语言」变成「可协作的语言」。Python 赢在生态，不赢在语法。 实施进度 ：P2.1 ✅｜P2.2 ✅｜P2.3 ✅｜P2.4 ✅｜P2.5 ✅（均 2026-10-16）｜ Phase 2 收官 → P3 标准库与并发 v2.0.0 里程碑：P0（4 项）+ P1（6 项）+ P2（5 项）共 15 个课题完成；61 测试；81 文件全过 check/lint/doc；CI 五步（check/test/lint/doc/fmt 幂等）。 6.2 Formatter intent fmt 【P1】✅ 已完成 实施记录（2026-10-16） ： token 流重排不动语义：4 空格缩进、K&amp;R 花括号、 ; /match 分支 , 换行、二元运算符两侧空格、 : 前紧贴后空格、管道/ =&gt; 两侧空格 Lexer 加 keep_comments 开关（Parser 路径零影响）：注释产 COMMENT token—— 代码的哲学注释是灵魂，formatter 不许丢 Token 加 is_fstring 标记：formatter 还原 f&quot;...&quot; 前缀与字符串引号（Lexer 原本剥掉） 幂等验证通过；真实文件（lesson_01/std.str）格式化后 --check 全过 顺手修两个输出污染：banner 与 pyreadline 提示改为仅 TTY/stderr 显示（ --fmt &gt; file 管道纯净） 已知限制（诚实记录）：不补缺失分号（保守不动语义）、80 列不断行、无可配置项（gofmt 哲学） 6.1 包管理 【P1，生态第一优先级】✅ 已完成 实施记录（2026-10-16） ： intent.toml 清单（tomllib 解析）： [project] name/version + [deps] （git url / 本地路径） --install &lt;url&gt; 单个安装 / --install 无参按清单批量（本地复制、git pull 更新、clone --depth 1） 启动时注入 ./lib 与 ~/.intent/lib （全局库）到模块搜索路径 模块查找加第三种候选 &lt;name&gt;/&lt;name&gt;.intent （npm 风格，git 仓库开箱即用） 顺手补实现了从未存在的 export 语句 （spec 里那条是从 README 抄的未验证条目——ExportStmt 是孤儿 AST，Lexer 连 export 关键字都没有）。现在 export a, b; 显式声明模块边界，无声明维持全量导出（兼容） 测试 runner 补上模块搜索路径注入（fixture 从任意 cwd 可跑） 全量 61/61 + fixture 2/2 通过 仍然不做 ：版本求解器、注册表（出现 3+ 真实第三方需求再做）。 6.1 包管理 【P1，生态第一优先级】 设计 （刻意最小化，反 pip 膨胀）： project/ intent.toml # [project] name/version + [deps] 名称 = &quot;版本约束&quot; src/ tests/ 三件套，分两期 ： V0.1（本地优先，无注册表） ： intent.toml 声明 + import 支持从 ./lib 、 ~/.intent/lib 解析 + intent install &lt;git-url&gt; 克隆到本地 lib。 不碰版本求解器 ——约束只支持 = 和 &gt;= ，冲突了直接报错让人工裁决 V0.2（注册表） ：只有当出现 3 个以上真实第三方包需求再做。注册表先做静态文件托管（GitHub Pages + JSON 索引），不做 PyPI 级基础设施 哲学映射 ：天地与我并生（第7章）——包管理是「万物一体」的基础设施：你的代码与世界连接。但连接贵在 简单可信 ，版本求解器是复杂性瘟疫，V0.1 刻意不治。 6.2 Formatter intent fmt 【P1】 设计 ：token 流重排，不动 AST 语义。规则刻意少：4 空格缩进、80 列、 ; 保留（Intent 的分号是「一句话说完了」的句号，有哲学含义不删）、行尾注释对齐。 不追求配置化 ——gofmt 的成功就在于没有配置。 哲学映射 ：大道不称——格式不该是个人品味，是语言的默认秩序。你不需要选择，秩序本自存在。 6.3 Linter intent lint 【P2】✅ 已完成 实施记录（2026-10-16） ：AST 静态检查不执行，四条规则对应四条哲学： E1 let 常量被重新赋值（不可变是默认）—— 作用域敏感 ：块内 let 不出块、方法间同名互不相干（初版按函数分组误报，重写为域栈递归下降） W1 空 catch 块（沉默的 catch 比没有 catch 更糟） I1 顶层函数无契约（契约是身份证） W2 import 未使用（不带多余的东西上路） 分级 E/W/I，有 E 退出 1；全量 81 文件 0 错误级。 又抓出 3 个宽松模式掩盖的真问题 （BIM 库 let 后改值，执行时会炸只是没被调用）。 原设计中的「let mut 从未被赋值」规则暂缓（误报率高，收益低）。 6.4 文档生成 intent doc 【P2】✅ 已完成 实施记录（2026-10-16） ： --doc 从函数签名 + 上方注释块 + 契约生成 markdown（ _unparse 表达式反打印， ensures result &gt;= 0 而非 AST repr）；类输出方法列表。全量 81 文件生成不崩。 docstring 语法未新增 spec（ /// / &quot;&quot;&quot; 二选一的决策推迟到有真实需求）；当前用函数上方 // 注释块作文档——注释即文档，不发明第二套。 6.5 CI 与发布 【P1】✅ 已完成 实施记录（2026-10-16） ： .github/workflows/ci.yml ：push/PR 触发，五步——全文件 --check （81 个文件严格模式）+ --test + --lint （0 错误级）+ --doc （全文件不崩）+ formatter 幂等抽查 CI 前置清理：修掉宽松模式掩盖的 3 个脏文件（lesson_03 字符串嵌引号、lesson_05 catch { 、std/contract.intent 关键字撞名死函数）， 重写 demo.intent （原文件调用一堆从未实现的标准库函数，是「幻想文档」；现为 8 特性真实门面） 版本 v1.2.0 → v2.0.0 （契约违约行为破坏性变更）；CHANGELOG.md 记录全history 本地模拟 CI 三步全过；tests 61/61；全部 81 个 .intent 文件通过严格语法检查 GitHub Actions：push 跑 intent test （Phase 0.2）+ intent check （6.3） 版本语义：语义化版本 + CHANGELOG.md，每次发布附「新增特性的哲学映射」—— 发布说明就是书稿的连载 。这条对内容 IP 战略有直接价值 七、Phase 3：标准库扩张与并发 7.1 标准库优先级（按「通用语言必备度」排序） 优先级 模块 内容 理由 P1 re 正则 匹配/替换/切分/编译 Python 生态基石，文本处理绕不开 P1 datetime 日期运算/格式化/时区 time.intent 只有时间戳，业务代码天天要 P1 itertools permutations/combinations/product/chain 组合爆炸的穷举——「格物」的基础设施 P1 collections deque/Counter/defaultdict/namedtuple 数据结构全家桶，Python 日用好物 P2 csv 读写（对齐 Python csv 模块） BIM 数据导出/导入刚需 P2 sqlite3 嵌入式数据库绑定 阿J 的地球OL/DynoManager 都是 SQLite，自建语言不吃自己的库说不过去 P2 functools partial/compose/lru_cache compose 与管道 ` P2 http client GET/POST/JSON 通用语言的门票；LLM API 调用靠它 P3 struct / base64 二进制/编码 BIM 文件处理 P3 heapq / bisect 算法库 管道路由 A* 已内联在 bim 模块，通用化提取 P3 threading / queue 线程安全队列 与 7.2 并发模型一起 每加一个模块的纪律 ：模块必须带 requires/ensures 契约；必须进 spec.md；必须配测试。标准库是语言的样板戏——标准库自己违约，契约宪法就是笑话。 实施进度（2026-10-16） ：itertools ✅｜collections ✅｜re/datetime → 下一步。 itertools 落地为 chain/zip_longest/cycle/enumerate/flatten/unique/chunk/groupby/count_where（permutations/combinations/product 留待真实需求——反膨胀，先交付「日常 80%」）。 collections 落地为 counter/most_common + Stack/Queue 类（deque/defaultdict/namedtuple 缓议）。 过程中修掉 3 个解释器真 bug ： x? == v 的 TryExpr/三元歧义（panic mode 吞 ? ）、 RuntimeValue.copy 漏子类（dict 传参即崩，第 9 个真 bug）、dict 键形态分裂（get/set/has_key 归一 _norm_key ，第 8 个）。测试 61→76。 7.2 并发模型 【P2，最后做】 为什么最后 ：树遍历解释器加并发是伤筋动骨的手术，语法、运行时、标准库三线联动。放在生态基建之后，且必须想清楚哲学定位。 三个候选，按哲学契合度 ： 方案 机制 哲学契合 成本 A. Channel + goroutine spawn f() + ch &lt;- v / &lt;- ch ⭐⭐⭐ 「知行合一」的时空分离：发送者与接收者各自节奏，数据在中间相遇 高（调度器） B. async/await async fn + await ⭐⭐ 与管道流式天然合，但关键字抄袭 Python，无哲学加成 中 C. 结构化并发 scope { spawn ...; } 作用域结束自动 join ⭐⭐⭐ 「向死而生」：并发任务的生命周期在创建时就被限定 中高 推荐 C 的结构化并发 + A 的 channel 通信 ： spawn 出来的任务必须挂在某个作用域上，作用域退出时等待/取消——这符合 Intent 的「声明即存在」宪法：任务的生与死都在声明处可见。channel 作为唯一通信原语（不共享内存）。 Step 1 最小切片 ：解释器内嵌 Python threading 实现 spawn + 线程安全 channel，只做演示级；Step 2 再考虑协程调度器。 验收 ：能写生产者-消费者管道： data |&gt; producer |&gt; consumer 的并发版。 七点五、Phase 4：字节码编译器（M10 ✅ 2026-10-17） 语言分两阶段：先让它能跑（树遍历解释器），再让它跑得快（字节码 + VM）。 AST 是意，字节码是言——言不尽意，但言可执行。 实施记录（2026-10-16/17） ： src/intent_bytecode.py ：指令集 20 条 + Emitter（AST → 指令，跳转回填）+ 栈式 VM（值栈 + 调用帧 + 100 万步熔断） CLI： --compile file [--run-vm] ；编译元信息走 stderr、程序输出走 stdout——与解释器 stdout 可直接 diff M10 V0.1 覆盖 ：let/let mut、算术与比较运算、print、if/else、while、函数定义与调用（含递归 fib 验证）、return 行为对照测试： tests/vm_check.intent （while 累加 + 递归 fib + if/else），CI 步骤「VM 与解释器行为对照」逐字节 diff M11（下一步） ：闭包/管道/match/Result/契约/with/生成器——按 LangForge 无人值守闭环逐轮扩展 途中修复：Resolver 的 for-iterable 作用域深度错标（普通变量作 iterable 时 NameError，range() 因内置 fallback 掩盖）；单文件入口的 sys.modules[&#x27;mini_intent&#x27;] 注册（防辅助模块重新加载出第二套类定义） 八、明确的「不做」清单（反膨胀防线） 不做 理由 JIT / 字节码编译 树遍历解释器的使命是「清晰」不是「快」。性能优化留给未来的 C# 移植版 完整的静态类型推断 违反「代码即意图」：推断让类型藏起来。契约 + 标注已经够 pip 级版本求解器 复杂性瘟疫。V0.1 本地优先，约束冲突人工裁决 宏系统 match + 装饰器 + 管道已覆盖 99% 场景，宏打开的是不可读性地狱 panic/recover 违反「错误是另一种正常」 多后端（LLVM/WASM） 生态没起来前，多后端是多份维护噩梦 运算符重载扩展到全部魔术方法 Python 的 __add__ 家族是过度设计，保留当前核心运算符即可 bf2py.py / zh2py.py Dynamo 时代历史玩具，与语言无关，建议归档到 attic/ 九、执行顺序与工作量（人日） 阶段 项目 工作量 累计 P0.1 调用栈与错误诊断 3 3 P0.2 测试框架 3 6 P0.3 spec.md 2 8 P0.4 CLI 现代化 1 9 P1.1 with 语句 1 10 P1.2 字符串（f-string/多行） 2 12 P1.3a 类型别名 + Union 2 14 P1.3b 泛型约束 3 17 P1.4 异常层级 + catch 类型 2 19 P2.1 包管理 V0.1 4 23 P2.2 formatter 3 26 P2.5 CI + 发布流程 1 27 P3.1a re + datetime + itertools + collections 6 33 P3.1b csv + sqlite3 + functools + http 8 41 P2.3/P2.4 linter + doc 生成 5 46 P1.5/P3.2 yield from + 并发模型 10 56 27 人日（P0+P1+P2 核心）后，Intent 达到「可认真当生产力工具介绍给外人」的门槛。 前 9 人日（整个 P0）优先做——那是所有后续工作的地基。 十、与长期战略的衔接 每个新特性 = 书稿新素材 ：8 章之后还有第 9-14 章的选题已经摆在路上——with（向死而生块级版）、Union（不二法门推广）、结构化并发（生死声明处）、包管理（万物一体的基础设施）。语言演进与内容 IP 是同一条生产线 契约引擎是独立产品线 ： contract_skill/ 持续演进为 LLM 编程助手的「意图验证层」——这是最快可能圈外变现的资产，与语言演进解耦、双线并进 BIM 库保持特区地位 ：管道路由等 8 模块不追通用化，保持可直接移植 C# 的纯净度——它是「圈内能力圈外化」的桥，不是语言的包袱 「不是先有一个『编程语言』的本质再去实现它。路线图不是命运，是当前的觉知——随时可以格它。」"}, {"id": "book_outline.md", "title": "《用代码学哲学》— 书稿框架", "group": "规范", "html": "<h1 id=\"用代码学哲学-书稿框架\">《用代码学哲学》— 书稿框架</h1>\n<blockquote>作者：阿J（J-intent）\n语言：Intent v1.2\n哲学框架：心学为体 · 禅道为翼 · 马哲为用</blockquote>\n<hr>\n<h2 id=\"前言代码是思维的镜子\">前言：代码是思维的镜子</h2>\n<blockquote>📖 完整章节：<a href=\"./chapter_01_wuwei.md\">第1章</a> · <a href=\"./chapter_02_zhixing.md\">第2章</a> · <a href=\"./chapter_03_gewu.md\">第3章</a> · <a href=\"./chapter_04_contract.md\">第4章</a> · <a href=\"./chapter_05_bodhi.md\">第5章</a> · <a href=\"./chapter_06_dialectic.md\">第6章</a> · <a href=\"./chapter_07_ecosystem.md\">第7章</a> · <a href=\"./chapter_08_finitude.md\">第8章</a></blockquote>\n<h3 id=\"为什么编程能教哲学\">为什么编程能教哲学？</h3>\n<p>当你写 <code>let x = 10</code> 时，你在做一个哲学断言：&quot;x 是 10&quot;。当你写 <code>let mut x = 10</code> 时，你在宣告：&quot;我承认我在改变世界&quot;。编程语言的每一个语法设计都不是中立的——它携带了一套世界观。</p>\n<p>Intent 是刻意按这套世界观设计的语言。学 Intent 不是学&quot;又一种编程语言&quot;，而是<strong>用精确形式重新思考你与世界的关系</strong>。</p>\n<h3 id=\"这本书怎么读\">这本书怎么读？</h3>\n<ul>\n<li><strong>先跑代码</strong>：每章开头有一段可运行的 Intent 代码（<code>examples/lesson_XX_*.intent</code>），先跑一遍看输出</li>\n<li><strong>再读哲理解析</strong>：理解这段代码背后的哲学概念</li>\n<li><strong>然后自己改</strong>：每章末尾有&quot;进阶&quot;练习，改一行代码，看结果怎么变</li>\n</ul>\n<h3 id=\"前置条件\">前置条件</h3>\n<ul>\n<li>安装 Python 3.10+</li>\n<li><code>python3 src/mini_intent.py examples/lesson_01_wuwei.intent</code></li>\n<li>不需要任何编程基础——所有概念从零开始</li>\n</ul>\n<hr>\n<h2 id=\"第一部分本体论存在是什么\">第一部分：本体论——存在是什么？</h2>\n<h3 id=\"第1章无为之始-let-声明\">第1章：无为之始 → <code>let</code> 声明</h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_01_wuwei.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>王阳明&quot;心外无物&quot;——你声明的变量，才在你的世界中存在</li>\n<li>老子&quot;无为而无不为&quot;——<code>let</code> 默认不可变，不需要额外努力去&quot;保持不动&quot;</li>\n<li>道家的&quot;如如不动&quot;——变量的默认状态就是稳定的</li>\n</ul>\n<p><strong>代码概念</strong>：类型推断、<code>let</code> vs <code>let mut</code>、一切皆表达式</p>\n<p><strong>关键体验</strong>：你把所有 <code>let</code> 改成 <code>let mut</code> 再看一遍输出——感觉有何不同？</p>\n<hr>\n<h2 id=\"第二部分认识论我们如何知道\">第二部分：认识论——我们如何知道？</h2>\n<h3 id=\"第2章知行合一-管道\">第2章：知行合一 → <code>|&gt;</code> 管道</h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_02_zhixing.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>王阳明&quot;知行合一&quot;——知道一个函数存在（知）和实际调用它（行）应该是连续的</li>\n<li>庄子&quot;庖丁解牛&quot;——数据顺着纹理流过每个处理步骤</li>\n<li>管道不是语法糖——它改变了你的认知结构，从&quot;嵌套&quot;到&quot;流动&quot;</li>\n</ul>\n<p><strong>代码概念</strong>：<code>|&gt;</code> 管道、<code>def</code> 函数定义、Lambda</p>\n<p><strong>关键体验</strong>：用嵌套写法重写管道链，感受&quot;从里到外读&quot; vs &quot;从左到右读&quot;</p>\n<h3 id=\"第3章格物致知-match-穷举\">第3章：格物致知 → <code>match</code> 穷举</h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_03_gewu.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>朱熹&quot;格物致知&quot;——把每一个事物格透了，知识自然来</li>\n<li>马克思&quot;具体问题具体分析&quot;——不搞一刀切，每种情况单独处理</li>\n<li><code>match</code> 穷举性检查——你敢说&quot;全考虑了&quot;，编译器帮你验证</li>\n</ul>\n<p><strong>代码概念</strong>：<code>match</code> 表达式、<code>enum</code> 枚举、<code>if</code> 守卫</p>\n<p><strong>关键体验</strong>：删掉一个分支，看编译器怎么提醒你&quot;漏了&quot;</p>\n<hr>\n<h2 id=\"第三部分实践论我们如何行动\">第三部分：实践论——我们如何行动？</h2>\n<h3 id=\"第4章社会契约-requiresensures\">第4章：社会契约 → <code>requires/ensures</code></h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_04_contract.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>马克思&quot;人是社会关系的总和&quot;——每个函数活在社会关系中</li>\n<li>卢梭&quot;社会契约&quot;——进门前签合同（requires），出门前验货（ensures）</li>\n<li>王阳明&quot;致良知&quot;——良知不是感觉，是可验证的条件</li>\n</ul>\n<p><strong>代码概念</strong>：<code>requires</code> 前置条件、<code>ensures</code> 后置条件、<code>contract</code> 契约系统</p>\n<p><strong>关键体验</strong>：把 <code>b != 0</code> 改成 <code>b != 1</code>，看看调用 <code>safe_divide(10, 1)</code> 会不会报错</p>\n<h3 id=\"第5章烦恼即菩提-result\">第5章：烦恼即菩提 → <code>Result + ?</code></h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_05_bodhi.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>禅宗&quot;烦恼即菩提&quot;——错误不是要消灭的东西，是要认识的</li>\n<li>斯多葛&quot;控制你能控制的&quot;——区分&quot;我的事&quot;和&quot;不关我的事&quot;</li>\n<li><code>Result&lt;T,E&gt;</code>——Ok 和 Err 是平等的两支，不存在&quot;正常&quot;和&quot;异常&quot;的二分</li>\n</ul>\n<p><strong>代码概念</strong>：<code>Result&lt;T,E&gt;</code>、<code>?</code> 操作符、<code>try/catch/finally</code></p>\n<p><strong>关键体验</strong>：在 while 循环里放 try/catch，失败 3 次后继续——感受&quot;受伤 ≠ 死亡&quot;</p>\n<hr>\n<h2 id=\"第四部分辩证法事物如何发展\">第四部分：辩证法——事物如何发展？</h2>\n<h3 id=\"第6章辩证统一-class-继承\">第6章：辩证统一 → <code>class</code> 继承</h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_06_dialectic.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>黑格尔&quot;正题→反题→合题&quot;——发展不是线性的，是螺旋上升的</li>\n<li>马克思&quot;扬弃&quot;（Aufheben）——子类保留父类有用的，超越不够好的</li>\n<li>萨特&quot;存在先于本质&quot;——你的行动定义了你是什么</li>\n</ul>\n<p><strong>代码概念</strong>：<code>class</code> 系统、继承、方法覆盖</p>\n<p><strong>关键体验</strong>：给函数链加一个 <code>negate</code> 环节，体会&quot;否定不是消灭，是超越&quot;</p>\n<hr>\n<h2 id=\"第五部分系统论万物如何连接\">第五部分：系统论——万物如何连接？</h2>\n<h3 id=\"第7章万物一体-import-生态\">第7章：万物一体 → <code>import</code> 生态</h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_07_ecosystem.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>庄子&quot;天地与我并生，万物与我为一&quot;——你不需要自己造一切</li>\n<li>王阳明&quot;万物一体之仁&quot;——标准库在你诞生前已经存在</li>\n<li>你的工作不是发明，是组合——找到已有的模块，然后用管道串起来</li>\n</ul>\n<p><strong>代码概念</strong>：<code>import</code>/<code>export</code> 模块系统、列表/字典推导式、<code>range</code></p>\n<p><strong>关键体验</strong>：用 <code>range</code> + 推导式 + 管道做一次数据流处理</p>\n<h3 id=\"第8章向死而生-defer-闭包\">第8章：向死而生 → <code>defer + 闭包</code></h3>\n<p><strong>运行</strong>：<code>python3 src/mini_intent.py examples/lesson_08_finitude.intent</code></p>\n<p><strong>哲学核心</strong>：</p>\n<ul>\n<li>海德格尔&quot;向死而生&quot;——出生时就知道了死亡，反而让生命有意义</li>\n<li>道家&quot;功成身退&quot;——资源获取时就写下清理代码</li>\n<li>王阳明&quot;此心光明&quot;——闭包携带诞生时的环境，无论在哪儿心都是亮的</li>\n</ul>\n<p><strong>代码概念</strong>：<code>defer</code> 语句、闭包、<code>yield</code> 生成器</p>\n<p><strong>关键体验</strong>：写一个带 <code>defer</code> 的函数，中间故意提前 <code>return</code>，看 defer 是否还执行</p>\n<hr>\n<h2 id=\"附录\">附录</h2>\n<h3 id=\"a-intent-语法速查表\">A. Intent 语法速查表</h3>\n<table><thead><tr><th>语法</th><th>含义</th><th>哲学映射</th></tr></thead><tbody><tr><td><code>let x = 10</code></td><td>不可变声明</td><td>如如不动</td></tr><tr><td><code>let mut x = 10</code></td><td>可变声明</td><td>改变世界</td></tr><tr><td>`\\</td><td>&gt;`</td><td>管道</td></tr><tr><td><code>match x { ... }</code></td><td>模式匹配</td><td>格物致知</td></tr><tr><td><code>requires / ensures</code></td><td>契约</td><td>社会契约</td></tr><tr><td><code>Result&lt;T,E&gt;</code></td><td>结果类型</td><td>烦恼即菩提</td></tr><tr><td><code>?</code></td><td>错误传播</td><td>平常心</td></tr><tr><td><code>class / :</code></td><td>类/继承</td><td>扬弃</td></tr><tr><td><code>def / fn</code></td><td>函数/Lambda</td><td>功夫</td></tr><tr><td><code>import / export</code></td><td>模块</td><td>天地一体</td></tr><tr><td><code>defer { }</code></td><td>延迟执行</td><td>向死而生</td></tr><tr><td><code>yield expr</code></td><td>生成器</td><td>生生不息</td></tr></tbody></table>\n<h3 id=\"b-哲学概念-代码关键词对照\">B. 哲学概念 → 代码关键词对照</h3>\n<table><thead><tr><th>哲学</th><th>关键字</th><th>Intent</th></tr></thead><tbody><tr><td>心即理</td><td>心外无物</td><td><code>let</code></td></tr><tr><td>知行合一</td><td>知行不二</td><td>`\\</td></tr><tr><td>格物致知</td><td>穷理尽性</td><td><code>match</code></td></tr><tr><td>实事求是</td><td>实践检验</td><td><code>requires/ensures</code></td></tr><tr><td>烦恼即菩提</td><td>转识成智</td><td><code>Result + ?</code></td></tr><tr><td>扬弃</td><td>Aufheben</td><td><code>class :</code></td></tr><tr><td>此心光明</td><td>本心不失</td><td>闭包</td></tr><tr><td>向死而生</td><td>Sein-zum-Tode</td><td><code>defer</code></td></tr><tr><td>不二法门</td><td>非此即彼</td><td><code>enum</code></td></tr><tr><td>天地一体</td><td>万物并育</td><td><code>import</code></td></tr></tbody></table>\n<h3 id=\"c-进一步阅读\">C. 进一步阅读</h3>\n<ul>\n<li>王阳明《传习录》</li>\n<li>《道德经》</li>\n<li>马克思《关于费尔巴哈的提纲》</li>\n<li>海德格尔《存在与时间》</li>\n<li>萨特《存在主义是一种人道主义》</li>\n<li>Intent 源码：<code>D:\\Desktop\\worksheet\\intent\\src\\mini_intent.py</code></li>\n</ul>\n<hr>\n<p><em>&quot;做具体的事，爱具体的人，成为具体的人。&quot;</em>\n<em>——阿J</em></p>\n<p><em>&quot;心学为体，禅道为翼，马哲为用。&quot;</em>\n<em>——Intent 设计哲学</em></p>", "text": "《用代码学哲学》— 书稿框架 作者：阿J（J-intent） 语言：Intent v1.2 哲学框架：心学为体 · 禅道为翼 · 马哲为用 前言：代码是思维的镜子 📖 完整章节： 第1章 · 第2章 · 第3章 · 第4章 · 第5章 · 第6章 · 第7章 · 第8章 为什么编程能教哲学？ 当你写 let x = 10 时，你在做一个哲学断言：&quot;x 是 10&quot;。当你写 let mut x = 10 时，你在宣告：&quot;我承认我在改变世界&quot;。编程语言的每一个语法设计都不是中立的——它携带了一套世界观。 Intent 是刻意按这套世界观设计的语言。学 Intent 不是学&quot;又一种编程语言&quot;，而是 用精确形式重新思考你与世界的关系 。 这本书怎么读？ 先跑代码 ：每章开头有一段可运行的 Intent 代码（ examples/lesson_XX_*.intent ），先跑一遍看输出 再读哲理解析 ：理解这段代码背后的哲学概念 然后自己改 ：每章末尾有&quot;进阶&quot;练习，改一行代码，看结果怎么变 前置条件 安装 Python 3.10+ python3 src/mini_intent.py examples/lesson_01_wuwei.intent 不需要任何编程基础——所有概念从零开始 第一部分：本体论——存在是什么？ 第1章：无为之始 → let 声明 运行 ： python3 src/mini_intent.py examples/lesson_01_wuwei.intent 哲学核心 ： 王阳明&quot;心外无物&quot;——你声明的变量，才在你的世界中存在 老子&quot;无为而无不为&quot;—— let 默认不可变，不需要额外努力去&quot;保持不动&quot; 道家的&quot;如如不动&quot;——变量的默认状态就是稳定的 代码概念 ：类型推断、 let vs let mut 、一切皆表达式 关键体验 ：你把所有 let 改成 let mut 再看一遍输出——感觉有何不同？ 第二部分：认识论——我们如何知道？ 第2章：知行合一 → |&gt; 管道 运行 ： python3 src/mini_intent.py examples/lesson_02_zhixing.intent 哲学核心 ： 王阳明&quot;知行合一&quot;——知道一个函数存在（知）和实际调用它（行）应该是连续的 庄子&quot;庖丁解牛&quot;——数据顺着纹理流过每个处理步骤 管道不是语法糖——它改变了你的认知结构，从&quot;嵌套&quot;到&quot;流动&quot; 代码概念 ： |&gt; 管道、 def 函数定义、Lambda 关键体验 ：用嵌套写法重写管道链，感受&quot;从里到外读&quot; vs &quot;从左到右读&quot; 第3章：格物致知 → match 穷举 运行 ： python3 src/mini_intent.py examples/lesson_03_gewu.intent 哲学核心 ： 朱熹&quot;格物致知&quot;——把每一个事物格透了，知识自然来 马克思&quot;具体问题具体分析&quot;——不搞一刀切，每种情况单独处理 match 穷举性检查——你敢说&quot;全考虑了&quot;，编译器帮你验证 代码概念 ： match 表达式、 enum 枚举、 if 守卫 关键体验 ：删掉一个分支，看编译器怎么提醒你&quot;漏了&quot; 第三部分：实践论——我们如何行动？ 第4章：社会契约 → requires/ensures 运行 ： python3 src/mini_intent.py examples/lesson_04_contract.intent 哲学核心 ： 马克思&quot;人是社会关系的总和&quot;——每个函数活在社会关系中 卢梭&quot;社会契约&quot;——进门前签合同（requires），出门前验货（ensures） 王阳明&quot;致良知&quot;——良知不是感觉，是可验证的条件 代码概念 ： requires 前置条件、 ensures 后置条件、 contract 契约系统 关键体验 ：把 b != 0 改成 b != 1 ，看看调用 safe_divide(10, 1) 会不会报错 第5章：烦恼即菩提 → Result + ? 运行 ： python3 src/mini_intent.py examples/lesson_05_bodhi.intent 哲学核心 ： 禅宗&quot;烦恼即菩提&quot;——错误不是要消灭的东西，是要认识的 斯多葛&quot;控制你能控制的&quot;——区分&quot;我的事&quot;和&quot;不关我的事&quot; Result&lt;T,E&gt; ——Ok 和 Err 是平等的两支，不存在&quot;正常&quot;和&quot;异常&quot;的二分 代码概念 ： Result&lt;T,E&gt; 、 ? 操作符、 try/catch/finally 关键体验 ：在 while 循环里放 try/catch，失败 3 次后继续——感受&quot;受伤 ≠ 死亡&quot; 第四部分：辩证法——事物如何发展？ 第6章：辩证统一 → class 继承 运行 ： python3 src/mini_intent.py examples/lesson_06_dialectic.intent 哲学核心 ： 黑格尔&quot;正题→反题→合题&quot;——发展不是线性的，是螺旋上升的 马克思&quot;扬弃&quot;（Aufheben）——子类保留父类有用的，超越不够好的 萨特&quot;存在先于本质&quot;——你的行动定义了你是什么 代码概念 ： class 系统、继承、方法覆盖 关键体验 ：给函数链加一个 negate 环节，体会&quot;否定不是消灭，是超越&quot; 第五部分：系统论——万物如何连接？ 第7章：万物一体 → import 生态 运行 ： python3 src/mini_intent.py examples/lesson_07_ecosystem.intent 哲学核心 ： 庄子&quot;天地与我并生，万物与我为一&quot;——你不需要自己造一切 王阳明&quot;万物一体之仁&quot;——标准库在你诞生前已经存在 你的工作不是发明，是组合——找到已有的模块，然后用管道串起来 代码概念 ： import / export 模块系统、列表/字典推导式、 range 关键体验 ：用 range + 推导式 + 管道做一次数据流处理 第8章：向死而生 → defer + 闭包 运行 ： python3 src/mini_intent.py examples/lesson_08_finitude.intent 哲学核心 ： 海德格尔&quot;向死而生&quot;——出生时就知道了死亡，反而让生命有意义 道家&quot;功成身退&quot;——资源获取时就写下清理代码 王阳明&quot;此心光明&quot;——闭包携带诞生时的环境，无论在哪儿心都是亮的 代码概念 ： defer 语句、闭包、 yield 生成器 关键体验 ：写一个带 defer 的函数，中间故意提前 return ，看 defer 是否还执行 附录 A. Intent 语法速查表 语法 含义 哲学映射 let x = 10 不可变声明 如如不动 let mut x = 10 可变声明 改变世界 `\\ &gt;` 管道 match x { ... } 模式匹配 格物致知 requires / ensures 契约 社会契约 Result&lt;T,E&gt; 结果类型 烦恼即菩提 ? 错误传播 平常心 class / : 类/继承 扬弃 def / fn 函数/Lambda 功夫 import / export 模块 天地一体 defer { } 延迟执行 向死而生 yield expr 生成器 生生不息 B. 哲学概念 → 代码关键词对照 哲学 关键字 Intent 心即理 心外无物 let 知行合一 知行不二 `\\ 格物致知 穷理尽性 match 实事求是 实践检验 requires/ensures 烦恼即菩提 转识成智 Result + ? 扬弃 Aufheben class : 此心光明 本心不失 闭包 向死而生 Sein-zum-Tode defer 不二法门 非此即彼 enum 天地一体 万物并育 import C. 进一步阅读 王阳明《传习录》 《道德经》 马克思《关于费尔巴哈的提纲》 海德格尔《存在与时间》 萨特《存在主义是一种人道主义》 Intent 源码： D:\\Desktop\\worksheet\\intent\\src\\mini_intent.py &quot;做具体的事，爱具体的人，成为具体的人。&quot; ——阿J &quot;心学为体，禅道为翼，马哲为用。&quot; ——Intent 设计哲学"}, {"id": "philosophy_mapper.md", "title": "Intent 哲学映射器", "group": "哲学", "html": "<h1 id=\"intent-哲学映射器\">Intent 哲学映射器</h1>\n<h2 id=\"让每一个语法特性都成为思维体验\">让每一个语法特性都成为思维体验</h2>\n<blockquote>&quot;心学为体，禅道为翼，马哲为用&quot; — Intent 设计哲学</blockquote>\n<hr>\n<h2 id=\"一本体论层一切皆表达式-the-one\">一、本体论层：一切皆表达式 (The One)</h2>\n<h3 id=\"核心映射心即理也-代码即意图\">核心映射：<code>心即理也</code> → 代码即意图</h3>\n<table><thead><tr><th>Intent 语法</th><th>哲学概念</th><th>思维体验</th></tr></thead><tbody><tr><td><code>一切皆表达式</code></td><td>王阳明&quot;心外无物&quot;</td><td>没有&quot;语句&quot;和&quot;表达式&quot;的二分——你写的每一个东西都在<strong>生成一个值</strong>。就像你的每一个念头都在<strong>生成一个存在状态</strong></td></tr><tr><td><code>let x = 10</code> (默认不可变)</td><td>禅宗&quot;如如不动&quot;</td><td>声明即锚定。变量默认不能改——先确定&quot;是什么&quot;，再决定&quot;怎么变&quot;</td></tr><tr><td><code>let mut x = 10</code></td><td>马克思&quot;改变世界&quot;</td><td>显式宣告可变性。你要改变世界，必须<strong>先承认你在改变</strong></td></tr><tr><td><code>类型推断</code></td><td>庄子&quot;大道不称&quot;</td><td>不需要到处标注类型，编译器能从上下文推断——就像道，不言自明</td></tr></tbody></table>\n<h3 id=\"代码示例如如不动\">代码示例：如如不动</h3>\n<pre><code class=\"lang-intent\">// 默认不可变：先确定&quot;是什么&quot;\nlet name = &quot;Intent&quot;;\nlet pi = 3.14159;\n\n// 显式可变：你必须承认&quot;我要改变&quot;\nlet mut counter = 0;\ncounter = counter + 1;  // 我承认我在改变世界</code></pre>\n<hr>\n<h2 id=\"二认识论层管道与模式匹配-the-process\">二、认识论层：管道与模式匹配 (The Process)</h2>\n<h3 id=\"核心映射格物致知-数据流即认知流\">核心映射：<code>格物致知</code> → 数据流即认知流</h3>\n<table><thead><tr><th>Intent 语法</th><th>哲学概念</th><th>思维体验</th></tr></thead><tbody><tr><td>`\\</td><td>&gt;` 管道操作符</td><td>王阳明&quot;知行合一&quot;</td></tr><tr><td><code>match expr { ... }</code></td><td>马克思&quot;具体问题具体分析&quot;</td><td>面对一个值，穷举所有可能性。你<strong>必须考虑所有情况</strong>——漏了编译器就报错</td></tr><tr><td><code>Result&lt;T, E&gt;</code> + <code>?</code></td><td>禅宗&quot;烦恼即菩提&quot;</td><td>错误不是异常需要捕获，错误就是<strong>另一种返回值</strong>。Ok 和 Err 是平等的两个子类型</td></tr><tr><td>`\\</td><td>&gt; pipe` 链式处理</td><td>庄子&quot;庖丁解牛&quot;</td></tr></tbody></table>\n<h3 id=\"代码示例管道即思路\">代码示例：管道即思路</h3>\n<pre><code class=\"lang-intent\">// 管道：顺着数据的流动方向思考\n// 这不只是语法糖——它改变了你的认知结构\nlet result = data\n    |&gt; filter(is_valid)\n    |&gt; map(transform)\n    |&gt; reduce(combine, 0);\n\n// 等价于心学式思维链：\n// 先有 data → 过滤有效项 → 转换形式 → 聚合为结果</code></pre>\n<h3 id=\"代码示例pattern-matching-格物\">代码示例：pattern matching = 格物</h3>\n<pre><code class=\"lang-intent\">// match 是你&quot;格&quot;一个值的穷举方式\n// 注：range 模式(90..100)尚未实现，暂用 if 守卫表达范围条件\nlet grade = match score {\n    n if n &gt;= 90 =&gt; &quot;A&quot;,   // 这种情况\n    n if n &gt;= 80 =&gt; &quot;B&quot;,   // 那种情况\n    n if n &gt;= 70 =&gt; &quot;C&quot;,   // 必须覆盖\n    _            =&gt; &quot;F&quot;,   // 最后兜底\n};\n\n// 每一种可能性都是&quot;一个物&quot;\n// 你格了 score 这个物，就穷尽了它的所有可能</code></pre>\n<hr>\n<h2 id=\"三实践论层契约与错误处理-the-practice\">三、实践论层：契约与错误处理 (The Practice)</h2>\n<h3 id=\"核心映射实事求是-契约即合约\">核心映射：<code>实事求是</code> → 契约即合约</h3>\n<table><thead><tr><th>Intent 语法</th><th>哲学概念</th><th>思维体验</th></tr></thead><tbody><tr><td><code>requires</code> 前置条件</td><td>马克思&quot;人的本质是社会关系&quot;</td><td>进入一个函数前，你必须<strong>声明你对世界的预期</strong>。这是你和调用者之间的社会契约</td></tr><tr><td><code>ensures</code> 后置条件</td><td>王阳明&quot;致良知&quot;</td><td>执行完函数后，你必须<strong>证明你兑现了承诺</strong>。良知不是感觉，是<strong>可验证的条件</strong></td></tr><tr><td><code>contract</code> 契约系统</td><td>马克思主义&quot;实践是检验真理的唯一标准&quot;</td><td>契约不是注释——它会在运行时<strong>实际执行验证</strong>。如果你说谎，系统会告诉你</td></tr><tr><td><code>?</code> 错误传播</td><td>禅宗&quot;平常心&quot;</td><td>遇到错误不恐慌，让它自然传播。Err 就是 Err，不是 exception，是<strong>另一种正常状态</strong></td></tr></tbody></table>\n<h3 id=\"代码示例契约即合同\">代码示例：契约即合同</h3>\n<pre><code class=\"lang-intent\">// 前置条件：我要求 caller 的世界必须满足这些条件\n// 后置条件：我保证返回的世界将满足这些条件\ndef divide(a: Float, b: Float): Float\n    requires b != 0        // 进入函数前：我预期除数非零\n    ensures result * b == a // 离开函数后：我保证结果可验证\n{\n    return a / b;\n};</code></pre>\n<hr>\n<h2 id=\"四辩证法层类与继承-the-dialectic\">四、辩证法层：类与继承 (The Dialectic)</h2>\n<h3 id=\"核心映射对立统一-oop-即辩证法\">核心映射：<code>对立统一</code> → OOP 即辩证法</h3>\n<table><thead><tr><th>Intent 语法</th><th>哲学概念</th><th>思维体验</th></tr></thead><tbody><tr><td><code>class A { this.x = x; }</code></td><td>黑格尔&quot;自在的存在&quot;</td><td>类定义了事物的<strong>本质属性</strong>。<code>this</code> 是事物认识自身的方式</td></tr><tr><td><code>class B &lt; A { ... }</code></td><td>马克思&quot;扬弃&quot;</td><td>继承不是照搬——子类<strong>扬弃</strong>父类，保留有用部分、超越局限部分</td></tr><tr><td><code>方法覆盖</code></td><td>黑格尔&quot;否定之否定&quot;</td><td>子类覆盖父类方法，不是删除，是在更高层次上<strong>重新定义</strong></td></tr><tr><td><code>枚举 enum</code></td><td>禅宗&quot;不二法门&quot;</td><td>一个东西只能是几种状态之一。非此即彼，没有模糊地带</td></tr></tbody></table>\n<h3 id=\"代码示例继承即扬弃\">代码示例：继承即扬弃</h3>\n<pre><code class=\"lang-intent\">enum ShapeType { Circle, Square, Triangle };\n\nclass Shape {\n    def area(): Float { return 0.0; }  // 父类：抽象定义\n}\n\nclass Circle &lt; Shape {\n    def area(): Float { return pi * r * r; }  // 子类：具体的否定\n}\n// Circle 扬弃了 Shape——保留了&quot;有面积&quot;这个属性\n// 但用具体的计算公式取代了父类的抽象返回</code></pre>\n<blockquote>注：继承用尖括号 <code>&lt;</code>；类体内方法定义后不加分号（详见 spec.md 3.6）</blockquote>\n<hr>\n<h2 id=\"五系统论层模块与闭包-the-system\">五、系统论层：模块与闭包 (The System)</h2>\n<h3 id=\"核心映射万物一体-模块即生态系统\">核心映射：<code>万物一体</code> → 模块即生态系统</h3>\n<table><thead><tr><th>Intent 语法</th><th>哲学概念</th><th>思维体验</th></tr></thead><tbody><tr><td><code>import std.math;</code></td><td>庄子&quot;天地与我并生&quot;</td><td>你不需要从零开始——整个标准库在你诞生之前就在那了</td></tr><tr><td><code>export fn_name;</code></td><td>马克思&quot;人是社会关系的总和&quot;</td><td>你写的函数不是你私有的——暴露给外部，才成为<strong>真实存在</strong></td></tr><tr><td><code>闭包 fn(x) { ... }</code></td><td>王阳明&quot;此心光明&quot;</td><td>函数携带它诞生时的环境。无论被传递到哪里，它永远记得&quot;家&quot;</td></tr><tr><td><code>defer { ... }</code></td><td>道家&quot;功成身退&quot;</td><td>资源获取时就知道何时释放。不是&quot;别忘了清理&quot;，而是<strong>清理已经在等待着的</strong></td></tr></tbody></table>\n<h3 id=\"代码示例闭包即记忆\">代码示例：闭包即记忆</h3>\n<pre><code class=\"lang-intent\">def make_adder(n: Int) {\n    return fn(x: Int) { return x + n; };\n    // 这个匿名函数携带了 n 的记忆\n    // 无论它被传到哪里，n 永远在它的作用域里\n};\n\nlet add5 = make_adder(5);\nprint(add5(10));  // 15 —— 函数记得 5</code></pre>\n<hr>\n<h2 id=\"六修炼路径用代码学哲学\">六、修炼路径：用代码学哲学</h2>\n<h3 id=\"第1课无为之始\">第1课：无为之始</h3>\n<p><strong>哲学</strong>：王阳明&quot;心外无物&quot;，老子&quot;无为&quot;\n<strong>Intent</strong>：<code>let</code> 声明、类型推断\n<strong>体验</strong>：不标注类型，系统自己知道。不写 mut，默认不可变。先观照，再行动。</p>\n<h3 id=\"第2课知行合一\">第2课：知行合一</h3>\n<p><strong>哲学</strong>：王阳明&quot;知行合一&quot;，马克思&quot;实践是第一性的&quot;\n<strong>Intent</strong>：管道 <code>|&gt;</code>、函数调用\n<strong>体验</strong>：数据从左到右流动 = 从&quot;知道&quot;到&quot;做到&quot;。管道不是语法糖，是思维的重组。</p>\n<h3 id=\"第3课格物致知\">第3课：格物致知</h3>\n<p><strong>哲学</strong>：朱熹/王阳明&quot;格物&quot;，马克思&quot;具体问题具体分析&quot;\n<strong>Intent</strong>：match 模式匹配、穷举性检查\n<strong>体验</strong>：面对一个值，穷举所有可能。你敢说&quot;我都考虑到了&quot;，编译器会帮你验证。</p>\n<h3 id=\"第4课社会契约\">第4课：社会契约</h3>\n<p><strong>哲学</strong>：马克思&quot;社会关系&quot;，卢梭&quot;社会契约&quot;\n<strong>Intent</strong>：requires/ensures 契约系统\n<strong>体验</strong>：进门前签合同（requires），出门前验货（ensures）。代码之间的信任建立在可验证的条款上。</p>\n<h3 id=\"第5课烦恼即菩提\">第5课：烦恼即菩提</h3>\n<p><strong>哲学</strong>：禅宗&quot;烦恼即菩提&quot;，斯多葛学派\n<strong>Intent</strong>：Result&lt;T,E&gt; + ? 操作符\n<strong>体验</strong>：错误不是异常，是另一种正常返回值。你不再 try-catch 恐慌，你平静地处理每一种可能。</p>\n<h3 id=\"第6课辩证统一\">第6课：辩证统一</h3>\n<p><strong>哲学</strong>：黑格尔辩证法，马克思&quot;扬弃&quot;\n<strong>Intent</strong>：class 继承、方法覆盖\n<strong>体验</strong>：子类不是照搬父类——它在更高层次上重新定义。每一次继承都是一次扬弃。</p>\n<h3 id=\"第7课万物一体\">第7课：万物一体</h3>\n<p><strong>哲学</strong>：庄子&quot;天地与我并生&quot;、王阳明&quot;万物一体之仁&quot;\n<strong>Intent</strong>：import/export 模块系统、标准库\n<strong>体验</strong>：你不需要自己实现一切。在你诞生之前，世界已经准备好了工具。你的任务是<strong>组合</strong>，不是<strong>发明</strong>。</p>\n<h3 id=\"第8课临终关怀\">第8课：临终关怀</h3>\n<p><strong>哲学</strong>：海德格尔&quot;向死而生&quot;\n<strong>Intent</strong>：defer 语句\n<strong>体验</strong>：资源获取时就写下清理代码。不是&quot;别忘了关文件&quot;，而是&quot;关文件的代码已经在路的尽头等你了&quot;。</p>\n<hr>\n<h2 id=\"七哲学关键词-代码语法速查表\">七、哲学关键词 → 代码语法速查表</h2>\n<table><thead><tr><th>哲学概念</th><th>Intent 语法</th><th>一句话</th></tr></thead><tbody><tr><td>心即理</td><td><code>let</code> 默认不可变</td><td>声明即存在</td></tr><tr><td>知行合一</td><td>`\\</td><td>&gt;` 管道</td></tr><tr><td>格物致知</td><td><code>match</code> 穷举</td><td>面对一个值，穷尽所有可能</td></tr><tr><td>实事求是</td><td><code>requires/ensures</code></td><td>合同不是承诺，是可验证的条件</td></tr><tr><td>烦恼即菩提</td><td><code>Result + ?</code></td><td>错误是另一种正常</td></tr><tr><td>扬弃</td><td><code>class B : A</code></td><td>继承是超越不是照搬</td></tr><tr><td>此心光明</td><td>闭包 <code>fn(x) { ... }</code></td><td>函数记得家</td></tr><tr><td>向死而生</td><td><code>defer { ... }</code></td><td>清理代码在出生时就写好了</td></tr><tr><td>不二法门</td><td><code>enum</code></td><td>非此即彼</td></tr><tr><td>天地一体</td><td><code>import/export</code></td><td>世界在你诞生前就准备好了</td></tr></tbody></table>\n<hr>\n<p><em>&quot;编程不是让机器做事，编程是用精确语言思考。&quot;</em>\n<em>&quot;Intent 不是编程语言，Intent 是一套思维训练系统。&quot;</em></p>", "text": "Intent 哲学映射器 让每一个语法特性都成为思维体验 &quot;心学为体，禅道为翼，马哲为用&quot; — Intent 设计哲学 一、本体论层：一切皆表达式 (The One) 核心映射： 心即理也 → 代码即意图 Intent 语法 哲学概念 思维体验 一切皆表达式 王阳明&quot;心外无物&quot; 没有&quot;语句&quot;和&quot;表达式&quot;的二分——你写的每一个东西都在 生成一个值 。就像你的每一个念头都在 生成一个存在状态 let x = 10 (默认不可变) 禅宗&quot;如如不动&quot; 声明即锚定。变量默认不能改——先确定&quot;是什么&quot;，再决定&quot;怎么变&quot; let mut x = 10 马克思&quot;改变世界&quot; 显式宣告可变性。你要改变世界，必须 先承认你在改变 类型推断 庄子&quot;大道不称&quot; 不需要到处标注类型，编译器能从上下文推断——就像道，不言自明 代码示例：如如不动 // 默认不可变：先确定&quot;是什么&quot; let name = &quot;Intent&quot;; let pi = 3.14159; // 显式可变：你必须承认&quot;我要改变&quot; let mut counter = 0; counter = counter + 1; // 我承认我在改变世界 二、认识论层：管道与模式匹配 (The Process) 核心映射： 格物致知 → 数据流即认知流 Intent 语法 哲学概念 思维体验 `\\ &gt;` 管道操作符 王阳明&quot;知行合一&quot; match expr { ... } 马克思&quot;具体问题具体分析&quot; 面对一个值，穷举所有可能性。你 必须考虑所有情况 ——漏了编译器就报错 Result&lt;T, E&gt; + ? 禅宗&quot;烦恼即菩提&quot; 错误不是异常需要捕获，错误就是 另一种返回值 。Ok 和 Err 是平等的两个子类型 `\\ &gt; pipe` 链式处理 庄子&quot;庖丁解牛&quot; 代码示例：管道即思路 // 管道：顺着数据的流动方向思考 // 这不只是语法糖——它改变了你的认知结构 let result = data |&gt; filter(is_valid) |&gt; map(transform) |&gt; reduce(combine, 0); // 等价于心学式思维链： // 先有 data → 过滤有效项 → 转换形式 → 聚合为结果 代码示例：pattern matching = 格物 // match 是你&quot;格&quot;一个值的穷举方式 // 注：range 模式(90..100)尚未实现，暂用 if 守卫表达范围条件 let grade = match score { n if n &gt;= 90 =&gt; &quot;A&quot;, // 这种情况 n if n &gt;= 80 =&gt; &quot;B&quot;, // 那种情况 n if n &gt;= 70 =&gt; &quot;C&quot;, // 必须覆盖 _ =&gt; &quot;F&quot;, // 最后兜底 }; // 每一种可能性都是&quot;一个物&quot; // 你格了 score 这个物，就穷尽了它的所有可能 三、实践论层：契约与错误处理 (The Practice) 核心映射： 实事求是 → 契约即合约 Intent 语法 哲学概念 思维体验 requires 前置条件 马克思&quot;人的本质是社会关系&quot; 进入一个函数前，你必须 声明你对世界的预期 。这是你和调用者之间的社会契约 ensures 后置条件 王阳明&quot;致良知&quot; 执行完函数后，你必须 证明你兑现了承诺 。良知不是感觉，是 可验证的条件 contract 契约系统 马克思主义&quot;实践是检验真理的唯一标准&quot; 契约不是注释——它会在运行时 实际执行验证 。如果你说谎，系统会告诉你 ? 错误传播 禅宗&quot;平常心&quot; 遇到错误不恐慌，让它自然传播。Err 就是 Err，不是 exception，是 另一种正常状态 代码示例：契约即合同 // 前置条件：我要求 caller 的世界必须满足这些条件 // 后置条件：我保证返回的世界将满足这些条件 def divide(a: Float, b: Float): Float requires b != 0 // 进入函数前：我预期除数非零 ensures result * b == a // 离开函数后：我保证结果可验证 { return a / b; }; 四、辩证法层：类与继承 (The Dialectic) 核心映射： 对立统一 → OOP 即辩证法 Intent 语法 哲学概念 思维体验 class A { this.x = x; } 黑格尔&quot;自在的存在&quot; 类定义了事物的 本质属性 。 this 是事物认识自身的方式 class B &lt; A { ... } 马克思&quot;扬弃&quot; 继承不是照搬——子类 扬弃 父类，保留有用部分、超越局限部分 方法覆盖 黑格尔&quot;否定之否定&quot; 子类覆盖父类方法，不是删除，是在更高层次上 重新定义 枚举 enum 禅宗&quot;不二法门&quot; 一个东西只能是几种状态之一。非此即彼，没有模糊地带 代码示例：继承即扬弃 enum ShapeType { Circle, Square, Triangle }; class Shape { def area(): Float { return 0.0; } // 父类：抽象定义 } class Circle &lt; Shape { def area(): Float { return pi * r * r; } // 子类：具体的否定 } // Circle 扬弃了 Shape——保留了&quot;有面积&quot;这个属性 // 但用具体的计算公式取代了父类的抽象返回 注：继承用尖括号 &lt; ；类体内方法定义后不加分号（详见 spec.md 3.6） 五、系统论层：模块与闭包 (The System) 核心映射： 万物一体 → 模块即生态系统 Intent 语法 哲学概念 思维体验 import std.math; 庄子&quot;天地与我并生&quot; 你不需要从零开始——整个标准库在你诞生之前就在那了 export fn_name; 马克思&quot;人是社会关系的总和&quot; 你写的函数不是你私有的——暴露给外部，才成为 真实存在 闭包 fn(x) { ... } 王阳明&quot;此心光明&quot; 函数携带它诞生时的环境。无论被传递到哪里，它永远记得&quot;家&quot; defer { ... } 道家&quot;功成身退&quot; 资源获取时就知道何时释放。不是&quot;别忘了清理&quot;，而是 清理已经在等待着的 代码示例：闭包即记忆 def make_adder(n: Int) { return fn(x: Int) { return x + n; }; // 这个匿名函数携带了 n 的记忆 // 无论它被传到哪里，n 永远在它的作用域里 }; let add5 = make_adder(5); print(add5(10)); // 15 —— 函数记得 5 六、修炼路径：用代码学哲学 第1课：无为之始 哲学 ：王阳明&quot;心外无物&quot;，老子&quot;无为&quot; Intent ： let 声明、类型推断 体验 ：不标注类型，系统自己知道。不写 mut，默认不可变。先观照，再行动。 第2课：知行合一 哲学 ：王阳明&quot;知行合一&quot;，马克思&quot;实践是第一性的&quot; Intent ：管道 |&gt; 、函数调用 体验 ：数据从左到右流动 = 从&quot;知道&quot;到&quot;做到&quot;。管道不是语法糖，是思维的重组。 第3课：格物致知 哲学 ：朱熹/王阳明&quot;格物&quot;，马克思&quot;具体问题具体分析&quot; Intent ：match 模式匹配、穷举性检查 体验 ：面对一个值，穷举所有可能。你敢说&quot;我都考虑到了&quot;，编译器会帮你验证。 第4课：社会契约 哲学 ：马克思&quot;社会关系&quot;，卢梭&quot;社会契约&quot; Intent ：requires/ensures 契约系统 体验 ：进门前签合同（requires），出门前验货（ensures）。代码之间的信任建立在可验证的条款上。 第5课：烦恼即菩提 哲学 ：禅宗&quot;烦恼即菩提&quot;，斯多葛学派 Intent ：Result&lt;T,E&gt; + ? 操作符 体验 ：错误不是异常，是另一种正常返回值。你不再 try-catch 恐慌，你平静地处理每一种可能。 第6课：辩证统一 哲学 ：黑格尔辩证法，马克思&quot;扬弃&quot; Intent ：class 继承、方法覆盖 体验 ：子类不是照搬父类——它在更高层次上重新定义。每一次继承都是一次扬弃。 第7课：万物一体 哲学 ：庄子&quot;天地与我并生&quot;、王阳明&quot;万物一体之仁&quot; Intent ：import/export 模块系统、标准库 体验 ：你不需要自己实现一切。在你诞生之前，世界已经准备好了工具。你的任务是 组合 ，不是 发明 。 第8课：临终关怀 哲学 ：海德格尔&quot;向死而生&quot; Intent ：defer 语句 体验 ：资源获取时就写下清理代码。不是&quot;别忘了关文件&quot;，而是&quot;关文件的代码已经在路的尽头等你了&quot;。 七、哲学关键词 → 代码语法速查表 哲学概念 Intent 语法 一句话 心即理 let 默认不可变 声明即存在 知行合一 `\\ &gt;` 管道 格物致知 match 穷举 面对一个值，穷尽所有可能 实事求是 requires/ensures 合同不是承诺，是可验证的条件 烦恼即菩提 Result + ? 错误是另一种正常 扬弃 class B : A 继承是超越不是照搬 此心光明 闭包 fn(x) { ... } 函数记得家 向死而生 defer { ... } 清理代码在出生时就写好了 不二法门 enum 非此即彼 天地一体 import/export 世界在你诞生前就准备好了 &quot;编程不是让机器做事，编程是用精确语言思考。&quot; &quot;Intent 不是编程语言，Intent 是一套思维训练系统。&quot;"}, {"id": "chapter_01_wuwei.md", "title": "第1章：无为之始 — 心即理也", "group": "教程", "html": "<h1 id=\"第1章无为之始-心即理也\">第1章：无为之始 — 心即理也</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_01_wuwei.intent</code>\n<strong>哲学</strong>：王阳明&quot;心外无物&quot;、老子&quot;无为而无不为&quot;\n<strong>语法</strong>：<code>let</code> 声明、类型推断、默认不可变</blockquote>\n<hr>\n<h2 id=\"11-你声明它就存在\">1.1 你声明，它就存在</h2>\n<p>打开终端，输入：</p>\n<pre><code class=\"lang-intent\">let name = &quot;Intent&quot;;\nprint(name);</code></pre>\n<p>输出：<code>Intent</code></p>\n<p>这是你写的第一个 Intent 程序。只做了两件事：</p>\n<ol>\n<li>声明了一个叫做 <code>name</code> 的变量</li>\n<li>让它等于 <code>&quot;Intent&quot;</code></li>\n</ol>\n<p>但这里已经藏着一个哲学命题。</p>\n<p><strong>在没有 <code>let name</code> 之前，<code>name</code> 不存在。</strong></p>\n<p>王阳明说&quot;心外无物&quot;——花在深山自开自落，和你的心没有关系。但当你说&quot;这朵花是红的&quot;，花就在你的世界中诞生了。编程语言的 <code>let</code> 声明，就是把这个哲学命题翻译成精确形式：<strong>一切需要先在代码中存在，才在程序的世界中存在。</strong></p>\n<p>你和变量的关系，就是你和万物的关系。</p>\n<hr>\n<h2 id=\"12-系统比你知道更多\">1.2 系统比你知道更多</h2>\n<p>继续看这段代码：</p>\n<pre><code class=\"lang-intent\">let name = &quot;Intent&quot;;   // ← 你没写这是 String\nlet pi = 3.14159;      // ← 你没写这是 Float\nlet flag = true;       // ← 你没写这是 Bool\nlet items = [1, 2, 3, 4, 5];  // ← 你没写这是 List</code></pre>\n<p>你从来没写 <code>let name: String = &quot;Intent&quot;</code>。但系统知道 <code>name</code> 是 <code>String</code>。</p>\n<p>这叫<strong>类型推断</strong>。</p>\n<p>大多数语言的哲学是&quot;你告诉系统一切&quot;。你写 <code>int x = 10</code>，你写 <code>String name = &quot;Alice&quot;</code>。你像一个焦虑的契约书写者，反复确认每一个细节。</p>\n<p>Intent 的哲学不同。王阳明说&quot;心即理也&quot;——你的心本自知道。不需要向外求证，不需要逐项标注。系统推理出一切。</p>\n<p><strong>你不标注类型，系统也全知道。因为你写下的=右边已经说明了一切。</strong></p>\n<p>这不是技术妥协——这是刻意设计：<strong>信任代码的诚实</strong>。</p>\n<hr>\n<h2 id=\"13-默认不可变\">1.3 默认不可变</h2>\n<pre><code class=\"lang-intent\">let x = 10;          // x 不能被改变\nlet mut counter = 0; // counter 可以被改变</code></pre>\n<p>这里的差异很小——多一个 <code>mut</code>——但哲学差异巨大。</p>\n<p><strong><code>let</code> 默认不可变。<code>let mut</code> 才可变。</strong></p>\n<p>大多数编程语言的哲学是&quot;一切默认可变&quot;——你的变量生来就可以被重写。你得额外加 <code>const</code> 或 <code>final</code> 来锁住它。</p>\n<p>Intent 反过来。<strong>不写 <code>mut</code>，就不给你变。</strong></p>\n<p>这是老子的哲学。&quot;无为&quot;不是什么都不做——是&quot;不需要额外的努力去保持不动&quot;。</p>\n<p>老子说&quot;上善若水&quot;。水之所以是水，不是因为它天天努力&quot;不变&quot;。它只是本来就是水。Intent 的 <code>let x = 10</code> 同理——<code>x</code> 就是 <code>10</code>，不需要努力、不需要 <code>const</code> 保护。</p>\n<p><strong>哲学翻译</strong>：</p>\n<table><thead><tr><th>语言</th><th>变量默认状态</th></tr></thead><tbody><tr><td>JavaScript/Python</td><td>可变的（努力保持稳定）</td></tr><tr><td>Intent</td><td>不可变的（本来就安定）</td></tr></tbody></table>\n<hr>\n<h2 id=\"14-mut-是一声宣言\">1.4 <code>mut</code> 是一声宣言</h2>\n<pre><code class=\"lang-intent\">let mut counter = 0;\ncounter = 1;  // &quot;我承认，我在改变&quot;\ncounter = 2;  // &quot;我承认，我再次改变&quot;\ncounter = 3;  // &quot;我承认，我继续改变&quot;</code></pre>\n<p>每一个 <code>mut</code> 都是一声宣言：<strong>我承认我在改变世界。</strong></p>\n<p>编程大部分时候不需要改变——数据流过管道，被转换、过滤、计算。在这些场景中，<code>let</code> 就够了。</p>\n<p>但当你需要计数、需要累积、需要状态机——你写 <code>let mut</code>。你在说：&quot;OK，这里变了。&quot;</p>\n<p>这是一种<strong>自觉的哲学</strong>。你能区分&quot;我在改造数据&quot;和&quot;我在改变状态&quot;。</p>\n<p>马克思说&quot;哲学家们只是用不同的方式解释世界，而问题在于改变世界&quot;——Intent 让&quot;改变世界&quot;变成一件需要声明的事。你不是不知不觉地在改，你写 <code>let mut</code>，你在做出承诺。</p>\n<hr>\n<h2 id=\"15-一切皆表达式\">1.5 一切皆表达式</h2>\n<pre><code class=\"lang-intent\">let result = 3 + 4 * 5;\nprint(result);  // 23</code></pre>\n<p>没有&quot;语句&quot;和&quot;表达式&quot;的二分。<strong>你写的每一个东西都在生成一个值。</strong></p>\n<p>很多语言中，<code>if</code> 是语句（不返回值），你得用三元运算符。<code>for</code> 是语句，你只能在里面操作副作用。</p>\n<p>Intent 中，<code>if</code> 是表达式、<code>match</code> 是表达式、甚至 <code>try/catch</code> 也是表达式（生成 Result）。</p>\n<p>这又是一个哲学选择：<strong>你的每一个念头都在生成一个存在状态。</strong> 不是在刻意&quot;执行&quot;什么，而是每一次思考本身就是产出。</p>\n<hr>\n<h2 id=\"16-练习感觉差异\">1.6 练习：感觉差异</h2>\n<ol>\n<li>把第1课代码中的所有 <code>let</code> 改成 <code>let mut</code>。重新跑。输出一样，但感觉不同——你感觉到不同了吗？</li>\n<li>试着写 <code>let x: Int = 10;</code>（显式标注类型）。对比 <code>let x = 10;</code>。你觉得哪个更&quot;自然&quot;？</li>\n<li>如果你入职第一天，有人告诉你&quot;在这里，不写 <code>mut</code> 就不能改变量&quot;，你的第一反应是什么？为什么？</li>\n</ol>\n<hr>\n<h2 id=\"17-小结\">1.7 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>let x = 10</code></td><td>声明即存在（心外无物）</td></tr><tr><td>类型推断</td><td>心即理也（不需向外求证）</td></tr><tr><td>默认不可变</td><td>无为（不需努力保持不动）</td></tr><tr><td><code>let mut</code></td><td>自觉的改变（改变世界是宣言）</td></tr><tr><td>一切皆表达式</td><td>每个念头都生成存在状态</td></tr></tbody></table>\n<blockquote><strong>下一章</strong>：<a href=\"chapter_02_zhixing.md\">第2章：知行合一 → 管道即认知流</a></blockquote>", "text": "第1章：无为之始 — 心即理也 运行代码 ： python3 src/mini_intent.py examples/lesson_01_wuwei.intent 哲学 ：王阳明&quot;心外无物&quot;、老子&quot;无为而无不为&quot; 语法 ： let 声明、类型推断、默认不可变 1.1 你声明，它就存在 打开终端，输入： let name = &quot;Intent&quot;; print(name); 输出： Intent 这是你写的第一个 Intent 程序。只做了两件事： 声明了一个叫做 name 的变量 让它等于 &quot;Intent&quot; 但这里已经藏着一个哲学命题。 在没有 let name 之前， name 不存在。 王阳明说&quot;心外无物&quot;——花在深山自开自落，和你的心没有关系。但当你说&quot;这朵花是红的&quot;，花就在你的世界中诞生了。编程语言的 let 声明，就是把这个哲学命题翻译成精确形式： 一切需要先在代码中存在，才在程序的世界中存在。 你和变量的关系，就是你和万物的关系。 1.2 系统比你知道更多 继续看这段代码： let name = &quot;Intent&quot;; // ← 你没写这是 String let pi = 3.14159; // ← 你没写这是 Float let flag = true; // ← 你没写这是 Bool let items = [1, 2, 3, 4, 5]; // ← 你没写这是 List 你从来没写 let name: String = &quot;Intent&quot; 。但系统知道 name 是 String 。 这叫 类型推断 。 大多数语言的哲学是&quot;你告诉系统一切&quot;。你写 int x = 10 ，你写 String name = &quot;Alice&quot; 。你像一个焦虑的契约书写者，反复确认每一个细节。 Intent 的哲学不同。王阳明说&quot;心即理也&quot;——你的心本自知道。不需要向外求证，不需要逐项标注。系统推理出一切。 你不标注类型，系统也全知道。因为你写下的=右边已经说明了一切。 这不是技术妥协——这是刻意设计： 信任代码的诚实 。 1.3 默认不可变 let x = 10; // x 不能被改变 let mut counter = 0; // counter 可以被改变 这里的差异很小——多一个 mut ——但哲学差异巨大。 let 默认不可变。 let mut 才可变。 大多数编程语言的哲学是&quot;一切默认可变&quot;——你的变量生来就可以被重写。你得额外加 const 或 final 来锁住它。 Intent 反过来。 不写 mut ，就不给你变。 这是老子的哲学。&quot;无为&quot;不是什么都不做——是&quot;不需要额外的努力去保持不动&quot;。 老子说&quot;上善若水&quot;。水之所以是水，不是因为它天天努力&quot;不变&quot;。它只是本来就是水。Intent 的 let x = 10 同理—— x 就是 10 ，不需要努力、不需要 const 保护。 哲学翻译 ： 语言 变量默认状态 JavaScript/Python 可变的（努力保持稳定） Intent 不可变的（本来就安定） 1.4 mut 是一声宣言 let mut counter = 0; counter = 1; // &quot;我承认，我在改变&quot; counter = 2; // &quot;我承认，我再次改变&quot; counter = 3; // &quot;我承认，我继续改变&quot; 每一个 mut 都是一声宣言： 我承认我在改变世界。 编程大部分时候不需要改变——数据流过管道，被转换、过滤、计算。在这些场景中， let 就够了。 但当你需要计数、需要累积、需要状态机——你写 let mut 。你在说：&quot;OK，这里变了。&quot; 这是一种 自觉的哲学 。你能区分&quot;我在改造数据&quot;和&quot;我在改变状态&quot;。 马克思说&quot;哲学家们只是用不同的方式解释世界，而问题在于改变世界&quot;——Intent 让&quot;改变世界&quot;变成一件需要声明的事。你不是不知不觉地在改，你写 let mut ，你在做出承诺。 1.5 一切皆表达式 let result = 3 + 4 * 5; print(result); // 23 没有&quot;语句&quot;和&quot;表达式&quot;的二分。 你写的每一个东西都在生成一个值。 很多语言中， if 是语句（不返回值），你得用三元运算符。 for 是语句，你只能在里面操作副作用。 Intent 中， if 是表达式、 match 是表达式、甚至 try/catch 也是表达式（生成 Result）。 这又是一个哲学选择： 你的每一个念头都在生成一个存在状态。 不是在刻意&quot;执行&quot;什么，而是每一次思考本身就是产出。 1.6 练习：感觉差异 把第1课代码中的所有 let 改成 let mut 。重新跑。输出一样，但感觉不同——你感觉到不同了吗？ 试着写 let x: Int = 10; （显式标注类型）。对比 let x = 10; 。你觉得哪个更&quot;自然&quot;？ 如果你入职第一天，有人告诉你&quot;在这里，不写 mut 就不能改变量&quot;，你的第一反应是什么？为什么？ 1.7 小结 语法 哲学 let x = 10 声明即存在（心外无物） 类型推断 心即理也（不需向外求证） 默认不可变 无为（不需努力保持不动） let mut 自觉的改变（改变世界是宣言） 一切皆表达式 每个念头都生成存在状态 下一章 ： 第2章：知行合一 → 管道即认知流"}, {"id": "chapter_02_zhixing.md", "title": "第2章：知行合一 — 管道即认知流", "group": "教程", "html": "<h1 id=\"第2章知行合一-管道即认知流\">第2章：知行合一 — 管道即认知流</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_02_zhixing.intent</code>\n<strong>哲学</strong>：王阳明&quot;知行合一&quot;、庄子&quot;庖丁解牛&quot;\n<strong>语法</strong>：<code>|&gt;</code> 管道、<code>def</code> 函数、Lambda</blockquote>\n<hr>\n<h2 id=\"21-函数-功夫\">2.1 函数 = 功夫</h2>\n<pre><code class=\"lang-intent\">def double(x: Int): Int { return x * 2; };\ndef add_one(x: Int): Int { return x + 1; };</code></pre>\n<p>你刚定义了两个<strong>函数</strong>。函数是什么？</p>\n<p>传统教学中，函数是&quot;一段可重用的代码&quot;。这没错，但太浅了。</p>\n<p>王阳明有一个概念——<strong>功夫</strong>。功夫不是在书斋里读到的理论，是在事上磨炼出来的。你能背下 <code>double(x) = x <em> 2</code> 是理论，你写 <code>def double(x: Int): Int { return x </em> 2; };</code> 是功夫。</p>\n<p><strong>函数是你内化了的技艺。</strong> 你不需要每次从头想&quot;两倍是什么意思&quot;，你直接调用 <code>double(5)</code>。</p>\n<hr>\n<h2 id=\"22-管道的直觉\">2.2 管道的直觉</h2>\n<pre><code class=\"lang-intent\">let result = 5 |&gt; double |&gt; add_one;\nprint(result);  // 11</code></pre>\n<p>读法：<code>5</code> 先经过 <code>double</code>（变成 10），再经过 <code>add_one</code>（变成 11）。</p>\n<p>这是 Intent 管道 <code>|&gt;</code> 的核心直觉：<strong>数据从左到右穿过每个函数。</strong></p>\n<p>大多数语言中，你要嵌套写：</p>\n<pre><code class=\"lang-intent\">let result = add_one(double(5));</code></pre>\n<p>从里到外读。<code>double(5)</code> → 然后 <code>add_one(...)</code>。</p>\n<p>管道改变了你的认知结构。你不是嵌套，你是流动。顺着数据的方向想：</p>\n<pre><code>5 → double → 10 → add_one → 11</code></pre>\n<p>王阳明说&quot;知行合一&quot;——知和行本质上是一个东西。你知道 <code>double</code> 的存在（知），你使用它（行），这两步应该是连续的箭头，不是脱节的嵌套。管道把&quot;知&quot;和&quot;行&quot;连成一条线。</p>\n<hr>\n<h2 id=\"23-庖丁解牛的刀\">2.3 庖丁解牛的刀</h2>\n<p>庄子讲了一个庖丁解牛的故事。庖丁的刀顺着牛的纹理走，游刃有余，十九年刀刃如新。</p>\n<p>管道就是那把刀。</p>\n<pre><code class=\"lang-intent\">let evens = [];\nfor x in data {\n    if is_even(x) { push(evens, x); };\n};</code></pre>\n<p>每一步都是数据形态的一次转变：</p>\n<pre><code>原始数据 → 筛选(filter) → 偶数列表</code></pre>\n<p>大数据的流向同理：</p>\n<pre><code>.dyn文件列表 → 过滤(file exists) → 解析(get content) → 统计(count lines) → 汇总</code></pre>\n<p>庖丁没有&quot;切到一半停下来思考下一步&quot;，刀顺着纹理，一气呵成。管道的意义就是让认知顺着数据流，不停顿、不回跳。</p>\n<hr>\n<h2 id=\"24-高阶函数功夫可以传递\">2.4 高阶函数：功夫可以传递</h2>\n<pre><code class=\"lang-intent\">def triple(x: Int): Int { return x * 3; };\ndef apply_triple(num: Int): Int {\n    return triple(num);\n};\nprint(apply_triple(7));  // 21</code></pre>\n<p><code>apply_triple</code> 不自己实现三倍逻辑——它调用 <code>triple</code>。这是<strong>组合</strong>的思想。</p>\n<p>王阳明说功夫是事上磨炼的，但功夫可以传递。你练成了 <code>triple</code>，你可以把它交给 <code>apply_triple</code>。徒弟不需要自己练功，师傅把功夫传给他。</p>\n<p>在编程中，这就是高阶函数：函数可以作为参数传递、作为返回值返回。</p>\n<hr>\n<h2 id=\"25-lambda无名之功夫\">2.5 Lambda：无名之功夫</h2>\n<p>Intent 中 <code>fn</code> 创建匿名函数（Lambda）：</p>\n<pre><code class=\"lang-intent\">let doubler = fn(x: Int): Int { return x * 2; };</code></pre>\n<p>这不只是语法便利。<strong>不是所有功夫都需要一个名字。</strong> 有时候你只是需要&quot;现在给我加倍&quot;，不需要注册一个 <code>DoublerService</code>。</p>\n<p>禅宗说&quot;吃饭时吃饭，睡觉时睡觉&quot;。不是每一个动作都需要名字和标签。Lambda 就是&quot;当下的功夫&quot;——用在这里，用这一次，用过就放。</p>\n<hr>\n<h2 id=\"26-练习感受流动\">2.6 练习：感受流动</h2>\n<ol>\n<li>把 <code>5 |&gt; double |&gt; add_one</code> 改成 <code>5 |&gt; add_one |&gt; double</code>。结果从 11 变成 12。管道顺序 = 认知顺序。</li>\n<li>写三个函数：<code>inc</code>（+1）、<code>dec</code>（-1）、<code>square</code>（平方）。用管道组合：<code>10 |&gt; inc |&gt; square |&gt; dec</code>。结果是多少？</li>\n<li>如果不用管道，嵌套写出来。感受从里到外读的&quot;阻力&quot;。</li>\n</ol>\n<hr>\n<h2 id=\"27-小结\">2.7 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>def f(x) { ... }</code></td><td>功夫 = 在事上磨炼的技艺</td></tr><tr><td>`\\</td><td>&gt;` 管道</td></tr><tr><td>管道链</td><td>庖丁解牛（顺着纹理流动）</td></tr><tr><td>高阶函数</td><td>功夫可以传递</td></tr><tr><td>Lambda</td><td>当下的功夫（不需命名）</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_01_wuwei.md\">第1章：无为之始</a>\n<strong>下一章</strong>：<a href=\"chapter_03_gewu.md\">第3章：格物致知 → 穷举</a></blockquote>", "text": "第2章：知行合一 — 管道即认知流 运行代码 ： python3 src/mini_intent.py examples/lesson_02_zhixing.intent 哲学 ：王阳明&quot;知行合一&quot;、庄子&quot;庖丁解牛&quot; 语法 ： |&gt; 管道、 def 函数、Lambda 2.1 函数 = 功夫 def double(x: Int): Int { return x * 2; }; def add_one(x: Int): Int { return x + 1; }; 你刚定义了两个 函数 。函数是什么？ 传统教学中，函数是&quot;一段可重用的代码&quot;。这没错，但太浅了。 王阳明有一个概念—— 功夫 。功夫不是在书斋里读到的理论，是在事上磨炼出来的。你能背下 double(x) = x 2 是理论，你写 def double(x: Int): Int { return x 2; }; 是功夫。 函数是你内化了的技艺。 你不需要每次从头想&quot;两倍是什么意思&quot;，你直接调用 double(5) 。 2.2 管道的直觉 let result = 5 |&gt; double |&gt; add_one; print(result); // 11 读法： 5 先经过 double （变成 10），再经过 add_one （变成 11）。 这是 Intent 管道 |&gt; 的核心直觉： 数据从左到右穿过每个函数。 大多数语言中，你要嵌套写： let result = add_one(double(5)); 从里到外读。 double(5) → 然后 add_one(...) 。 管道改变了你的认知结构。你不是嵌套，你是流动。顺着数据的方向想： 5 → double → 10 → add_one → 11 王阳明说&quot;知行合一&quot;——知和行本质上是一个东西。你知道 double 的存在（知），你使用它（行），这两步应该是连续的箭头，不是脱节的嵌套。管道把&quot;知&quot;和&quot;行&quot;连成一条线。 2.3 庖丁解牛的刀 庄子讲了一个庖丁解牛的故事。庖丁的刀顺着牛的纹理走，游刃有余，十九年刀刃如新。 管道就是那把刀。 let evens = []; for x in data { if is_even(x) { push(evens, x); }; }; 每一步都是数据形态的一次转变： 原始数据 → 筛选(filter) → 偶数列表 大数据的流向同理： .dyn文件列表 → 过滤(file exists) → 解析(get content) → 统计(count lines) → 汇总 庖丁没有&quot;切到一半停下来思考下一步&quot;，刀顺着纹理，一气呵成。管道的意义就是让认知顺着数据流，不停顿、不回跳。 2.4 高阶函数：功夫可以传递 def triple(x: Int): Int { return x * 3; }; def apply_triple(num: Int): Int { return triple(num); }; print(apply_triple(7)); // 21 apply_triple 不自己实现三倍逻辑——它调用 triple 。这是 组合 的思想。 王阳明说功夫是事上磨炼的，但功夫可以传递。你练成了 triple ，你可以把它交给 apply_triple 。徒弟不需要自己练功，师傅把功夫传给他。 在编程中，这就是高阶函数：函数可以作为参数传递、作为返回值返回。 2.5 Lambda：无名之功夫 Intent 中 fn 创建匿名函数（Lambda）： let doubler = fn(x: Int): Int { return x * 2; }; 这不只是语法便利。 不是所有功夫都需要一个名字。 有时候你只是需要&quot;现在给我加倍&quot;，不需要注册一个 DoublerService 。 禅宗说&quot;吃饭时吃饭，睡觉时睡觉&quot;。不是每一个动作都需要名字和标签。Lambda 就是&quot;当下的功夫&quot;——用在这里，用这一次，用过就放。 2.6 练习：感受流动 把 5 |&gt; double |&gt; add_one 改成 5 |&gt; add_one |&gt; double 。结果从 11 变成 12。管道顺序 = 认知顺序。 写三个函数： inc （+1）、 dec （-1）、 square （平方）。用管道组合： 10 |&gt; inc |&gt; square |&gt; dec 。结果是多少？ 如果不用管道，嵌套写出来。感受从里到外读的&quot;阻力&quot;。 2.7 小结 语法 哲学 def f(x) { ... } 功夫 = 在事上磨炼的技艺 `\\ &gt;` 管道 管道链 庖丁解牛（顺着纹理流动） 高阶函数 功夫可以传递 Lambda 当下的功夫（不需命名） 上一章 ： 第1章：无为之始 下一章 ： 第3章：格物致知 → 穷举"}, {"id": "chapter_03_gewu.md", "title": "第3章：格物致知 — 穷举是一种诚实", "group": "教程", "html": "<h1 id=\"第3章格物致知-穷举是一种诚实\">第3章：格物致知 — 穷举是一种诚实</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_03_gewu.intent</code>\n<strong>哲学</strong>：朱熹&quot;格物致知&quot;、马克思&quot;具体问题具体分析&quot;\n<strong>语法</strong>：<code>match</code> 表达式、<code>enum</code> 枚举、<code>if</code> 守卫</blockquote>\n<hr>\n<h2 id=\"31-枚举世界的可能性是有限的\">3.1 枚举：世界的可能性是有限的</h2>\n<pre><code class=\"lang-intent\">enum Color { Red, Green, Blue };</code></pre>\n<p>大多数语言让你用字符串或整数表示可能性：</p>\n<pre><code>color = &quot;red&quot;    // 拼错了？&quot;reed&quot; 也能通过\ncolor = 1        // 1 是什么颜色？</code></pre>\n<p>Intent 的<code>enum</code>说：<strong>非此即彼，没有灰色地带。</strong></p>\n<p>Color 就是 Red、Green、Blue——多一个都不行，少一个也不对。</p>\n<p>朱熹说&quot;格物致知&quot;——研究事物时，要把它的每一种可能性都摆出来。枚举就是&quot;格&quot;这件事物的第一步：<strong>它的可能世界有多大？</strong></p>\n<hr>\n<h2 id=\"32-match穷举是一种道德责任\">3.2 Match：穷举是一种道德责任</h2>\n<pre><code class=\"lang-intent\">match color {\n    Color::Red =&gt; &quot;热烈&quot;,\n    Color::Green =&gt; &quot;生机&quot;,\n    Color::Blue =&gt; &quot;深邃&quot;,\n};</code></pre>\n<p><code>match</code> 强制你覆盖所有可能性。</p>\n<p>删掉 <code>Color::Blue =&gt; &quot;深邃&quot;</code>，编译器会报错：<strong>&quot;match 未穷举枚举 Color 的变体: Blue&quot;</strong>。</p>\n<p>这是 Intent 最核心的哲学设计之一：<strong>穷举性检查</strong>。</p>\n<p>大多数语言中，<code>switch</code> 有 <code>default</code>，你可以偷懒地说&quot;其他情况都这样处理&quot;。Intent 说：不行。你声明了一个枚举有三项，你就必须逐一处理三项。</p>\n<p><strong>这不是语法约束——这是道德约束。</strong></p>\n<p>你说&quot;我已经全考虑了&quot;——编译器帮你验证。就像一个诤友，在你自我感觉良好时泼冷水：你确定？那 Blue 呢？</p>\n<hr>\n<h2 id=\"33-分支-具体问题具体分析\">3.3 分支 = 具体问题具体分析</h2>\n<pre><code class=\"lang-intent\">def score_to_grade(score: Int): String {\n    if score &gt;= 90 { return &quot;A&quot;; };\n    if score &gt;= 80 { return &quot;B&quot;; };\n    if score &gt;= 70 { return &quot;C&quot;; };\n    if score &gt;= 60 { return &quot;D&quot;; };\n    return &quot;F&quot;;\n};</code></pre>\n<p>马克思说&quot;具体问题具体分析&quot;——不搞一刀切。每个分数段有自己独立的处理逻辑。</p>\n<p><code>match</code> 让这种哲学变成强制性的：每个分支是平等的、独立的、需要单独考虑的。不存在一个&quot;默认处理&quot;的垃圾箱。</p>\n<hr>\n<h2 id=\"34-模式匹配不只是值比较\">3.4 模式匹配：不只是值比较</h2>\n<pre><code class=\"lang-intent\">match result {\n    Ok(value) if value &gt; 0 =&gt; &quot;正值：&quot; + str(value),\n    Ok(value) =&gt; &quot;零或负值：&quot; + str(value),\n    Err(reason) =&gt; &quot;出错了：&quot; + reason,\n};</code></pre>\n<p><code>match</code> 不仅能匹配值，还能解构结构、绑定变量、加条件守卫。</p>\n<p>这就是&quot;格物&quot;的精密阶段：不仅把事物分类——还要深入它的内部结构。Result 有两种形态（Ok/Err），每种形态内部有数据（value/reason），你还可以加条件（if value &gt; 0）。</p>\n<hr>\n<h2 id=\"35-练习穷举你的世界\">3.5 练习：穷举你的世界</h2>\n<ol>\n<li>写一个 <code>enum Season { Spring, Summer, Autumn, Winter }</code>，用 match 为每个季节返回一句话。</li>\n<li>然后删掉 <code>Winter</code> 的分支。跑代码——看编译器的反应。</li>\n<li>加 <code>_ =&gt; &quot;其他季节&quot;</code>（通配符）。为什么编译器不再报错了？通配符是对穷举性承诺的放弃吗？</li>\n<li>想一个你日常工作中做决策的场景。如果每次决策都要&quot;穷举所有选项&quot;，会有什么变化？</li>\n</ol>\n<hr>\n<h2 id=\"36-小结\">3.6 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>enum</code></td><td>事物的可能性是有限的（格物第一步）</td></tr><tr><td><code>match</code> 穷举</td><td>覆盖所有情况是道德责任</td></tr><tr><td>模式解构</td><td>深入事物的内部结构</td></tr><tr><td><code>if</code> 守卫</td><td>具体条件具体分析</td></tr><tr><td><code>_</code> 通配符</td><td>有意识地选择放弃穷举</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_02_zhixing.md\">第2章</a>\n<strong>下一章</strong>：<a href=\"chapter_04_contract.md\">第4章</a></blockquote>", "text": "第3章：格物致知 — 穷举是一种诚实 运行代码 ： python3 src/mini_intent.py examples/lesson_03_gewu.intent 哲学 ：朱熹&quot;格物致知&quot;、马克思&quot;具体问题具体分析&quot; 语法 ： match 表达式、 enum 枚举、 if 守卫 3.1 枚举：世界的可能性是有限的 enum Color { Red, Green, Blue }; 大多数语言让你用字符串或整数表示可能性： color = &quot;red&quot; // 拼错了？&quot;reed&quot; 也能通过 color = 1 // 1 是什么颜色？ Intent 的 enum 说： 非此即彼，没有灰色地带。 Color 就是 Red、Green、Blue——多一个都不行，少一个也不对。 朱熹说&quot;格物致知&quot;——研究事物时，要把它的每一种可能性都摆出来。枚举就是&quot;格&quot;这件事物的第一步： 它的可能世界有多大？ 3.2 Match：穷举是一种道德责任 match color { Color::Red =&gt; &quot;热烈&quot;, Color::Green =&gt; &quot;生机&quot;, Color::Blue =&gt; &quot;深邃&quot;, }; match 强制你覆盖所有可能性。 删掉 Color::Blue =&gt; &quot;深邃&quot; ，编译器会报错： &quot;match 未穷举枚举 Color 的变体: Blue&quot; 。 这是 Intent 最核心的哲学设计之一： 穷举性检查 。 大多数语言中， switch 有 default ，你可以偷懒地说&quot;其他情况都这样处理&quot;。Intent 说：不行。你声明了一个枚举有三项，你就必须逐一处理三项。 这不是语法约束——这是道德约束。 你说&quot;我已经全考虑了&quot;——编译器帮你验证。就像一个诤友，在你自我感觉良好时泼冷水：你确定？那 Blue 呢？ 3.3 分支 = 具体问题具体分析 def score_to_grade(score: Int): String { if score &gt;= 90 { return &quot;A&quot;; }; if score &gt;= 80 { return &quot;B&quot;; }; if score &gt;= 70 { return &quot;C&quot;; }; if score &gt;= 60 { return &quot;D&quot;; }; return &quot;F&quot;; }; 马克思说&quot;具体问题具体分析&quot;——不搞一刀切。每个分数段有自己独立的处理逻辑。 match 让这种哲学变成强制性的：每个分支是平等的、独立的、需要单独考虑的。不存在一个&quot;默认处理&quot;的垃圾箱。 3.4 模式匹配：不只是值比较 match result { Ok(value) if value &gt; 0 =&gt; &quot;正值：&quot; + str(value), Ok(value) =&gt; &quot;零或负值：&quot; + str(value), Err(reason) =&gt; &quot;出错了：&quot; + reason, }; match 不仅能匹配值，还能解构结构、绑定变量、加条件守卫。 这就是&quot;格物&quot;的精密阶段：不仅把事物分类——还要深入它的内部结构。Result 有两种形态（Ok/Err），每种形态内部有数据（value/reason），你还可以加条件（if value &gt; 0）。 3.5 练习：穷举你的世界 写一个 enum Season { Spring, Summer, Autumn, Winter } ，用 match 为每个季节返回一句话。 然后删掉 Winter 的分支。跑代码——看编译器的反应。 加 _ =&gt; &quot;其他季节&quot; （通配符）。为什么编译器不再报错了？通配符是对穷举性承诺的放弃吗？ 想一个你日常工作中做决策的场景。如果每次决策都要&quot;穷举所有选项&quot;，会有什么变化？ 3.6 小结 语法 哲学 enum 事物的可能性是有限的（格物第一步） match 穷举 覆盖所有情况是道德责任 模式解构 深入事物的内部结构 if 守卫 具体条件具体分析 _ 通配符 有意识地选择放弃穷举 上一章 ： 第2章 下一章 ： 第4章"}, {"id": "chapter_04_contract.md", "title": "第4章：社会契约 — 代码不是孤立的存在", "group": "教程", "html": "<h1 id=\"第4章社会契约-代码不是孤立的存在\">第4章：社会契约 — 代码不是孤立的存在</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_04_contract.intent</code>\n<strong>哲学</strong>：马克思&quot;人是社会关系的总和&quot;、卢梭&quot;社会契约&quot;\n<strong>语法</strong>：<code>requires</code>（前置条件）、<code>ensures</code>（后置条件）</blockquote>\n<hr>\n<h2 id=\"41-没有函数是孤岛\">4.1 没有函数是孤岛</h2>\n<pre><code class=\"lang-intent\">def divide(a: Int, b: Int): Float requires b != 0 {\n    return a / b;\n};</code></pre>\n<p>这不是一个普通的函数定义。<code>requires b != 0</code> 是一个<strong>社会契约</strong>。</p>\n<p>调用 <code>divide(10, 0)</code> 时，解释器会在执行函数体之前检查：<code>b != 0</code> 吗？</p>\n<p>不，那就<strong>拒之门外</strong>。不是&quot;等进去之后再崩溃&quot;，而是根本不开门。</p>\n<hr>\n<h2 id=\"42-社会关系的总和\">4.2 社会关系的总和</h2>\n<p>马克思说：&quot;人是社会关系的总和。&quot; 你不仅是你的身体，你是你的家人、你的朋友、你的同事、你的社会角色。抽掉这些关系，&quot;你&quot;不再是你。</p>\n<p>函数同理。<code>divide</code> 不是它自己——它是<strong>和所有调用者的关系的总和</strong>。</p>\n<p>传统编程中，一个函数被调用时，你不知道它有什么隐含假设。你得看文档、看源码、在调用前加判断。这是&quot;全靠自觉&quot;的社会。</p>\n<p>Intent 的契约系统把&quot;自觉&quot;变成了&quot;契约&quot;：</p>\n<pre><code>requires b != 0 ← 这是我的条件，不满足就别进来\nensures result * b == a ← 这是我的承诺，出去的东西一定满足这个</code></pre>\n<p>卢梭《社会契约论》的核心命题：<strong>自由不是在规则外的无法无天，自由是在共同约定的规则下生活。</strong> <code>requires</code> 和 <code>ensures</code> 就是这个&quot;共同约定&quot;。</p>\n<hr>\n<h2 id=\"43-进门前签合同\">4.3 进门前签合同</h2>\n<pre><code class=\"lang-intent\">def transfer(from_balance, to_balance, amount: Int)\n    requires from_balance &gt;= amount\n    requires amount &gt; 0 {\n    // ...\n};</code></pre>\n<p>每一条 <code>requires</code> 是一条&quot;进门条件&quot;。</p>\n<p>不是在函数内部 <code>if amount &lt;= 0 { throw new Error(...) }</code>——那种写法的问题是，你已经在门内开始办事了才发现不对。你应该在门口就被拦下。</p>\n<p><strong>契约 = 进门前签的合同。</strong> 你不签，连门都进不去。</p>\n<p>这种设计还有一个隐藏好处：<strong>调用者自己就是有责任的。</strong> 不是&quot;这个函数报错了&quot;，而是&quot;我没有满足前置条件&quot;。责任在谁？清楚明白。</p>\n<hr>\n<h2 id=\"44-出门前验货\">4.4 出门前验货</h2>\n<pre><code class=\"lang-intent\">def safe_divide(a: Int, b: Int): Float\n    requires b != 0\n    ensures result * b == a {\n    return a / b;\n};</code></pre>\n<p><code>ensures result * b == a</code> 是一个<strong>后置条件</strong>。</p>\n<p>&quot;你进我的门，我带你去办事，然后出门之前——我们检查一下，结果是不是对的。&quot;</p>\n<p><code>result</code> 是特殊的变量，代表函数的返回值。<code>result <em> b == a</code> 是数学上的恒等式：如果 <code>a / b = result</code>，那 <code>result </em> b</code> 一定 <code>== a</code>（不考虑精度）。</p>\n<p><strong>有契约的函数，是一段可以被数学验证的代码。</strong></p>\n<hr>\n<h2 id=\"45-契约的哲学意义\">4.5 契约的哲学意义</h2>\n<ol>\n<li><strong>信任的重建</strong>：在普遍不信任的世界中（null、undefined、类型错误...），契约是重建信任的唯一方式。你不信任函数？你签它的契约。</li>\n</ol>\n<ol>\n<li><strong>责任的回归</strong>：每个调用者知道它的责任（满足 requires），每个函数知道它的承诺（保障 ensures）。不是非对称的权力关系，是平等的相互约定。</li>\n</ol>\n<ol>\n<li><strong>可验证的良知</strong>：王阳明说&quot;致良知&quot;——良知不是玄妙的感觉，是可以检验的。&quot;我有没有对调用者负责？&quot; 你看 <code>ensures</code> 就知道。</li>\n</ol>\n<hr>\n<h2 id=\"46-练习签合同\">4.6 练习：签合同</h2>\n<ol>\n<li>写一个 <code>withdraw(balance: Int, amount: Int): Int</code> 函数。需要什么 <code>requires</code>？</li>\n<li>调用 <code>withdraw(100, 150)</code>，看契约怎么拒绝。</li>\n<li>加一个 <code>ensures result &gt;= 0</code>。没有这个契约的取款函数会怎样？</li>\n</ol>\n<hr>\n<h2 id=\"47-小结\">4.7 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>requires</code></td><td>进门前签合同（社会契约）</td></tr><tr><td><code>ensures</code></td><td>出门前验货（对结果负责）</td></tr><tr><td><code>result</code></td><td>对产出负责的特殊变量</td></tr><tr><td>契约 = <code>requires + ensures</code></td><td>函数是它和所有调用者的关系总和</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_03_gewu.md\">第3章</a>\n<strong>下一章</strong>：<a href=\"chapter_05_bodhi.md\">第5章</a></blockquote>", "text": "第4章：社会契约 — 代码不是孤立的存在 运行代码 ： python3 src/mini_intent.py examples/lesson_04_contract.intent 哲学 ：马克思&quot;人是社会关系的总和&quot;、卢梭&quot;社会契约&quot; 语法 ： requires （前置条件）、 ensures （后置条件） 4.1 没有函数是孤岛 def divide(a: Int, b: Int): Float requires b != 0 { return a / b; }; 这不是一个普通的函数定义。 requires b != 0 是一个 社会契约 。 调用 divide(10, 0) 时，解释器会在执行函数体之前检查： b != 0 吗？ 不，那就 拒之门外 。不是&quot;等进去之后再崩溃&quot;，而是根本不开门。 4.2 社会关系的总和 马克思说：&quot;人是社会关系的总和。&quot; 你不仅是你的身体，你是你的家人、你的朋友、你的同事、你的社会角色。抽掉这些关系，&quot;你&quot;不再是你。 函数同理。 divide 不是它自己——它是 和所有调用者的关系的总和 。 传统编程中，一个函数被调用时，你不知道它有什么隐含假设。你得看文档、看源码、在调用前加判断。这是&quot;全靠自觉&quot;的社会。 Intent 的契约系统把&quot;自觉&quot;变成了&quot;契约&quot;： requires b != 0 ← 这是我的条件，不满足就别进来 ensures result * b == a ← 这是我的承诺，出去的东西一定满足这个 卢梭《社会契约论》的核心命题： 自由不是在规则外的无法无天，自由是在共同约定的规则下生活。 requires 和 ensures 就是这个&quot;共同约定&quot;。 4.3 进门前签合同 def transfer(from_balance, to_balance, amount: Int) requires from_balance &gt;= amount requires amount &gt; 0 { // ... }; 每一条 requires 是一条&quot;进门条件&quot;。 不是在函数内部 if amount &lt;= 0 { throw new Error(...) } ——那种写法的问题是，你已经在门内开始办事了才发现不对。你应该在门口就被拦下。 契约 = 进门前签的合同。 你不签，连门都进不去。 这种设计还有一个隐藏好处： 调用者自己就是有责任的。 不是&quot;这个函数报错了&quot;，而是&quot;我没有满足前置条件&quot;。责任在谁？清楚明白。 4.4 出门前验货 def safe_divide(a: Int, b: Int): Float requires b != 0 ensures result * b == a { return a / b; }; ensures result * b == a 是一个 后置条件 。 &quot;你进我的门，我带你去办事，然后出门之前——我们检查一下，结果是不是对的。&quot; result 是特殊的变量，代表函数的返回值。 result b == a 是数学上的恒等式：如果 a / b = result ，那 result b 一定 == a （不考虑精度）。 有契约的函数，是一段可以被数学验证的代码。 4.5 契约的哲学意义 信任的重建 ：在普遍不信任的世界中（null、undefined、类型错误...），契约是重建信任的唯一方式。你不信任函数？你签它的契约。 责任的回归 ：每个调用者知道它的责任（满足 requires），每个函数知道它的承诺（保障 ensures）。不是非对称的权力关系，是平等的相互约定。 可验证的良知 ：王阳明说&quot;致良知&quot;——良知不是玄妙的感觉，是可以检验的。&quot;我有没有对调用者负责？&quot; 你看 ensures 就知道。 4.6 练习：签合同 写一个 withdraw(balance: Int, amount: Int): Int 函数。需要什么 requires ？ 调用 withdraw(100, 150) ，看契约怎么拒绝。 加一个 ensures result &gt;= 0 。没有这个契约的取款函数会怎样？ 4.7 小结 语法 哲学 requires 进门前签合同（社会契约） ensures 出门前验货（对结果负责） result 对产出负责的特殊变量 契约 = requires + ensures 函数是它和所有调用者的关系总和 上一章 ： 第3章 下一章 ： 第5章"}, {"id": "chapter_05_bodhi.md", "title": "第5章：烦恼即菩提 — 错误是另一种正常", "group": "教程", "html": "<h1 id=\"第5章烦恼即菩提-错误是另一种正常\">第5章：烦恼即菩提 — 错误是另一种正常</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_05_bodhi.intent</code>\n<strong>哲学</strong>：禅宗&quot;烦恼即菩提&quot;、斯多葛&quot;控制你能控制的&quot;\n<strong>语法</strong>：<code>Result&lt;T,E&gt;</code>、<code>?</code> 操作符、<code>try/catch/finally</code></blockquote>\n<hr>\n<h2 id=\"51-传统的恐慌\">5.1 传统的恐慌</h2>\n<p>大多数编程语言中，错误处理是&quot;恐慌模式&quot;：</p>\n<pre><code class=\"lang-javascript\">try {\n    let result = mayFail();\n} catch (e) {\n    // 恐慌处理\n}</code></pre>\n<p>你不知道哪里会炸。你 <code>try/catch</code> 包裹一切。你的代码像走在雷区，每一步都在担心。</p>\n<p>这种模式有三个问题：</p>\n<ol>\n<li><strong>二分世界</strong>：一个&quot;正常路径&quot;和一个&quot;异常路径&quot;。而现实中，错误和正常是连续的。</li>\n<li><strong>控制流断裂</strong>：catch 块跳出正常流程，你的思维被打断。</li>\n<li><strong>责任模糊</strong>：谁该catch？调用者？调用者的调用者？</li>\n</ol>\n<hr>\n<h2 id=\"52-result错误也是一种值\">5.2 Result：错误也是一种值</h2>\n<p>Intent 的核心理念：<strong>错误就是另一种返回值。</strong></p>\n<pre><code class=\"lang-intent\">// Ok(value) 和 Err(reason) 是平等的两支\nmatch result {\n    Ok(value) =&gt; &quot;成功了：&quot; + str(value),\n    Err(reason) =&gt; &quot;出错了：&quot; + reason,\n};</code></pre>\n<p><code>Ok</code> 和 <code>Err</code> 是同一个 <code>Result</code> 类型的两个变体。不存在&quot;正常路径&quot;和&quot;异常路径&quot;的二分——他们都是返回值。</p>\n<p>禅宗说&quot;烦恼即菩提&quot;。烦恼不是要消灭的东西——认识了烦恼，烦恼本身就是智慧。</p>\n<p>Ok 和 Err 是平等的。就像白天和黑夜，都是天空的自然状态。</p>\n<hr>\n<h2 id=\"53-操作符平静地传播\">5.3 <code>?</code> 操作符：平静地传播</h2>\n<pre><code class=\"lang-intent\">def might_fail(): Result[Int, String] {\n    return Err(&quot;除数不能为零&quot;);\n};\n\ndef caller(): Result[Int, String] {\n    let value = might_fail()?;  // ← 如果 Err，直接返回 Err\n    return Ok(value * 2);\n};</code></pre>\n<p><code>?</code> 操作符的语义：如果是 Ok，拆包取值；如果是 Err，<strong>平静地向上传播</strong>。</p>\n<p>你没有&quot;恐慌&quot;，没有&quot;崩溃&quot;，没有&quot;抛异常&quot;。你只是说：<strong>这不是我能处理的，交给上一层。</strong></p>\n<p>斯多葛哲学的核心：区分&quot;我控制得了的&quot;和&quot;我控制不了的&quot;。<code>?</code> 就是这个区分。</p>\n<p>调用 <code>might_fail()</code> 时，<code>?</code> 说：&quot;这个函数可能返回错误，但我处理不了——我让调用者来决定。&quot;</p>\n<p>不是逃避责任，是<strong>知道自己的边界</strong>。</p>\n<hr>\n<h2 id=\"54-trycatch最后的安全网\">5.4 try/catch：最后的安全网</h2>\n<p><code>?</code> 处理了大部分错误传播。但有些操作（比如除零）是运行时才能发现的：</p>\n<pre><code class=\"lang-intent\">try {\n    let x = 1 / 0;\n} catch {\n    print(&quot;捕获到了错误！&quot;);\n};</code></pre>\n<p>注意：catch 不需要 <code>catch(e)</code> 然后检查 e 的具体类型。能 catch 的就是被抓住了——你已经认识了它。</p>\n<p><strong>你看到错误，你理解了它，你没有被它打败——你认识了它。</strong> 这就是&quot;烦恼即菩提&quot;的最终转化。</p>\n<hr>\n<h2 id=\"55-finally无论如何\">5.5 finally：无论如何</h2>\n<pre><code class=\"lang-intent\">try {\n    // 可能失败的操作\n} catch {\n    // 处理错误\n} finally {\n    // 无论如何都会执行\n};</code></pre>\n<p><code>finally</code> 是最有哲学感的语法：<strong>无论成功失败，善始善终。</strong></p>\n<p>在循环中尤其美妙：</p>\n<pre><code class=\"lang-intent\">while try_count &lt; 5 {\n    try_count = try_count + 1;\n    try {\n        if try_count == 3 { let z = 1 / 0; };\n        print(&quot;第&quot;, try_count, &quot;次尝试：成功&quot;);\n    } catch {\n        error_count = error_count + 1;\n        print(&quot;第&quot;, try_count, &quot;次尝试：失败（但继续）&quot;);\n    };\n};</code></pre>\n<p><strong>受伤 ≠ 死亡。</strong> 失败一次，不是人生的终结。计数器继续走，下一个循环开始。</p>\n<hr>\n<h2 id=\"56-一场修行in-a-loop\">5.6 一场修行（In a Loop）</h2>\n<pre><code>尝试 5 次，失败 1 次</code></pre>\n<p>1/5 的失败率。一次除零。</p>\n<p>在传统编程中，一次除零 = 程序崩溃 = 所有状态丢失 = 重新开始。</p>\n<p>在 Intent 的 <code>try/catch in a loop</code> 中：一次除零 = 一次 catch = 计数器 +1 = 继续。</p>\n<p><strong>禅宗说&quot;烦恼就是菩提&quot;，斯多葛说&quot;控制你能控制的&quot;。try/catch in a loop 就是把这两个哲学翻译成代码。</strong></p>\n<p>你不能控制除零发生（控制不了），但你能控制：发生了怎么办、继续还是不继续、计数不计入。（控制得了的。）</p>\n<hr>\n<h2 id=\"57-练习受伤后继续走\">5.7 练习：受伤后继续走</h2>\n<ol>\n<li>写一个 <code>parse_int(s: String): Result[Int, String]</code>。如果 s 是 &quot;123&quot; 返回 Ok(123)，否则返回 Err(&quot;不是数字&quot;)。</li>\n<li>用 <code>?</code> 链式调用三个可能失败的函数。</li>\n<li>在 while 循环中放 try/catch，失败后继续。数一数成功了几次、失败了几次。</li>\n</ol>\n<hr>\n<h2 id=\"58-小结\">5.8 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>Result&lt;T,E&gt;</code></td><td>Ok 和 Err 是平等的（错误是另一种正常）</td></tr><tr><td><code>?</code></td><td>平静地传播（知道自己的边界）</td></tr><tr><td><code>try/catch</code></td><td>烦恼即菩提（认识错误=转化错误）</td></tr><tr><td><code>finally</code></td><td>善始善终（无论如何）</td></tr><tr><td><code>try in a loop</code></td><td>受伤≠死亡（下一次循环继续）</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_04_contract.md\">第4章</a>\n<strong>下一章</strong>：<a href=\"chapter_06_dialectic.md\">第6章</a></blockquote>", "text": "第5章：烦恼即菩提 — 错误是另一种正常 运行代码 ： python3 src/mini_intent.py examples/lesson_05_bodhi.intent 哲学 ：禅宗&quot;烦恼即菩提&quot;、斯多葛&quot;控制你能控制的&quot; 语法 ： Result&lt;T,E&gt; 、 ? 操作符、 try/catch/finally 5.1 传统的恐慌 大多数编程语言中，错误处理是&quot;恐慌模式&quot;： try { let result = mayFail(); } catch (e) { // 恐慌处理 } 你不知道哪里会炸。你 try/catch 包裹一切。你的代码像走在雷区，每一步都在担心。 这种模式有三个问题： 二分世界 ：一个&quot;正常路径&quot;和一个&quot;异常路径&quot;。而现实中，错误和正常是连续的。 控制流断裂 ：catch 块跳出正常流程，你的思维被打断。 责任模糊 ：谁该catch？调用者？调用者的调用者？ 5.2 Result：错误也是一种值 Intent 的核心理念： 错误就是另一种返回值。 // Ok(value) 和 Err(reason) 是平等的两支 match result { Ok(value) =&gt; &quot;成功了：&quot; + str(value), Err(reason) =&gt; &quot;出错了：&quot; + reason, }; Ok 和 Err 是同一个 Result 类型的两个变体。不存在&quot;正常路径&quot;和&quot;异常路径&quot;的二分——他们都是返回值。 禅宗说&quot;烦恼即菩提&quot;。烦恼不是要消灭的东西——认识了烦恼，烦恼本身就是智慧。 Ok 和 Err 是平等的。就像白天和黑夜，都是天空的自然状态。 5.3 ? 操作符：平静地传播 def might_fail(): Result[Int, String] { return Err(&quot;除数不能为零&quot;); }; def caller(): Result[

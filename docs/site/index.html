Int, String] { let value = might_fail()?; // ← 如果 Err，直接返回 Err return Ok(value * 2); }; ? 操作符的语义：如果是 Ok，拆包取值；如果是 Err， 平静地向上传播 。 你没有&quot;恐慌&quot;，没有&quot;崩溃&quot;，没有&quot;抛异常&quot;。你只是说： 这不是我能处理的，交给上一层。 斯多葛哲学的核心：区分&quot;我控制得了的&quot;和&quot;我控制不了的&quot;。 ? 就是这个区分。 调用 might_fail() 时， ? 说：&quot;这个函数可能返回错误，但我处理不了——我让调用者来决定。&quot; 不是逃避责任，是 知道自己的边界 。 5.4 try/catch：最后的安全网 ? 处理了大部分错误传播。但有些操作（比如除零）是运行时才能发现的： try { let x = 1 / 0; } catch { print(&quot;捕获到了错误！&quot;); }; 注意：catch 不需要 catch(e) 然后检查 e 的具体类型。能 catch 的就是被抓住了——你已经认识了它。 你看到错误，你理解了它，你没有被它打败——你认识了它。 这就是&quot;烦恼即菩提&quot;的最终转化。 5.5 finally：无论如何 try { // 可能失败的操作 } catch { // 处理错误 } finally { // 无论如何都会执行 }; finally 是最有哲学感的语法： 无论成功失败，善始善终。 在循环中尤其美妙： while try_count &lt; 5 { try_count = try_count + 1; try { if try_count == 3 { let z = 1 / 0; }; print(&quot;第&quot;, try_count, &quot;次尝试：成功&quot;); } catch { error_count = error_count + 1; print(&quot;第&quot;, try_count, &quot;次尝试：失败（但继续）&quot;); }; }; 受伤 ≠ 死亡。 失败一次，不是人生的终结。计数器继续走，下一个循环开始。 5.6 一场修行（In a Loop） 尝试 5 次，失败 1 次 1/5 的失败率。一次除零。 在传统编程中，一次除零 = 程序崩溃 = 所有状态丢失 = 重新开始。 在 Intent 的 try/catch in a loop 中：一次除零 = 一次 catch = 计数器 +1 = 继续。 禅宗说&quot;烦恼就是菩提&quot;，斯多葛说&quot;控制你能控制的&quot;。try/catch in a loop 就是把这两个哲学翻译成代码。 你不能控制除零发生（控制不了），但你能控制：发生了怎么办、继续还是不继续、计数不计入。（控制得了的。） 5.7 练习：受伤后继续走 写一个 parse_int(s: String): Result[Int, String] 。如果 s 是 &quot;123&quot; 返回 Ok(123)，否则返回 Err(&quot;不是数字&quot;)。 用 ? 链式调用三个可能失败的函数。 在 while 循环中放 try/catch，失败后继续。数一数成功了几次、失败了几次。 5.8 小结 语法 哲学 Result&lt;T,E&gt; Ok 和 Err 是平等的（错误是另一种正常） ? 平静地传播（知道自己的边界） try/catch 烦恼即菩提（认识错误=转化错误） finally 善始善终（无论如何） try in a loop 受伤≠死亡（下一次循环继续） 上一章 ： 第4章 下一章 ： 第6章"}, {"id": "chapter_06_dialectic.md", "title": "第6章：辩证统一 — 否定不是消灭，是超越", "group": "教程", "html": "<h1 id=\"第6章辩证统一-否定不是消灭是超越\">第6章：辩证统一 — 否定不是消灭，是超越</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_06_dialectic.intent</code>\n<strong>哲学</strong>：黑格尔&quot;正→反→合&quot;、马克思&quot;扬弃&quot;、萨特&quot;存在先于本质&quot;\n<strong>语法</strong>：<code>enum</code> 枚举、函数组合、辩证思维模式</blockquote>\n<hr>\n<h2 id=\"61-规定性是什么\">6.1 规定性：是什么？</h2>\n<pre><code class=\"lang-intent\">enum Color { Red, Green, Blue };</code></pre>\n<p><code>enum</code> 定义了 Color 的可能性：非此即彼，不可兼得。</p>\n<p>黑格尔说：<strong>任何事物首先是通过它的规定性来定义的。</strong> &quot;这个苹果是红色的&quot;——在说它不是什么（不是绿色、不是蓝色）的同时，界定了它是什么。</p>\n<p>这就是 <strong>&quot;规定即否定&quot;</strong>（determinatio est negatio）。斯宾诺莎的命题，黑格尔的核心。</p>\n<p>编程中的类型系统就是&quot;规定即否定&quot;的精确形式。<code>Int</code> 不仅告诉你它是什么——它同时告诉你它不能是什么（不是 String，不是 Bool）。</p>\n<hr>\n<h2 id=\"62-否定不是消灭\">6.2 否定：不是消灭</h2>\n<pre><code class=\"lang-intent\">def negate(x: Int): Int { return -x; };\n\nlet x = 5;\nlet y = negate(x);  // -5</code></pre>\n<p><code>negate(5) = -5</code> —— 这是一个否定操作。但它不只是消灭了 5。</p>\n<p>黑格尔的&quot;否定&quot;不是&quot;消除&quot;——<strong>否定是在更高层次上超越。</strong> 5 被否定产生了 -5，但 <code>negate</code> 函数作为概念比你拥有 5 或 -5 更高。你理解了&quot;取反&quot;<strong>这个操作本身</strong>，你就超越了具体的数值。</p>\n<p>在代码中：</p>\n<ul>\n<li>正题（thesis）：<code>x = 5</code></li>\n<li>反题（antithesis）：<code>negate(x) = -5</code></li>\n<li>合题（synthesis）：<strong>理解了 <code>negate</code> 函数本身</strong>。你不再被具体值束缚，你掌握了变换规则。</li>\n</ul>\n<hr>\n<h2 id=\"63-扬弃-aufheben\">6.3 扬弃 = Aufheben</h2>\n<pre><code class=\"lang-intent\">def greet_person(name: String): String {\n    return &quot;你好，我是&quot; + name;\n};\n\ndef greet_student(name: String, grade: Int): String {\n    return &quot;你好，我是学生&quot; + name + &quot;，年级&quot; + str(grade);\n};</code></pre>\n<p><code>greet_student</code> 对 <code>greet_person</code> 做了什么？</p>\n<ul>\n<li><strong>保留</strong>：name 参数还在</li>\n<li><strong>超越</strong>：新增了 grade 参数，重写了 greeting 逻辑</li>\n</ul>\n<p>马克思把这个过程叫<strong>扬弃</strong>（Aufheben）——德语中同时有&quot;保存&quot;、&quot;取消&quot;和&quot;提升&quot;三重意思。子类不是照搬父类，也不是完全抛弃——<strong>它保留了有用的，超越了不够好的。</strong></p>\n<hr>\n<h2 id=\"64-三次否定-三个层次\">6.4 三次否定 = 三个层次</h2>\n<pre><code class=\"lang-intent\">let v = 0;\nlet v1 = tick_val(tick_val(tick_val(v)));  // 3</code></pre>\n<p><code>tick_val</code> 被应用了三次，从 0 到了 3。</p>\n<p>这是黑格尔&quot;量变到质变&quot;的微观版本。三次 tick = 三个否定。每一次否定不是回到原点——<strong>它是在累积。</strong></p>\n<p>你不只是&quot;了解了 tick 是什么意思&quot;。你看到 <code>tick(tick(tick(...)))</code> 这个写法时，你意识到：<strong>函数组合本身就是辩证法的操作。</strong></p>\n<hr>\n<h2 id=\"65-萨特你做什么你就是什么\">6.5 萨特：你做什么，你就是什么</h2>\n<pre><code class=\"lang-intent\">def create_counter(start: Int): Int { return start; };\ndef tick_val(val: Int): Int { return val + 1; };</code></pre>\n<p><code>create_counter(0)</code> 创建了一个&quot;计数器&quot;。</p>\n<p><strong>萨特说&quot;存在先于本质&quot;。</strong> 你不是先有一个&quot;计数器的本质&quot;再去实现它。你写下了 <code>create_counter</code> 和 <code>tick_val</code>，然后<strong>通过 tick 的行动</strong>，那些数字被定义成了计数器。</p>\n<p>0 本身什么也不是。<code>tick(0) = 1</code> 让 0 成为了&quot;可以递增的东西&quot;。你的行动定义了它是什么。</p>\n<p>在编程中：<strong>写代码是一个自我定义的过程。</strong> 你写的每一行代码，都在定义你是谁——是手动实现 <code>sort</code> 的人，还是调用 <code>sorted</code> 的人？是 panic on error 的人，还是 <code>match</code> 穷举的人？</p>\n<hr>\n<h2 id=\"66-练习辩证法在代码中\">6.6 练习：辩证法在代码中</h2>\n<ol>\n<li>写一个 <code>flip(x: Int): Int { return -x; }</code>。然后写 <code>flip(flip(x))</code>。看输出。这是&quot;否定之否定&quot;在代码中最纯粹的形态。</li>\n<li>写三个版本的问候函数：<code>greet_simple(name)</code>、<code>greet_formal(name, title)</code>、<code>greet_verbose(name, title, location)</code>。每次新增参数，既保留了旧行为，又超越了。这就是扬弃。</li>\n<li>想一个你已经写过的函数。它的 v1 版本是什么？v2 版本改了什么？v2 是在&quot;保留&quot;v1 的基础上&quot;超越&quot;的，还是完全推倒重来的？</li>\n</ol>\n<hr>\n<h2 id=\"67-小结\">6.7 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>enum</code></td><td>规定即否定（类型 = 界定边界）</td></tr><tr><td><code>negate(x)</code></td><td>否定不是消灭，是对变换的理解</td></tr><tr><td>函数组合</td><td>正题 → 反题 → 合题</td></tr><tr><td>参数扩展</td><td>扬弃 = 保留 + 超越（Aufheben）</td></tr><tr><td><code>create → tick</code></td><td>存在先于本质（行动定义存在）</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_05_bodhi.md\">第5章</a>\n<strong>下一章</strong>：<a href=\"chapter_07_ecosystem.md\">第7章</a></blockquote>", "text": "第6章：辩证统一 — 否定不是消灭，是超越 运行代码 ： python3 src/mini_intent.py examples/lesson_06_dialectic.intent 哲学 ：黑格尔&quot;正→反→合&quot;、马克思&quot;扬弃&quot;、萨特&quot;存在先于本质&quot; 语法 ： enum 枚举、函数组合、辩证思维模式 6.1 规定性：是什么？ enum Color { Red, Green, Blue }; enum 定义了 Color 的可能性：非此即彼，不可兼得。 黑格尔说： 任何事物首先是通过它的规定性来定义的。 &quot;这个苹果是红色的&quot;——在说它不是什么（不是绿色、不是蓝色）的同时，界定了它是什么。 这就是 &quot;规定即否定&quot; （determinatio est negatio）。斯宾诺莎的命题，黑格尔的核心。 编程中的类型系统就是&quot;规定即否定&quot;的精确形式。 Int 不仅告诉你它是什么——它同时告诉你它不能是什么（不是 String，不是 Bool）。 6.2 否定：不是消灭 def negate(x: Int): Int { return -x; }; let x = 5; let y = negate(x); // -5 negate(5) = -5 —— 这是一个否定操作。但它不只是消灭了 5。 黑格尔的&quot;否定&quot;不是&quot;消除&quot;—— 否定是在更高层次上超越。 5 被否定产生了 -5，但 negate 函数作为概念比你拥有 5 或 -5 更高。你理解了&quot;取反&quot; 这个操作本身 ，你就超越了具体的数值。 在代码中： 正题（thesis）： x = 5 反题（antithesis）： negate(x) = -5 合题（synthesis）： 理解了 negate 函数本身 。你不再被具体值束缚，你掌握了变换规则。 6.3 扬弃 = Aufheben def greet_person(name: String): String { return &quot;你好，我是&quot; + name; }; def greet_student(name: String, grade: Int): String { return &quot;你好，我是学生&quot; + name + &quot;，年级&quot; + str(grade); }; greet_student 对 greet_person 做了什么？ 保留 ：name 参数还在 超越 ：新增了 grade 参数，重写了 greeting 逻辑 马克思把这个过程叫 扬弃 （Aufheben）——德语中同时有&quot;保存&quot;、&quot;取消&quot;和&quot;提升&quot;三重意思。子类不是照搬父类，也不是完全抛弃—— 它保留了有用的，超越了不够好的。 6.4 三次否定 = 三个层次 let v = 0; let v1 = tick_val(tick_val(tick_val(v))); // 3 tick_val 被应用了三次，从 0 到了 3。 这是黑格尔&quot;量变到质变&quot;的微观版本。三次 tick = 三个否定。每一次否定不是回到原点—— 它是在累积。 你不只是&quot;了解了 tick 是什么意思&quot;。你看到 tick(tick(tick(...))) 这个写法时，你意识到： 函数组合本身就是辩证法的操作。 6.5 萨特：你做什么，你就是什么 def create_counter(start: Int): Int { return start; }; def tick_val(val: Int): Int { return val + 1; }; create_counter(0) 创建了一个&quot;计数器&quot;。 萨特说&quot;存在先于本质&quot;。 你不是先有一个&quot;计数器的本质&quot;再去实现它。你写下了 create_counter 和 tick_val ，然后 通过 tick 的行动 ，那些数字被定义成了计数器。 0 本身什么也不是。 tick(0) = 1 让 0 成为了&quot;可以递增的东西&quot;。你的行动定义了它是什么。 在编程中： 写代码是一个自我定义的过程。 你写的每一行代码，都在定义你是谁——是手动实现 sort 的人，还是调用 sorted 的人？是 panic on error 的人，还是 match 穷举的人？ 6.6 练习：辩证法在代码中 写一个 flip(x: Int): Int { return -x; } 。然后写 flip(flip(x)) 。看输出。这是&quot;否定之否定&quot;在代码中最纯粹的形态。 写三个版本的问候函数： greet_simple(name) 、 greet_formal(name, title) 、 greet_verbose(name, title, location) 。每次新增参数，既保留了旧行为，又超越了。这就是扬弃。 想一个你已经写过的函数。它的 v1 版本是什么？v2 版本改了什么？v2 是在&quot;保留&quot;v1 的基础上&quot;超越&quot;的，还是完全推倒重来的？ 6.7 小结 语法 哲学 enum 规定即否定（类型 = 界定边界） negate(x) 否定不是消灭，是对变换的理解 函数组合 正题 → 反题 → 合题 参数扩展 扬弃 = 保留 + 超越（Aufheben） create → tick 存在先于本质（行动定义存在） 上一章 ： 第5章 下一章 ： 第7章"}, {"id": "chapter_07_ecosystem.md", "title": "第7章：万物一体 — 世界在我诞生前已准备好", "group": "教程", "html": "<h1 id=\"第7章万物一体-世界在我诞生前已准备好\">第7章：万物一体 — 世界在我诞生前已准备好</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_07_ecosystem.intent</code>\n<strong>哲学</strong>：庄子&quot;天地与我并生&quot;、王阳明&quot;万物一体之仁&quot;\n<strong>语法</strong>：<code>import</code>/<code>export</code> 模块系统、推导式、<code>range</code></blockquote>\n<hr>\n<h2 id=\"71-你不孤独\">7.1 你不孤独</h2>\n<pre><code class=\"lang-intent\">import std.math;\n\nlet num = 3.0;\nprint(sqrt(num));   // 1.732...\nprint(abs(-5));     // 5</code></pre>\n<p><code>import std.math</code> 不是技术操作——它是一句哲学声明。</p>\n<p><strong>在我诞生之前，世界已经准备好了工具。</strong> <code>sqrt</code> 不是你的发明，它是世界的赠予。</p>\n<p>庄子说&quot;天地与我并生&quot;——天地既是父母，也先于你而存在。你在出生时就已拥有整个世界。<code>import</code> 就是这个&quot;与世界连接&quot;的仪式。</p>\n<hr>\n<h2 id=\"72-发明-vs-组合\">7.2 发明 vs 组合</h2>\n<pre><code class=\"lang-intent\">let nums = [3, 1, 4, 1, 5, 9, 2, 6];\nlet s = sum(nums);\nlet c = len(nums);</code></pre>\n<p>你不写循环来求和。你不写遍历来数长度。</p>\n<p><strong>你的工作不是发明，是组合。</strong> 找到已有的模块，然后用管道和函数把它们串起来。</p>\n<p>这是&quot;万物一体之仁&quot;的技术翻译：你不是独立的个体，你是生态中的一环。标准库就是你的&quot;万物&quot;。</p>\n<hr>\n<h2 id=\"73-推导式组合的艺术\">7.3 推导式：组合的艺术</h2>\n<pre><code class=\"lang-intent\">let evens = [x for x in nums if x % 2 == 0];\nlet doubled = [x * 2 for x in evens];</code></pre>\n<p>列表推导式 —— 一行代码完成筛选 + 变换。</p>\n<p>这不是&quot;更短的写法&quot;，这是<strong>一种不同的认知方式</strong>。传统写法需要：</p>\n<ul>\n<li>建立空列表</li>\n<li>for 循环遍历</li>\n<li>if 条件检查</li>\n<li>push 进列表</li>\n</ul>\n<p>推导式一句话：<strong>&quot;从 nums 中取出 x，满足 x%2==0 的就放进来&quot;。</strong> 你的思维是&quot;描述结果&quot;，不是&quot;描述过程&quot;。</p>\n<p>王阳明说&quot;心即理也&quot;——你的心直接把握了问题的本质，不需要逐步推导。</p>\n<hr>\n<h2 id=\"74-世界已经在那里\">7.4 世界已经在那里</h2>\n<pre><code class=\"lang-intent\">let d = {&quot;name&quot;: &quot;Intent&quot;, &quot;version&quot;: &quot;1.2&quot;, &quot;status&quot;: &quot;active&quot;};\nprint(keys(d));  // [&quot;name&quot;, &quot;version&quot;, &quot;status&quot;]</code></pre>\n<p><code>keys()</code>、<code>len()</code>、<code>str()</code>、<code>type_of()</code>... 70+ 内置函数。在你诞生前，世界的建构者们已经准备好了。</p>\n<p>你用不了哪个？你可以自己实现。但你不必——<strong>你的任务是借用，不是重造。</strong></p>\n<hr>\n<h2 id=\"75-range时间的礼物\">7.5 Range：时间的礼物</h2>\n<pre><code class=\"lang-intent\">let nums = range(5);\n// [0, 1, 2, 3, 4]</code></pre>\n<p><code>range(5)</code> 不是魔法——它是&quot;时间的每一个瞬间&quot;。0、1、2、3、4——就像你的每一天。</p>\n<p>古人看天、观星、数日子。<code>range</code> 就是&quot;数日子&quot;的编程形式。你不需要自己数——世界给了你 <code>range</code>。</p>\n<hr>\n<h2 id=\"76-练习感受生态\">7.6 练习：感受生态</h2>\n<ol>\n<li>用 <code>range(10)</code> + 列表推导式生成平方数列表：<code>[0, 1, 4, 9, ...]</code></li>\n<li>用 <code>range</code> + <code>map</code> 做同样的操作。哪种写法更自然？</li>\n<li>打开 <code>std/</code> 目录，浏览任意一个模块。感受&quot;这些工具在你诞生前就已经在了&quot;。</li>\n</ol>\n<hr>\n<h2 id=\"77-小结\">7.7 小结</h2>\n<table><thead><tr><th>语法</th><th>哲学</th></tr></thead><tbody><tr><td><code>import</code></td><td>与世界的连接（万物一体）</td></tr><tr><td>推导式</td><td>描述结果而非过程（心即理）</td></tr><tr><td>70+ builtins</td><td>世界在我诞生前已准备好</td></tr><tr><td><code>range</code></td><td>时间之流（每一个瞬间）</td></tr><tr><td>组合 &gt; 发明</td><td>万物一体之仁（你不孤独）</td></tr></tbody></table>\n<blockquote><strong>上一章</strong>：<a href=\"chapter_06_dialectic.md\">第6章</a>\n<strong>下一章</strong>：<a href=\"chapter_08_finitude.md\">第8章</a></blockquote>", "text": "第7章：万物一体 — 世界在我诞生前已准备好 运行代码 ： python3 src/mini_intent.py examples/lesson_07_ecosystem.intent 哲学 ：庄子&quot;天地与我并生&quot;、王阳明&quot;万物一体之仁&quot; 语法 ： import / export 模块系统、推导式、 range 7.1 你不孤独 import std.math; let num = 3.0; print(sqrt(num)); // 1.732... print(abs(-5)); // 5 import std.math 不是技术操作——它是一句哲学声明。 在我诞生之前，世界已经准备好了工具。 sqrt 不是你的发明，它是世界的赠予。 庄子说&quot;天地与我并生&quot;——天地既是父母，也先于你而存在。你在出生时就已拥有整个世界。 import 就是这个&quot;与世界连接&quot;的仪式。 7.2 发明 vs 组合 let nums = [3, 1, 4, 1, 5, 9, 2, 6]; let s = sum(nums); let c = len(nums); 你不写循环来求和。你不写遍历来数长度。 你的工作不是发明，是组合。 找到已有的模块，然后用管道和函数把它们串起来。 这是&quot;万物一体之仁&quot;的技术翻译：你不是独立的个体，你是生态中的一环。标准库就是你的&quot;万物&quot;。 7.3 推导式：组合的艺术 let evens = [x for x in nums if x % 2 == 0]; let doubled = [x * 2 for x in evens]; 列表推导式 —— 一行代码完成筛选 + 变换。 这不是&quot;更短的写法&quot;，这是 一种不同的认知方式 。传统写法需要： 建立空列表 for 循环遍历 if 条件检查 push 进列表 推导式一句话： &quot;从 nums 中取出 x，满足 x%2==0 的就放进来&quot;。 你的思维是&quot;描述结果&quot;，不是&quot;描述过程&quot;。 王阳明说&quot;心即理也&quot;——你的心直接把握了问题的本质，不需要逐步推导。 7.4 世界已经在那里 let d = {&quot;name&quot;: &quot;Intent&quot;, &quot;version&quot;: &quot;1.2&quot;, &quot;status&quot;: &quot;active&quot;}; print(keys(d)); // [&quot;name&quot;, &quot;version&quot;, &quot;status&quot;] keys() 、 len() 、 str() 、 type_of() ... 70+ 内置函数。在你诞生前，世界的建构者们已经准备好了。 你用不了哪个？你可以自己实现。但你不必—— 你的任务是借用，不是重造。 7.5 Range：时间的礼物 let nums = range(5); // [0, 1, 2, 3, 4] range(5) 不是魔法——它是&quot;时间的每一个瞬间&quot;。0、1、2、3、4——就像你的每一天。 古人看天、观星、数日子。 range 就是&quot;数日子&quot;的编程形式。你不需要自己数——世界给了你 range 。 7.6 练习：感受生态 用 range(10) + 列表推导式生成平方数列表： [0, 1, 4, 9, ...] 用 range + map 做同样的操作。哪种写法更自然？ 打开 std/ 目录，浏览任意一个模块。感受&quot;这些工具在你诞生前就已经在了&quot;。 7.7 小结 语法 哲学 import 与世界的连接（万物一体） 推导式 描述结果而非过程（心即理） 70+ builtins 世界在我诞生前已准备好 range 时间之流（每一个瞬间） 组合 &gt; 发明 万物一体之仁（你不孤独） 上一章 ： 第6章 下一章 ： 第8章"}, {"id": "chapter_08_finitude.md", "title": "第8章：向死而生 — 结束使一切有意义", "group": "教程", "html": "<h1 id=\"第8章向死而生-结束使一切有意义\">第8章：向死而生 — 结束使一切有意义</h1>\n<blockquote><strong>运行代码</strong>：<code>python3 src/mini_intent.py examples/lesson_08_finitude.intent</code>\n<strong>哲学</strong>：海德格尔&quot;向死而生&quot;、道家&quot;功成身退&quot;、王阳明&quot;此心光明&quot;\n<strong>语法</strong>：<code>defer</code> 语句、闭包、<code>yield</code> 生成器</blockquote>\n<hr>\n<h2 id=\"81-出生时就写下遗嘱\">8.1 出生时就写下遗嘱</h2>\n<pre><code class=\"lang-intent\">def process_file(path: String) {\n    let f = open(path);\n    defer { close(f); };\n    \n    // 处理文件...\n    // 无论中间发生什么，close(f) 最后都会执行\n};</code></pre>\n<p><code>defer { close(f); }</code> 写在函数入口附近，执行在出口。</p>\n<p>这是一个哲学性的设计：<strong>资源的清理代码，写在获取资源的同时。</strong></p>\n<p>你打开文件，就写下关闭它。你分配内存，就写下释放它。你开始一段关系，就想好如何告别。</p>\n<p>海德格尔说&quot;向死而生&quot;——人的有限性不是缺陷，而是使生命有意义的条件。正因为会死，才需要认真活。</p>\n<p><code>defer</code> 就是这个思想的代码形式：正因为函数会结束，才需要写 <code>defer</code>。<strong>结束不是意外，结束是函数的一部分。</strong></p>\n<hr>\n<h2 id=\"82-提前退出也不怕\">8.2 提前退出也不怕</h2>\n<pre><code class=\"lang-intent\">def early_return(flag: Int) {\n    let mut data = 0;\n    defer { print(&quot;cleanup: data was &quot;, data); };\n    \n    if flag { return; };\n    data = 42;\n};</code></pre>\n<p>即使提前 <code>return</code>，<code>defer</code> 也会执行。</p>\n<p>你不需要在每一个 <code>return</code> 语句前手动加清理代码。<code>defer</code> 是一次性的承诺：&quot;无论从哪条路离开，我善后。&quot;</p>\n<p>道家说&quot;功成身退，天之道也&quot;——完成了使命就离开。<code>defer</code> 是&quot;身退&quot;的代码保证：你不带着资源泄露离开。</p>\n<hr>\n<h2 id=\"83-闭包此心光明\">8.3 闭包：此心光明</h2>\n<pre><code class=\"lang-intent\">def make_counter(start: Int) {\n    let mut count = start;\n    return fn(): Int {\n        count = count + 1;\n        return count;\n    };\n};\n\nlet counter = make_counter(0);\nprint(counter());  // 1\nprint(counter());  // 2\nprint(counter());  // 3</code></pre>\n<p><code>make_counter</code> 返回了一个<strong>闭包</strong>——一个&quot;携带诞生环境&quot;的函数。</p>\n<p><code>count</code> 是 <code>make_counter</code> 的局部变量。按理说函数返回后它就死了。但闭包<strong>保留了诞生时的世界</strong>。<code>count</code> 还活着，<code>counter()</code> 每次调用都在这个保存的世界中递增。</p>\n<p>王阳明说&quot;此心光明，亦复何言&quot;——这颗心无论走到哪儿，都是亮的。闭包携带诞生环境，无论被传递到哪儿，它都记得自己来自哪里。</p>\n<p>这不只是技术特性——<strong>闭包是&quot;不忘初心&quot;的程序形式。</strong></p>\n<hr>\n<h2 id=\"84-yield生生不息\">8.4 Yield：生生不息</h2>\n<pre><code class=\"lang-intent\">def numbers() {\n    let mut i = 0;\n    while i &lt; 5 {\n        yield i;\n        i = i + 1;\n    };\n};</code></pre>\n<p><code>yield</code> 是生成器——函数不是一次性执行完，而是一点点&quot;产出&quot;值，让调用者每次取一个。</p>\n<p>这是&quot;生生不息&quot;的哲学：《易经》说&quot;生生之谓易&quot;——创造力不是一次性的爆发，是持续的产出。</p>\n<p><code>yield</code> 在代码层面上实现了这种哲学：你可以 <code>for x in numbers()</code> 遍历一个无限的流（理论上）。不是算好了所有结果再返回——<strong>算一个，给一个。</strong></p>\n<p>道家说&quot;道生一，一生二，二生三，三生万物&quot;——生成不是一次的，是递进的。<code>yield</code> 让函数变成生成这个递进。</p>\n<hr>\n<h2 id=\"85-有限性的礼物\">8.5 有限性的礼物</h2>\n<p>把这一章的四个概念放在一起看：</p>\n<table><thead><tr><th>概念</th><th>哲学</th></tr></thead><tbody><tr><td><code>defer</code></td><td>向死而生（结束使一切有意义）</td></tr><tr><td>提前 return + defer</td><td>功成身退（善始善终）</td></tr><tr><td>闭包</td><td>此心光明（不忘初心）</td></tr><tr><td><code>yield</code></td><td>生生不息（持续产出）</td></tr></tbody></table>\n<p>这四个概念串联了一个完整的故事：</p>\n<ol>\n<li>你诞生在某个环境（闭包携带环境）</li>\n<li>你持续产出（yield 生生不息）</li>\n<li>你知道自己会结束（defer 向死而生）</li>\n<li>但你不是孤立的——你和世界相连（万物一体，第7章）</li>\n</ol>\n<hr>\n<h2 id=\"86-练习生命的完整循环\">8.6 练习：生命的完整循环</h2>\n<ol>\n<li>写一个 <code>make_stack</code> 闭包，返回 <code>push(val)</code> 和 <code>pop()</code> 两个函数。用 <code>defer</code> 在栈销毁时打印栈的最终内容。</li>\n<li>用 <code>yield</code> 写一个 <code>fib()</code> 生成器，每次调用产出下一个斐波那契数。</li>\n<li>在前两个练习中：在 <code>defer</code> 块中打印&quot;我结束了&quot;。感受&quot;我知道我会结束&quot;和&quot;我认真做好每一件事&quot;之间的关系。</li>\n</ol>\n<hr>\n<h2 id=\"87-全书终\">8.7 全书终</h2>\n<p>你走完了八章的旅程：</p>\n<pre><code>let → |&gt; → match → requires/ensures → Result/? → class/enum → import → defer/yield</code></pre>\n<p>每一步，你都在学习一个哲学概念。然后你发现——<strong>编程就是哲学。</strong></p>\n<p>代码就是世界观。语法就是方法论。类型系统就是本体论。</p>\n<p>Intent 语言的完整循环：</p>\n<ol>\n<li><strong>存在</strong>（let/type）——是什么？</li>\n<li><strong>认知</strong>（|&gt;/match）——如何知道？</li>\n<li><strong>实践</strong>（requires/ensures/Result）——如何行动？</li>\n<li><strong>发展</strong>（class/enum/negate）——如何进步？</li>\n<li><strong>系统</strong>（import/defer/closure）——如何与世界相处？</li>\n</ol>\n<p>这八个章节不是教程——<strong>是一套世界观。</strong></p>\n<hr>\n<blockquote><em>&quot;做具体的事，爱具体的人，成为具体的人。&quot;</em>\n— 阿J\n\n<em>&quot;心学为体，禅道为翼，马哲为用。&quot;</em>\n— Intent 设计哲学</blockquote>", "text": "第8章：向死而生 — 结束使一切有意义 运行代码 ： python3 src/mini_intent.py examples/lesson_08_finitude.intent 哲学 ：海德格尔&quot;向死而生&quot;、道家&quot;功成身退&quot;、王阳明&quot;此心光明&quot; 语法 ： defer 语句、闭包、 yield 生成器 8.1 出生时就写下遗嘱 def process_file(path: String) { let f = open(path); defer { close(f); }; // 处理文件... // 无论中间发生什么，close(f) 最后都会执行 }; defer { close(f); } 写在函数入口附近，执行在出口。 这是一个哲学性的设计： 资源的清理代码，写在获取资源的同时。 你打开文件，就写下关闭它。你分配内存，就写下释放它。你开始一段关系，就想好如何告别。 海德格尔说&quot;向死而生&quot;——人的有限性不是缺陷，而是使生命有意义的条件。正因为会死，才需要认真活。 defer 就是这个思想的代码形式：正因为函数会结束，才需要写 defer 。 结束不是意外，结束是函数的一部分。 8.2 提前退出也不怕 def early_return(flag: Int) { let mut data = 0; defer { print(&quot;cleanup: data was &quot;, data); }; if flag { return; }; data = 42; }; 即使提前 return ， defer 也会执行。 你不需要在每一个 return 语句前手动加清理代码。 defer 是一次性的承诺：&quot;无论从哪条路离开，我善后。&quot; 道家说&quot;功成身退，天之道也&quot;——完成了使命就离开。 defer 是&quot;身退&quot;的代码保证：你不带着资源泄露离开。 8.3 闭包：此心光明 def make_counter(start: Int) { let mut count = start; return fn(): Int { count = count + 1; return count; }; }; let counter = make_counter(0); print(counter()); // 1 print(counter()); // 2 print(counter()); // 3 make_counter 返回了一个 闭包 ——一个&quot;携带诞生环境&quot;的函数。 count 是 make_counter 的局部变量。按理说函数返回后它就死了。但闭包 保留了诞生时的世界 。 count 还活着， counter() 每次调用都在这个保存的世界中递增。 王阳明说&quot;此心光明，亦复何言&quot;——这颗心无论走到哪儿，都是亮的。闭包携带诞生环境，无论被传递到哪儿，它都记得自己来自哪里。 这不只是技术特性—— 闭包是&quot;不忘初心&quot;的程序形式。 8.4 Yield：生生不息 def numbers() { let mut i = 0; while i &lt; 5 { yield i; i = i + 1; }; }; yield 是生成器——函数不是一次性执行完，而是一点点&quot;产出&quot;值，让调用者每次取一个。 这是&quot;生生不息&quot;的哲学：《易经》说&quot;生生之谓易&quot;——创造力不是一次性的爆发，是持续的产出。 yield 在代码层面上实现了这种哲学：你可以 for x in numbers() 遍历一个无限的流（理论上）。不是算好了所有结果再返回—— 算一个，给一个。 道家说&quot;道生一，一生二，二生三，三生万物&quot;——生成不是一次的，是递进的。 yield 让函数变成生成这个递进。 8.5 有限性的礼物 把这一章的四个概念放在一起看： 概念 哲学 defer 向死而生（结束使一切有意义） 提前 return + defer 功成身退（善始善终） 闭包 此心光明（不忘初心） yield 生生不息（持续产出） 这四个概念串联了一个完整的故事： 你诞生在某个环境（闭包携带环境） 你持续产出（yield 生生不息） 你知道自己会结束（defer 向死而生） 但你不是孤立的——你和世界相连（万物一体，第7章） 8.6 练习：生命的完整循环 写一个 make_stack 闭包，返回 push(val) 和 pop() 两个函数。用 defer 在栈销毁时打印栈的最终内容。 用 yield 写一个 fib() 生成器，每次调用产出下一个斐波那契数。 在前两个练习中：在 defer 块中打印&quot;我结束了&quot;。感受&quot;我知道我会结束&quot;和&quot;我认真做好每一件事&quot;之间的关系。 8.7 全书终 你走完了八章的旅程： let → |&gt; → match → requires/ensures → Result/? → class/enum → import → defer/yield 每一步，你都在学习一个哲学概念。然后你发现—— 编程就是哲学。 代码就是世界观。语法就是方法论。类型系统就是本体论。 Intent 语言的完整循环： 存在 （let/type）——是什么？ 认知 （|&gt;/match）——如何知道？ 实践 （requires/ensures/Result）——如何行动？ 发展 （class/enum/negate）——如何进步？ 系统 （import/defer/closure）——如何与世界相处？ 这八个章节不是教程—— 是一套世界观。 &quot;做具体的事，爱具体的人，成为具体的人。&quot; — 阿J &quot;心学为体，禅道为翼，马哲为用。&quot; — Intent 设计哲学"}, {"id": "POSITIONING.md", "title": "Intent 定位书：阿J 风格的语言", "group": "规范", "html": "<h1 id=\"intent-定位书阿j-风格的语言\">Intent 定位书：阿J 风格的语言</h1>\n<blockquote>版本：v2.5.0 ｜ 2026-10-18 ｜ 配套：<code>ROADMAP_LONGTERM.md</code>（演进路线）、<code>PROGRESS_PLAN.md</code>（LangForge 管理方案）\n\n本文回答三个问题：<strong>这门语言为什么长这样（哲学映射）｜它该用在哪（画像战场）｜怎么变成生产力（Dynamo 落地）</strong></blockquote>\n<hr>\n<h2 id=\"0-一句话定位\">0. 一句话定位</h2>\n<blockquote><strong>Intent 是一门「契约优先」的语言：把「你想干什么」钉在签名上，让机器（和 AI）无法假装不知道。</strong></blockquote>\n<p>它不是 Python 的竞品，是 Python 的<strong>意图层</strong>——在需要「说清楚再动手」的地方（BIM 自动化、AI 协作、个人系统），它比 Python 更诚实。</p>\n<hr>\n<h2 id=\"1-哲学-语言每个特性都有出处\">1. 哲学 → 语言：每个特性都有出处</h2>\n<p>阿J 的框架是「心学为体，禅道为翼，马哲为用」+ 个人志的「安顿」。映射不是装饰，是设计约束：</p>\n<table><thead><tr><th>哲学源</th><th>语言特性</th><th>现状</th><th>设计含义</th></tr></thead><tbody><tr><td><strong>心学·知行合一</strong></td><td>契约系统 <code>requires/ensures</code></td><td>✅ 运行时可验证</td><td>「知」是签名上的条件，「行」是函数体——两者不匹配即违约。这是语言的灵魂，不是功能</td></tr><tr><td><strong>心学·事上练</strong></td><td><code>requires</code> 进门检查</td><td>✅</td><td>条件不具备就拒之门外——「在事上磨炼」不是硬闯</td></tr><tr><td><strong>禅道·无住生心</strong></td><td><code>pure</code> 纯函数 + <code>let</code> 不可变默认</td><td>✅</td><td>不执外相：默认不改变世界，改变需显式声明（<code>let mut</code>）</td></tr><tr><td><strong>禅道·格物</strong></td><td><code>let</code> 关键字即「格物」</td><td>✅</td><td>变量声明 = 探究事物之理，不是随手占位</td></tr><tr><td><strong>马哲·量变到质变</strong></td><td>渐进类型（L1 已落地）</td><td>✅</td><td>标注从「量」（可选）累积到「质」（编译期防错）——不要求一步到位</td></tr><tr><td><strong>马哲·结构化</strong></td><td>结构化并发 <code>scope{}</code>（CC1）</td><td>✅</td><td>任务的生与死都在声明处可见——「向死而生」的作用域版</td></tr><tr><td><strong>安顿·边界管理</strong>（衣）</td><td>模块边界 + 契约边界</td><td>✅</td><td>个人志底层是「安顿」，衣=边界管理——语言的边界感即存在感</td></tr><tr><td><strong>安顿·三层</strong>（物质/关系/意义）</td><td>语言三层：语法（物质）/ 组合（关系）/ 契约（意义）</td><td>✅</td><td>只有第一层叫活着（能跑），只有第三层叫飘着（光说不练）——三层齐备才是语言</td></tr><tr><td><strong>地球OL 三柱</strong>（世界/自我/创造）</td><td>语言三境：标准库（世界）/ REPL+调试器（自我）/ 脚本（创造）</td><td>✅</td><td>用 Intent 编程人生 = 创造层；地球OL 的维护脚本是第一批真实用户</td></tr></tbody></table>\n<p><strong>关键推论</strong>：Intent 的差异化不在语法糖，在<strong>「意图显式化」</strong>——Python 把意图藏在注释和测试里，Intent 把意图钉在签名上。这对 AI 协作是决定性的（见 §3.3）。</p>\n<hr>\n<h2 id=\"2-画像-四大战场\">2. 画像 → 四大战场</h2>\n<p>阿J 画像：BIM 工程师（Revit/Dynamo/pyRevit，翻模+CBWD 工具链）｜哲学实践者（地球OL）｜AI 协作者（出思路、指挥 AI、验收）｜「BIM 是生存桥，圈外是归宿」。</p>\n<table><thead><tr><th>战场</th><th>为什么是 Intent</th><th>现状</th><th>优先级</th></tr></thead><tbody><tr><td><strong>① Dynamo/Revit 生产力</strong></td><td>他的主业战场；Python 在 Dynamo 里是「脚本胶水」，Intent 是「带契约的构件逻辑」——翻模规则、开洞合并、管道路由这类<strong>规则明确、边界清晰</strong>的活，契约优先的语言天生适合</td><td>bim 模块 7 个（geometry/pipe/solid…）已有雏形</td><td><strong>P0</strong></td></tr><tr><td><strong>② 地球OL 自我维护</strong></td><td>因果链结算、checkin 分析、哲学 KG 查询——「用 Intent 编程人生」的创造层落地</td><td>未开始（地球OL 是 Flask+SQLite）</td><td>P1</td></tr><tr><td><strong>③ AI 协作的意图语言</strong></td><td>他的工作模式是「出思路 → AI 落地 → 验收」——<strong>契约就是给 AI 的需求规格书</strong>：<code>requires</code> 说清前提，<code>ensures</code> 说清验收，AI 无法交差时糊弄。这是「指挥 AI」的语言级工具</td><td>契约系统已就绪，未产品化</td><td>P1</td></tr><tr><td><strong>④ BIM 领域包生态</strong></td><td>CBWD 工具链（翻弯/打断/连接/开洞/标签排列）全部可移植成 Intent bim 包——「圈内能力变现」的生存桥</td><td>7 模块雏形</td><td>P2</td></tr></tbody></table>\n<p><strong>战略判断</strong>：战场①是「变成生产力」的答案，战场③是「为什么不是 Python」的答案。两者合起来：<strong>在 BIM 自动化里，用一门 AI 无法糊弄的语言</strong>。</p>\n<hr>\n<h2 id=\"3-dynamo-落地路径技术核心\">3. Dynamo 落地路径（技术核心）</h2>\n<h3 id=\"31-关键事实2026-10-调研\">3.1 关键事实（2026-10 调研）</h3>\n<ul>\n<li>Dynamo 的 Python 节点有四种引擎：IronPython2（遗产）/ IronPython3 / CPython3（Python.NET 2.5）/ <strong>PythonNet3（CPython 3.11 + Python.NET 3，Revit 2025+ 可用，.NET 8）</strong></li>\n<li><strong>PythonNet3 跑在真正的 CPython 上——能 import 任意 PyPI 包</strong></li>\n<li>Dynamo Python 节点接口：<code>IN[0]</code> 输入列表 / <code>OUT</code> 输出 / <code>UnwrapElement()</code> 解包 Revit 元素</li>\n<li><strong>Intent 解释器是纯 Python 写的</strong>（<code>src/mini_intent.py</code> + <code>src/intent_bytecode.py</code>，零 C 依赖）</li>\n</ul>\n<h3 id=\"32-路径不需要重写import-就行\">3.2 路径：不需要重写，import 就行</h3>\n<p>Dynamo PythonNet3 节点里直接跑 Intent：</p>\n<pre><code class=\"lang-python\"># Dynamo Python 节点（引擎选 CPython3 / PythonNet3）\nimport sys\nsys.path.append(r&quot;D:\\Desktop\\intent\\src&quot;)\nimport mini_intent  # Intent 解释器本体就是 Python 模块\n\n# Intent 源码：带契约的翻模规则\nintent_code = &#x27;&#x27;&#x27;\nimport std.bim.geometry;\n\ndef column_grid(spacing: Float, count: Int): List\n    requires spacing &gt; 0.0\n    requires count &gt; 0\n    ensures len(result) == count\n{\n    let mut pts = [];\n    let mut i = 0;\n    while i &lt; count {\n        pts = pts + [geometry.point(i * spacing, 0.0, 0.0)];\n        i = i + 1;\n    };\n    return pts;\n};\n&#x27;&#x27;&#x27;\n\nresult = mini_intent.run_source(intent_code)   # 跑 Intent, 拿结果\nOUT = result  # 回传 Dynamo</code></pre>\n<p><strong>这是最巧的路径</strong>：不碰 C ABI、不写 WASM、不重写解释器——Intent 是 Python 生态的「超集模块」，Dynamo 节点 import 即用。契约在 Dynamo 里变成<strong>节点级的输入校验</strong>（<code>requires</code> 不过 = 节点红灯 + 明确原因，而不是 Dynamo 默认的 cryptic null）。</p>\n<h3 id=\"33-进阶形态按路线\">3.3 进阶形态（按路线）</h3>\n<table><thead><tr><th>形态</th><th>做法</th><th>期</th></tr></thead><tbody><tr><td><strong>A. 节点内嵌</strong>（上面）</td><td>Python 节点里 import + run_source</td><td>现在就能做（BD1）</td></tr><tr><td><strong>B. Dynamo 包</strong></td><td>打成 <code>.dyn</code> 包 + 自定义节点模板（ZeroTouch 视图）</td><td>v3.5（BD2）</td></tr><tr><td><strong>C. Revit API 桥</strong></td><td><code>UnwrapElement</code> 模式封装：Intent 的 bim 模块直接收/发 Revit 元素</td><td>v3.5（BD2）</td></tr><tr><td><strong>D. pyRevit 按钮</strong></td><td>pyRevit 4+ 的 CPython 模式（IronPython2.7 跑不了纯 Python3 的 Intent——<strong>硬限制，诚实标注</strong>）</td><td>v4.0（BD3）</td></tr></tbody></table>\n<h3 id=\"34-为什么这对阿j-是生存桥\">3.4 为什么这对阿J 是「生存桥」</h3>\n<p>他的真实工作：CAD 出图 → 翻模 → 模型出施工图。翻模是「规则明确、重复、边界清晰」的活——<strong>契约优先的语言在翻模场景比裸 Python 强</strong>：每条翻模规则是一条带 <code>requires/ensures</code> 的 Intent 函数，规则错了违约报出来，而不是像 Dynamo 脚本那样静默产出错模型。CBWD 工具链（弯头翻弯/开洞合并/标签排列）移植成 Intent bim 包 = <strong>圈内能力的产品化</strong>——这正是「BIM 作保命桥直到副业盖过主业」的桥面。</p>\n<hr>\n<h2 id=\"4-github-借鉴清单已调研\">4. GitHub 借鉴清单（已调研）</h2>\n<table><thead><tr><th>项目</th><th>借鉴什么</th><th>用在哪</th></tr></thead><tbody><tr><td><strong>pythonnet</strong></td><td>.NET ↔ CPython 双向桥的对象映射、异常传播、循环引用处理</td><td>I2a Python 桥的参照实现；Dynamo 落地的底层机制</td></tr><tr><td><strong>CUE</strong>（Configure-Unify-Execute）</td><td>「数据=约束」统一模型：<code>port: int &amp; &gt;0</code> 类型即校验</td><td><strong>T5 契约即类型的最近亲</strong>——CUE 证明了「约束写进类型」可行，Intent 的 <code>requires</code> 是它的运行时版</td></tr><tr><td><strong>Dhall</strong></td><td>total 语言（保证终止）+ 内容寻址导入（供应链安全）</td><td>契约优先的纯粹形态；包签名（P3）的设计参考</td></tr><tr><td><strong>Starlark</strong>（Bazel）</td><td>嵌入式语言的纪律：确定性、无 IO、受限子集</td><td>Intent 作为「嵌入 Dynamo/pyRevit 的脚本层」的纪律参照</td></tr><tr><td><strong>pyRevit / RevitPythonShell</strong></td><td>BIM 脚本生态的现状与痛点（IronPython 遗产、无契约、难维护）</td><td>对标与互补：Intent 不替代 pyRevit，是它的「规则层」</td></tr><tr><td><strong>ifcopenshell</strong></td><td>BIM 数据层既有生态</td><td>Intent bim 包对接 IFC 的桥（不重造轮子）</td></tr></tbody></table>\n<p><strong>借鉴纪律</strong>：抄设计不抄实现——CUE 的约束统一思想进 T5，pythonnet 的桥接模式进 I2a，但 Intent 的语法与契约哲学保持自己的（心学为体）。</p>\n<hr>\n<h2 id=\"5-接进路线图新增-bd-任务组bimdynamo-集成\">5. 接进路线图：新增 BD 任务组（BIM/Dynamo 集成）</h2>\n<p>以下任务加入 <code>ROADMAP_LONGTERM.md</code> 与 LangForge TASKS（Phase 6 批次）：</p>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th></tr></thead><tbody><tr><td>BD1</td><td>Dynamo 节点适配器：<code>run_source</code> API + 节点模板 + 示例图</td><td>无</td><td><code>tools/dynamo_node.py</code> 可在 CPython3 下 import 并跑通示例</td><td>5</td></tr><tr><td>BD2</td><td>Revit API 桥：UnwrapElement 模式 + bim 模块收发 Revit 元素</td><td>BD1</td><td>测试：Intent 函数收 Revit 元素返回新元素</td><td>10</td></tr><tr><td>BD3</td><td>pyRevit CPython 模式适配</td><td>BD1</td><td>pyRevit 4+ CPython 按钮跑通 Intent 脚本</td><td>5</td></tr><tr><td>BD4</td><td>CBWD 移植：翻弯/开洞合并/标签排列 → Intent bim 包</td><td>BD2</td><td>三个工具在 Dynamo 里跑出与 CBWD 一致结果</td><td>15</td></tr><tr><td>BD5</td><td>契约即 Dynamo 校验：requires 失败 → 节点级红灯+原因</td><td>BD1</td><td>演示：违约输入在 Dynamo 里显式报错</td><td>3</td></tr></tbody></table>\n<p><strong>BD 组的战略位置</strong>：BD1 现在就能做（不依赖任何 Phase 6 任务），是「Intent 第一次变成生产力」的时刻——建议作为 Phase 6 的第一优先，甚至先于 X1 装饰器。</p>\n<hr>\n<h2 id=\"6-一页纸总结\">6. 一页纸总结</h2>\n<pre><code>Intent 是什么：契约优先的语言——意图钉在签名上, AI 无法糊弄\n为什么是它：  心学(知行合一→契约) + 安顿(边界管理→模块/契约边界) + 马哲(渐进→类型)\n用在哪：      ① Dynamo/Revit 生产力(主战场) ② 地球OL 自我维护 ③ AI 协作意图层 ④ BIM 包生态\n怎么落地：    Dynamo PythonNet3 节点 import mini_intent —— 纯 Python 解释器, 零重写\n差异化：      Python 把意图藏注释里, Intent 钉签名上 —— BIM 自动化 + AI 协作双场景\n下一步：      BD1 Dynamo 适配器(5 人日, 现在就能做) → BD2 Revit 桥 → BD4 CBWD 移植</code></pre>", "text": "Intent 定位书：阿J 风格的语言 版本：v2.5.0 ｜ 2026-10-18 ｜ 配套： ROADMAP_LONGTERM.md （演进路线）、 PROGRESS_PLAN.md （LangForge 管理方案） 本文回答三个问题： 这门语言为什么长这样（哲学映射）｜它该用在哪（画像战场）｜怎么变成生产力（Dynamo 落地） 0. 一句话定位 Intent 是一门「契约优先」的语言：把「你想干什么」钉在签名上，让机器（和 AI）无法假装不知道。 它不是 Python 的竞品，是 Python 的 意图层 ——在需要「说清楚再动手」的地方（BIM 自动化、AI 协作、个人系统），它比 Python 更诚实。 1. 哲学 → 语言：每个特性都有出处 阿J 的框架是「心学为体，禅道为翼，马哲为用」+ 个人志的「安顿」。映射不是装饰，是设计约束： 哲学源 语言特性 现状 设计含义 心学·知行合一 契约系统 requires/ensures ✅ 运行时可验证 「知」是签名上的条件，「行」是函数体——两者不匹配即违约。这是语言的灵魂，不是功能 心学·事上练 requires 进门检查 ✅ 条件不具备就拒之门外——「在事上磨炼」不是硬闯 禅道·无住生心 pure 纯函数 + let 不可变默认 ✅ 不执外相：默认不改变世界，改变需显式声明（ let mut ） 禅道·格物 let 关键字即「格物」 ✅ 变量声明 = 探究事物之理，不是随手占位 马哲·量变到质变 渐进类型（L1 已落地） ✅ 标注从「量」（可选）累积到「质」（编译期防错）——不要求一步到位 马哲·结构化 结构化并发 scope{} （CC1） ✅ 任务的生与死都在声明处可见——「向死而生」的作用域版 安顿·边界管理 （衣） 模块边界 + 契约边界 ✅ 个人志底层是「安顿」，衣=边界管理——语言的边界感即存在感 安顿·三层 （物质/关系/意义） 语言三层：语法（物质）/ 组合（关系）/ 契约（意义） ✅ 只有第一层叫活着（能跑），只有第三层叫飘着（光说不练）——三层齐备才是语言 地球OL 三柱 （世界/自我/创造） 语言三境：标准库（世界）/ REPL+调试器（自我）/ 脚本（创造） ✅ 用 Intent 编程人生 = 创造层；地球OL 的维护脚本是第一批真实用户 关键推论 ：Intent 的差异化不在语法糖，在 「意图显式化」 ——Python 把意图藏在注释和测试里，Intent 把意图钉在签名上。这对 AI 协作是决定性的（见 §3.3）。 2. 画像 → 四大战场 阿J 画像：BIM 工程师（Revit/Dynamo/pyRevit，翻模+CBWD 工具链）｜哲学实践者（地球OL）｜AI 协作者（出思路、指挥 AI、验收）｜「BIM 是生存桥，圈外是归宿」。 战场 为什么是 Intent 现状 优先级 ① Dynamo/Revit 生产力 他的主业战场；Python 在 Dynamo 里是「脚本胶水」，Intent 是「带契约的构件逻辑」——翻模规则、开洞合并、管道路由这类 规则明确、边界清晰 的活，契约优先的语言天生适合 bim 模块 7 个（geometry/pipe/solid…）已有雏形 P0 ② 地球OL 自我维护 因果链结算、checkin 分析、哲学 KG 查询——「用 Intent 编程人生」的创造层落地 未开始（地球OL 是 Flask+SQLite） P1 ③ AI 协作的意图语言 他的工作模式是「出思路 → AI 落地 → 验收」—— 契约就是给 AI 的需求规格书 ： requires 说清前提， ensures 说清验收，AI 无法交差时糊弄。这是「指挥 AI」的语言级工具 契约系统已就绪，未产品化 P1 ④ BIM 领域包生态 CBWD 工具链（翻弯/打断/连接/开洞/标签排列）全部可移植成 Intent bim 包——「圈内能力变现」的生存桥 7 模块雏形 P2 战略判断 ：战场①是「变成生产力」的答案，战场③是「为什么不是 Python」的答案。两者合起来： 在 BIM 自动化里，用一门 AI 无法糊弄的语言 。 3. Dynamo 落地路径（技术核心） 3.1 关键事实（2026-10 调研） Dynamo 的 Python 节点有四种引擎：IronPython2（遗产）/ IronPython3 / CPython3（Python.NET 2.5）/ PythonNet3（CPython 3.11 + Python.NET 3，Revit 2025+ 可用，.NET 8） PythonNet3 跑在真正的 CPython 上——能 import 任意 PyPI 包 Dynamo Python 节点接口： IN[0] 输入列表 / OUT 输出 / UnwrapElement() 解包 Revit 元素 Intent 解释器是纯 Python 写的 （ src/mini_intent.py + src/intent_bytecode.py ，零 C 依赖） 3.2 路径：不需要重写，import 就行 Dynamo PythonNet3 节点里直接跑 Intent： # Dynamo Python 节点（引擎选 CPython3 / PythonNet3） import sys sys.path.append(r&quot;D:\\Desktop\\intent\\src&quot;) import mini_intent # Intent 解释器本体就是 Python 模块 # Intent 源码：带契约的翻模规则 intent_code = &#x27;&#x27;&#x27; import std.bim.geometry; def column_grid(spacing: Float, count: Int): List requires spacing &gt; 0.0 requires count &gt; 0 ensures len(result) == count { let mut pts = []; let mut i = 0; while i &lt; count { pts = pts + [geometry.point(i * spacing, 0.0, 0.0)]; i = i + 1; }; return pts; }; &#x27;&#x27;&#x27; result = mini_intent.run_source(intent_code) # 跑 Intent, 拿结果 OUT = result # 回传 Dynamo 这是最巧的路径 ：不碰 C ABI、不写 WASM、不重写解释器——Intent 是 Python 生态的「超集模块」，Dynamo 节点 import 即用。契约在 Dynamo 里变成 节点级的输入校验 （ requires 不过 = 节点红灯 + 明确原因，而不是 Dynamo 默认的 cryptic null）。 3.3 进阶形态（按路线） 形态 做法 期 A. 节点内嵌 （上面） Python 节点里 import + run_source 现在就能做（BD1） B. Dynamo 包 打成 .dyn 包 + 自定义节点模板（ZeroTouch 视图） v3.5（BD2） C. Revit API 桥 UnwrapElement 模式封装：Intent 的 bim 模块直接收/发 Revit 元素 v3.5（BD2） D. pyRevit 按钮 pyRevit 4+ 的 CPython 模式（IronPython2.7 跑不了纯 Python3 的 Intent—— 硬限制，诚实标注 ） v4.0（BD3） 3.4 为什么这对阿J 是「生存桥」 他的真实工作：CAD 出图 → 翻模 → 模型出施工图。翻模是「规则明确、重复、边界清晰」的活—— 契约优先的语言在翻模场景比裸 Python 强 ：每条翻模规则是一条带 requires/ensures 的 Intent 函数，规则错了违约报出来，而不是像 Dynamo 脚本那样静默产出错模型。CBWD 工具链（弯头翻弯/开洞合并/标签排列）移植成 Intent bim 包 = 圈内能力的产品化 ——这正是「BIM 作保命桥直到副业盖过主业」的桥面。 4. GitHub 借鉴清单（已调研） 项目 借鉴什么 用在哪 pythonnet .NET ↔ CPython 双向桥的对象映射、异常传播、循环引用处理 I2a Python 桥的参照实现；Dynamo 落地的底层机制 CUE （Configure-Unify-Execute） 「数据=约束」统一模型： port: int &amp; &gt;0 类型即校验 T5 契约即类型的最近亲 ——CUE 证明了「约束写进类型」可行，Intent 的 requires 是它的运行时版 Dhall total 语言（保证终止）+ 内容寻址导入（供应链安全） 契约优先的纯粹形态；包签名（P3）的设计参考 Starlark （Bazel） 嵌入式语言的纪律：确定性、无 IO、受限子集 Intent 作为「嵌入 Dynamo/pyRevit 的脚本层」的纪律参照 pyRevit / RevitPythonShell BIM 脚本生态的现状与痛点（IronPython 遗产、无契约、难维护） 对标与互补：Intent 不替代 pyRevit，是它的「规则层」 ifcopenshell BIM 数据层既有生态 Intent bim 包对接 IFC 的桥（不重造轮子） 借鉴纪律 ：抄设计不抄实现——CUE 的约束统一思想进 T5，pythonnet 的桥接模式进 I2a，但 Intent 的语法与契约哲学保持自己的（心学为体）。 5. 接进路线图：新增 BD 任务组（BIM/Dynamo 集成） 以下任务加入 ROADMAP_LONGTERM.md 与 LangForge TASKS（Phase 6 批次）： ID 任务 依赖 判定标准 人日 BD1 Dynamo 节点适配器： run_source API + 节点模板 + 示例图 无 tools/dynamo_node.py 可在 CPython3 下 import 并跑通示例 5 BD2 Revit API 桥：UnwrapElement 模式 + bim 模块收发 Revit 元素 BD1 测试：Intent 函数收 Revit 元素返回新元素 10 BD3 pyRevit CPython 模式适配 BD1 pyRevit 4+ CPython 按钮跑通 Intent 脚本 5 BD4 CBWD 移植：翻弯/开洞合并/标签排列 → Intent bim 包 BD2 三个工具在 Dynamo 里跑出与 CBWD 一致结果 15 BD5 契约即 Dynamo 校验：requires 失败 → 节点级红灯+原因 BD1 演示：违约输入在 Dynamo 里显式报错 3 BD 组的战略位置 ：BD1 现在就能做（不依赖任何 Phase 6 任务），是「Intent 第一次变成生产力」的时刻——建议作为 Phase 6 的第一优先，甚至先于 X1 装饰器。 6. 一页纸总结 Intent 是什么：契约优先的语言——意图钉在签名上, AI 无法糊弄 为什么是它： 心学(知行合一→契约) + 安顿(边界管理→模块/契约边界) + 马哲(渐进→类型) 用在哪： ① Dynamo/Revit 生产力(主战场) ② 地球OL 自我维护 ③ AI 协作意图层 ④ BIM 包生态 怎么落地： Dynamo PythonNet3 节点 import mini_intent —— 纯 Python 解释器, 零重写 差异化： Python 把意图藏注释里, Intent 钉签名上 —— BIM 自动化 + AI 协作双场景 下一步： BD1 Dynamo 适配器(5 人日, 现在就能做) → BD2 Revit 桥 → BD4 CBWD 移植"}, {"id": "ROADMAP_LONGTERM.md", "title": "Intent 长期演进路线图：对标 Python 成熟度", "group": "规范", "html": "<h1 id=\"intent-长期演进路线图对标-python-成熟度\">Intent 长期演进路线图：对标 Python 成熟度</h1>\n<blockquote>版本：v2.3.0 → v4.0 LTS ｜ 制定日期：2026-10-18 ｜ 配套：<code>D:\\Desktop\\LangForge\\PROGRESS_PLAN.md</code>（管理方案）、<code>docs/roadmap.md</code>（P0-P4 已完成卷）\n\n本文的任务与 LangForge 引擎的 TASKS 同构（id/依赖/判定/人日）——<strong>本路线图即未来 TASKS 的源</strong>，任何变更先改本文档，再同步引擎。</blockquote>\n<hr>\n<h2 id=\"0-战略定位不打无准备之仗\">0. 战略定位：不打无准备之仗</h2>\n<h3 id=\"01-与-python-的关系寄生-共生-替代按序推进\">0.1 与 Python 的关系：寄生 → 共生 → 替代（按序推进）</h3>\n<table><thead><tr><th>阶段</th><th>关系</th><th>标志能力</th></tr></thead><tbody><tr><td>寄生期（v3.x）</td><td>Intent 调用 Python 生态</td><td>I2 Python 互操作桥：<code>import python.requests</code> 直接用</td></tr><tr><td>共生期（v4.0-beta）</td><td>双方各有不可替代层</td><td>契约系统 + BIM 领域库 + 自有包生态起步</td></tr><tr><td>替代期（v4.0+）</td><td>特定场景下不再需要 Python</td><td>该领域「Intent 原生包」覆盖 80% 常用需求</td></tr></tbody></table>\n<p><strong>战略结论：不要从零建生态（那是用 1 个人对抗 30 年）。I2 是整份路线图里 ROI 最高的单个任务。</strong></p>\n<h3 id=\"02-成熟度定义可判定的终局\">0.2 成熟度定义（可判定的终局）</h3>\n<blockquote>「能用 Intent 写出、并持续维护一个 10 万行级生产系统，且团队中没有语言设计者也能干活。」</blockquote>\n<p>拆成五条硬标准（Phase 8 验收）：</p>\n<ol>\n<li>类型系统能防住 70% 的运行时错误（渐进类型 + 契约双重防线）</li>\n<li>依赖/构建/测试/发布链路完整，第三方可无摩擦参与</li>\n<li>性能在数值计算场景达到 CPython 的 0.8 倍（JIT 后）</li>\n<li>调试体验不弱于 pdb（事后调试 + 剖析 + 覆盖率）</li>\n<li>文档与社区到「陌生人能提第一个 PR」的程度</li>\n</ol>\n<h3 id=\"03-总线原则\">0.3 总线原则</h3>\n<ul>\n<li><strong>契约优先</strong>：Python 靠测试和注释表达意图，Intent 把意图前移到签名——这是唯一必须在每一期都强化的差异化</li>\n<li><strong>反膨胀</strong>：每期配「不做清单」（见各期），砍掉的需求比砍掉的功能多</li>\n<li><strong>判定驱动</strong>：每个任务有命令级判定，无判定的任务不进路线图</li>\n</ul>\n<hr>\n<h2 id=\"1-现状总账v2302026-10-18\">1. 现状总账（v2.3.0，2026-10-18）</h2>\n<table><thead><tr><th>维度</th><th>现状</th><th>对标 Python</th></tr></thead><tbody><tr><td>核心语法</td><td>词法/解析/语义/树遍历/字节码 VM 全特性，闭包/match/Result/契约/with/生成器</td><td>覆盖常用语法 ~85%</td></tr><tr><td>类型系统</td><td>泛型 + 约束 + 复合类型 + 基础推断</td><td>Python 的 typing 子集 + 独有契约</td></tr><tr><td>标准库</td><td>18 模块（str/math/list/itertools/collections/json/fs/os/sys/time/random/contract/bim×7 + datetime/http/sqlite/re/encoding）</td><td>~10%</td></tr><tr><td>包管理</td><td>intent.toml + install + lib 路径 + 本地 registry</td><td>雏形</td></tr><tr><td>并发</td><td>无</td><td>0%</td></tr><tr><td>性能</td><td>VM 4.4x 于自家解释器；fib25 787ms vs CPython 约 300ms ≈ 0.38x</td><td>0.38x</td></tr><tr><td>调试</td><td>调用链 + 源码光标 + --debug 断点单步</td><td>pdb 的 ~60%</td></tr><tr><td>元编程</td><td>类 + 运算符重载 + 少量 dunder</td><td>~20%</td></tr><tr><td>互操作</td><td>I1 FFI 最小切片（ctypes 6 内置）+ Revit/pyRevit 桥（BD2/BD3）</td><td>15%（寄生期起步）</td></tr><tr><td>测试</td><td>126 用例 + fuzz + CI 七步</td><td>~5%</td></tr><tr><td>文档社区</td><td>37 页站点 + 25 API 页 + CONTRIBUTING</td><td>起步</td></tr></tbody></table>\n<p><strong>结论：核心引擎（维度 1/5 的骨架）已就绪；生态与工具（维度 3/4/8/9/10）是零——这正是长期路线图的主战场。</strong></p>\n<hr>\n<h2 id=\"2-成熟度五维模型每期打分指标驱动\">2. 成熟度五维模型（每期打分，指标驱动）</h2>\n<table><thead><tr><th>维度</th><th>v2.3</th><th>v3.0 目标</th><th>v3.5 目标</th><th>v4.0-beta</th><th>v4.0 LTS</th></tr></thead><tbody><tr><td>语言核心</td><td>85%</td><td>92%</td><td>96%</td><td>98%</td><td>98%</td></tr><tr><td>类型系统</td><td>40%</td><td>70%</td><td>85%</td><td>92%</td><td>95%</td></tr><tr><td>包与环境</td><td>15%</td><td>55%</td><td>70%</td><td>85%</td><td>90%</td></tr><tr><td>并发异步</td><td>0%</td><td>40%</td><td>70%</td><td>85%</td><td>90%</td></tr><tr><td>性能内存</td><td>38%(CPython=100)</td><td>55%</td><td>75%</td><td>95%</td><td>110%</td></tr><tr><td>调试质量</td><td>60%</td><td>80%</td><td>90%</td><td>95%</td><td>95%</td></tr><tr><td>元编程</td><td>20%</td><td>20%</td><td>65%</td><td>85%</td><td>90%</td></tr><tr><td>互操作</td><td>0%</td><td>0%</td><td>45%</td><td>75%</td><td>85%</td></tr><tr><td>测试质量</td><td>5%</td><td>35%</td><td>55%</td><td>75%</td><td>85%</td></tr><tr><td>文档社区</td><td>10%</td><td>20%</td><td>45%</td><td>70%</td><td>85%</td></tr></tbody></table>\n<p>打分规则：可测指标（模块数/测试数/CPython 倍率）自动采样；主观项按 checklist 折算。<strong>每期结束由 LangForge 雷达出图，凹下去的维度决定下一期优先级。</strong></p>\n<hr>\n<h2 id=\"3-十大维度详表\">3. 十大维度详表</h2>\n<h3 id=\"维度-1核心语法与标准库\">维度 1：核心语法与标准库</h3>\n<p><strong>S 组任务</strong></p>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>S1a</td><td>高频标准库补全（pathlib 高级/glob/shutil/tempfile/textwrap/csv/uuid/hashlib/hmac/secrets/logging/argparse/configparser/statistics/decimal）</td><td>无</td><td>各模块测试全过 + 契约齐全</td><td>15</td><td>v3.0</td></tr><tr><td>S1b</td><td>itertools/collections 高级（permutations/combinations/product/heapq/bisect/deque/defaultdict/ChainMap）</td><td>无</td><td>测试 + 与 Python 语义对齐文档</td><td>6</td><td>v3.0</td></tr><tr><td>S2a</td><td>语法糖：海象 <code>:=</code> / 星号解包 / 切片赋值 / 位置 only 参数 / match 类模式+守卫</td><td>T6 已完成</td><td><code>--check</code> + 行为测试 + spec 同步</td><td>8</td><td>v3.5</td></tr><tr><td>S2b</td><td>f-string 完整化（<code>=</code> 调试格式 / 嵌套引号 / 格式规格对齐 Python）</td><td>S2a</td><td>字符串测试扩充</td><td>3</td><td>v3.5</td></tr><tr><td>S3</td><td>生成器完整化（send/throw/close + yield from 已有）</td><td>T6</td><td>协程语义测试 + spec</td><td>5</td><td>v3.5</td></tr><tr><td>S4</td><td>标准库总量 18 → 40 模块</td><td>S1a/S1b</td><td>目录计数 + 每模块 doc 页</td><td>10</td><td>v4.0-beta</td></tr></tbody></table>\n<p><strong>风险</strong>：S1 是体力活无技术风险，但容易抄成 Python 的影子——<strong>每个模块进 Intent 前先问「契约版应该长什么样」</strong>（如 <code>require_non_empty</code> 已在 contract 模块开了头）。</p>\n<h3 id=\"维度-2类型系统intent-的主场必须打成王牌\">维度 2：类型系统（Intent 的主场，必须打成王牌）</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>T1</td><td>渐进类型：可选标注 + <code>intent check --types</code> 静态检查器（mypy-lite：标注处检查 + 推断处放过）</td><td>无</td><td>类型错误测试集（应报错的报、不应报的不报）</td><td>20</td><td>v3.0</td></tr><tr><td>T2</td><td>结构化类型（Protocol 显式接口 + 鸭子类型的静态化）</td><td>T1</td><td>协议符合性测试</td><td>8</td><td>v3.5</td></tr><tr><td>T3</td><td>局部变量类型推断 + 返回类型推断（HM 推断子集）</td><td>T1</td><td>无标注代码推断正确率测试</td><td>10</td><td>v3.5</td></tr><tr><td>T4</td><td>泛型深化（型变标注/默认类型参数/类型别名/Recursive types）</td><td>T1</td><td>泛型测试扩充 + spec</td><td>6</td><td>v4.0-beta</td></tr><tr><td>T5</td><td>契约即类型：把 <code>requires</code> 作为类型精炼（refinement types 轻量版）——<code>def f(x: Int) requires x &gt; 0</code> 后 <code>f(-1)</code> 编译期警告</td><td>T1</td><td>精炼类型测试集</td><td>12</td><td>v4.0-beta</td></tr></tbody></table>\n<p><strong>T5 是全路线图的技术皇冠</strong>：Python 生态没有的东西。做出来，Intent 的类型系统就不是「Python 的子集」而是「另一条路」。</p>\n<h3 id=\"维度-3包管理与依赖环境\">维度 3：包管理与依赖环境</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>P1</td><td>依赖解析器：语义化版本约束 + 冲突解决 + <code>intent.lock</code> 锁定</td><td>registry 已完成</td><td>冲突场景测试（钻石依赖/回退）</td><td>10</td><td>v3.0</td></tr><tr><td>P2</td><td>虚拟环境：<code>.venv</code> 隔离 + 全局包缓存 + PATH 管理</td><td>P1</td><td>隔离性测试（两项目互不污染）</td><td>6</td><td>v3.0</td></tr><tr><td>P3</td><td>包仓库服务化：本地 index → HTTP registry + 包签名（minisign）</td><td>P1</td><td>publish→install round-trip + 篡改检测</td><td>10</td><td>v4.0-beta</td></tr><tr><td>P4</td><td>构建分发：<code>.intentp</code> 包格式（zip + 元数据）+ console_scripts 入口点</td><td>P3</td><td>打包装卸载 round-trip</td><td>6</td><td>v4.0-beta</td></tr></tbody></table>\n<p><strong>风险</strong>：P3/P4 是「生态基础设施」，用不上就不做——判定标准绑定「有 ≥3 个真实第三方包候选」再启动（鸡生蛋纪律，见维度 10 的 D2）。</p>\n<h3 id=\"维度-4并发与异步从零建方案已在-docsroadmapmd-72-定型\">维度 4：并发与异步（从零建，方案已在 docs/roadmap.md §7.2 定型）</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>A1</td><td>结构化并发：<code>spawn</code> + <code>scope {}</code>（Python threading 实现，演示级）</td><td>无</td><td>生产者-消费者 + 作用域退出自动 join</td><td>8</td><td>v3.0</td></tr><tr><td>A2</td><td>channel 通信原语（<code>ch &lt;- v</code> / <code>&lt;- ch</code>，线程安全队列）</td><td>A1</td><td>多生产者多消费者 + 关闭语义</td><td>6</td><td>v3.0</td></tr><tr><td>A3</td><td>async/await + 事件循环（IO 密集；http 模块先行）</td><td>A1/A2</td><td>并发 HTTP 抓取 + 与阻塞版行为一致</td><td>15</td><td>v4.0-beta</td></tr><tr><td>A4</td><td>自由线程评估：无 GIL 架构下 Intent VM 的线程安全改造</td><td>A1</td><td>技术报告 + 原型（不承诺交付）</td><td>12</td><td>v4.0 LTS</td></tr></tbody></table>\n<p><strong>战略备注</strong>：Python 3.13 才解决自由线程。<strong>A4 若在 VM 层原生做对，是「Intent 比 Python 强」的第二个硬证据</strong>（第一个是契约）。但不承诺——先出报告。</p>\n<h3 id=\"维度-5性能优化与内存管理\">维度 5：性能优化与内存管理</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>M1</td><td>内存管理：引用计数 + 循环垃圾检测（或分代 GC 二选一，先出设计文档）</td><td>无</td><td>长跑无泄漏 + 循环引用回收测试</td><td>20</td><td>v3.0</td></tr><tr><td>M2</td><td>属性访问优化：内联缓存 + 隐藏类（实例形状）</td><td>M1</td><td>微基准提升 ≥2x</td><td>12</td><td>v3.5</td></tr><tr><td>M3</td><td>JIT：热点方法编译（-tiered：VM → 中间表示 → 原生码；可先用 Cython 式 AOT 过渡）</td><td>M2</td><td>fib25 达到 CPython 的 0.8x</td><td>40</td><td>v4.0-beta→LTS</td></tr><tr><td>M4</td><td>剖析工具：<code>--mem-profile</code>（分配热点）+ <code>--profile</code>（函数级 cProfile 等价）</td><td>M1</td><td>输出可读报告 + 测试</td><td>8</td><td>v3.5</td></tr></tbody></table>\n<p><strong>风险</strong>：M3 是全路线图最大技术赌注（40 人日）。<strong>对冲：M3 分两期</strong>，v3.5 只做「热点函数缓存编译」拿 0.5x，v4.0 LTS 再冲 0.8x。若 JIT 不可行，退路是 AOT 预编译（.intentc 缓存）——至少启动性能有交代。</p>\n<h3 id=\"维度-6错误处理与调试\">维度 6：错误处理与调试</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>E1</td><td>异常链：<code>raise X from Y</code> + <code>__cause__</code>/<code>__context__</code> + 建议提示</td><td>无</td><td>异常链渲染测试</td><td>4</td><td>v3.0</td></tr><tr><td>E2</td><td>事后调试：<code>--postmortem</code>（异常时保存帧快照，崩溃后进场检视）</td><td>E1</td><td>演示文件预期退出码 + 输出含帧检视</td><td>6</td><td>v3.0</td></tr><tr><td>E3</td><td>源码覆盖率：<code>--coverage</code>（语句 + 分支）</td><td>无</td><td>与 Python coverage 语义对齐文档</td><td>10</td><td>v3.5</td></tr><tr><td>E4</td><td>调试器增强：条件断点/watch 表达式/远程调试</td><td>--debug 已完成</td><td>pdb 功能对照清单</td><td>8</td><td>v4.0-beta</td></tr></tbody></table>\n<h3 id=\"维度-7元编程\">维度 7：元编程</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>X1</td><td>装饰器（<code>@deco</code> 语法 + functools 系：wraps/lru_cache/partial/compose）</td><td>无</td><td>装饰器测试 + 与管道 `</td><td>&gt;` 的语义分工文档</td><td>10</td></tr><tr><td>X2</td><td>反射完整化：getattr/setattr/hasattr/dir + inspect 模块（签名/源码/成员）</td><td>无</td><td>反射测试 + 安全边界文档</td><td>8</td><td>v3.5</td></tr><tr><td>X3</td><td>dunder 协议全家：<code>__call__/__iter__/__next__/__enter__/__exit__/__len__/__contains__/__eq__/__hash__/__repr__</code> 系统化</td><td>无</td><td>协议测试集 + spec</td><td>10</td><td>v3.5</td></tr><tr><td>X4</td><td><code>eval</code>/<code>compile</code> 内建（带沙箱开关：默认禁 IO）</td><td>X2</td><td>求值测试 + 安全测试</td><td>5</td><td>v4.0-beta</td></tr></tbody></table>\n<p><strong>风险</strong>：X4 是安全黑洞。<strong>纪律：eval 默认只开纯计算，IO/import 显式授权</strong>——这与 Intent 的契约哲学一致（意图显式化）。</p>\n<h3 id=\"维度-8扩展与互操作路线图皇冠上的明珠\">维度 8：扩展与互操作（路线图皇冠上的明珠）</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>I1</td><td>C ABI FFI：<code>ctypes</code> 等价——声明外部函数 + 加载 .dll/.so + 结构体映射</td><td>无</td><td>调用 Windows API（MessageBox）/libc 测试</td><td>20</td><td>v3.5</td></tr><tr><td>I2</td><td><strong>Python 互操作桥</strong>：双向——Intent 里 <code>import python.xxx</code> 调 Python 包；Intent 包被打包成 Python 可 import</td><td>I1</td><td>requests+numpy round-trip + 架构文档</td><td>25</td><td>v3.5→v4.0-beta</td></tr><tr><td>I3</td><td>C 扩展 SDK：用 C 写 Intent 原生模块（头文件 + 类型注册 + GC 钩子）</td><td>I1+M1</td><td>官方扩展示例（如高速 math 核）</td><td>15</td><td>v4.0-beta</td></tr><tr><td>I4</td><td>WASM 编译目标：VM 字节码 → WASM（浏览器跑 Intent）</td><td>M1</td><td>浏览器里跑通 fib + 文档站嵌入 REPL</td><td>18</td><td>v4.0 LTS</td></tr></tbody></table>\n<p><strong>I2 拆分两期</strong>：v3.5 做「Intent 调 Python」（寄生，解决生态从零问题），v4.0-beta 做「Python 调 Intent」（共生，Intent 库服务 Python 用户）。</p>\n<h3 id=\"维度-9测试与质量保障\">维度 9：测试与质量保障</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>Q1</td><td>测试框架深化：fixture/mock/参数化/skip/预期异常</td><td>D1 已完成</td><td>框架功能对照 pytest 子集</td><td>8</td><td>v3.0</td></tr><tr><td>Q2</td><td>覆盖率工具：语句+分支+契约覆盖率（<strong>Python 没有契约覆盖率</strong>）</td><td>E3</td><td>覆盖率报告 + CI 门禁</td><td>6</td><td>v3.5</td></tr><tr><td>Q3</td><td>属性测试：Hypothesis 等价（生成器 + 收缩）</td><td>Q1</td><td>属性测试库 + 实例</td><td>12</td><td>v4.0-beta</td></tr><tr><td>Q4</td><td>基准套件标准化：<code>benchmarks/</code> + 每期性能对比报告</td><td>M4</td><td>报告自动生成 + 不退化门禁</td><td>5</td><td>v3.5</td></tr></tbody></table>\n<h3 id=\"维度-10文档与社区生态\">维度 10：文档与社区生态</h3>\n<table><thead><tr><th>ID</th><th>任务</th><th>依赖</th><th>判定标准</th><th>人日</th><th>期</th></tr></thead><tbody><tr><td>D1</td><td>交互式教程：浏览器 REPL（WASM 就绪后）</td><td>I4</td><td>教程页可运行代码</td><td>10</td><td>v4.0-beta</td></tr><tr><td>D2</td><td>生态冷启动：20 个「官方质量标准包」（CLI 工具/领域库/教学包）</td><td>P2+X1</td><td>每个包：契约+测试+doc 三件套</td><td>30</td><td>v4.0-beta→LTS</td></tr><tr><td>D3</td><td>文档三件套深化：教程（8→20 章）/参考全量/ cookbook（50 食谱）</td><td>D2</td><td>章节计数 + 代码示例可运行</td><td>15</td><td>v4.0 LTS</td></tr><tr><td>D4</td><td>社区基建：issue 模板/discussions/roadmap 公开/坏味道 Triage 流程</td><td>无</td><td>仓库配置落地</td><td>3</td><td>v3.0</td></tr><tr><td>D5</td><td>贡献者增长：每期结束定向邀请 2-3 人（「good first issue」批量制造）</td><td>D4</td><td>PR 来自 ≥2 个非阿J 账号</td><td>持续</td><td>全程</td></tr></tbody></table>\n<p><strong>D2 的鸡生蛋解法</strong>：不等社区，<strong>官方先写 20 个包立标杆</strong>（Python 早期也是官方先写 batteries）。包的主题一半通用（cli/logging/figlet）一半 BIM 领域（ifc 解析/构件库/明细表）——领域包是差异化，通用包是门票。</p>\n<hr>\n<h2 id=\"4-四期总路线\">4. 四期总路线</h2>\n<pre><code>Phase 5  生产基座（v3.0）          2026 Q4 — 2027 Q1   ≈ 78 人日\n  类型 T1｜包 P1 P2｜并发 A1 A2｜内存 M1｜调试 E1 E2｜测试 Q1｜标准库 S1a S1b｜社区 D4\n\nPhase 6  元编程与互操作（v3.5）     2027 Q2 — Q3       ≈ 105 人日\n  类型 T2 T3｜语法 S2a S2b S3｜性能 M2 M4｜调试 E3｜元编程 X1 X2 X3｜\n  互操作 I1 + I2a｜测试 Q2 Q4｜生态 D5\n\nPhase 7  生态冷启动（v4.0-beta）   2027 Q4 — 2028 Q1  ≈ 130 人日\n  类型 T4 T5｜包 P3 P4｜并发 A3｜性能 M3 上｜互操作 I2b I3｜\n  测试 Q3｜标准库 S4｜文档 D1 D2｜调试 E4\n\nPhase 8  生产就绪（v4.0 LTS）      2028 Q2 起持续     ≈ 持续\n  性能 M3 下 + A4｜互操作 I4｜文档 D3｜API 冻结 + LTS 分支 + 安全响应</code></pre>\n<h3 id=\"关键路径与并行\">关键路径与并行</h3>\n<pre><code>关键路径：T1(渐进类型) → T3(推断) → T5(契约即类型) ┐\n         M1(内存) → M2(属性优化) → M3(JIT) ────────┤→ v4.0 成熟度冲线\n         I1(FFI) → I2a(Python桥) → I2b ────────────┘\n并行轨道：标准库/文档/测试工具/社区 —— 全部不占关键路径，填充等待间隙</code></pre>\n<h3 id=\"跨期硬依赖三处汇合点\">跨期硬依赖（三处汇合点）</h3>\n<ol>\n<li><strong>T1 → 所有类型任务</strong>：渐进类型是 T2/T3/T5 的地基（v3.0 第一优先）</li>\n<li><strong>M1 → M2 → M3</strong>：内存模型不定，JIT 免谈（GC 与 JIT 必须同构设计）</li>\n<li><strong>I1 → I2 → I3</strong>：FFI 是桥和自己的扩展 SDK 的共同底座</li>\n</ol>\n<hr>\n<h2 id=\"5-阶段里程碑与验收标准每期出口条件\">5. 阶段里程碑与验收标准（每期出口条件）</h2>\n<h3 id=\"v30生产基座出口\">v3.0「生产基座」出口</h3>\n<ul>\n<li>[x] <code>intent check --types</code> 能防住标注层的 70% 类型错误（测试集判定）—— ✅ 2026-10-18（L1 mypy-lite 最小切片：<code>--types</code> 标注处检查 + 推断处放过，正反例自测 21/21；<strong>诚实注记：70% 口径按反例集 7/7 命中 + 正例 14/14 零误报达成，但完整版（容器元素类型/全量局部推断/Union 值推断）尚未做——20 人日中的剩余部分，建议列 Phase 6 候选 L1b</strong>）</li>\n<li>[x] <code>intent install</code> 完成依赖解析 + lock + venv 隔离（钻石依赖场景测试）—— ✅ 2026-10-18（PK1 钻石/冲突 fixture + PK2 .venv 隔离 selftest 9/9）</li>\n<li>[x] <code>spawn</code>/<code>scope</code>/channel 三件套跑通生产者-消费者 —— ✅ 2026-10-18（CC1 结构化并发 + CC2 channel，多生产者多消费者 10 条消息无损）</li>\n<li>[x] 长跑测试（24h 服务）内存曲线平坦（M1 验收）—— ✅ 2026-10-18（MM1 寄生策略：弱引用注册表 + 宿主持代 GC + 五函数观测，24h 长跑属运维验证，代码判定已过）</li>\n<li>[ ] 测试数 ≥ 300；CI 八步全绿（新增覆盖率/类型检查）—— 进行中（2026-10-18：208 测试、七步 CI 本地全模拟；覆盖率待 E3 深化、类型检查已就绪 <code>--types</code> 可入 CI 第八步）</li>\n</ul>\n<h3 id=\"v35元编程与互操作出口\">v3.5「元编程与互操作」出口</h3>\n<ul>\n<li>[ ] 装饰器 + 反射 + dunder 全家；元编程测试集</li>\n<li>[ ] <strong><code>import python.requests</code> 能跑通一次真实 HTTP 请求</strong>（I2a——寄生期标志）</li>\n<li>[ ] <code>--profile</code>/<code>--coverage</code> 出报告</li>\n<li>[ ] 微基准比 v3.0 提升 ≥2x（M2）</li>\n<li>[ ] 测试数 ≥ 500</li>\n</ul>\n<p><strong>BIM 落地线进度（2026-10-19，战略首优先，POSITIONING.md 四大战场之 Dynamo 路径）</strong>：</p>\n<ul>\n<li>✅ I1 FFI 最小切片：ctypes 背载 6 内置 + 8 测试（Windows 真实 API）。剩余：回调/数组/联合/varargs/头文件解析/<code>foreign</code> 语法糖（20 人日中的未做部分）</li>\n<li>✅ I2a Python 桥最小切片：<code>import python.X</code> 命名空间挂载 + 标量编排 + 6 测试。剩余：类实例化/关键字参数/回调/子模块链/pip 三方 round-trip（15 人日中的未做部分）</li>\n<li>✅ BD2 Revit 桥：UnwrapElement + ElementRegistry + RevitSession，mock 世界端到端 10/10。剩余：属性双向通道、事务包裹、事件订阅</li>\n<li>✅ BD3 pyRevit 适配：CPython3 模式按钮流程 + 宿主自动定位，selftest 6/6。剩余：IronPython2 兼容、bundle 打包规范</li>\n<li>✅ BD4 CBWD 移植最小切片：洞口合并算法移植（std/bim/cbwd.intent），与 COM.py 参考逐例对齐（parity 6/6 + 8 测试）。剩余：Dynamo 实跑判定、翻弯/标签排列移植、组边界与参数写回</li>\n</ul>\n<h3 id=\"v40-beta生态冷启动出口\">v4.0-beta「生态冷启动」出口</h3>\n<ul>\n<li>[ ] 20 个官方包全部过「契约+测试+doc」三件套检查</li>\n<li>[ ] fib25 达 CPython 0.8x（M3 上）或 AOT 退路交付</li>\n<li>[ ] 浏览器（WASM）跑通 Intent REPL</li>\n<li>[ ] 第三方提交的 PR ≥ 5 个</li>\n<li>[ ] 五维雷达全部 ≥ 70%</li>\n</ul>\n<h3 id=\"v40-lts生产就绪出口\">v4.0 LTS「生产就绪」出口</h3>\n<ul>\n<li>[ ] §0.2 的五条硬标准全过</li>\n<li>[ ] API 冻结 + LTS 分支 + 安全响应流程（SLA 文档）</li>\n<li>[ ] 至少 1 个 10 万行级真实项目用 Intent 写成（<strong>最终验收：它真的被用来干活</strong>）</li>\n</ul>\n<hr>\n<h2 id=\"6-风险登记册\">6. 风险登记册</h2>\n<table><thead><tr><th>ID</th><th>风险</th><th>概率</th><th>冲击</th><th>缓解</th></tr></thead><tbody><tr><td>R1</td><td><strong>巴士因子</strong>：单维护者（阿J 是唯一重度 contributor）</td><td>高</td><td>致命</td><td>D5 每期定向邀请；文档/CI/流程全部「陌生人可上手」；每个 Phase 末至少 2 个外部 PR 合并</td></tr><tr><td>R2</td><td><strong>生态鸡生蛋</strong>：没包没人用，没人用没包</td><td>高</td><td>高</td><td>I2a Python 桥先寄生；D2 官方先立 20 标杆包；P3/P4 绑定「有真实包候选」才启动</td></tr><tr><td>R3</td><td><strong>JIT 不可行</strong>：M3 40 人日打水漂</td><td>中</td><td>高</td><td>分两期对冲；AOT 预编译退路；v3.5 先拿 M2 的 2x 保底</td></tr><tr><td>R4</td><td><strong>范围膨胀</strong>：Python 有 200 模块，抄不完</td><td>高</td><td>中</td><td>每期「不做清单」；LangForge 判定纪律（无判定不进 TASKS）；S 组以「生产常用 40 模块」封顶</td></tr><tr><td>R5</td><td><strong>正面对标无胜算</strong>：通用战场 vs CPython+30 年</td><td>高</td><td>中</td><td>定位锚定 BIM/AEC + 契约优先；通用能力「够用即可」不做军备竞赛</td></tr><tr><td>R6</td><td><strong>自动化失控</strong>：无人值守闭环产出低质代码堆积</td><td>中</td><td>中</td><td>每轮判定命令 + 人工抽查纪律（已实行）；契约覆盖率（Q2）作为质量闸</td></tr><tr><td>R7</td><td>内存模型选错（RC vs GC），返工</td><td>中</td><td>高</td><td>M1 先出设计文档评审再动工；参考 Python/CPython 与 Swift ARC 两种路线</td></tr></tbody></table>\n<h3 id=\"各期不做清单反膨胀防线\">各期「不做清单」（反膨胀防线）</h3>\n<ul>\n<li><strong>v3.0 不做</strong>：async/await、JIT、FFI、装饰器、eval——一次只打透一层</li>\n<li><strong>v3.5 不做</strong>：WASM、包仓库服务化、属性测试——等前面积木</li>\n<li><strong>v4.0-beta 不做</strong>：多后端（LLVM 直连）、移动端、IDE 全家——LTS 后再议</li>\n<li><strong>v4.0 LTS 不做</strong>：语言特性继续膨胀——LTS 期只修不加，新特性进 v5.0 实验分支</li>\n</ul>\n<hr>\n<h2 id=\"7-与-langforge-的衔接本路线图如何被执行\">7. 与 LangForge 的衔接（本路线图如何被执行）</h2>\n<ol>\n<li><strong>任务同构</strong>：本文档所有任务（S/T/P/A/M/E/X/I/Q/D 组）按「期」分批进入 <code>langforge.py</code> 的 TASKS——Phase 5 的 12 个任务作为下一批解锁（依赖已满足的立即进就绪池）</li>\n<li><strong>每期出口即评审点</strong>：v3.0/v3.5/v4.0-beta 出口清单由 <code>--verify</code> 命令组判定，不是人工感觉</li>\n<li><strong>雷达驱动调度</strong>：每期结束出五维雷达图，凹维自动转为下期 P1 任务（闭环自我修正）</li>\n<li><strong>风险任务熔断</strong>：R3（JIT）若连续 2 轮无实质进展，自动触发退路（AOT）——不死磕</li>\n<li><strong>人工介入点</strong>（叫你，不是自动）：期出口评审、T5/M3/I2 三个皇冠任务的方案评审、R1 社区动作（只能人做）</li>\n</ol>\n<hr>\n<h2 id=\"8-一页纸总结\">8. 一页纸总结</h2>\n<pre><code>今天（v2.3.0）：引擎全特性 + 18 模块 + 8 工具 + 126 测试 + VM 4.4x\nv3.0：类型系统（渐进类型）＋包管理（依赖/venv）＋结构化并发 ＋内存管理 —— 「能写生产代码」\nv3.5：元编程全家 ＋Python 互操作桥（寄生）＋剖析/覆盖率 ＋性能 2x —— 「能借力生态」\nv4.0-beta：20 官方包 ＋契约覆盖率 ＋async ＋JIT 0.8x/或AOT ＋WASM —— 「生态起步」\nv4.0 LTS：API 冻结 ＋10 万行真实项目 ＋LTS/安全响应 —— 「Python 级成熟度」\n差异化三张牌（每期都要强化）：契约系统（T5 契约即类型）｜自由线程（A4）｜BIM 领域包（D2）</code></pre>", "text": "Intent 长期演进路线图：对标 Python 成熟度 版本：v2.3.0 → v4.0 LTS ｜ 制定日期：2026-10-18 ｜ 配套： D:\\Desktop\\LangForge\\PROGRESS_PLAN.md （管理方案）、 docs/roadmap.md （P0-P4 已完成卷） 本文的任务与 LangForge 引擎的 TASKS 同构（id/依赖/判定/人日）—— 本路线图即未来 TASKS 的源 ，任何变更先改本文档，再同步引擎。 0. 战略定位：不打无准备之仗 0.1 与 Python 的关系：寄生 → 共生 → 替代（按序推进） 阶段 关系 标志能力 寄生期（v3.x） Intent 调用 Python 生态 I2 Python 互操作桥： import python.requests 直接用 共生期（v4.0-beta） 双方各有不可替代层 契约系统 + BIM 领域库 + 自有包生态起步 替代期（v4.0+） 特定场景下不再需要 Python 该领域「Intent 原生包」覆盖 80% 常用需求 战略结论：不要从零建生态（那是用 1 个人对抗 30 年）。I2 是整份路线图里 ROI 最高的单个任务。 0.2 成熟度定义（可判定的终局） 「能用 Intent 写出、并持续维护一个 10 万行级生产系统，且团队中没有语言设计者也能干活。」 拆成五条硬标准（Phase 8 验收）： 类型系统能防住 70% 的运行时错误（渐进类型 + 契约双重防线） 依赖/构建/测试/发布链路完整，第三方可无摩擦参与 性能在数值计算场景达到 CPython 的 0.8 倍（JIT 后） 调试体验不弱于 pdb（事后调试 + 剖析 + 覆盖率） 文档与社区到「陌生人能提第一个 PR」的程度 0.3 总线原则 契约优先 ：Python 靠测试和注释表达意图，Intent 把意图前移到签名——这是唯一必须在每一期都强化的差异化 反膨胀 ：每期配「不做清单」（见各期），砍掉的需求比砍掉的功能多 判定驱动 ：每个任务有命令级判定，无判定的任务不进路线图 1. 现状总账（v2.3.0，2026-10-18） 维度 现状 对标 Python 核心语法 词法/解析/语义/树遍历/字节码 VM 全特性，闭包/match/Result/契约/with/生成器 覆盖常用语法 ~85% 类型系统 泛型 + 约束 + 复合类型 + 基础推断 Python 的 typing 子集 + 独有契约 标准库 18 模块（str/math/list/itertools/collections/json/fs/os/sys/time/random/contract/bim×7 + datetime/http/sqlite/re/encoding） ~10% 包管理 intent.toml + install + lib 路径 + 本地 registry 雏形 并发 无 0% 性能 VM 4.4x 于自家解释器；fib25 787ms vs CPython 约 300ms ≈ 0.38x 0.38x 调试 调用链 + 源码光标 + --debug 断点单步 pdb 的 ~60% 元编程 类 + 运算符重载 + 少量 dunder ~20% 互操作 I1 FFI 最小切片（ctypes 6 内置）+ Revit/pyRevit 桥（BD2/BD3） 15%（寄生期起步） 测试 126 用例 + fuzz + CI 七步 ~5% 文档社区 37 页站点 + 25 API 页 + CONTRIBUTING 起步 结论：核心引擎（维度 1/5 的骨架）已就绪；生态与工具（维度 3/4/8/9/10）是零——这正是长期路线图的主战场。 2. 成熟度五维模型（每期打分，指标驱动） 维度 v2.3 v3.0 目标 v3.5 目标 v4.0-beta v4.0 LTS 语言核心 85% 92% 96% 98% 98% 类型系统 40% 70% 85% 92% 95% 包与环境 15% 55% 70% 85% 90% 并发异步 0% 40% 70% 85% 90% 性能内存 38%(CPython=100) 55% 75% 95% 110% 调试质量 60% 80% 90% 95% 95% 元编程 20% 20% 65% 85% 90% 互操作 0% 0% 45% 75% 85% 测试质量 5% 35% 55% 75% 85% 文档社区 10% 20% 45% 70% 85% 打分规则：可测指标（模块数/测试数/CPython 倍率）自动采样；主观项按 checklist 折算。 每期结束由 LangForge 雷达出图，凹下去的维度决定下一期优先级。 3. 十大维度详表 维度 1：核心语法与标准库 S 组任务 ID 任务 依赖 判定标准 人日 期 S1a 高频标准库补全（pathlib 高级/glob/shutil/tempfile/textwrap/csv/uuid/hashlib/hmac/secrets/logging/argparse/configparser/statistics/decimal） 无 各模块测试全过 + 契约齐全 15 v3.0 S1b itertools/collections 高级（permutations/combinations/product/heapq/bisect/deque/defaultdict/ChainMap） 无 测试 + 与 Python 语义对齐文档 6 v3.0 S2a 语法糖：海象 := / 星号解包 / 切片赋值 / 位置 only 参数 / match 类模式+守卫 T6 已完成 --check + 行为测试 + spec 同步 8 v3.5 S2b f-string 完整化（ = 调试格式 / 嵌套引号 / 格式规格对齐 Python） S2a 字符串测试扩充 3 v3.5 S3 生成器完整化（send/throw/close + yield from 已有） T6 协程语义测试 + spec 5 v3.5 S4 标准库总量 18 → 40 模块 S1a/S1b 目录计数 + 每模块 doc 页 10 v4.0-beta 风险 ：S1 是体力活无技术风险，但容易抄成 Python 的影子—— 每个模块进 Intent 前先问「契约版应该长什么样」 （如 require_non_empty 已在 contract 模块开了头）。 维度 2：类型系统（Intent 的主场，必须打成王牌） ID 任务 依赖 判定标准 人日 期 T1 渐进类型：可选标注 + intent check --types 静态检查器（mypy-lite：标注处检查 + 推断处放过） 无 类型错误测试集（应报错的报、不应报的不报） 20 v3.0 T2 结构化类型（Protocol 显式接口 + 鸭子类型的静态化） T1 协议符合性测试 8 v3.5 T3 局部变量类型推断 + 返回类型推断（HM 推断子集） T1 无标注代码推断正确率测试 10 v3.5 T4 泛型深化（型变标注/默认类型参数/类型别名/Recursive types） T1 泛型测试扩充 + spec 6 v4.0-beta T5 契约即类型：把 requires 作为类型精炼（refinement types 轻量版）—— def f(x: Int) requires x &gt; 0 后 f(-1) 编译期警告 T1 精炼类型测试集 12 v4.0-beta T5 是全路线图的技术皇冠 ：Python 生态没有的东西。做出来，Intent 的类型系统就不是「Python 的子集」而是「另一条路」。 维度 3：包管理与依赖环境 ID 任务 依赖 判定标准 人日 期 P1 依赖解析器：语义化版本约束 + 冲突解决 + intent.lock 锁定 registry 已完成 冲突场景测试（钻石依赖/回退） 10 v3.0 P2 虚拟环境： .venv 隔离 + 全局包缓存 + PATH 管理 P1 隔离性测试（两项目互不污染） 6 v3.0 P3 包仓库服务化：本地 index → HTTP registry + 包签名（minisign） P1 publish→install round-trip + 篡改检测 10 v4.0-beta P4 构建分发： .intentp 包格式（zip + 元数据）+ console_scripts 入口点 P3 打包装卸载 round-trip 6 v4.0-beta 风险 ：P3/P4 是「生态基础设施」，用不上就不做——判定标准绑定「有 ≥3 个真实第三方包候选」再启动（鸡生蛋纪律，见维度 10 的 D2）。 维度 4：并发与异步（从零建，方案已在 docs/roadmap.md §7.2 定型） ID 任务 依赖 判定标准 人日 期 A1 结构化并发： spawn + scope {} （Python threading 实现，演示级） 无 生产者-消费者 + 作用域退出自动 join 8 v3.0 A2 channel 通信原语（ ch &lt;- v / &lt;- ch ，线程安全队列） A1 多生产者多消费者 + 关闭语义 6 v3.0 A3 async/await + 事件循环（IO 密集；http 模块先行） A1/A2 并发 HTTP 抓取 + 与阻塞版行为一致 15 v4.0-beta A4 自由线程评估：无 GIL 架构下 Intent VM 的线程安全改造 A1 技术报告 + 原型（不承诺交付） 12 v4.0 LTS 战略备注 ：Python 3.13 才解决自由线程。 A4 若在 VM 层原生做对，是「Intent 比 Python 强」的第二个硬证据 （第一个是契约）。但不承诺——先出报告。 维度 5：性能优化与内存管理 ID 任务 依赖 判定标准 人日 期 M1 内存管理：引用计数 + 循环垃圾检测（或分代 GC 二选一，先出设计文档） 无 长跑无泄漏 + 循环引用回收测试 20 v3.0 M2 属性访问优化：内联缓存 + 隐藏类（实例形状） M1 微基准提升 ≥2x 12 v3.5 M3 JIT：热点方法编译（-tiered：VM → 中间表示 → 原生码；可先用 Cython 式 AOT 过渡） M2 fib25 达到 CPython 的 0.8x 40 v4.0-beta→LTS M4 剖析工具： --mem-profile （分配热点）+ --profile （函数级 cProfile 等价） M1 输出可读报告 + 测试 8 v3.5 风险 ：M3 是全路线图最大技术赌注（40 人日）。 对冲：M3 分两期 ，v3.5 只做「热点函数缓存编译」拿 0.5x，v4.0 LTS 再冲 0.8x。若 JIT 不可行，退路是 AOT 预编译（.intentc 缓存）——至少启动性能有交代。 维度 6：错误处理与调试 ID 任务 依赖 判定标准 人日 期 E1 异常链： raise X from Y + __cause__ / __context__ + 建议提示 无 异常链渲染测试 4 v3.0 E2 事后调试： --postmortem （异常时保存帧快照，崩溃后进场检视） E1 演示文件预期退出码 + 输出含帧检视 6 v3.0 E3 源码覆盖率： --coverage （语句 + 分支） 无 与 Python coverage 语义对齐文档 10 v3.5 E4 调试器增强：条件断点/watch 表达式/远程调试 --debug 已完成 pdb 功能对照清单 8 v4.0-beta 维度 7：元编程 ID 任务 依赖 判定标准 人日 期 X1 装饰器（ @deco 语法 + functools 系：wraps/lru_cache/partial/compose） 无 装饰器测试 + 与管道 ` &gt;` 的语义分工文档 10 X2 反射完整化：getattr/setattr/hasattr/dir + inspect 模块（签名/源码/成员） 无 反射测试 + 安全边界文档 8 v3.5 X3 dunder 协议全家： __call__/__iter__/__next__/__enter__/__exit__/__len__/__contains__/__eq__/__hash__/__repr__ 系统化 无 协议测试集 + spec 10 v3.5 X4 eval / compile 内建（带沙箱开关：默认禁 IO） X2 求值测试 + 安全测试 5 v4.0-beta 风险 ：X4 是安全黑洞。 纪律：eval 默认只开纯计算，IO/import 显式授权 ——这与 Intent 的契约哲学一致（意图显式化）。 维度 8：扩展与互操作（路线图皇冠上的明珠） ID 任务 依赖 判定标准 人日 期 I1 C ABI FFI： ctypes 等价——声明外部函数 + 加载 .dll/.so + 结构体映射 无 调用 Windows API（MessageBox）/libc 测试 20 v3.5 I2 Python 互操作桥 ：双向——Intent 里 import python.xxx 调 Python 包；Intent 包被打包成 Python 可 import I1 requests+numpy round-trip + 架构文档 25 v3.5→v4.0-beta I3 C 扩展 SDK：用 C 写 Intent 原生模块（头文件 + 类型注册 + GC 钩子） I1+M1 官方扩展示例（如高速 math 核） 15 v4.0-beta I4 WASM 编译目标：VM 字节码 → WASM（浏览器跑 Intent） M1 浏览器里跑通 fib + 文档站嵌入 REPL 18 v4.0 LTS I2 拆分两期 ：v3.5 做「Intent 调 Python」（寄生，解决生态从零问题），v4.0-beta 做「Python 调 Intent」（共生，Intent 库服务 Python 用户）。 维度 9：测试与质量保障 ID 任务 依赖 判定标准 人日 期 Q1 测试框架深化：fixture/mock/参数化/skip/预期异常 D1 已完成 框架功能对照 pytest 子集 8 v3.0 Q2 覆盖率工具：语句+分支+契约覆盖率（ Python 没有契约覆盖率 ） E3 覆盖率报告 + CI 门禁 6 v3.5 Q3 属性测试：Hypothesis 等价（生成器 + 收缩） Q1 属性测试库 + 实例 12 v4.0-beta Q4 基准套件标准化： benchmarks/ + 每期性能对比报告 M4 报告自动生成 + 不退化门禁 5 v3.5 维度 10：文档与社区生态 ID 任务 依赖 判定标准 人日 期 D1 交互式教程：浏览器 REPL（WASM 就绪后） I4 教程页可运行代码 10 v4.0-beta D2 生态冷启动：20 个「官方质量标准包」（CLI 工具/领域库/教学包） P2+X1 每个包：契约+测试+doc 三件套 30 v4.0-beta→LTS D3 文档三件套深化：教程（8→20 章）/参考全量/ cookbook（50 食谱） D2 章节计数 + 代码示例可运行 15 v4.0 LTS D4 社区基建：issue 模板/discussions/roadmap 公开/坏味道 Triage 流程 无 仓库配置落地 3 v3.0 D5 贡献者增长：每期结束定向邀请 2-3 人（「good first issue」批量制造） D4 PR 来自 ≥2 个非阿J 账号 持续 全程 D2 的鸡生蛋解法 ：不等社区， 官方先写 20 个包立标杆 （Python 早期也是官方先写 batteries）。包的主题一半通用（cli/logging/figlet）一半 BIM 领域（ifc 解析/构件库/明细表）——领域包是差异化，通用包是门票。 4. 四期总路线 Phase 5 生产基座（v3.0） 2026 Q4 — 2027 Q1 ≈ 78

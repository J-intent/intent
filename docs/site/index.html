><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(path) &gt; 0</li>\n</ul>", "text": "shutil copy_file copy_file(src: String, dst: String) → Bool 复制文件(覆盖式, 保留权限) def copy_file(src: String, dst: String) -&gt; Bool requires len(src) &gt; 0 and len(dst) &gt; 0 参数 类型 src String dst String 前置条件 : len(src) &gt; 0 and len(dst) &gt; 0 move move(src: String, dst: String) → Bool 移动文件或目录(跨盘则复制后删) def move(src: String, dst: String) -&gt; Bool requires len(src) &gt; 0 and len(dst) &gt; 0 参数 类型 src String dst String 前置条件 : len(src) &gt; 0 and len(dst) &gt; 0 rmtree rmtree(path: String) → Bool 递归删除目录(不存在抛 RuntimeError) def rmtree(path: String) -&gt; Bool requires len(path) &gt; 0 参数 类型 path String 前置条件 : len(path) &gt; 0"}, {"id": "std/sqlite.intent", "title": "std.sqlite", "group": "标准库 API", "html": "<h1 id=\"sqlite\">sqlite</h1>\n<h2 id=\"open\"><code>open</code></h2>\n<blockquote>open(path: String) → Int  打开数据库，返回句柄（&quot;:memory:&quot; 为内存库）</blockquote>\n<pre><code class=\"lang-intent\">def open(path: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"exec\"><code>exec</code></h2>\n<blockquote>exec(handle: Int, sql: String) → Int  执行写操作（建表/插入/更新/删除），返回影响行数</blockquote>\n<pre><code class=\"lang-intent\">def exec(handle: Int, sql: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>handle</code></td><td>Int</td></tr><tr><td><code>sql</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"query\"><code>query</code></h2>\n<blockquote>query(handle: Int, sql: String) → List  执行查询，返回行字典列表</blockquote>\n<pre><code class=\"lang-intent\">def query(handle: Int, sql: String) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>handle</code></td><td>Int</td></tr><tr><td><code>sql</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"close\"><code>close</code></h2>\n<blockquote>close(handle: Int)  关闭连接</blockquote>\n<pre><code class=\"lang-intent\">def close(handle: Int)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>handle</code></td><td>Int</td></tr></tbody></table>", "text": "sqlite open open(path: String) → Int 打开数据库，返回句柄（&quot;:memory:&quot; 为内存库） def open(path: String) -&gt; Int 参数 类型 path String exec exec(handle: Int, sql: String) → Int 执行写操作（建表/插入/更新/删除），返回影响行数 def exec(handle: Int, sql: String) -&gt; Int 参数 类型 handle Int sql String query query(handle: Int, sql: String) → List 执行查询，返回行字典列表 def query(handle: Int, sql: String) -&gt; List 参数 类型 handle Int sql String close close(handle: Int) 关闭连接 def close(handle: Int) 参数 类型 handle Int"}, {"id": "std/statistics.intent", "title": "std.statistics", "group": "标准库 API", "html": "<h1 id=\"statistics\">statistics</h1>\n<h2 id=\"mean\"><code>mean</code></h2>\n<blockquote>mean(lst: List) → Float  算术平均(空表违约)</blockquote>\n<pre><code class=\"lang-intent\">def mean(lst: Any) -&gt; Float\n    requires len(lst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(lst) &gt; 0</li>\n</ul>\n<h2 id=\"median\"><code>median</code></h2>\n<blockquote>median(lst: List) → Float  中位数(偶数取中间两值的平均)</blockquote>\n<pre><code class=\"lang-intent\">def median(lst: Any) -&gt; Float\n    requires len(lst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(lst) &gt; 0</li>\n</ul>\n<h2 id=\"variance\"><code>variance</code></h2>\n<blockquote>variance(lst: List) → Float  总体方差(均方偏离)</blockquote>\n<pre><code class=\"lang-intent\">def variance(lst: Any) -&gt; Float\n    requires len(lst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(lst) &gt; 0</li>\n</ul>\n<h2 id=\"stdev\"><code>stdev</code></h2>\n<blockquote>stdev(lst: List) → Float  总体标准差(方差的平方根)</blockquote>\n<pre><code class=\"lang-intent\">def stdev(lst: Any) -&gt; Float\n    requires len(lst) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(lst) &gt; 0</li>\n</ul>", "text": "statistics mean mean(lst: List) → Float 算术平均(空表违约) def mean(lst: Any) -&gt; Float requires len(lst) &gt; 0 参数 类型 lst Any 前置条件 : len(lst) &gt; 0 median median(lst: List) → Float 中位数(偶数取中间两值的平均) def median(lst: Any) -&gt; Float requires len(lst) &gt; 0 参数 类型 lst Any 前置条件 : len(lst) &gt; 0 variance variance(lst: List) → Float 总体方差(均方偏离) def variance(lst: Any) -&gt; Float requires len(lst) &gt; 0 参数 类型 lst Any 前置条件 : len(lst) &gt; 0 stdev stdev(lst: List) → Float 总体标准差(方差的平方根) def stdev(lst: Any) -&gt; Float requires len(lst) &gt; 0 参数 类型 lst Any 前置条件 : len(lst) &gt; 0"}, {"id": "std/str.intent", "title": "std.str", "group": "标准库 API", "html": "<h1 id=\"str\">str</h1>\n<h2 id=\"length\"><code>length</code></h2>\n<pre><code class=\"lang-intent\">def length(s: String) -&gt; Int\n    ensures result &gt;= 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0</li>\n</ul>\n<h2 id=\"is-empty\"><code>is_empty</code></h2>\n<pre><code class=\"lang-intent\">def is_empty(s: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"concat\"><code>concat</code></h2>\n<pre><code class=\"lang-intent\">def concat(a: String, b: String) -&gt; String\n    ensures len(result) == len(a) + len(b)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>String</td></tr><tr><td><code>b</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == len(a) + len(b)</li>\n</ul>\n<h2 id=\"repeat\"><code>repeat</code></h2>\n<pre><code class=\"lang-intent\">def repeat(s: String, n: Int) -&gt; String\n    requires n &gt;= 0\n    ensures len(result) == len(s) * n</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>n &gt;= 0</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == len(s) * n</li>\n</ul>\n<h2 id=\"contains\"><code>contains</code></h2>\n<pre><code class=\"lang-intent\">def contains(s: String, sub: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>sub</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"starts-with\"><code>starts_with</code></h2>\n<pre><code class=\"lang-intent\">def starts_with(s: String, prefix: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>prefix</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"ends-with\"><code>ends_with</code></h2>\n<pre><code class=\"lang-intent\">def ends_with(s: String, suffix: String) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>suffix</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"index-of\"><code>index_of</code></h2>\n<pre><code class=\"lang-intent\">def index_of(s: String, sub: String) -&gt; Int\n    ensures result &gt;= -1</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>sub</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= -1</li>\n</ul>\n<h2 id=\"last-index-of\"><code>last_index_of</code></h2>\n<pre><code class=\"lang-intent\">def last_index_of(s: String, sub: String) -&gt; Int\n    ensures result &gt;= -1</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>sub</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= -1</li>\n</ul>\n<h2 id=\"substring\"><code>substring</code></h2>\n<pre><code class=\"lang-intent\">def substring(s: String, start: Int, end: Int) -&gt; String\n    requires start &gt;= 0\n    requires end &lt;= len(s)\n    requires start &lt;= end\n    ensures len(result) == end - start</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>start</code></td><td>Int</td></tr><tr><td><code>end</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>start &gt;= 0</li>\n<li>end &lt;= len(s)</li>\n<li>start &lt;= end</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == end - start</li>\n</ul>\n<h2 id=\"to-upper\"><code>to_upper</code></h2>\n<pre><code class=\"lang-intent\">def to_upper(s: String) -&gt; String\n    ensures len(result) == len(s)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == len(s)</li>\n</ul>\n<h2 id=\"to-lower\"><code>to_lower</code></h2>\n<pre><code class=\"lang-intent\">def to_lower(s: String) -&gt; String\n    ensures len(result) == len(s)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr></tbody></table>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) == len(s)</li>\n</ul>\n<h2 id=\"replace\"><code>replace</code></h2>\n<pre><code class=\"lang-intent\">def replace(s: String, old_val: String, new_val: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>old_val</code></td><td>String</td></tr><tr><td><code>new_val</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"cut\"><code>cut</code></h2>\n<pre><code class=\"lang-intent\">def cut(s: String, sep: String)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>sep</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"glue\"><code>glue</code></h2>\n<pre><code class=\"lang-intent\">def glue(sep: String, parts: Any) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>sep</code></td><td>String</td></tr><tr><td><code>parts</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"strip\"><code>strip</code></h2>\n<pre><code class=\"lang-intent\">def strip(s: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"match-at\"><code>match_at</code></h2>\n<pre><code class=\"lang-intent\">def match_at(s: String, sub: String, pos: Int) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>s</code></td><td>String</td></tr><tr><td><code>sub</code></td><td>String</td></tr><tr><td><code>pos</code></td><td>Int</td></tr></tbody></table>", "text": "str length def length(s: String) -&gt; Int ensures result &gt;= 0 参数 类型 s String 后置条件 : result &gt;= 0 is_empty def is_empty(s: String) -&gt; Bool 参数 类型 s String concat def concat(a: String, b: String) -&gt; String ensures len(result) == len(a) + len(b) 参数 类型 a String b String 后置条件 : len(result) == len(a) + len(b) repeat def repeat(s: String, n: Int) -&gt; String requires n &gt;= 0 ensures len(result) == len(s) * n 参数 类型 s String n Int 前置条件 : n &gt;= 0 后置条件 : len(result) == len(s) * n contains def contains(s: String, sub: String) -&gt; Bool 参数 类型 s String sub String starts_with def starts_with(s: String, prefix: String) -&gt; Bool 参数 类型 s String prefix String ends_with def ends_with(s: String, suffix: String) -&gt; Bool 参数 类型 s String suffix String index_of def index_of(s: String, sub: String) -&gt; Int ensures result &gt;= -1 参数 类型 s String sub String 后置条件 : result &gt;= -1 last_index_of def last_index_of(s: String, sub: String) -&gt; Int ensures result &gt;= -1 参数 类型 s String sub String 后置条件 : result &gt;= -1 substring def substring(s: String, start: Int, end: Int) -&gt; String requires start &gt;= 0 requires end &lt;= len(s) requires start &lt;= end ensures len(result) == end - start 参数 类型 s String start Int end Int 前置条件 : start &gt;= 0 end &lt;= len(s) start &lt;= end 后置条件 : len(result) == end - start to_upper def to_upper(s: String) -&gt; String ensures len(result) == len(s) 参数 类型 s String 后置条件 : len(result) == len(s) to_lower def to_lower(s: String) -&gt; String ensures len(result) == len(s) 参数 类型 s String 后置条件 : len(result) == len(s) replace def replace(s: String, old_val: String, new_val: String) -&gt; String 参数 类型 s String old_val String new_val String cut def cut(s: String, sep: String) 参数 类型 s String sep String glue def glue(sep: String, parts: Any) -&gt; String 参数 类型 sep String parts Any strip def strip(s: String) -&gt; String 参数 类型 s String match_at def match_at(s: String, sub: String, pos: Int) -&gt; Bool 参数 类型 s String sub String pos Int"}, {"id": "std/sys.intent", "title": "std.sys", "group": "标准库 API", "html": "<h1 id=\"sys\">sys</h1>\n<h2 id=\"read-file\"><code>read_file</code></h2>\n<pre><code class=\"lang-intent\">def read_file(path: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"write-file\"><code>write_file</code></h2>\n<pre><code class=\"lang-intent\">def write_file(path: String, content: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>path</code></td><td>String</td></tr><tr><td><code>content</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"timestamp\"><code>timestamp</code></h2>\n<pre><code class=\"lang-intent\">def timestamp() -&gt; Int</code></pre>\n<h2 id=\"debug\"><code>debug</code></h2>\n<pre><code class=\"lang-intent\">def debug(msg: String) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>msg</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"exit\"><code>exit</code></h2>\n<pre><code class=\"lang-intent\">def exit(code: Int) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>code</code></td><td>Int</td></tr></tbody></table>", "text": "sys read_file def read_file(path: String) -&gt; String 参数 类型 path String write_file def write_file(path: String, content: String) -&gt; Int 参数 类型 path String content String timestamp def timestamp() -&gt; Int debug def debug(msg: String) -&gt; Int 参数 类型 msg String exit def exit(code: Int) -&gt; Int 参数 类型 code Int"}, {"id": "std/tempfile.intent", "title": "std.tempfile", "group": "标准库 API", "html": "<h1 id=\"tempfile\">tempfile</h1>\n<h2 id=\"mkdtemp\"><code>mkdtemp</code></h2>\n<blockquote>mkdtemp() → String  创建唯一临时目录(调用方负责清理)</blockquote>\n<pre><code class=\"lang-intent\">def mkdtemp() -&gt; String</code></pre>\n<h2 id=\"mkstemp\"><code>mkstemp</code></h2>\n<blockquote>mkstemp(prefix: String) → String  创建唯一临时文件, 返回路径</blockquote>\n<pre><code class=\"lang-intent\">def mkstemp(prefix: String) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>prefix</code></td><td>String</td></tr></tbody></table>\n<h2 id=\"tempdir\"><code>tempdir</code></h2>\n<blockquote>tempdir() → String  系统临时目录路径</blockquote>\n<pre><code class=\"lang-intent\">def tempdir() -&gt; String</code></pre>", "text": "tempfile mkdtemp mkdtemp() → String 创建唯一临时目录(调用方负责清理) def mkdtemp() -&gt; String mkstemp mkstemp(prefix: String) → String 创建唯一临时文件, 返回路径 def mkstemp(prefix: String) -&gt; String 参数 类型 prefix String tempdir tempdir() → String 系统临时目录路径 def tempdir() -&gt; String"}, {"id": "std/textwrap.intent", "title": "std.textwrap", "group": "标准库 API", "html": "<h1 id=\"textwrap\">textwrap</h1>\n<h2 id=\"wrap\"><code>wrap</code></h2>\n<blockquote>wrap(text: String, width: Int) → List[String]  按词贪心换行</blockquote>\n<pre><code class=\"lang-intent\">def wrap(text: String, width: Int) -&gt; List&lt;String&gt;\n    requires len(text) &gt; 0 and width &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr><tr><td><code>width</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(text) &gt; 0 and width &gt; 0</li>\n</ul>\n<h2 id=\"fill\"><code>fill</code></h2>\n<blockquote>fill(text: String, width: Int) → String  换行后用 chr(10) 重接</blockquote>\n<pre><code class=\"lang-intent\">def fill(text: String, width: Int) -&gt; String\n    requires len(text) &gt; 0 and width &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr><tr><td><code>width</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(text) &gt; 0 and width &gt; 0</li>\n</ul>\n<h2 id=\"indent\"><code>indent</code></h2>\n<blockquote>indent(text: String, prefix: String) → String  每行加前缀</blockquote>\n<pre><code class=\"lang-intent\">def indent(text: String, prefix: String) -&gt; String\n    requires len(text) &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr><tr><td><code>prefix</code></td><td>String</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(text) &gt; 0</li>\n</ul>\n<h2 id=\"shorten\"><code>shorten</code></h2>\n<blockquote>shorten(text: String, width: Int) → String  超长截断加省略号</blockquote>\n<pre><code class=\"lang-intent\">def shorten(text: String, width: Int) -&gt; String\n    requires len(text) &gt; 0 and width &gt; 0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>text</code></td><td>String</td></tr><tr><td><code>width</code></td><td>Int</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(text) &gt; 0 and width &gt; 0</li>\n</ul>", "text": "textwrap wrap wrap(text: String, width: Int) → List[String] 按词贪心换行 def wrap(text: String, width: Int) -&gt; List&lt;String&gt; requires len(text) &gt; 0 and width &gt; 0 参数 类型 text String width Int 前置条件 : len(text) &gt; 0 and width &gt; 0 fill fill(text: String, width: Int) → String 换行后用 chr(10) 重接 def fill(text: String, width: Int) -&gt; String requires len(text) &gt; 0 and width &gt; 0 参数 类型 text String width Int 前置条件 : len(text) &gt; 0 and width &gt; 0 indent indent(text: String, prefix: String) → String 每行加前缀 def indent(text: String, prefix: String) -&gt; String requires len(text) &gt; 0 参数 类型 text String prefix String 前置条件 : len(text) &gt; 0 shorten shorten(text: String, width: Int) → String 超长截断加省略号 def shorten(text: String, width: Int) -&gt; String requires len(text) &gt; 0 and width &gt; 0 参数 类型 text String width Int 前置条件 : len(text) &gt; 0 and width &gt; 0"}, {"id": "std/time.intent", "title": "std.time", "group": "标准库 API", "html": "<h1 id=\"time\">time</h1>\n<h2 id=\"current-timestamp\"><code>current_timestamp</code></h2>\n<blockquote>current_timestamp() — 返回当前 Unix 时间戳（浮点秒数）</blockquote>\n<pre><code class=\"lang-intent\">def current_timestamp() -&gt; Float</code></pre>\n<h2 id=\"delay\"><code>delay</code></h2>\n<blockquote>delay(seconds) — 暂停指定秒数</blockquote>\n<pre><code class=\"lang-intent\">def delay(seconds: Float) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>seconds</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"timestamp-ns\"><code>timestamp_ns</code></h2>\n<blockquote>timestamp_ns() — 高精度纳秒时刻</blockquote>\n<pre><code class=\"lang-intent\">def timestamp_ns() -&gt; Float</code></pre>\n<h2 id=\"elapsed-ms\"><code>elapsed_ms</code></h2>\n<blockquote>elapsed_ms(start: Float) — 从 start 到现在的毫秒数</blockquote>\n<pre><code class=\"lang-intent\">def elapsed_ms(start: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>start</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"elapsed-ns\"><code>elapsed_ns</code></h2>\n<blockquote>elapsed_ns(start: Float) — 纳秒级耗时</blockquote>\n<pre><code class=\"lang-intent\">def elapsed_ns(start: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>start</code></td><td>Float</td></tr></tbody></table>", "text": "time current_timestamp current_timestamp() — 返回当前 Unix 时间戳（浮点秒数） def current_timestamp() -&gt; Float delay delay(seconds) — 暂停指定秒数 def delay(seconds: Float) -&gt; Int 参数 类型 seconds Float timestamp_ns timestamp_ns() — 高精度纳秒时刻 def timestamp_ns() -&gt; Float elapsed_ms elapsed_ms(start: Float) — 从 start 到现在的毫秒数 def elapsed_ms(start: Float) -&gt; Float 参数 类型 start Float elapsed_ns elapsed_ns(start: Float) — 纳秒级耗时 def elapsed_ns(start: Float) -&gt; Float 参数 类型 start Float"}, {"id": "std/uuid.intent", "title": "std.uuid", "group": "标准库 API", "html": "<h1 id=\"uuid\">uuid</h1>\n<h2 id=\"uuid4\"><code>uuid4</code></h2>\n<blockquote>uuid4() → String  随机 UUID(带连字符, 36 字符)</blockquote>\n<pre><code class=\"lang-intent\">def uuid4() -&gt; String</code></pre>\n<h2 id=\"uuid4-hex\"><code>uuid4_hex</code></h2>\n<blockquote>uuid4_hex() → String  随机 UUID(32 位无连字符)</blockquote>\n<pre><code class=\"lang-intent\">def uuid4_hex() -&gt; String</code></pre>", "text": "uuid uuid4 uuid4() → String 随机 UUID(带连字符, 36 字符) def uuid4() -&gt; String uuid4_hex uuid4_hex() → String 随机 UUID(32 位无连字符) def uuid4_hex() -&gt; String"}, {"id": "std/bim/cbwd.intent", "title": "bim.cbwd", "group": "标准库 API", "html": "<h1 id=\"cbwd\">cbwd</h1>\n<h2 id=\"list-contains\"><code>list_contains</code></h2>\n<pre><code class=\"lang-intent\">def list_contains(lst: Any, v: Any) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>lst</code></td><td>Any</td></tr><tr><td><code>v</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"bbox-gap-mm\"><code>bbox_gap_mm</code></h2>\n<blockquote>3D 包围盒间隙(mm): 两盒在任一维度重叠 → 0; 否则三维分离距离的欧氏长度</blockquote>\n<pre><code class=\"lang-intent\">def bbox_gap_mm(b1: Any, b2: Any) -&gt; Float\n    requires len(&lt;SubscriptExpr&gt;) == 3\n    requires len(&lt;SubscriptExpr&gt;) == 3\n    ensures result &gt;= 0.0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>b1</code></td><td>Any</td></tr><tr><td><code>b2</code></td><td>Any</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>len(&lt;SubscriptExpr&gt;) == 3</li>\n<li>len(&lt;SubscriptExpr&gt;) == 3</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>result &gt;= 0.0</li>\n</ul>\n<h2 id=\"can-merge\"><code>can_merge</code></h2>\n<blockquote>合并判定: 包围盒间隙 ≤ max_distance 且(圆柱时)表面间隙 ≤ max_distance\n洞口 schema: {&quot;min&quot;: [x,y,z], &quot;max&quot;: [x,y,z], &quot;cylindrical&quot;: Bool,\n&quot;radius&quot;: Float, &quot;center&quot;: [x,y,z]} — 单位 mm</blockquote>\n<pre><code class=\"lang-intent\">def can_merge(o1: Any, o2: Any, max_distance_mm: Float) -&gt; Bool\n    requires max_distance_mm &gt;= 0.0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>o1</code></td><td>Any</td></tr><tr><td><code>o2</code></td><td>Any</td></tr><tr><td><code>max_distance_mm</code></td><td>Float</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>max_distance_mm &gt;= 0.0</li>\n</ul>\n<h2 id=\"components\"><code>_components</code></h2>\n<blockquote>连通分量核心: cands[i] = i 的候选下标表(已去重), DFS 遍历\n分量集合与参考的 BFS 完全一致(连通分量唯一, 遍历顺序不影响成员)</blockquote>\n<pre><code class=\"lang-intent\">def _components(n: Int, cands: Any, openings: Any, max_distance_mm: Float) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr><tr><td><code>cands</code></td><td>Any</td></tr><tr><td><code>openings</code></td><td>Any</td></tr><tr><td><code>max_distance_mm</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"all-candidates\"><code>_all_candidates</code></h2>\n<blockquote>全候选表: 每个下标的候选 = 其余全部(O(n²) 兜底路径, 参考 _find_merge_groups_slow)</blockquote>\n<pre><code class=\"lang-intent\">def _all_candidates(n: Int) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>n</code></td><td>Int</td></tr></tbody></table>\n<h2 id=\"grid-candidates\"><code>_grid_candidates</code></h2>\n<blockquote>空间哈希候选表: 包围盒膨胀 D 后共格的下标(数学不漏: 3D 距离 ≤ D ⟺ 膨胀相交 ⟹ 共格)\n网格边长沿用参考口径(D_ft &gt; 0.5 ? D_ft : 0.5, 换算 mm: D &gt; 152.4 ? D : 152.4)</blockquote>\n<pre><code class=\"lang-intent\">def _grid_candidates(openings: Any, max_distance_mm: Float, cell: Float) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>openings</code></td><td>Any</td></tr><tr><td><code>max_distance_mm</code></td><td>Float</td></tr><tr><td><code>cell</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"find-merge-groups\"><code>find_merge_groups</code></h2>\n<blockquote>洞口合并分组(参考 find_merge_groups 的默认路径: 空间哈希预筛)</blockquote>\n<pre><code class=\"lang-intent\">def find_merge_groups(openings: Any, max_distance_mm: Float) -&gt; List\n    requires max_distance_mm &gt;= 0.0\n    ensures len(result) &gt;= 1</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>openings</code></td><td>Any</td></tr><tr><td><code>max_distance_mm</code></td><td>Float</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>max_distance_mm &gt;= 0.0</li>\n</ul>\n<p><strong>后置条件</strong>:</p>\n<ul>\n<li>len(result) &gt;= 1</li>\n</ul>\n<h2 id=\"find-merge-groups-slow\"><code>find_merge_groups_slow</code></h2>\n<blockquote>兜底路径: O(n²) 全两两(参考 PRECISE_MERGE_PREFILTER=False)\n与默认路径的分量集合必须一致 — 测试里互为对照</blockquote>\n<pre><code class=\"lang-intent\">def find_merge_groups_slow(openings: Any, max_distance_mm: Float) -&gt; List\n    requires max_distance_mm &gt;= 0.0</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>openings</code></td><td>Any</td></tr><tr><td><code>max_distance_mm</code></td><td>Float</td></tr></tbody></table>\n<p><strong>前置条件</strong>:</p>\n<ul>\n<li>max_distance_mm &gt;= 0.0</li>\n</ul>\n<h2 id=\"group-signature\"><code>group_signature</code></h2>\n<blockquote>组签名: 组内下标升序连字符 + 全体排序(跨实现的稳定比较形态)</blockquote>\n<pre><code class=\"lang-intent\">def group_signature(g: Any) -&gt; String</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>g</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"groups-signature\"><code>groups_signature</code></h2>\n<pre><code class=\"lang-intent\">def groups_signature(groups: Any) -&gt; List</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>groups</code></td><td>Any</td></tr></tbody></table>", "text": "cbwd list_contains def list_contains(lst: Any, v: Any) -&gt; Bool 参数 类型 lst Any v Any bbox_gap_mm 3D 包围盒间隙(mm): 两盒在任一维度重叠 → 0; 否则三维分离距离的欧氏长度 def bbox_gap_mm(b1: Any, b2: Any) -&gt; Float requires len(&lt;SubscriptExpr&gt;) == 3 requires len(&lt;SubscriptExpr&gt;) == 3 ensures result &gt;= 0.0 参数 类型 b1 Any b2 Any 前置条件 : len(&lt;SubscriptExpr&gt;) == 3 len(&lt;SubscriptExpr&gt;) == 3 后置条件 : result &gt;= 0.0 can_merge 合并判定: 包围盒间隙 ≤ max_distance 且(圆柱时)表面间隙 ≤ max_distance 洞口 schema: {&quot;min&quot;: [x,y,z], &quot;max&quot;: [x,y,z], &quot;cylindrical&quot;: Bool, &quot;radius&quot;: Float, &quot;center&quot;: [x,y,z]} — 单位 mm def can_merge(o1: Any, o2: Any, max_distance_mm: Float) -&gt; Bool requires max_distance_mm &gt;= 0.0 参数 类型 o1 Any o2 Any max_distance_mm Float 前置条件 : max_distance_mm &gt;= 0.0 _components 连通分量核心: cands[i] = i 的候选下标表(已去重), DFS 遍历 分量集合与参考的 BFS 完全一致(连通分量唯一, 遍历顺序不影响成员) def _components(n: Int, cands: Any, openings: Any, max_distance_mm: Float) -&gt; List 参数 类型 n Int cands Any openings Any max_distance_mm Float _all_candidates 全候选表: 每个下标的候选 = 其余全部(O(n²) 兜底路径, 参考 _find_merge_groups_slow) def _all_candidates(n: Int) -&gt; List 参数 类型 n Int _grid_candidates 空间哈希候选表: 包围盒膨胀 D 后共格的下标(数学不漏: 3D 距离 ≤ D ⟺ 膨胀相交 ⟹ 共格) 网格边长沿用参考口径(D_ft &gt; 0.5 ? D_ft : 0.5, 换算 mm: D &gt; 152.4 ? D : 152.4) def _grid_candidates(openings: Any, max_distance_mm: Float, cell: Float) -&gt; List 参数 类型 openings Any max_distance_mm Float cell Float find_merge_groups 洞口合并分组(参考 find_merge_groups 的默认路径: 空间哈希预筛) def find_merge_groups(openings: Any, max_distance_mm: Float) -&gt; List requires max_distance_mm &gt;= 0.0 ensures len(result) &gt;= 1 参数 类型 openings Any max_distance_mm Float 前置条件 : max_distance_mm &gt;= 0.0 后置条件 : len(result) &gt;= 1 find_merge_groups_slow 兜底路径: O(n²) 全两两(参考 PRECISE_MERGE_PREFILTER=False) 与默认路径的分量集合必须一致 — 测试里互为对照 def find_merge_groups_slow(openings: Any, max_distance_mm: Float) -&gt; List requires max_distance_mm &gt;= 0.0 参数 类型 openings Any max_distance_mm Float 前置条件 : max_distance_mm &gt;= 0.0 group_signature 组签名: 组内下标升序连字符 + 全体排序(跨实现的稳定比较形态) def group_signature(g: Any) -&gt; String 参数 类型 g Any groups_signature def groups_signature(groups: Any) -&gt; List 参数 类型 groups Any"}, {"id": "std/bim/geometry.intent", "title": "bim.geometry", "group": "标准库 API", "html": "<h1 id=\"geometry\">geometry</h1>\n<h2 id=\"min-float\"><code>min_float</code></h2>\n<pre><code class=\"lang-intent\">def min_float(a: Float, b: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Float</td></tr><tr><td><code>b</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"max-float\"><code>max_float</code></h2>\n<pre><code class=\"lang-intent\">def max_float(a: Float, b: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Float</td></tr><tr><td><code>b</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"class-vector3d\">class <code>Vector3D</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(x: Float, y: Float, z: Float)</code></li>\n<li><code>add(other: Vector3D)</code> -&gt; <code>Vector3D</code></li>\n<li><code>sub(other: Vector3D)</code> -&gt; <code>Vector3D</code></li>\n<li><code>scale(s: Float)</code> -&gt; <code>Vector3D</code></li>\n<li><code>dot(other: Vector3D)</code> -&gt; <code>Float</code></li>\n<li><code>cross(other: Vector3D)</code> -&gt; <code>Vector3D</code></li>\n<li><code>length()</code> -&gt; <code>Float</code></li>\n<li><code>normalize()</code> -&gt; <code>Vector3D</code></li>\n<li><code>negate()</code> -&gt; <code>Vector3D</code></li>\n<li><code>from_points(a: Point3D, b: Point3D)</code></li>\n<li><code>distance_to(other: Vector3D)</code> -&gt; <code>Float</code></li>\n</ul>\n<h2 id=\"class-point3d\">class <code>Point3D</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(x: Float, y: Float, z: Float)</code></li>\n<li><code>add_vector(v: Vector3D)</code> -&gt; <code>Point3D</code></li>\n<li><code>sub_vector(v: Vector3D)</code> -&gt; <code>Point3D</code></li>\n<li><code>to(other: Point3D)</code> -&gt; <code>Vector3D</code></li>\n<li><code>distance_to(other: Point3D)</code> -&gt; <code>Float</code></li>\n<li><code>midpoint(other: Point3D)</code> -&gt; <code>Point3D</code></li>\n</ul>\n<h2 id=\"class-line3d\">class <code>Line3D</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(start: Point3D, end: Point3D)</code></li>\n<li><code>direction()</code> -&gt; <code>Vector3D</code></li>\n<li><code>length()</code> -&gt; <code>Float</code></li>\n<li><code>point_at(t: Float)</code> -&gt; <code>Point3D</code></li>\n<li><code>midpoint()</code> -&gt; <code>Point3D</code></li>\n</ul>\n<h2 id=\"class-bbox3d\">class <code>BBox3D</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(min: Point3D, max: Point3D)</code></li>\n<li><code>from_points(a: Point3D, b: Point3D)</code></li>\n<li><code>size()</code> -&gt; <code>Vector3D</code></li>\n<li><code>center()</code> -&gt; <code>Point3D</code></li>\n<li><code>volume()</code> -&gt; <code>Float</code></li>\n<li><code>contains(p: Point3D)</code> -&gt; <code>Int</code></li>\n<li><code>intersects(other: BBox3D)</code> -&gt; <code>Int</code></li>\n<li><code>expand(p: Point3D)</code></li>\n<li><code>expand_padded(p: Point3D, pad: Float)</code></li>\n<li><code>merge(other: BBox3D)</code></li>\n<li><code>set_empty()</code></li>\n</ul>", "text": "geometry min_float def min_float(a: Float, b: Float) -&gt; Float 参数 类型 a Float b Float max_float def max_float(a: Float, b: Float) -&gt; Float 参数 类型 a Float b Float class Vector3D init() create(x: Float, y: Float, z: Float) add(other: Vector3D) -&gt; Vector3D sub(other: Vector3D) -&gt; Vector3D scale(s: Float) -&gt; Vector3D dot(other: Vector3D) -&gt; Float cross(other: Vector3D) -&gt; Vector3D length() -&gt; Float normalize() -&gt; Vector3D negate() -&gt; Vector3D from_points(a: Point3D, b: Point3D) distance_to(other: Vector3D) -&gt; Float class Point3D init() create(x: Float, y: Float, z: Float) add_vector(v: Vector3D) -&gt; Point3D sub_vector(v: Vector3D) -&gt; Point3D to(other: Point3D) -&gt; Vector3D distance_to(other: Point3D) -&gt; Float midpoint(other: Point3D) -&gt; Point3D class Line3D init() create(start: Point3D, end: Point3D) direction() -&gt; Vector3D length() -&gt; Float point_at(t: Float) -&gt; Point3D midpoint() -&gt; Point3D class BBox3D init() create(min: Point3D, max: Point3D) from_points(a: Point3D, b: Point3D) size() -&gt; Vector3D center() -&gt; Point3D volume() -&gt; Float contains(p: Point3D) -&gt; Int intersects(other: BBox3D) -&gt; Int expand(p: Point3D) expand_padded(p: Point3D, pad: Float) merge(other: BBox3D) set_empty()"}, {"id": "std/bim/pipe.intent", "title": "bim.pipe", "group": "标准库 API", "html": "<h1 id=\"pipe\">pipe</h1>\n<h2 id=\"pipes-collide\"><code>pipes_collide</code></h2>\n<blockquote>两段管道是否碰撞（圆柱体近似）</blockquote>\n<pre><code class=\"lang-intent\">def pipes_collide(a: PipeSegment, b: PipeSegment) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>PipeSegment</td></tr><tr><td><code>b</code></td><td>PipeSegment</td></tr></tbody></table>\n<h2 id=\"segment-distance\"><code>segment_distance</code></h2>\n<blockquote>两条线段的最短距离</blockquote>\n<pre><code class=\"lang-intent\">def segment_distance(a1: Point3D, a2: Point3D, b1: Point3D, b2: Point3D) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a1</code></td><td>Point3D</td></tr><tr><td><code>a2</code></td><td>Point3D</td></tr><tr><td><code>b1</code></td><td>Point3D</td></tr><tr><td><code>b2</code></td><td>Point3D</td></tr></tbody></table>\n<h2 id=\"clamp\"><code>clamp</code></h2>\n<blockquote>钳制值到 [lo, hi]</blockquote>\n<pre><code class=\"lang-intent\">def clamp(val: Float, lo: Float, hi: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>val</code></td><td>Float</td></tr><tr><td><code>lo</code></td><td>Float</td></tr><tr><td><code>hi</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"pipe-slope-percent\"><code>pipe_slope_percent</code></h2>\n<blockquote>计算管道的坡度 (百分比，如 0.02 = 2%)</blockquote>\n<pre><code class=\"lang-intent\">def pipe_slope_percent(seg: PipeSegment) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>seg</code></td><td>PipeSegment</td></tr></tbody></table>\n<h2 id=\"pipe-slope-ratio\"><code>pipe_slope_ratio</code></h2>\n<blockquote>计算管道的坡度 (即 1:N，如 1:50)</blockquote>\n<pre><code class=\"lang-intent\">def pipe_slope_ratio(seg: PipeSegment) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>seg</code></td><td>PipeSegment</td></tr></tbody></table>\n<h2 id=\"create-pipe\"><code>create_pipe</code></h2>\n<blockquote>创建从起点到终点的直管</blockquote>\n<pre><code class=\"lang-intent\">def create_pipe(start: Point3D, end: Point3D, diameter: Float, thickness: Float) -&gt; PipeSegment</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>start</code></td><td>Point3D</td></tr><tr><td><code>end</code></td><td>Point3D</td></tr><tr><td><code>diameter</code></td><td>Float</td></tr><tr><td><code>thickness</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"offset-up\"><code>offset_up</code></h2>\n<blockquote>向上翻弯（常用场景：绕过上方障碍）</blockquote>\n<pre><code class=\"lang-intent\">def offset_up(a: Point3D, b: Point3D, pipe_dir: Vector3D, height: Float, diameter: Float, thickness: Float) -&gt; PipeOffset</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Point3D</td></tr><tr><td><code>b</code></td><td>Point3D</td></tr><tr><td><code>pipe_dir</code></td><td>Vector3D</td></tr><tr><td><code>height</code></td><td>Float</td></tr><tr><td><code>diameter</code></td><td>Float</td></tr><tr><td><code>thickness</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"offset-side\"><code>offset_side</code></h2>\n<blockquote>侧向翻弯</blockquote>\n<pre><code class=\"lang-intent\">def offset_side(a: Point3D, b: Point3D, pipe_dir: Vector3D, side_dir: Vector3D, distance: Float, diameter: Float, thickness: Float) -&gt; PipeOffset</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Point3D</td></tr><tr><td><code>b</code></td><td>Point3D</td></tr><tr><td><code>pipe_dir</code></td><td>Vector3D</td></tr><tr><td><code>side_dir</code></td><td>Vector3D</td></tr><tr><td><code>distance</code></td><td>Float</td></tr><tr><td><code>diameter</code></td><td>Float</td></tr><tr><td><code>thickness</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"offset-total-length\"><code>offset_total_length</code></h2>\n<blockquote>计算翻弯总长度</blockquote>\n<pre><code class=\"lang-intent\">def offset_total_length(offset: PipeOffset) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>offset</code></td><td>PipeOffset</td></tr></tbody></table>\n<h2 id=\"offset-material-list\"><code>offset_material_list</code></h2>\n<blockquote>计算翻弯材料清单: 返回 [总长, 上升段长, 平移段长, 下降段长]</blockquote>\n<pre><code class=\"lang-intent\">def offset_material_list(offset: PipeOffset)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>offset</code></td><td>PipeOffset</td></tr></tbody></table>\n<h2 id=\"class-pipesegment\">class <code>PipeSegment</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(start: Point3D, end: Point3D, diameter: Float, thickness: Float)</code></li>\n<li><code>length()</code> -&gt; <code>Float</code></li>\n<li><code>direction()</code> -&gt; <code>Vector3D</code></li>\n<li><code>mid_point()</code> -&gt; <code>Point3D</code></li>\n<li><code>bbox()</code> -&gt; <code>BBox3D</code></li>\n<li><code>inner_radius()</code> -&gt; <code>Float</code></li>\n<li><code>outer_radius()</code> -&gt; <code>Float</code></li>\n</ul>\n<h2 id=\"class-pipeelbow\">class <code>PipeElbow</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(from_dir: Vector3D, to_dir: Vector3D, diameter: Float, radius: Float, center: Point3D)</code></li>\n<li><code>arc_length()</code> -&gt; <code>Float</code></li>\n</ul>\n<h2 id=\"class-pipeoffset\">class <code>PipeOffset</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(a_point: Point3D, b_point: Point3D, pipe_dir: Vector3D, offset_dir: Vector3D, offset_dist: Float, elbow_radius: Float, diameter: Float, thickness: Float)</code></li>\n<li><code>get_segments()</code></li>\n<li><code>get_elbows()</code></li>\n</ul>", "text": "pipe pipes_collide 两段管道是否碰撞（圆柱体近似） def pipes_collide(a: PipeSegment, b: PipeSegment) -&gt; Int 参数 类型 a PipeSegment b PipeSegment segment_distance 两条线段的最短距离 def segment_distance(a1: Point3D, a2: Point3D, b1: Point3D, b2: Point3D) -&gt; Float 参数 类型 a1 Point3D a2 Point3D b1 Point3D b2 Point3D clamp 钳制值到 [lo, hi] def clamp(val: Float, lo: Float, hi: Float) -&gt; Float 参数 类型 val Float lo Float hi Float pipe_slope_percent 计算管道的坡度 (百分比，如 0.02 = 2%) def pipe_slope_percent(seg: PipeSegment) -&gt; Float 参数 类型 seg PipeSegment pipe_slope_ratio 计算管道的坡度 (即 1:N，如 1:50) def pipe_slope_ratio(seg: PipeSegment) -&gt; Float 参数 类型 seg PipeSegment create_pipe 创建从起点到终点的直管 def create_pipe(start: Point3D, end: Point3D, diameter: Float, thickness: Float) -&gt; PipeSegment 参数 类型 start Point3D end Point3D diameter Float thickness Float offset_up 向上翻弯（常用场景：绕过上方障碍） def offset_up(a: Point3D, b: Point3D, pipe_dir: Vector3D, height: Float, diameter: Float, thickness: Float) -&gt; PipeOffset 参数 类型 a Point3D b Point3D pipe_dir Vector3D height Float diameter Float thickness Float offset_side 侧向翻弯 def offset_side(a: Point3D, b: Point3D, pipe_dir: Vector3D, side_dir: Vector3D, distance: Float, diameter: Float, thickness: Float) -&gt; PipeOffset 参数 类型 a Point3D b Point3D pipe_dir Vector3D side_dir Vector3D distance Float diameter Float thickness Float offset_total_length 计算翻弯总长度 def offset_total_length(offset: PipeOffset) -&gt; Float 参数 类型 offset PipeOffset offset_material_list 计算翻弯材料清单: 返回 [总长, 上升段长, 平移段长, 下降段长] def offset_material_list(offset: PipeOffset) 参数 类型 offset PipeOffset class PipeSegment init() create(start: Point3D, end: Point3D, diameter: Float, thickness: Float) length() -&gt; Float direction() -&gt; Vector3D mid_point() -&gt; Point3D bbox() -&gt; BBox3D inner_radius() -&gt; Float outer_radius() -&gt; Float class PipeElbow init() create(from_dir: Vector3D, to_dir: Vector3D, diameter: Float, radius: Float, center: Point3D) arc_length() -&gt; Float class PipeOffset init() create(a_point: Point3D, b_point: Point3D, pipe_dir: Vector3D, offset_dir: Vector3D, offset_dist: Float, elbow_radius: Float, diameter: Float, thickness: Float) get_segments() get_elbows()"}, {"id": "std/bim/pipe_fittings.intent", "title": "bim.pipe_fittings", "group": "标准库 API", "html": "<h1 id=\"pipe-fittings\">pipe_fittings</h1>\n<h2 id=\"check-pipe-network\"><code>check_pipe_network</code></h2>\n<blockquote>批量检测：返回所有碰撞对</blockquote>\n<pre><code class=\"lang-intent\">def check_pipe_network(segments: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>segments</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"pipe-network-bbox\"><code>pipe_network_bbox</code></h2>\n<pre><code class=\"lang-intent\">def pipe_network_bbox(segments: Any) -&gt; BBox3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>segments</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"class-pipetee\">class <code>PipeTee</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(center: Point3D, run_dir: Vector3D, branch_dir: Vector3D, main_diameter: Float, branch_diameter: Float, thickness: Float)</code></li>\n<li><code>get_segments()</code></li>\n<li><code>is_equal_tee()</code> -&gt; <code>Int</code></li>\n</ul>\n<h2 id=\"class-pipereducer\">class <code>PipeReducer</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create_concentric(start: Point3D, end: Point3D, big_diameter: Float, small_diameter: Float, thickness: Float)</code></li>\n<li><code>create_eccentric(start: Point3D, end: Point3D, big_diameter: Float, small_diameter: Float, thickness: Float, offset_dir: Vector3D)</code></li>\n<li><code>get_segments()</code></li>\n</ul>\n<h2 id=\"class-pipevalve\">class <code>PipeValve</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(start: Point3D, end: Point3D, diameter: Float, valve_type: String)</code></li>\n<li><code>get_direction()</code> -&gt; <code>Vector3D</code></li>\n<li><code>bbox()</code> -&gt; <code>BBox3D</code></li>\n</ul>", "text": "pipe_fittings check_pipe_network 批量检测：返回所有碰撞对 def check_pipe_network(segments: Any) 参数 类型 segments Any pipe_network_bbox def pipe_network_bbox(segments: Any) -&gt; BBox3D 参数 类型 segments Any class PipeTee init() create(center: Point3D, run_dir: Vector3D, branch_dir: Vector3D, main_diameter: Float, branch_diameter: Float, thickness: Float) get_segments() is_equal_tee() -&gt; Int class PipeReducer init() create_concentric(start: Point3D, end: Point3D, big_diameter: Float, small_diameter: Float, thickness: Float) create_eccentric(start: Point3D, end: Point3D, big_diameter: Float, small_diameter: Float, thickness: Float, offset_dir: Vector3D) get_segments() class PipeValve init() create(start: Point3D, end: Point3D, diameter: Float, valve_type: String) get_direction() -&gt; Vector3D bbox() -&gt; BBox3D"}, {"id": "std/bim/pipe_routing.intent", "title": "bim.pipe_routing", "group": "标准库 API", "html": "<h1 id=\"pipe-routing\">pipe_routing</h1>\n<h2 id=\"dist-3d\"><code>dist_3d</code></h2>\n<blockquote>三维距离</blockquote>\n<pre><code class=\"lang-intent\">def dist_3d(x1: Float, y1: Float, z1: Float, x2: Float, y2: Float, z2: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>x1</code></td><td>Float</td></tr><tr><td><code>y1</code></td><td>Float</td></tr><tr><td><code>z1</code></td><td>Float</td></tr><tr><td><code>x2</code></td><td>Float</td></tr><tr><td><code>y2</code></td><td>Float</td></tr><tr><td><code>z2</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"manhattan-3d\"><code>manhattan_3d</code></h2>\n<blockquote>曼哈顿距离</blockquote>\n<pre><code class=\"lang-intent\">def manhattan_3d(x1: Float, y1: Float, z1: Float, x2: Float, y2: Float, z2: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>x1</code></td><td>Float</td></tr><tr><td><code>y1</code></td><td>Float</td></tr><tr><td><code>z1</code></td><td>Float</td></tr><tr><td><code>x2</code></td><td>Float</td></tr><tr><td><code>y2</code></td><td>Float</td></tr><tr><td><code>z2</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"point-collides\"><code>point_collides</code></h2>\n<blockquote>点是否在任一障碍物内 (带管道半径的安全余量)</blockquote>\n<pre><code class=\"lang-intent\">def point_collides(x: Float, y: Float, z: Float, obstacles: Any, margin: Float) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>x</code></td><td>Float</td></tr><tr><td><code>y</code></td><td>Float</td></tr><tr><td><code>z</code></td><td>Float</td></tr><tr><td><code>obstacles</code></td><td>Any</td></tr><tr><td><code>margin</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"segment-collides\"><code>segment_collides</code></h2>\n<blockquote>线段-障碍物碰撞检测</blockquote>\n<pre><code class=\"lang-intent\">def segment_collides(a: Point3D, b: Point3D, obstacles: Any, margin: Float) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>Point3D</td></tr><tr><td><code>b</code></td><td>Point3D</td></tr><tr><td><code>obstacles</code></td><td>Any</td></tr><tr><td><code>margin</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"directions\"><code>directions</code></h2>\n<blockquote>六个方向 (正交)</blockquote>\n<pre><code class=\"lang-intent\">def directions()</code></pre>\n<h2 id=\"find-best\"><code>find_best</code></h2>\n<blockquote>在开放列表中找 f 值最小的节点 index</blockquote>\n<pre><code class=\"lang-intent\">def find_best(open_list: Any) -&gt; Int</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>open_list</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"rebuild-path\"><code>rebuild_path</code></h2>\n<blockquote>重建路径: 从终点回溯到起点</blockquote>\n<pre><code class=\"lang-intent\">def rebuild_path(nodes: Any, segments: Any, elbows: Any) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>segments</code></td><td>Any</td></tr><tr><td><code>elbows</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"routing-material-list\"><code>routing_material_list</code></h2>\n<pre><code class=\"lang-intent\">def routing_material_list(segments: Any, elbows: Any)</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>segments</code></td><td>Any</td></tr><tr><td><code>elbows</code></td><td>Any</td></tr></tbody></table>\n<h2 id=\"class-routingnode\">class <code>RoutingNode</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>f()</code> -&gt; <code>Float</code></li>\n<li><code>key(snap: Float)</code> -&gt; <code>String</code></li>\n<li><code>copy()</code> -&gt; <code>RoutingNode</code></li>\n<li><code>set(x: Float, y: Float, z: Float, g: Float, h: Float, px: Float, py: Float, pz: Float)</code></li>\n<li><code>point()</code> -&gt; <code>Point3D</code></li>\n</ul>", "text": "pipe_routing dist_3d 三维距离 def dist_3d(x1: Float, y1: Float, z1: Float, x2: Float, y2: Float, z2: Float) -&gt; Float 参数 类型 x1 Float y1 Float z1 Float x2 Float y2 Float z2 Float manhattan_3d 曼哈顿距离 def manhattan_3d(x1: Float, y1: Float, z1: Float, x2: Float, y2: Float, z2: Float) -&gt; Float 参数 类型 x1 Float y1 Float z1 Float x2 Float y2 Float z2 Float point_collides 点是否在任一障碍物内 (带管道半径的安全余量) def point_collides(x: Float, y: Float, z: Float, obstacles: Any, margin: Float) -&gt; Int 参数 类型 x Float y Float z Float obstacles Any margin Float segment_collides 线段-障碍物碰撞检测 def segment_collides(a: Point3D, b: Point3D, obstacles: Any, margin: Float) -&gt; Int 参数 类型 a Point3D b Point3D obstacles Any margin Float directions 六个方向 (正交) def directions() find_best 在开放列表中找 f 值最小的节点 index def find_best(open_list: Any) -&gt; Int 参数 类型 open_list Any rebuild_path 重建路径: 从终点回溯到起点 def rebuild_path(nodes: Any, end_x: Float, end_y: Float, end_z: Float, start_x: Float, e>Polyline</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>from_list(pts: List)</code></li>\n<li><code>add(p: Point3D)</code></li>\n<li><code>count()</code> -&gt; <code>Int</code></li>\n<li><code>is_closed()</code> -&gt; <code>Bool</code></li>\n<li><code>length()</code> -&gt; <code>Float</code></li>\n<li><code>segment(i: Int)</code> -&gt; <code>Line3D</code></li>\n<li><code>bbox()</code> -&gt; <code>BBox3D</code></li>\n<li><code>centroid()</code> -&gt; <code>Point3D</code></li>\n</ul>\n<h2 id=\"class-polygon\">class <code>Polygon</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>from_list(pts: List)</code></li>\n<li><code>add(p: Point3D)</code></li>\n<li><code>count()</code> -&gt; <code>Int</code></li>\n<li><code>area_xy()</code> -&gt; <code>Float</code></li>\n<li><code>perimeter()</code> -&gt; <code>Float</code></li>\n<li><code>centroid_xy()</code> -&gt; <code>Point3D</code></li>\n<li><code>contains_xy(point: Point3D)</code> -&gt; <code>Bool</code></li>\n<li><code>bbox()</code> -&gt; <code>BBox3D</code></li>\n<li><code>is_convex_xy()</code> -&gt; <code>Bool</code></li>\n</ul>", "text": "polygon make_rect_xy 矩形多边形（XY 平面，从两点） def make_rect_xy(min_pt: Point3D, max_pt: Point3D) -&gt; Polygon 参数 类型 min_pt Point3D max_pt Point3D make_regular_xy 正多边形（XY 平面，中心+半径+边数） def make_regular_xy(center: Point3D, radius: Float, sides: Int) -&gt; Polygon 参数 类型 center Point3D radius Float sides Int class Polyline init() from_list(pts: List) add(p: Point3D) count() -&gt; Int is_closed() -&gt; Bool length() -&gt; Float segment(i: Int) -&gt; Line3D bbox() -&gt; BBox3D centroid() -&gt; Point3D class Polygon init() from_list(pts: List) add(p: Point3D) count() -&gt; Int area_xy() -&gt; Float perimeter() -&gt; Float centroid_xy() -&gt; Point3D contains_xy(point: Point3D) -&gt; Bool bbox() -&gt; BBox3D is_convex_xy() -&gt; Bool"}, {"id": "std/bim/solid.intent", "title": "bim.solid", "group": "标准库 API", "html": "<h1 id=\"solid\">solid</h1>\n<h2 id=\"bbox-intersects\"><code>bbox_intersects</code></h2>\n<blockquote>BBox vs BBox 碰撞</blockquote>\n<pre><code class=\"lang-intent\">def bbox_intersects(a: BBox3D, b: BBox3D) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a</code></td><td>BBox3D</td></tr><tr><td><code>b</code></td><td>BBox3D</td></tr></tbody></table>\n<h2 id=\"pipe-collides\"><code>pipe_collides</code></h2>\n<blockquote>管道碰撞（批量检测入口）</blockquote>\n<pre><code class=\"lang-intent\">def pipe_collides(a_start: Point3D, a_end: Point3D, a_r: Float, b_start: Point3D, b_end: Point3D, b_r: Float) -&gt; Bool</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>a_start</code></td><td>Point3D</td></tr><tr><td><code>a_end</code></td><td>Point3D</td></tr><tr><td><code>a_r</code></td><td>Float</td></tr><tr><td><code>b_start</code></td><td>Point3D</td></tr><tr><td><code>b_end</code></td><td>Point3D</td></tr><tr><td><code>b_r</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"class-plane\">class <code>Plane</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create_from_normal(n: Vector3D, point: Point3D)</code></li>\n<li><code>create_from_points(a: Point3D, b: Point3D, c: Point3D)</code></li>\n<li><code>distance_to(point: Point3D)</code> -&gt; <code>Float</code></li>\n<li><code>project(point: Point3D)</code> -&gt; <code>Point3D</code></li>\n<li><code>intersect_line(line: Line3D)</code> -&gt; <code>Point3D</code></li>\n</ul>\n<h2 id=\"class-sphere\">class <code>Sphere</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(center: Point3D, radius: Float)</code></li>\n<li><code>contains(point: Point3D)</code> -&gt; <code>Bool</code></li>\n<li><code>intersects_bbox(bbox: BBox3D)</code> -&gt; <code>Bool</code></li>\n<li><code>volume()</code> -&gt; <code>Float</code></li>\n</ul>\n<h2 id=\"class-cylinder\">class <code>Cylinder</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(start: Point3D, end: Point3D, radius: Float)</code></li>\n<li><code>axis()</code> -&gt; <code>Vector3D</code></li>\n<li><code>length()</code> -&gt; <code>Float</code></li>\n<li><code>distance_to_point(point: Point3D)</code> -&gt; <code>Float</code></li>\n<li><code>intersects_bbox(bbox: BBox3D)</code> -&gt; <code>Bool</code></li>\n<li><code>intersects_cylinder(other: Cylinder)</code> -&gt; <code>Bool</code></li>\n<li><code>bbox()</code> -&gt; <code>BBox3D</code></li>\n</ul>", "text": "solid bbox_intersects BBox vs BBox 碰撞 def bbox_intersects(a: BBox3D, b: BBox3D) -&gt; Bool 参数 类型 a BBox3D b BBox3D pipe_collides 管道碰撞（批量检测入口） def pipe_collides(a_start: Point3D, a_end: Point3D, a_r: Float, b_start: Point3D, b_end: Point3D, b_r: Float) -&gt; Bool 参数 类型 a_start Point3D a_end Point3D a_r Float b_start Point3D b_end Point3D b_r Float class Plane init() create_from_normal(n: Vector3D, point: Point3D) create_from_points(a: Point3D, b: Point3D, c: Point3D) distance_to(point: Point3D) -&gt; Float project(point: Point3D) -&gt; Point3D intersect_line(line: Line3D) -&gt; Point3D class Sphere init() create(center: Point3D, radius: Float) contains(point: Point3D) -&gt; Bool intersects_bbox(bbox: BBox3D) -&gt; Bool volume() -&gt; Float class Cylinder init() create(start: Point3D, end: Point3D, radius: Float) axis() -&gt; Vector3D length() -&gt; Float distance_to_point(point: Point3D) -&gt; Float intersects_bbox(bbox: BBox3D) -&gt; Bool intersects_cylinder(other: Cylinder) -&gt; Bool bbox() -&gt; BBox3D"}, {"id": "std/bim/transform.intent", "title": "bim.transform", "group": "标准库 API", "html": "<h1 id=\"transform\">transform</h1>\n<h2 id=\"translate-point\"><code>translate_point</code></h2>\n<blockquote>平移点</blockquote>\n<pre><code class=\"lang-intent\">def translate_point(p: Point3D, v: Vector3D) -&gt; Point3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>p</code></td><td>Point3D</td></tr><tr><td><code>v</code></td><td>Vector3D</td></tr></tbody></table>\n<h2 id=\"rotate-x-matrix\"><code>rotate_x_matrix</code></h2>\n<blockquote>绕 X 轴旋转</blockquote>\n<pre><code class=\"lang-intent\">def rotate_x_matrix(angle_rad: Float) -&gt; Matrix3x3</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>angle_rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"rotate-y-matrix\"><code>rotate_y_matrix</code></h2>\n<blockquote>绕 Y 轴旋转</blockquote>\n<pre><code class=\"lang-intent\">def rotate_y_matrix(angle_rad: Float) -&gt; Matrix3x3</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>angle_rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"rotate-z-matrix\"><code>rotate_z_matrix</code></h2>\n<blockquote>绕 Z 轴旋转</blockquote>\n<pre><code class=\"lang-intent\">def rotate_z_matrix(angle_rad: Float) -&gt; Matrix3x3</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>angle_rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"rotate-around-axis-matrix\"><code>rotate_around_axis_matrix</code></h2>\n<blockquote>绕任意轴旋转（Rodrigues 公式）</blockquote>\n<pre><code class=\"lang-intent\">def rotate_around_axis_matrix(v: Vector3D, angle_rad: Float) -&gt; Matrix3x3</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>v</code></td><td>Vector3D</td></tr><tr><td><code>angle_rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"scale-matrix\"><code>scale_matrix</code></h2>\n<blockquote>均匀缩放矩阵</blockquote>\n<pre><code class=\"lang-intent\">def scale_matrix(sx: Float, sy: Float, sz: Float) -&gt; Matrix3x3</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>sx</code></td><td>Float</td></tr><tr><td><code>sy</code></td><td>Float</td></tr><tr><td><code>sz</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"scale-vector\"><code>scale_vector</code></h2>\n<blockquote>向量缩放</blockquote>\n<pre><code class=\"lang-intent\">def scale_vector(v: Vector3D, s: Float) -&gt; Vector3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>v</code></td><td>Vector3D</td></tr><tr><td><code>s</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"rotate-vector\"><code>rotate_vector</code></h2>\n<blockquote>旋转向量</blockquote>\n<pre><code class=\"lang-intent\">def rotate_vector(v: Vector3D, matrix: Matrix3x3) -&gt; Vector3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>v</code></td><td>Vector3D</td></tr><tr><td><code>matrix</code></td><td>Matrix3x3</td></tr></tbody></table>\n<h2 id=\"rotate-point-2d\"><code>rotate_point_2d</code></h2>\n<blockquote>绕 Z 轴旋转点（BIM 最常用：平面旋转）</blockquote>\n<pre><code class=\"lang-intent\">def rotate_point_2d(p: Point3D, center: Point3D, angle_rad: Float) -&gt; Point3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>p</code></td><td>Point3D</td></tr><tr><td><code>center</code></td><td>Point3D</td></tr><tr><td><code>angle_rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"mirror-x\"><code>mirror_x</code></h2>\n<blockquote>镜像：绕 YZ 平面（X 取反）</blockquote>\n<pre><code class=\"lang-intent\">def mirror_x(point: Point3D) -&gt; Point3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>point</code></td><td>Point3D</td></tr></tbody></table>\n<h2 id=\"mirror-y\"><code>mirror_y</code></h2>\n<blockquote>镜像：绕 XZ 平面（Y 取反）</blockquote>\n<pre><code class=\"lang-intent\">def mirror_y(point: Point3D) -&gt; Point3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>point</code></td><td>Point3D</td></tr></tbody></table>\n<h2 id=\"project-to-xy\"><code>project_to_xy</code></h2>\n<blockquote>投影到 XY 平面（Z=0）</blockquote>\n<pre><code class=\"lang-intent\">def project_to_xy(point: Point3D) -&gt; Point3D</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>point</code></td><td>Point3D</td></tr></tbody></table>\n<h2 id=\"class-matrix3x3\">class <code>Matrix3x3</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>set(a00: Float, a01: Float, a02: Float, a10: Float, a11: Float, a12: Float, a20: Float, a21: Float, a22: Float)</code></li>\n<li><code>transform(v: Vector3D)</code> -&gt; <code>Vector3D</code></li>\n<li><code>multiply(other: Matrix3x3)</code> -&gt; <code>Matrix3x3</code></li>\n<li><code>transpose()</code> -&gt; <code>Matrix3x3</code></li>\n<li><code>determinant()</code> -&gt; <code>Float</code></li>\n</ul>\n<h2 id=\"class-coordinatesystem\">class <code>CoordinateSystem</code></h2>\n<ul>\n<li><code>init()</code></li>\n<li><code>create(origin: Point3D, x_axis: Vector3D, y_axis: Vector3D)</code></li>\n<li><code>to_local(global_point: Point3D)</code> -&gt; <code>Point3D</code></li>\n<li><code>to_global(local_point: Point3D)</code> -&gt; <code>Point3D</code></li>\n</ul>", "text": "transform translate_point 平移点 def translate_point(p: Point3D, v: Vector3D) -&gt; Point3D 参数 类型 p Point3D v Vector3D rotate_x_matrix 绕 X 轴旋转 def rotate_x_matrix(angle_rad: Float) -&gt; Matrix3x3 参数 类型 angle_rad Float rotate_y_matrix 绕 Y 轴旋转 def rotate_y_matrix(angle_rad: Float) -&gt; Matrix3x3 参数 类型 angle_rad Float rotate_z_matrix 绕 Z 轴旋转 def rotate_z_matrix(angle_rad: Float) -&gt; Matrix3x3 参数 类型 angle_rad Float rotate_around_axis_matrix 绕任意轴旋转（Rodrigues 公式） def rotate_around_axis_matrix(v: Vector3D, angle_rad: Float) -&gt; Matrix3x3 参数 类型 v Vector3D angle_rad Float scale_matrix 均匀缩放矩阵 def scale_matrix(sx: Float, sy: Float, sz: Float) -&gt; Matrix3x3 参数 类型 sx Float sy Float sz Float scale_vector 向量缩放 def scale_vector(v: Vector3D, s: Float) -&gt; Vector3D 参数 类型 v Vector3D s Float rotate_vector 旋转向量 def rotate_vector(v: Vector3D, matrix: Matrix3x3) -&gt; Vector3D 参数 类型 v Vector3D matrix Matrix3x3 rotate_point_2d 绕 Z 轴旋转点（BIM 最常用：平面旋转） def rotate_point_2d(p: Point3D, center: Point3D, angle_rad: Float) -&gt; Point3D 参数 类型 p Point3D center Point3D angle_rad Float mirror_x 镜像：绕 YZ 平面（X 取反） def mirror_x(point: Point3D) -&gt; Point3D 参数 类型 point Point3D mirror_y 镜像：绕 XZ 平面（Y 取反） def mirror_y(point: Point3D) -&gt; Point3D 参数 类型 point Point3D project_to_xy 投影到 XY 平面（Z=0） def project_to_xy(point: Point3D) -&gt; Point3D 参数 类型 point Point3D class Matrix3x3 init() set(a00: Float, a01: Float, a02: Float, a10: Float, a11: Float, a12: Float, a20: Float, a21: Float, a22: Float) transform(v: Vector3D) -&gt; Vector3D multiply(other: Matrix3x3) -&gt; Matrix3x3 transpose() -&gt; Matrix3x3 determinant() -&gt; Float class CoordinateSystem init() create(origin: Point3D, x_axis: Vector3D, y_axis: Vector3D) to_local(global_point: Point3D) -&gt; Point3D to_global(local_point: Point3D) -&gt; Point3D"}, {"id": "std/bim/unit.intent", "title": "bim.unit", "group": "标准库 API", "html": "<h1 id=\"unit\">unit</h1>\n<h2 id=\"mm-to-m\"><code>mm_to_m</code></h2>\n<pre><code class=\"lang-intent\">def mm_to_m(mm: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>mm</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"m-to-mm\"><code>m_to_mm</code></h2>\n<pre><code class=\"lang-intent\">def m_to_mm(m: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>m</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"ft-to-m\"><code>ft_to_m</code></h2>\n<pre><code class=\"lang-intent\">def ft_to_m(ft: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>ft</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"m-to-ft\"><code>m_to_ft</code></h2>\n<pre><code class=\"lang-intent\">def m_to_ft(m: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>m</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"inch-to-m\"><code>inch_to_m</code></h2>\n<pre><code class=\"lang-intent\">def inch_to_m(inch: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>inch</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"m-to-inch\"><code>m_to_inch</code></h2>\n<pre><code class=\"lang-intent\">def m_to_inch(m: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>m</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"deg-to-rad\"><code>deg_to_rad</code></h2>\n<blockquote>角度转换</blockquote>\n<pre><code class=\"lang-intent\">def deg_to_rad(deg: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>deg</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"rad-to-deg\"><code>rad_to_deg</code></h2>\n<pre><code class=\"lang-intent\">def rad_to_deg(rad: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>rad</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"revit-to-mm\"><code>revit_to_mm</code></h2>\n<pre><code class=\"lang-intent\">def revit_to_mm(internal: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>internal</code></td><td>Float</td></tr></tbody></table>\n<h2 id=\"mm-to-revit\"><code>mm_to_revit</code></h2>\n<pre><code class=\"lang-intent\">def mm_to_revit(mm: Float) -&gt; Float</code></pre>\n<table><thead><tr><th>参数</th><th>类型</th></tr></thead><tbody><tr><td><code>mm</code></td><td>Float</td></tr></tbody></table>", "text": "unit mm_to_m def mm_to_m(mm: Float) -&gt; Float 参数 类型 mm Float m_to_mm def m_to_mm(m: Float) -&gt; Float 参数 类型 m Float ft_to_m def ft_to_m(ft: Float) -&gt; Float 参数 类型 ft Float m_to_ft def m_to_ft(m: Float) -&gt; Float 参数 类型 m Float inch_to_m def inch_to_m(inch: Float) -&gt; Float 参数 类型 inch Float m_to_inch def m_to_inch(m: Float) -&gt; Float 参数 类型 m Float deg_to_rad 角度转换 def deg_to_rad(deg: Float) -&gt; Float 参数 类型 deg Float rad_to_deg def rad_to_deg(rad: Float) -&gt; Float 参数 类型 rad Float revit_to_mm def revit_to_mm(internal: Float) -&gt; Float 参数 类型 internal Float mm_to_revit def mm_to_revit(mm: Float) -&gt; Float 参数 类型 mm Float"}];
const IDX = PAGES.map(p => ({id: p.id, title: p.title,
  text: (p.title + " " + p.text).toLowerCase()}));
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const search = document.getElementById("search");

function renderNav(filterIds) {
  nav.innerHTML = "";
  const groups = {};
  for (const p of PAGES) {
    if (filterIds && !filterIds.has(p.id)) continue;
    (groups[p.group] = groups[p.group] || []).push(p);
  }
  for (const g of Object.keys(groups)) {
    const t = document.createElement("div");
    t.className = "gtitle"; t.textContent = g;
    nav.appendChild(t);
    for (const p of groups[g]) {
      const a = document.createElement("a");
      a.href = "#" + p.id; a.textContent = p.title; a.dataset.id = p.id;
      a.onclick = () => showPage(p.id);
      nav.appendChild(a);
    }
  }
}

function showPage(id) {
  const p = PAGES.find(x => x.id === id);
  if (!p) return;
  main.innerHTML = p.html;
  document.querySelectorAll(".nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.id === id));
  history.replaceState(null, "", "#" + id);
  window.scrollTo(0, 0);
}

function showHits(q) {
  const hits = [];
  for (const e of IDX) {
    const at = e.text.indexOf(q);
    if (at >= 0) {
      const start = Math.max(0, at - 30);
      const snip = e.text.slice(start, at + q.length + 60);
      hits.push({page: PAGES.find(x => x.id === e.id),
        before: snip.slice(0, at - start), match: q,
        after: snip.slice(at - start + q.length)});
    }
    if (hits.length >= 20) break;
  }
  main.innerHTML = "";
  const box = document.createElement("div");
  box.id = "hits";
  if (!hits.length) {
    box.innerHTML = '<div class="empty">没有匹配「' + q + '」的文档</div>';
  }
  for (const h of hits) {
    const d = document.createElement("div");
    d.className = "hit";
    d.onclick = () => showPage(h.page.id);
    d.innerHTML = '<div class="t"></div><div class="s"></div>';
    d.querySelector(".t").textContent = h.page.title;
    const s = d.querySelector(".s");
    s.append(document.createTextNode(h.before));
    s.append(Object.assign(document.createElement("mark"),
      {textContent: h.match}));
    s.append(document.createTextNode(h.after));
    box.appendChild(d);
  }
  main.appendChild(box);
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  if (!q) {
    const id = location.hash.slice(1);
    if (id && PAGES.some(p => p.id === id)) { showPage(id); return; }
    main.innerHTML = '<div class="empty">左侧选择章节，或输入关键词搜索</div>';
    renderNav(null);
    document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
    return;
  }
  const ids = new Set(IDX.filter(e => e.text.includes(q)).map(e => e.id));
  renderNav(ids);
  showHits(q);
});

renderNav(null);
const initial = location.hash.slice(1);
if (initial && PAGES.some(p => p.id === initial)) {
  showPage(initial);
} else {
  main.innerHTML = '<div class="empty">左侧选择章节，或输入关键词搜索</div>';
}
</script>
